// Local light editor. Save these settings with /savelight. F3 routes a single selected light here.
UI_ls_type = 0
UI_ls_radius = 0
UI_ls_width = 0
UI_ls_height = 0
UI_ls_yaw = 0
UI_ls_pitch = 0
UI_ls_roll = 0
UI_ls_entity = -1

UI_ls_read = [
    local shape
    shape = (getlightshape)
    UI_ls_type = (at $shape 0)
    UI_ls_radius = (at $shape 1)
    UI_ls_width = (at $shape 2)
    UI_ls_height = (at $shape 3)
    UI_ls_yaw = (at $shape 4)
    UI_ls_pitch = (at $shape 5)
    UI_ls_roll = (at $shape 6)
]

UI_ls_apply = [
    if (&& (= (enthavesel) 1) [= (entindex) $UI_ls_entity] [=s (enttype) "light"]) [
        lightshape $UI_ls_type $UI_ls_radius $UI_ls_width $UI_ls_height $UI_ls_yaw $UI_ls_pitch $UI_ls_roll
        UI_ls_read
    ] [hideui "lightshape"]
]

UI_ls_choose = [
    UI_ls_type = $arg1
    if (&& (> $arg1 0) [< $arg1 4] [<=f $UI_ls_radius 0]) [UI_ls_radius = 4]
    if (&& (>= $arg1 3) [<=f $UI_ls_width 0]) [UI_ls_width = 16]
    if (&& (= $arg1 4) [<=f $UI_ls_height 0]) [UI_ls_height = 8]
    if (= $arg1 0) [UI_ls_radius = 0]
    UI_ls_apply
]

// Variable, label, minimum, initial slider maximum, step. Fields allow larger values.
UI_ls_control = [
    uivlist 0.003 [
        uihlist 0 [
            uifill 0.28 0.026 [uitext $arg2 0.55; uialign- -1 0]
            uifield $arg1 7 [UI_ls_apply] 0.55 style_generic_focus
        ]
        UIhslider $arg1 $arg3 (maxf $arg4 $$arg1) $arg5 0.40 0.022 [uitext $@arg1 0.45] [UI_ls_apply]
    ]
]

UImenu "lightshape" [
    uivlist 0.012 [
        uitext (concatword "Light #" $UI_ls_entity "   |   F3") 0.55
        uihlist 0.004 [
            looplist2 label shape [Point 0 Sphere 1 Disk 2 Capsule 3 Rectangle 4] [
                UIbutton "hold2" [
                    uitext (concatword (? (= $UI_ls_type $shape) "^f0" "^f7") $label) 0.5
                ] 0.078 0.034 [UI_ls_choose @shape]
            ]
        ]
        UIbar 1 0
        if (!= $UI_ls_type 4) [
            UI_ls_control UI_ls_radius (? (= $UI_ls_type 0) "Source radius (0 = point)" "Radius") 0 64 0.25
        ]
        if (>= $UI_ls_type 3) [
            UI_ls_control UI_ls_width (? (= $UI_ls_type 3) "Line length" "Width") 0 128 0.5
        ]
        if (= $UI_ls_type 4) [UI_ls_control UI_ls_height "Height" 0 128 0.5]
        if (>= $UI_ls_type 2) [
            UI_ls_control UI_ls_yaw "Yaw" -360 360 1
            UI_ls_control UI_ls_pitch "Pitch" -360 360 1
        ]
        if (= $UI_ls_type 4) [UI_ls_control UI_ls_roll "Roll" -360 360 1]
        if (= $UI_ls_type 3) [uitext "^f4Radius 0 makes a thin line." 0.45]
        UIbar 1 0
        UIbutton "hold2" [UIcheckbox $showlightshapes 0.016; uitext "Show shape wireframe" 0.55] 0.40 0.03 [
            showlightshapes (! $showlightshapes)
        ]
        uitext "^f4Live changes. Use /savelight to save." 0.45
        uihlist 0.01 [
            UIbutton "" [uitext "Light attributes" 0.55] 0.195 0.035 [hideui "lightshape"; showui "editentity"]
            UIbutton "" [uitext "Reset to point" 0.55] 0.195 0.035 [
                UI_ls_type = 0; UI_ls_radius = 0; UI_ls_width = 0; UI_ls_height = 0
                UI_ls_yaw = 0; UI_ls_pitch = 0; UI_ls_roll = 0
                UI_ls_apply
            ]
        ]
    ]
] [
    if (&& (= (enthavesel) 1) [=s (enttype) "light"]) [
        UI_ls_entity = (entindex)
        UI_ls_read
    ] [hideui "lightshape"]
] [] [
    uialign -1 0
    if (|| (!= (enthavesel) 1) [!= (entindex) $UI_ls_entity] [!=s (enttype) "light"]) [hideui "lightshape"]
] "Light Shape"
