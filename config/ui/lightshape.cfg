// Local light editor. Save these settings with /savelight. F3 routes a single selected light here.
UI_ls_type = 0
UI_ls_radius = 0
UI_ls_width = 0
UI_ls_height = 0
UI_ls_yaw = 0
UI_ls_pitch = 0
UI_ls_roll = 0
UI_ls_entity = -1

UI_ls_read = [
    local shape
    shape = (getlightshape)
    UI_ls_type = (at $shape 0)
    UI_ls_radius = (lightuifloat (at $shape 1))
    UI_ls_width = (lightuifloat (at $shape 2))
    UI_ls_height = (lightuifloat (at $shape 3))
    UI_ls_yaw = (lightuifloat (at $shape 4))
    UI_ls_pitch = (lightuifloat (at $shape 5))
    UI_ls_roll = (lightuifloat (at $shape 6))
]

UI_ls_apply = [
    if (&& (= (enthavesel) 1) [= (entindex) $UI_ls_entity] [=s (enttype) "light"]) [
        lightshape $UI_ls_type $UI_ls_radius $UI_ls_width $UI_ls_height $UI_ls_yaw $UI_ls_pitch $UI_ls_roll
        UI_ls_read
    ] [hideui "lightshape"]
]

UI_ls_choose = [
    UI_ls_type = $arg1
    if (&& (> $arg1 0) [< $arg1 4] [<=f $UI_ls_radius 0]) [UI_ls_radius = 4]
    if (&& (>= $arg1 3) [<=f $UI_ls_width 0]) [UI_ls_width = 16]
    if (&& (= $arg1 4) [<=f $UI_ls_height 0]) [UI_ls_height = 8]
    if (= $arg1 0) [UI_ls_radius = 0]
    UI_ls_apply
]

// Variable, label, minimum, initial slider maximum, step. Fields allow larger values.
UI_ls_control = [
    uivlist 0.003 [
        uihlist 0 [
            uifill 0.28 0.026 [uitext $arg2 0.55; uialign- -1 0]
            uifield $arg1 7 [UI_ls_apply] 0.55 style_generic_focus
        ]
        UIhslider $arg1 $arg3 (maxf $arg4 $$arg1) $arg5 0.40 0.022 [uitext (lightuifloat $@arg1) 0.45] [UI_ls_apply]
    ]
]

UI_ls_page = 0
UI_la_properties = [
    UI_la_intensity intensity
    UI_la_flickeramp flicker.amplitude
    UI_la_flickerfrequency flicker.frequency
    UI_la_flickernoise flicker.noise
    UI_la_flickerseed flicker.seed
    UI_la_offsetamp offset.amplitude
    UI_la_offsetfrequency offset.frequency
    UI_la_offsetnoise offset.noise
    UI_la_offsetseed offset.seed
    UI_la_offsetaxes offset.axes
    UI_la_offsetquantize offset.quantize
    UI_la_blinkfrequency blink.frequency
    UI_la_blinkduty blink.duty
    UI_la_blinkphase blink.phase
    UI_la_blinkfade blink.fade
    UI_la_enabled attenuation.enabled
    UI_la_exponent attenuation.exponent
    UI_la_mindistance attenuation.min_distance
    UI_la_edge attenuation.edge
    UI_la_secondarycolor secondary.color
    UI_la_secondaryradius secondary.radius
]
UI_la_format = [
    if (|| (>= (strstr $arg1 ".seed") 0) [=s $arg1 "attenuation.enabled"] [=s $arg1 "secondary.color"]) [result $arg2] [
        loopconcat i (listlen $arg2) [lightuifloat (at $arg2 $i)]
    ]
]
UI_la_read = [looplist2 variable property $UI_la_properties [alias $variable (UI_la_format $property (lightproperty $property))]]
UI_la_apply = [
    if (&& (= (enthavesel) 1) [= (entindex) $UI_ls_entity] [=s (enttype) "light"]) [
        lightproperty $arg2 $$arg1
        alias $arg1 (UI_la_format $arg2 (lightproperty $arg2))
        UI_la_enabled = (lightproperty attenuation.enabled)
    ] [hideui "lightshape"]
]

// Variable, label, named property, min, slider max, step.
UI_la_control = [
    uivlist 0.003 [
        uihlist 0 [
            uifill 0.28 0.026 [uitext $arg2 0.55; uialign- -1 0]
            uifield $arg1 7 [UI_la_apply @arg1 @arg3] 0.55 style_generic_focus
        ]
        UIhslider $arg1 $arg4 (maxf $arg5 $$arg1) $arg6 0.40 0.022 [uitext (lightuifloat $@arg1) 0.45] [UI_la_apply @arg1 @arg3]
    ]
]
UI_la_field = [
    uihlist 0 [
        uifill 0.20 0.028 [uitext $arg2 0.55; uialign- -1 0]
        uifield $arg1 16 [UI_la_apply @arg1 @arg3] 0.55 style_generic_focus
    ]
]
UI_la_panel = [
    case $UI_ls_page 1 [
        UI_la_control UI_la_intensity "Base intensity" intensity 0 8 0.05
        UI_la_control UI_la_flickeramp "Flicker amplitude" flicker.amplitude 0 1 0.01
        UI_la_control UI_la_flickerfrequency "Frequency (Hz)" flicker.frequency 0 20 0.1
        UI_la_control UI_la_flickernoise "Noise amount" flicker.noise 0 1 0.01
        UI_la_field UI_la_flickerseed "Seed" flicker.seed
        uitext "^f4Amplitude 0 disables flicker." 0.45
    ] 2 [
        UI_la_control UI_la_offsetamp "Offset amplitude" offset.amplitude 0 16 0.05
        UI_la_control UI_la_offsetfrequency "Frequency (Hz)" offset.frequency 0 20 0.1
        UI_la_control UI_la_offsetnoise "Noise amount" offset.noise 0 1 0.01
        UI_la_field UI_la_offsetseed "Seed" offset.seed
        UI_la_field UI_la_offsetaxes "Axes (X Y Z)" offset.axes
        UI_la_control UI_la_offsetquantize "Position snap step" offset.quantize 0 0.25 0.005
        uitext "^f4Amplitude 0 disables movement." 0.45
    ] 3 [
        UI_la_control UI_la_blinkfrequency "Blink frequency (Hz)" blink.frequency 0 10 0.1
        UI_la_control UI_la_blinkduty "On fraction" blink.duty 0 1 0.01
        UI_la_control UI_la_blinkphase "Phase (cycles)" blink.phase -1 1 0.01
        UI_la_control UI_la_blinkfade "Fade (cycles)" blink.fade 0 0.5 0.01
        uitext "^f4Frequency 0 disables blinking." 0.45
        uitext "^f4Fade 0 switches instantly." 0.45
    ] 4 [
        UIbutton "hold2" [UIcheckbox $UI_la_enabled 0.016; uitext "Use configured attenuation" 0.55] 0.40 0.03 [
            UI_la_enabled = (! $UI_la_enabled)
            UI_la_apply UI_la_enabled attenuation.enabled
        ]
        if (! $UI_la_enabled) [uitext "^f4Legacy linear falloff is active." 0.45]
        UI_la_control UI_la_exponent "Attenuation exponent" attenuation.exponent 0 8 0.05
        uihlist 0.005 [
            looplist2 label power [Constant 0 Soft 1 Realistic 2 Fast 4] [
                UIbutton "" [uitext $label 0.5] 0.096 0.03 [
                    UI_la_exponent = @power
                    UI_la_apply UI_la_exponent attenuation.exponent
                ]
            ]
        ]
        UI_la_control UI_la_mindistance "Near-source distance" attenuation.min_distance 0.01 64 0.25
        UI_la_control UI_la_edge "Range fade fraction" attenuation.edge 0.001 1 0.01
        uitext "^f4All curves fade smoothly at the range." 0.45
    ] 5 [
        UI_la_field UI_la_secondarycolor "Inner RGB (hex)" secondary.color
        uihlist 0.01 [
            uicolor $UI_la_secondarycolor 0.04 0.03
            uitext "Secondary color" 0.55
        ]
        if (> (entattr 0) 0) [
            UI_la_control UI_la_secondaryradius "Inner radius" secondary.radius 0 (entattr 0) 0.25
        ] [uitext "^f4Set a positive light range first." 0.45]
        uitext "^f4Radius 0 disables the inner color." 0.45
        uitext "^f4Blends smoothly into the primary color." 0.45
    ]
]

UImenu "lightshape" [
    uivlist 0.012 [
        uitext (concatword "Light #" $UI_ls_entity "   |   F3") 0.55
        uihlist 0.004 [
            looplist2 label page [Shape 0 Color 5 Flicker 1 Move 2 Blink 3 Falloff 4] [
                UIbutton "hold2" [uitext (concatword (? (= $UI_ls_page $page) "^f0" "^f7") $label) 0.5] 0.064 0.03 [
                    UI_ls_page = @page
                ]
            ]
        ]
        UIbar 1 0
        if (= $UI_ls_page 0) [
            uihlist 0.004 [
                looplist2 label shape [Point 0 Sphere 1 Disk 2 Capsule 3 Rectangle 4] [
                    UIbutton "hold2" [
                        uitext (concatword (? (= $UI_ls_type $shape) "^f0" "^f7") $label) 0.5
                    ] 0.078 0.034 [UI_ls_choose @shape]
                ]
            ]
            UIbar 1 0
            if (!= $UI_ls_type 4) [
                UI_ls_control UI_ls_radius (? (= $UI_ls_type 0) "Source radius (0 = point)" "Radius") 0 64 0.25
            ]
            if (>= $UI_ls_type 3) [
                UI_ls_control UI_ls_width (? (= $UI_ls_type 3) "Line length" "Width") 0 128 0.5
            ]
            if (= $UI_ls_type 4) [UI_ls_control UI_ls_height "Height" 0 128 0.5]
            if (>= $UI_ls_type 2) [
                UI_ls_control UI_ls_yaw "Yaw" -360 360 1
                UI_ls_control UI_ls_pitch "Pitch" -360 360 1
            ]
            if (= $UI_ls_type 4) [UI_ls_control UI_ls_roll "Roll" -360 360 1]
            if (= $UI_ls_type 3) [uitext "^f4Radius 0 makes a thin line." 0.45]
        ] [UI_la_panel]
        UIbar 1 0
        UIbutton "hold2" [UIcheckbox $showlightshapes 0.016; uitext "Show shape wireframe" 0.55] 0.40 0.03 [
            showlightshapes (! $showlightshapes)
        ]
        uitext "^f4Live changes. Use /savelight to save." 0.45
        uihlist 0.01 [
            UIbutton "" [uitext "Light attributes" 0.55] 0.195 0.035 [hideui "lightshape"; showui "editentity"]
            UIbutton "" [uitext "Reset to point" 0.55] 0.195 0.035 [
                UI_ls_type = 0; UI_ls_radius = 0; UI_ls_width = 0; UI_ls_height = 0
                UI_ls_yaw = 0; UI_ls_pitch = 0; UI_ls_roll = 0
                UI_ls_apply
            ]
        ]
    ]
] [
    if (&& (= (enthavesel) 1) [=s (enttype) "light"]) [
        UI_ls_entity = (entindex)
        UI_ls_read
        UI_la_read
    ] [hideui "lightshape"]
] [] [
    uialign -1 0
    if (|| (!= (enthavesel) 1) [!= (entindex) $UI_ls_entity] [!=s (enttype) "light"]) [hideui "lightshape"]
] "Local Light"
