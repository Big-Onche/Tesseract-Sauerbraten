////////////////////////////////////////////////
//
// Sky-cube ambient lighting and visibility volume
//
////////////////////////////////////////////////

skylightuniforms = [result [
    uniform sampler3D tex12;
    uniform vec3 skylf, skyrt, skybk, skyft, skydn, skyup;
    uniform vec2 skyfront;
    uniform vec2 skyambientparams;
]]

skylightocclusionuniforms = [result [
    uniform vec3 skyocclscale, skyoccloffset;
]]

skylightvisibilityfunction = [result [
    float skylightvisibility(sampler3D visibilitymap, vec3 position, vec3 scale, vec3 offset, bool clampbounds)
    {
        if(scale.x <= 0.0) return 1.0;
        vec3 tc = position*scale + offset;
        if(!clampbounds && any(notEqual(tc, clamp(tc, vec3(0.0), vec3(1.0))))) return 1.0;
        return clamp(texture3D(visibilitymap, clamp(tc, vec3(0.0), vec3(1.0))).r, 0.0, 1.0);
    }
]]

skylightfunctions = [result [
    vec3 skycubesample(vec3 dir)
    {
        dir = normalize(dir);
        vec2 front = skyfront;
        float fl2 = dot(front, front);
        front = fl2 > 1.0e-6 ? front*inversesqrt(fl2) : vec2(0.0, -1.0);
        vec2 right = vec2(-front.y, front.x);
        vec3 ld = vec3(dot(dir.xy, right), -dot(dir.xy, front), dir.z);
        vec3 ad = abs(ld);
        float wsum = max(ad.x + ad.y + ad.z, 1.0e-5);
        vec3 cx = ld.x >= 0.0 ? max(skyrt, vec3(0.0)) : max(skylf, vec3(0.0));
        vec3 cy = ld.y >= 0.0 ? max(skybk, vec3(0.0)) : max(skyft, vec3(0.0));
        vec3 cz = ld.z >= 0.0 ? max(skyup, vec3(0.0)) : max(skydn, vec3(0.0));
        return (cx*ad.x + cy*ad.y + cz*ad.z)/wsum;
    }

    float skylightvisibility(vec3 position)
    {
        return skylightvisibility(tex12, position, skyocclscale, skyoccloffset, true);
    }

    vec3 skylightambient(vec3 normal, float visibility)
    {
        return max(skycubesample(normal), vec3(skyambientparams.y))*skyambientparams.x*clamp(visibility, 0.0, 1.0);
    }
]]
