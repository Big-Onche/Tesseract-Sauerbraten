volumetriccloudsvertexshader = [result [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
]]

volumetriccloudsfragmentshader = [
result [
    uniform sampler2D tex0;          // weather map (coverage, type, moisture, erosion)
    uniform sampler3D tex10;         // periodic precomputed R8 FBM volume
    @(gfetchdefs tex8 $msaalight ngfetch)
    @(gfetchdefs tex9)
    uniform vec3 camera;
    uniform mat4 tvcloudinvcamprojmatrix;
    uniform vec4 tvcloudsundir; // xyz=normalized direction, w=abs(z)
    uniform vec4 tvcloudsuntintstrength; // rgb=normalized tint, w=strength
    uniform vec3 tvcloudambienttint;
    uniform float tvcloudambientboost;
    uniform vec3 tvclouddirecttint;
    uniform vec3 tvcloudsilverwarm;
    uniform mat4 worldmatrix;
    uniform vec4 tvcloudscale; // x,y = fullres/rt, z,w = rt/fullres
    uniform vec4 tvcloudbounds; // x=base z, y=top z, z=max dist, w=time
    uniform vec4 tvclouddome;   // x=dome z/r^2 (signed), y,z=dome center xy, w=cloud radius
    uniform vec2 tvcloudscroll; // x,y = accumulated cloud wind offset
    uniform vec4 tvcloudnoise;  // x=base scale, y=detail scale, z=threshold, w=density
    uniform vec3 tvcloudfbmparams; // x=1/period, y=texels/noise unit, z=max mip
    uniform vec4 tvcloudlodoffsets; // x=base, y=macro, z=detail, w=light
    uniform float tvcloudsilverlodoffset;
    uniform float tvcloudstructure;
    uniform float vclouddensity;
    uniform float vcloudalpha;
    uniform float vcloudthickness;
    uniform vec4 tvcloudsilvermask; // x,y=sun screen position in full-res pixels, z=mask radius in pixels, w=screen fade
    uniform float tvcloudcrmask; // geometry-independent directional source enabled
    uniform float tvcloudsilvercontrast;
    uniform vec3 tvcloudphaseparams; // x=g0, y=g1, z=dual-lobe blend
    uniform vec3 tvcloudmultiscatparams; // x=scatter attenuation, y=phase attenuation, z=active octaves
    uniform vec4 tvcloudmultiscatextscale;
    uniform vec4 tvcloudsunextscale;
    uniform vec4 tvcloudsilverparams0; // x=sharpness, y=intensity, z=density enter, w=density exit 0
    uniform vec4 tvcloudsilverparams1; // x=density exit 1, y=alpha enter, z=alpha exit 0, w=alpha exit 1
    uniform vec2 fogdensity;
    uniform float tvcloudfogdistmul;
    uniform vec2 tvcloudatmoblend;          // x=min radius blend start, y=max radius blend end
    uniform vec4 vcloudatmosunlight;         // rgb=atmosphere sunlight scale, a=atmosphere alpha
    uniform vec4 vcloudatmoopticaldepthparams;// xyz=shell depth terms, w=planet radius
    uniform vec3 vcloudatmosunweight;
    uniform vec3 vcloudatmomieparams;
    uniform vec3 vcloudatmobetarayleigh;
    uniform vec3 vcloudatmobetamie;
    uniform vec3 vcloudatmobetaozone;
    uniform vec2 hdrgamma;
    uniform float tvcloudsteps;
    uniform vec4 tvcloudviewsteps; // x=near, y=medium, z=far max world step, w=world size
    uniform float tvcloudsunsteps;
    uniform vec3 vcloudcolour;
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;
    fragdata(1) float fragcrsource;

    const int TV_MULTISCAT_OCTAVES = @arg1;
    const int TV_SUN_STEPS_MAX = 32;
    const float TV_INV_4PI = 0.07957747154594767;

    @(? (= $arg1 1) [
        #define TV_MULTISCAT_TYPE float
        #define TV_MULTISCAT_EXT_SCALE tvcloudmultiscatextscale.x
        #define TV_SUN_EXT_SCALE tvcloudsunextscale.x
    ] [
        #define TV_MULTISCAT_TYPE vec@arg1
        #define TV_MULTISCAT_EXT_SCALE tvcloudmultiscatextscale.@(substr "xyzw" 0 $arg1)
        #define TV_SUN_EXT_SCALE tvcloudsunextscale.@(substr "xyzw" 0 $arg1)
    ])

    float interleavedGradientNoise(vec2 p)
    {
        // Stable per-pixel jitter to avoid time-based shimmer.
        return fract(52.9829189 * fract(0.06711056 * p.x + 0.00583715 * p.y));
    }

    vec2 fullresRepresentativeFromCloudPix(vec2 cloudPix)
    {
        // Center-ish representative of the low-res texel footprint in full-res pixels.
        vec2 p = (cloudPix + vec2(0.5)) * tvcloudscale.xy;
        return clamp(floor(p) + vec2(0.5), vec2(0.5), viewsize.xy - vec2(0.5));
    }

    float tvlogworldstep(float worldStep)
    {
        return log2(max(worldStep, 1.0e-20));
    }

    float tvfbmlod(float logWorldStep, float lodOffset, float bias)
    {
        return clamp(max(logWorldStep + lodOffset, 0.0) + bias, 0.0, tvcloudfbmparams.z);
    }

    float tvfbm(vec3 p, float lod)
    {
        return textureLod(tex10, p * tvcloudfbmparams.x, lod).r;
    }

    struct TVCloudGeometry
    {
        vec2 domeDelta;
        float domeDist2;
        float cloudOffset;
        float flattenedHeight;
        float normalizedHeight;
        float radiusFade;
    };

    TVCloudGeometry tvcloudgeometry(vec3 p, float invThickness)
    {
        TVCloudGeometry geometry;
        geometry.domeDelta = p.xy - tvclouddome.yz;
        geometry.domeDist2 = dot(geometry.domeDelta, geometry.domeDelta);
        geometry.cloudOffset = tvclouddome.x * geometry.domeDist2;
        geometry.flattenedHeight = p.z - geometry.cloudOffset;
        geometry.normalizedHeight = clamp((geometry.flattenedHeight - tvcloudbounds.x) * invThickness, 0.0, 1.0);

        float radius = tvclouddome.w;
        if(radius <= 1.0e-4) geometry.radiusFade = 0.0;
        else
        {
            float inner = radius * 0.94;
            geometry.radiusFade = 1.0 - smoothstep(inner * inner, radius * radius, geometry.domeDist2);
        }
        return geometry;
    }

    float tvsunundercloudk(vec3 sdir, float cloudOffset, float horizdist)
    {
        float belowhorizon = sdir.z <= 0.0 ? 1.0 : 0.0;
        if(horizdist <= 1.0) return belowhorizon;

        float cloudbase = tvcloudbounds.x + cloudOffset;
        float baseslope = (cloudbase - camera.z) / max(horizdist, 1.0);
        float sunhoriz = max(length(sdir.xy), 1.0e-4);
        float sunslope = sdir.z / sunhoriz;
        float undercloud = smoothstep(-0.03, 0.08, baseslope - sunslope);
        undercloud *= 1.0 - smoothstep(0.18, 0.55, sdir.z);
        return clamp(max(undercloud, belowhorizon), 0.0, 1.0);
    }

    vec4 tvweather(vec2 xy)
    {
        float period = max(tvclouddome.w * 2.0, 1.0);
        vec2 wind = tvcloudscroll * 0.35;
        return texture2D(tex0, (xy + wind) / period);
    }

    float tvsunsilvermask(vec2 screentc)
    {
        if(tvcloudsilvermask.w <= 1.0e-4 || tvcloudsilvermask.z <= 1.0e-4) return 0.0;
        float sundist = length(tvcloudsilvermask.xy - screentc);
        float sunmask = 1.0 - smoothstep(0.0, tvcloudsilvermask.z, sundist);
        sunmask *= sunmask;
        return sunmask * tvcloudsilvermask.w;
    }

    vec3 tvcloudhcoeffs(vec3 o, vec3 d)
    {
        vec2 q = o.xy - tvclouddome.yz;
        vec2 u = d.xy;
        float k = tvclouddome.x;
        float a = -k * dot(u, u);
        float b = d.z - 2.0 * k * dot(q, u);
        float c = o.z - k * dot(q, q);
        return vec3(a, b, c);
    }

    vec3 tvcloudhcoeffs(TVCloudGeometry geometry, vec3 d)
    {
        vec2 u = d.xy;
        float k = tvclouddome.x;
        float a = -k * dot(u, u);
        float b = d.z - 2.0 * k * dot(geometry.domeDelta, u);
        return vec3(a, b, geometry.flattenedHeight);
    }

    int tvquadraticroots(float a, float b, float c, out vec2 roots)
    {
        roots = vec2(0.0);
        if(abs(a) <= 1.0e-8)
        {
            if(abs(b) <= 1.0e-8) return 0;
            roots.x = -c / b;
            return 1;
        }

        float disc = b*b - 4.0*a*c;
        if(disc < 0.0) return 0;

        float s = sqrt(max(disc, 0.0));
        float q = -0.5 * (b + (b < 0.0 ? -s : s));
        float r0 = q / a;
        float r1 = abs(q) > 1.0e-8 ? c / q : (-b + s) / (2.0 * a);
        if(r0 > r1) { float t = r0; r0 = r1; r1 = t; }
        roots = vec2(r0, r1);
        return disc <= 1.0e-8 ? 1 : 2;
    }

    float tvfirstpositiveroot(float a, float b, float c)
    {
        vec2 roots;
        int nroots = tvquadraticroots(a, b, c, roots);
        float t = 1.0e16;
        if(nroots >= 1 && roots.x > 1.0e-4) t = roots.x;
        if(nroots >= 2 && roots.y > 1.0e-4) t = min(t, roots.y);
        return t;
    }

    float tvcloudheval(vec3 hcoeff, float t)
    {
        return (hcoeff.x * t + hcoeff.y) * t + hcoeff.z;
    }

    float tvcloudviewstep(float t)
    {
        float worldspan = max(tvcloudviewsteps.w, 1.0);
        float mediumk = smoothstep(0.0, worldspan, t);
        float fark = smoothstep(worldspan, 4.0 * worldspan, t);
        return mix(mix(tvcloudviewsteps.x, tvcloudviewsteps.y, mediumk), tvcloudviewsteps.z, fark);
    }

    void tvcloudsortpair(inout float a, inout float b)
    {
        if(a > b) { float t = a; a = b; b = t; }
    }

    void tvcloudappendinterval(float tstart, float tend, vec3 hcoeff, float hbase, float htop,
                               inout vec2 interval0, inout vec2 interval1, inout int intervalcount)
    {
        if(tend <= tstart) return;

        float hmid = tvcloudheval(hcoeff, 0.5 * (tstart + tend));
        if(hmid < hbase || hmid > htop) return;

        if(intervalcount <= 0)
        {
            interval0 = vec2(tstart, tend);
            intervalcount = 1;
        }
        else if(intervalcount == 1)
        {
            // A tangent root can split one connected interval into two adjacent
            // pieces. Merge those pieces instead of consuming the second slot.
            if(tstart <= interval0.y) interval0.y = tend;
            else
            {
                interval1 = vec2(tstart, tend);
                intervalcount = 2;
            }
        }
        else if(tstart <= interval1.y) interval1.y = tend;
    }

    float tvdensity(vec3 p, float lodWorldStep, float farDist, float invThickness, out TVCloudGeometry geometry, out float logWorldStep)
    {
        logWorldStep = 0.0;
        float densityk = clamp(vclouddensity, 0.0, 1.0);
        if(densityk <= 1.0e-4) return 0.0;
        vec4 weather = tvweather(p.xy);
        float overcastk = smoothstep(0.5, 1.0, densityk);
        float coverage = mix(weather.r * min(densityk * 2.0, 1.0), 1.0, overcastk);
        coverage = clamp(coverage, 0.0, 1.0);
        if(coverage <= 0.015) return 0.0;
        float cloudtype = mix(weather.g, 0.55, overcastk);
        float moisture = mix(weather.b, 0.85, overcastk * 0.75);
        geometry = tvcloudgeometry(p, invThickness);
        if(geometry.radiusFade <= 1.0e-4) return 0.0;

        float h = geometry.normalizedHeight;
        float layer = smoothstep(mix(0.03, 0.12, cloudtype), mix(0.30, 0.48, cloudtype), h)
                    * (1.0 - smoothstep(mix(0.58, 0.70, cloudtype), mix(0.92, 0.99, cloudtype), h));
        if(layer <= 1.0e-4) return 0.0;

        logWorldStep = tvlogworldstep(lodWorldStep);
        float detailRate = max(lodWorldStep, 0.0) * tvcloudnoise.y;
        float farfield = max(smoothstep(0.28, 1.20, detailRate), smoothstep(tvcloudbounds.z * 0.08, tvcloudbounds.z * 0.42, farDist));
        float structurebias = clamp(tvcloudstructure - 1.0, -1.0, 1.0);
        float detailFade = clamp(1.0 - detailRate * 1.45, 0.0, 1.0);
        detailFade = detailFade * detailFade * (3.0 - 2.0 * detailFade);
        float macroWeight = clamp((0.50 + 0.18 * farfield) - 0.22 * structurebias, 0.0, 1.0);
        float detailWeight = clamp(mix(mix(0.08, 0.22, cloudtype), mix(0.02, 0.07, cloudtype), farfield) + 0.18 * structurebias, 0.0, 0.75);

        vec3 windp = p;
        windp.xy += tvcloudscroll;
        windp.z += tvcloudbounds.w * 2.0;

        float overcast = coverage;
        float baseLod = tvfbmlod(logWorldStep, tvcloudlodoffsets.x, 0.0);
        float base = tvfbm(windp * tvcloudnoise.x, baseLod);
        float macroScale = tvcloudnoise.x * 0.22;
        float macro = tvfbm((windp + vec3(-23.0, 17.0, 9.0)) * macroScale, tvfbmlod(logWorldStep, tvcloudlodoffsets.y, 0.0));
        float detailLod = base;
        // Keep the smooth LOD blend through its visible range, but do not execute
        // detail FBM after its blend coefficient has become negligible.
        if(detailFade > 1.0e-4)
        {
            float detail = tvfbm((windp + vec3(13.0, -9.0, 17.0)) * tvcloudnoise.y,
                                 tvfbmlod(logWorldStep, tvcloudlodoffsets.z, 0.0));
            detailLod = mix(base, detail, detailFade);
        }
        float structure = mix(base, macro, macroWeight);
        float threshold = mix(tvcloudnoise.z + 0.40, tvcloudnoise.z - 0.32, overcast);
        threshold += mix(0.12, -0.06, cloudtype);
        threshold -= (moisture - 0.5) * 0.12;
        threshold -= 0.10 * overcastk;
        float shape = mix(structure, detailLod, detailWeight);
        shape = smoothstep(threshold - mix(0.02, 0.07, moisture), threshold + mix(0.22, 0.10, overcast), shape);
        if(shape <= 1.0e-4) return 0.0;
        float billow = mix(smoothstep(0.20, 0.85, detailLod), moisture, 0.35);
        billow = mix(billow, smoothstep(0.26, 0.80, structure), 0.55 * farfield);
        float breakup = mix(0.28, 0.06, overcast) * mix(1.0, 0.12, overcastk) * mix(0.78, 0.10, farfield)
                      * clamp(1.0 + 0.45 * structurebias, 0.55, 1.45);
        float d = shape;
        if(breakup > 1.0 / 1024.0)
        {
            float edge = 1.0 - smoothstep(mix(0.06, 0.16, farfield), mix(0.78, 0.93, farfield), shape);
            float erosionWeight = clamp(0.40 * (1.0 - overcastk) + 0.18 * structurebias, 0.0, 0.85);
            float erosion = clamp(mix(smoothstep(0.34, 0.86, detailLod), weather.a, erosionWeight), 0.0, 1.0);
            erosion = pow(erosion, 0.9);
            d *= 1.0 - breakup * edge * erosion;
        }
        d *= mix(0.88, 1.18, billow * shape);
        d = clamp(d, 0.0, 1.0);
        float densityamp = coverage * mix(0.80, 1.45, moisture);
        return d * layer * tvcloudnoise.w * densityamp * geometry.radiusFade;
    }

    // Secondary sun rays need the same large density boundaries as the camera
    // ray, but not all of the surface-frequency noise used to shade them.
    float tvdensitymedium(vec3 p, float lodWorldStep, float logWorldStep, float invThickness)
    {
        float densityk = clamp(vclouddensity, 0.0, 1.0);
        if(densityk <= 1.0e-4) return 0.0;
        vec4 weather = tvweather(p.xy);
        float overcastk = smoothstep(0.5, 1.0, densityk);
        float coverage = mix(weather.r * min(densityk * 2.0, 1.0), 1.0, overcastk);
        coverage = clamp(coverage, 0.0, 1.0);
        if(coverage <= 0.015) return 0.0;
        float cloudtype = mix(weather.g, 0.55, overcastk);
        float moisture = mix(weather.b, 0.85, overcastk * 0.75);
        TVCloudGeometry geometry = tvcloudgeometry(p, invThickness);
        if(geometry.radiusFade <= 1.0e-4) return 0.0;

        float h = geometry.normalizedHeight;
        float layer = smoothstep(mix(0.03, 0.12, cloudtype), mix(0.30, 0.48, cloudtype), h)
                    * (1.0 - smoothstep(mix(0.58, 0.70, cloudtype), mix(0.92, 0.99, cloudtype), h));
        if(layer <= 1.0e-4) return 0.0;

        float detailRate = max(lodWorldStep, 0.0) * tvcloudnoise.y;
        float farDist = length(p.xy - camera.xy);
        float farfield = max(smoothstep(0.28, 1.20, detailRate), smoothstep(tvcloudbounds.z * 0.08, tvcloudbounds.z * 0.42, farDist));
        float structurebias = clamp(tvcloudstructure - 1.0, -1.0, 1.0);
        float detailFade = clamp(1.0 - detailRate * 1.45, 0.0, 1.0);
        detailFade = detailFade * detailFade * (3.0 - 2.0 * detailFade);
        float macroWeight = clamp((0.50 + 0.18 * farfield) - 0.22 * structurebias, 0.0, 1.0);
        float detailWeight = clamp(mix(mix(0.08, 0.22, cloudtype), mix(0.02, 0.07, cloudtype), farfield) + 0.18 * structurebias, 0.0, 0.75);

        vec3 windp = p;
        windp.xy += tvcloudscroll;
        windp.z += tvcloudbounds.w * 2.0;

        float overcast = coverage;
        float baseLod = tvfbmlod(logWorldStep, tvcloudlodoffsets.x, 1.0);
        float base = tvfbm(windp * tvcloudnoise.x, baseLod);
        float macroScale = tvcloudnoise.x * 0.22;
        float macro = tvfbm((windp + vec3(-23.0, 17.0, 9.0)) * macroScale, tvfbmlod(logWorldStep, tvcloudlodoffsets.y, 1.0));
        float detailLod = base;
        if(detailFade > 1.0e-4)
        {
            float detail = tvfbm((windp + vec3(13.0, -9.0, 17.0)) * tvcloudnoise.y,
                                 tvfbmlod(logWorldStep, tvcloudlodoffsets.z, 1.5));
            detailLod = mix(base, detail, detailFade);
        }
        float structure = mix(base, macro, macroWeight);
        float threshold = mix(tvcloudnoise.z + 0.40, tvcloudnoise.z - 0.32, overcast);
        threshold += mix(0.12, -0.06, cloudtype);
        threshold -= (moisture - 0.5) * 0.12;
        threshold -= 0.10 * overcastk;
        float shape = mix(structure, detailLod, detailWeight);
        shape = smoothstep(threshold - mix(0.02, 0.07, moisture), threshold + mix(0.22, 0.10, overcast), shape);
        if(shape <= 1.0e-4) return 0.0;
        float billow = mix(smoothstep(0.20, 0.85, detailLod), moisture, 0.35);
        billow = mix(billow, smoothstep(0.26, 0.80, structure), 0.55 * farfield);
        float breakup = mix(0.28, 0.06, overcast) * mix(1.0, 0.12, overcastk) * mix(0.78, 0.10, farfield)
                      * clamp(1.0 + 0.45 * structurebias, 0.55, 1.45);
        float d = shape;
        if(breakup > 1.0 / 1024.0)
        {
            float edge = 1.0 - smoothstep(mix(0.06, 0.16, farfield), mix(0.78, 0.93, farfield), shape);
            float erosionWeight = clamp(0.40 * (1.0 - overcastk) + 0.18 * structurebias, 0.0, 0.85);
            float erosion = clamp(mix(smoothstep(0.34, 0.86, detailLod), weather.a, erosionWeight), 0.0, 1.0);
            erosion = pow(erosion, 0.9);
            d *= 1.0 - breakup * edge * erosion;
        }
        d *= mix(0.88, 1.18, billow * shape);
        d = clamp(d, 0.0, 1.0);
        float densityamp = coverage * mix(0.80, 1.45, moisture);
        return d * layer * tvcloudnoise.w * densityamp * geometry.radiusFade;
    }

    float tvextworldscale()
    {
        return max(tvcloudnoise.x, 1.0e-5);
    }

    float tvhgphase(float cosTheta, float g)
    {
        float g2 = g * g;
        float denom = max(1.0 + g2 - 2.0 * g * cosTheta, 1.0e-4);
        return TV_INV_4PI * (1.0 - g2) / pow(denom, 1.5);
    }

    float tvdualhgphase(float cosTheta, vec3 phaseparams)
    {
        float phase0 = tvhgphase(cosTheta, phaseparams.x);
        float phase1 = tvhgphase(cosTheta, phaseparams.y);
        return mix(phase0, phase1, phaseparams.z);
    }

    float tvatmoextinctioncomp(float w)
    {
        return abs(w) > 1.0e-4 ? (exp2(w) - 1.0) / w : 0.69314718;
    }

    vec3 tvatmoscolor(vec3 ray, vec3 sdir)
    {
        if(vcloudatmosunlight.a <= 1.0e-4) return vec3(0.0);

        float costheta = dot(ray, sdir);
        float offset = ray.z * vcloudatmoopticaldepthparams.w;
        vec3 depth = sqrt(vec3(offset * offset) + vcloudatmoopticaldepthparams.xyz) - vec3(offset);
        vec3 rayleighweight = vcloudatmobetarayleigh * depth.x;
        vec3 mieweight = vcloudatmobetamie * depth.y;
        vec3 ozoneweight = vcloudatmobetaozone * (depth.z - depth.x);
        vec3 viewweight = vcloudatmosunweight - (rayleighweight + mieweight + ozoneweight);
        vec3 extinction = vec3(
            tvatmoextinctioncomp(viewweight.x),
            tvatmoextinctioncomp(viewweight.y),
            tvatmoextinctioncomp(viewweight.z)
        );

        float rphase = (1.5 + 0.5 * costheta * costheta) * (3.0 / (16.0 * 3.14159265));
        float miearg = max(vcloudatmomieparams.x + vcloudatmomieparams.y * min(costheta, vcloudatmomieparams.z), 1.0e-4);
        float mphase = inversesqrt(miearg);
        vec3 scatter = rayleighweight * rphase + mieweight * (mphase * mphase * mphase);
        vec3 inscatter = max((vcloudatmosunlight.rgb * scatter) * extinction, vec3(0.0));
        @(hdrgammaencode inscatter)
        return inscatter;
    }

    TV_MULTISCAT_TYPE tvsuntransmittance(vec3 p, TVCloudGeometry geometry, vec3 sdir, float thickness, float sunext, int sunsteps,
                                         float densityLodStep, float logDensityLodStep, float primaryDensity)
    {
        float tmax;
        if(abs(tvclouddome.x) <= 1.0e-12)
        {
            if(abs(sdir.z) <= 1.0e-4) tmax = thickness * 6.0;
            else
            {
                float boundz = sdir.z >= 0.0 ? tvcloudbounds.y : tvcloudbounds.x;
                tmax = (boundz - p.z) / sdir.z;
            }
        }
        else
        {
            vec3 hcoeff = tvcloudhcoeffs(geometry, sdir);
            float tbase = tvfirstpositiveroot(hcoeff.x, hcoeff.y, hcoeff.z - tvcloudbounds.x);
            float ttop = tvfirstpositiveroot(hcoeff.x, hcoeff.y, hcoeff.z - tvcloudbounds.y);
            tmax = min(tbase, ttop);
        }
        if(!(tmax > 0.0) || !(tmax < 1.0e15)) return TV_MULTISCAT_TYPE(1.0);

        tmax = min(tmax, thickness * 6.0);
        const float TV_SUN_OPTICAL_DEPTH_CUTOFF = 2.99573227; // -log(0.05)
        float sunstepdist = max(tmax / float(sunsteps), 1.0e-3);
        float sigmaScale = sunstepdist * sunext;
        TV_MULTISCAT_TYPE opticalDepth = TV_MULTISCAT_TYPE(0.0);
        vec3 sunstep = sdir * sunstepdist;
        vec3 sunp = p + sunstep * 0.35;
        bool reusePrimary = sunstepdist * tvcloudnoise.x <= 0.20;
        float invThickness = 1.0 / thickness;
        float sunDensityLodStep = max(densityLodStep, sunstepdist);
        float logSunDensityLodStep = max(logDensityLodStep, tvlogworldstep(sunstepdist));
        for(int j = 0; j < TV_SUN_STEPS_MAX; ++j)
        {
            if(j >= sunsteps) break;
            float d = primaryDensity;
            if(j != 0 || !reusePrimary)
            {
                d = tvdensitymedium(sunp, sunDensityLodStep, logSunDensityLodStep, invThickness);
            }
            if(d > 1.0e-4) opticalDepth += d * sigmaScale * TV_SUN_EXT_SCALE;
            if(@(? (= $arg1 1) [opticalDepth > TV_SUN_OPTICAL_DEPTH_CUTOFF] [all(greaterThan(opticalDepth, TV_MULTISCAT_TYPE(TV_SUN_OPTICAL_DEPTH_CUTOFF)))])) break;
            sunp += sunstep;
        }
        return exp(-clamp(opticalDepth, TV_MULTISCAT_TYPE(0.0), TV_MULTISCAT_TYPE(32.0)));
    }

    TV_MULTISCAT_TYPE tvmultiscatweights(float cosTheta, vec3 phaseparams, float scatteratten, float phaseatten)
    {
        // Approximate multiple scattering by summing repeated single-scattering octaves
        // with the Frostbite paper's a, b and theta*c^n substitutions.
        TV_MULTISCAT_TYPE weights = TV_MULTISCAT_TYPE(0.0);
        float scatterscale = 1.0;
        float phaseanglescale = 1.0;
        float theta = acos(clamp(cosTheta, -1.0, 1.0));
        for(int i = 0; i < TV_MULTISCAT_OCTAVES; ++i)
        {
            float phase = tvdualhgphase(cos(theta * phaseanglescale), phaseparams);
            float weight = scatterscale * phase;
            @(? (= $arg1 1) [weights = weight;] [weights[i] = weight;])
            scatterscale *= scatteratten;
            phaseanglescale *= phaseatten;
        }
        return weights;
    }

    float tvmultiscatdot(TV_MULTISCAT_TYPE transmittance, TV_MULTISCAT_TYPE weights)
    {
        return @(? (= $arg1 1) [transmittance * weights] [dot(transmittance, weights)]);
    }

    float tvprimarytransmittance(TV_MULTISCAT_TYPE transmittance)
    {
        return @(? (= $arg1 1) [transmittance] [transmittance.x]);
    }

    void main(void)
    {
        fragcrsource = 0.0;
        // Map each low-res pixel to a stable representative full-res texel in its footprint.
        vec2 cloudPix = floor(gl_FragCoord.xy);
        vec2 screentc = fullresRepresentativeFromCloudPix(cloudPix);
        float silvermask = tvsunsilvermask(screentc);
        // Unlike the visible silver highlight, the distant crepuscular source
        // is not bounded by a local screen-space radius. Its spatial gate is
        // the cloud/sun angular phase evaluated below.
        float crsourcefade = tvcloudcrmask * tvcloudsilvermask.w;
        float silvercontrast = max(tvcloudsilvercontrast, 1.0);
        // Explicit sky can write depth without gbuffer normals; treat it as background.
        vec4 normalsample = ngfetch(tex8, screentc);
        bool hasscene = dot(normalsample.rgb, normalsample.rgb) > 1.0e-6;
        @(gdepthunpack depth [gfetch(tex9, screentc)] [
            vec3 wpos = (worldmatrix * vec4(depth*screentc, depth, 1.0)).xyz;
        ] [
            vec4 wpos = worldmatrix * vec4(screentc, depth, 1.0);
            wpos.xyz /= wpos.w;
        ])

        float raydist = length(wpos.xyz - camera);
        if(!(raydist > 0.0))
        {
            fragcolor = vec4(0.0);
            return;
        }
        vec2 rayndc = screentc * viewsize.zw * 2.0 - vec2(1.0);
        vec4 raypoint = tvcloudinvcamprojmatrix * vec4(rayndc, 1.0, 1.0);
        raypoint.xyz /= max(abs(raypoint.w), 1.0e-6) * (raypoint.w < 0.0 ? -1.0 : 1.0);
        vec3 ray = normalize(raypoint.xyz - camera);
        float crangularterm = pow(max(dot(ray, tvcloudsundir.xyz), 0.0), tvcloudsilverparams0.x);
        float visiblescenedist = hasscene ? min(raydist, tvcloudbounds.z) : tvcloudbounds.z;
        // Only the one-channel ray source is allowed to see through geometry.
        // Use the directional sun/cloud phase instead of the visible local
        // silver radius, preserving the distant source across occluders.
        float scenedist = crsourcefade * crangularterm > 1.0e-4 ? tvcloudbounds.z : visiblescenedist;
        if(scenedist <= 1.0)
        {
            fragcolor = vec4(0.0);
            return;
        }

        float rayXYLength = length(ray.xy);
        vec2 cloudinterval0 = vec2(0.0), cloudinterval1 = vec2(0.0);
        int cloudintervals = 0;
        bool startinside = false;
        float thickness = max(tvcloudbounds.y - tvcloudbounds.x, 1.0);
        if(abs(tvclouddome.x) <= 1.0e-12)
        {
            float t0 = 0.0, t1 = scenedist;
            startinside = camera.z >= tvcloudbounds.x && camera.z <= tvcloudbounds.y;
            if(abs(ray.z) < 1.0e-4)
            {
                if(camera.z < tvcloudbounds.x || camera.z > tvcloudbounds.y)
                {
                    fragcolor = vec4(0.0);
                    return;
                }
            }
            else
            {
                float invrz = 1.0 / ray.z;
                float tz0 = (tvcloudbounds.x - camera.z) * invrz;
                float tz1 = (tvcloudbounds.y - camera.z) * invrz;
                if(tz0 > tz1) { float t = tz0; tz0 = tz1; tz1 = t; }
                t0 = max(t0, tz0);
                t1 = min(t1, tz1);
            }
            if(t1 > t0)
            {
                cloudinterval0 = vec2(t0, t1);
                cloudintervals = 1;
            }
        }
        else
        {
            vec3 hcoeff = tvcloudhcoeffs(camera, ray);
            float hbase = tvcloudbounds.x, htop = tvcloudbounds.y;
            startinside = hcoeff.z >= hbase && hcoeff.z <= htop;

            vec2 broots = vec2(0.0), troots = vec2(0.0);
            int nbottom = tvquadraticroots(hcoeff.x, hcoeff.y, hcoeff.z - hbase, broots);
            int ntop = tvquadraticroots(hcoeff.x, hcoeff.y, hcoeff.z - htop, troots);

            // A quadratic and the two layer boundaries produce at most six
            // breakpoints. Keep them in scalars and use a fixed sorting network.
            float cut0 = 0.0;
            float cut1 = scenedist;
            float cut2 = nbottom >= 1 ? clamp(broots.x, 0.0, scenedist) : scenedist;
            float cut3 = nbottom >= 2 ? clamp(broots.y, 0.0, scenedist) : scenedist;
            float cut4 = ntop >= 1 ? clamp(troots.x, 0.0, scenedist) : scenedist;
            float cut5 = ntop >= 2 ? clamp(troots.y, 0.0, scenedist) : scenedist;

            tvcloudsortpair(cut1, cut2);
            tvcloudsortpair(cut4, cut5);
            tvcloudsortpair(cut0, cut2);
            tvcloudsortpair(cut3, cut5);
            tvcloudsortpair(cut0, cut1);
            tvcloudsortpair(cut3, cut4);
            tvcloudsortpair(cut2, cut5);
            tvcloudsortpair(cut0, cut3);
            tvcloudsortpair(cut1, cut4);
            tvcloudsortpair(cut2, cut4);
            tvcloudsortpair(cut1, cut3);
            tvcloudsortpair(cut2, cut3);

            tvcloudappendinterval(cut0, cut1, hcoeff, hbase, htop, cloudinterval0, cloudinterval1, cloudintervals);
            tvcloudappendinterval(cut1, cut2, hcoeff, hbase, htop, cloudinterval0, cloudinterval1, cloudintervals);
            tvcloudappendinterval(cut2, cut3, hcoeff, hbase, htop, cloudinterval0, cloudinterval1, cloudintervals);
            tvcloudappendinterval(cut3, cut4, hcoeff, hbase, htop, cloudinterval0, cloudinterval1, cloudintervals);
            tvcloudappendinterval(cut4, cut5, hcoeff, hbase, htop, cloudinterval0, cloudinterval1, cloudintervals);
        }

        // Keep a tiny epsilon from the camera to avoid self-sampling artifacts, but
        // do not add a large outside-layer skip (it creates a visible disappear zone
        // when crossing the cloud slab boundary).
        cloudinterval0.x = max(cloudinterval0.x, 0.1);
        if(cloudintervals >= 2) cloudinterval1.x = max(cloudinterval1.x, 0.1);
        if(cloudintervals >= 1 && cloudinterval0.y <= cloudinterval0.x)
        {
            cloudinterval0 = cloudinterval1;
            cloudintervals--;
            // The camera-containing piece was entirely inside the self-sampling
            // epsilon; a promoted distant re-entry is not a camera interval.
            startinside = false;
        }
        if(cloudintervals >= 2 && cloudinterval1.y <= cloudinterval1.x) cloudintervals--;
        if(cloudintervals <= 0)
        {
            fragcolor = vec4(0.0);
            return;
        }

        const int TV_STEPS_MAX = 512;
        float extworld = tvextworldscale();
        float viewext = extworld * (12.0 * clamp(vcloudalpha, 0.0, 1.0));
        float sunext = extworld * (10.0 * max(vcloudthickness, 0.0));
        int marchsteps = int(clamp(tvcloudsteps, 4.0, float(TV_STEPS_MAX)));
        int interval0steps = marchsteps;
        // Preserve the full configured budget for the camera interval. A re-entry
        // is independent and lower priority, so it cannot dilute the near samples.
        int interval1steps = startinside ? (marchsteps >= 8 ? marchsteps / 2 : 4) : marchsteps;
        // Project this angular footprint to each sample distance below. Keeping
        // derivatives outside the adaptive loops avoids divergent derivative use.
        float rayPixelAngle = max(length(dFdx(ray)), length(dFdy(ray)));
        // Keep the full stable spatial range at every cloud render resolution.
        float jitter = interleavedGradientNoise(floor(screentc));
        vec3 sdir = tvcloudsundir.xyz;
        vec3 suntint = tvcloudsuntintstrength.rgb;
        float sunstrength = tvcloudsuntintstrength.w;
        float silverintensity = tvcloudsilverparams0.y;
        float silverdensityenter = tvcloudsilverparams0.z;
        float silverdensityexit0 = tvcloudsilverparams0.w;
        float silverdensityexit1 = tvcloudsilverparams1.x;
        float silveralphaenter = tvcloudsilverparams1.y;
        float silveralphaexit0 = tvcloudsilverparams1.z;
        float silveralphaexit1 = tvcloudsilverparams1.w;
        float multiscatscatter = tvcloudmultiscatparams.x;
        float multiscatphase = tvcloudmultiscatparams.y;
        int sunsteps = int(clamp(tvcloudsunsteps, 2.0, float(TV_SUN_STEPS_MAX)));
        vec3 phaseparams = tvcloudphaseparams;
        float cosT = clamp(dot(ray, sdir), -1.0, 1.0);
        float silverAngularTerm = crangularterm;
        TV_MULTISCAT_TYPE multiscatlaneweights = tvmultiscatweights(cosT, phaseparams, multiscatscatter, multiscatphase);
        float abssunz = tvcloudsundir.w;
        float lightnoisescale = tvcloudnoise.x * 0.35;
        float silvernoisescale = tvcloudnoise.x * 0.55;
        vec3 basecol = max(vcloudcolour, vec3(0.0));
        vec3 ambienttint = tvcloudambienttint;
        vec3 directtint = tvclouddirecttint;
        float sourceatmoblendstrength = clamp(vcloudatmosunlight.a, 0.0, 1.0);
        float atmoblendstrength = !hasscene ? sourceatmoblendstrength : 0.0;
        float atmoblendmin = min(tvcloudatmoblend.x, tvcloudatmoblend.y);
        float atmoblendmax = max(tvcloudatmoblend.x, tvcloudatmoblend.y);
        vec3 atmoscolor = atmoblendstrength > 1.0e-4 ? tvatmoscolor(ray, sdir) : vec3(0.0);

        vec3 accum = vec3(0.0);
        vec3 atmosaccum = vec3(0.0);
        float trans = 1.0;
        float alphaaccum = 0.0;
        float cloudalphaaccum = 0.0;
        float silverrimaccum = 0.0;
        float sourcealphaaccum = 0.0;
        float sourcesilverrimaccum = 0.0;
        float invThickness = 1.0 / thickness;
        // Sorted intervals put the camera-containing segment first when
        // startinside is true. March every region with its own local spacing.
        for(int region = 0; region < 2; ++region)
        {
            if(region >= cloudintervals) break;
            if(trans < 0.03) break;

            float regionstart = region == 0 ? cloudinterval0.x : cloudinterval1.x;
            float regionend = region == 0 ? cloudinterval0.y : cloudinterval1.y;
            int regionsteps = region == 0 ? interval0steps : interval1steps;
            float nearbiasrange = max(thickness, tvcloudviewsteps.w * 0.125);
            float nearbiask = region == 0 ? 1.0 - smoothstep(0.0, nearbiasrange, regionstart) : 0.0;
            if(region == 0 && startinside) nearbiask = 1.0;
            float regioncursor = regionstart;
            int targetindex = 0;
            for(int i = 0; i < TV_STEPS_MAX; ++i)
            {
                if(regioncursor >= regionend) break;
                if(trans < 0.03) break;

                // Blend uniform bin edges toward u^2 for near intervals. The
                // world-step ceiling can subdivide a bin without changing its edge.
                float targetu = min(float(targetindex + 1) / float(regionsteps), 1.0);
                float targett = mix(regionstart, regionend, mix(targetu, targetu * targetu, nearbiask));
                float targetremaining = targett - regioncursor;
                if(!(targetremaining > 0.0))
                {
                    targetindex++;
                    continue;
                }

                float currentsampledist = regioncursor;
                bool anchoredfirstcell = i == 0 && region == 0 && (startinside || regionstart <= nearbiasrange);
                float localstepcap = tvcloudviewstep(currentsampledist);
                if(anchoredfirstcell) localstepcap = min(localstepcap, max(tvcloudviewsteps.x / float(regionsteps), 1.0e-3));
                float nextsampledist = min(min(targett, currentsampledist + localstepcap), regionend);
                float dt = nextsampledist - currentsampledist;
                if(!(dt > 0.0)) break;

                // Jitter selects the density probe inside this exact optical cell;
                // extinction still integrates over its full local dt. Anchor the
                // first near-camera probe at the tiny cell midpoint.
                float samplejitter = anchoredfirstcell ? 0.5 : jitter;
                float t = mix(currentsampledist, nextsampledist, samplejitter);
                regioncursor = nextsampledist;
                if(regioncursor >= targett - 1.0e-6 * max(regionend - regionstart, 1.0)) targetindex++;

                vec3 p = camera + ray * t;
                float projectedPixelFootprint = max(t, 0.0) * rayPixelAngle;
                float densityLodStep = max(dt, projectedPixelFootprint * 0.75);
                float farDist = t * rayXYLength;
                TVCloudGeometry geometry;
                float logDensityLodStep;
                float d = tvdensity(p, densityLodStep, farDist, invThickness, geometry, logDensityLodStep);
                if(d > 1.0e-4)
                {
                    float sigmaext = d * viewext;

                    float h = geometry.normalizedHeight;
                    float undercloudk = tvsunundercloudk(sdir, geometry.cloudOffset, farDist);
                    float sunfacingh = mix(h, 1.0 - h, undercloudk);
                    TV_MULTISCAT_TYPE suntrans = tvsuntransmittance(p, geometry, sdir, thickness, sunext, sunsteps,
                                                                    densityLodStep, logDensityLodStep, d);
                    float sunfacefrac = mix(1.0 - h, h, undercloudk);
                    float localpath = thickness * sunfacefrac * mix(1.0, 0.60, undercloudk);
                    float localangle = max(abssunz, mix(0.22, 0.34, undercloudk));
                    float localsigma = d * sunext * localpath / localangle;
                    TV_MULTISCAT_TYPE localsuntrans = exp(-clamp(localsigma * TV_MULTISCAT_EXT_SCALE,
                                                                 TV_MULTISCAT_TYPE(0.0), TV_MULTISCAT_TYPE(32.0)));
                    suntrans = mix(suntrans, max(suntrans, localsuntrans), undercloudk);
                    float ambient = mix(0.16, 0.32, sunfacingh) + tvcloudambientboost;
                    float direct = mix(0.50, 1.0, sunfacingh) * tvmultiscatdot(suntrans, multiscatlaneweights) * sunstrength;
                    float lightnoise = mix(0.80, 1.05, tvfbm(p * lightnoisescale + vec3(2.0, 11.0, 5.0),
                                                             tvfbmlod(logDensityLodStep, tvcloudlodoffsets.w, 0.0)));
                    vec3 litcol = mix(basecol * vec3(0.76, 0.80, 0.90), basecol * mix(vec3(1.0), suntint, 0.45),
                                      tvprimarytransmittance(suntrans));
                    vec3 samplecol = litcol * (ambienttint * ambient + directtint * direct) * lightnoise;
                    float opticaldepth = clamp(sigmaext * dt, 0.0, 32.0);
                    float steptrans = exp(-opticaldepth);
                    float stepalpha = 1.0 - steptrans;
                    // Energy-conserving analytical integration over a homogeneous step.
                    float contribalpha = trans * stepalpha;
                    // Preserve the previous epsilon behavior when extinction is nearly zero.
                    float extinctionweight = sigmaext >= 1.0e-6 ? 1.0 : sigmaext / 1.0e-6;
                    float fogcoord = t / max(tvcloudfogdistmul, 1.0e-4);
                    float fogvis = clamp(exp2(fogcoord * fogdensity.x) * fogdensity.y, 0.0, 1.0);
                    float visiblecontribalpha = contribalpha * fogvis;
                    float geometryvisible = t <= visiblescenedist ? 1.0 : 0.0;
                    float radial = clamp(sqrt(max(geometry.domeDist2, 0.0)) / max(tvclouddome.w, 1.0e-4), 0.0, 1.0);
                    float radialblend = atmoblendmax > atmoblendmin + 1.0e-4 ? smoothstep(atmoblendmin, atmoblendmax, radial) :
                                                                                 step(atmoblendmax, radial);
                    float sampleatmoblend = radialblend * atmoblendstrength;
                    float sourceatmoblend = radialblend * sourceatmoblendstrength;
                    float cloudblend = 1.0 - sampleatmoblend;
                    float sourcecloudblend = 1.0 - sourceatmoblend;
                    accum += samplecol * (visiblecontribalpha * extinctionweight * cloudblend * geometryvisible);
                    atmosaccum += atmoscolor * (visiblecontribalpha * sampleatmoblend * geometryvisible);
                    alphaaccum += visiblecontribalpha * geometryvisible;
                    cloudalphaaccum += visiblecontribalpha * cloudblend * geometryvisible;
                    sourcealphaaccum += visiblecontribalpha * sourcecloudblend;
                    if(stepalpha < 0.002)
                    {
                        trans *= steptrans;
                        continue;
                    }

                    float densityMask = smoothstep(0.01, silverdensityenter, d) *
                                        (1.0 - smoothstep(silverdensityexit0, silverdensityexit1, d));
                    float noise = 0.7 + 0.3 * tvfbm(p * silvernoisescale + vec3(-5.0, 7.0, 3.0),
                                                    tvfbmlod(logDensityLodStep, tvcloudsilverlodoffset, 0.0));
                    float silverrim = silverAngularTerm * densityMask * noise;
                    silverrim *= silverintensity;
                    silverrimaccum += visiblecontribalpha * cloudblend * silverrim * geometryvisible;
                    sourcesilverrimaccum += visiblecontribalpha * sourcecloudblend * silverrim;
                    trans *= steptrans;
                }
            }
        }

        float alpha = clamp(alphaaccum, 0.0, 1.0);
        if(alpha > 1.0e-4)
        {
            float cloudalpha = clamp(cloudalphaaccum, 0.0, 1.0);
            float silveredge = silvermask * smoothstep(0.01, silveralphaenter, cloudalpha) *
                               (1.0 - smoothstep(silveralphaexit0, silveralphaexit1, cloudalpha));
            silveredge *= clamp(cloudalphaaccum > 1.0e-4 ? silverrimaccum / cloudalphaaccum : 0.0, 0.0, 1.0);
            accum *= mix(1.0, silvercontrast, silveredge);
            accum *= mix(vec3(1.0), tvcloudsilverwarm, 0.35 * silveredge);
            accum += atmosaccum;
        }

        float sourcealpha = clamp(sourcealphaaccum, 0.0, 1.0);
        if(sourcealpha > 1.0e-4)
        {
            float sourceedge = crsourcefade * smoothstep(0.01, silveralphaenter, sourcealpha) *
                               (1.0 - smoothstep(silveralphaexit0, silveralphaexit1, sourcealpha));
            sourceedge *= clamp(sourcesilverrimaccum / max(sourcealphaaccum, 1.0e-4), 0.0, 1.0);
            fragcrsource = sourceedge;
        }

        fragcolor = vec4(accum, alpha);
    }
]
]

defershader 0 "volumetricclouds" [
    // The base shader is scalar; row 0 contains the 2-, 3-, and 4-lane programs.
    shader 0 "volumetricclouds" (volumetriccloudsvertexshader) (volumetriccloudsfragmentshader 1)
    loop+ lanes 2 3 [
        variantshader 0 "volumetricclouds" 0 [] (volumetriccloudsfragmentshader $lanes)
    ]
]

lazyshader 0 "volumetricclouddepth" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    // tex9 = full-res scene depth (rect or msaa)
    @(gfetchdefs tex9 $msaalight)
    uniform vec4 tvcloudscale; // xy = full-res/cloud-res
    uniform vec4 viewsize;
    fragdata(0) float fragdepth;

    void main(void)
    {
        vec2 cloudPix = floor(gl_FragCoord.xy);
        vec2 fullresUV = (cloudPix + vec2(0.5)) * tvcloudscale.xy;
        fullresUV = clamp(floor(fullresUV) + vec2(0.5), vec2(0.5), viewsize.xy - vec2(0.5));
        @(gdepthunpack depth [gfetch(tex9, fullresUV)])
        fragdepth = depth;
    }
]

lazyshader 0 "volumetriccloudsupscale" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    // tex0 = low-res cloud RT (RGBA)
    uniform sampler2DRect tex0;
    // tex1 = cached representative linear depth at cloud resolution
    uniform sampler2DRect tex1;
    // tex9 = full-res scene depth (rect or msaa)
    @(gfetchdefs tex9 $msaalight)
    uniform vec4 tvcloudscale;      // xy = output/src, zw = src/output
    uniform float tvbilateraledge;  // relative depth tolerance for cloud upsample taps
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;

    float fetchDepthLinear(vec2 uv)
    {
        @(gdepthunpack depth [gfetch(tex9, uv)])
        return depth;
    }

    float cloudDepthErr(float sampleDepth, float centerDepth)
    {
        float depthTolerance = max(2.0, max(abs(centerDepth), abs(sampleDepth)) * max(tvbilateraledge, 1.0e-5));
        return abs(sampleDepth - centerDepth) / depthTolerance;
    }

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy;
        float centerDepth = fetchDepthLinear(uv);

        vec2 srcsize = max(floor(viewsize.xy * tvcloudscale.zw + vec2(0.5)), vec2(1.0));
        vec2 srcf = uv * tvcloudscale.zw - vec2(0.5);
        srcf = clamp(srcf, vec2(0.0), srcsize - vec2(1.0));
        vec2 base = floor(srcf);
        vec2 fracp = srcf - base;

        vec4 accumCloud = vec4(0.0);
        float totalWeight = 0.0;

        for(int iy = 0; iy < 2; ++iy)
        {
            for(int ix = 0; ix < 2; ++ix)
            {
                vec2 o = vec2(float(ix), float(iy));
                float wx = ix == 0 ? (1.0 - fracp.x) : fracp.x;
                float wy = iy == 0 ? (1.0 - fracp.y) : fracp.y;
                float spatialWeight = wx * wy;
                if(spatialWeight <= 1.0e-6) continue;

                vec2 cloudPix = clamp(base + o, vec2(0.0), srcsize - vec2(1.0));
                vec2 cloudUV = cloudPix + vec2(0.5);

                float sampleDepth = texture2DRect(tex1, cloudUV).r;
                float depthErr = cloudDepthErr(sampleDepth, centerDepth);
                // Strong depth weighting prevents low-res cloud alpha from leaking
                // onto foreground silhouettes during upscale.
                if(depthErr > 3.0) continue;
                float depthWeight = exp(-depthErr * depthErr);
                float w = spatialWeight * depthWeight;
                accumCloud += texture2DRect(tex0, cloudUV) * w;
                totalWeight += w;
            }
        }

        fragcolor = totalWeight > 1.0e-5 ? (accumCloud / totalWeight) : vec4(0.0);
    }
]

lazyshader 0 "volumetriccloudcomposite" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;

    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    // tex0 retains premultiplied cloud color and accumulated opacity. Transmittance is 1-alpha.
    uniform sampler2DRect tex0;
    // Reuse the raymarch's periodic, precomputed FBM volume for both lightweight detail layers.
    uniform sampler3D tex10;
    varying vec2 texcoord0;
    uniform vec3 camera;
    uniform mat4 tvcloudinvcamprojmatrix;
    uniform vec4 tvcloudbounds;              // x=base z, y=top z, w=time
    uniform vec3 tvcloudfbmparams;           // x=1/period
    uniform vec4 tvcloudsilvermask;          // xy=sun screen position, z=radius, w=fade
    uniform vec4 tvcloudcompositedetail0;     // x=master strength, y=frequency, z=secondary frequency, w=scroll speed
    uniform vec4 tvcloudcompositedetail1;     // x=edge erosion, y=internal darkening, z=silver breakup, w=near scale multiplier
    uniform vec2 tvcloudcompositedetail2;     // x=proximity/fade start distance, y=near fade distance
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;

    vec3 tvcloudworldviewdirection(void)
    {
        vec2 rayndc = gl_FragCoord.xy * viewsize.zw * 2.0 - vec2(1.0);
        vec4 raypoint = tvcloudinvcamprojmatrix * vec4(rayndc, 1.0, 1.0);
        raypoint.xyz /= max(abs(raypoint.w), 1.0e-6) * (raypoint.w < 0.0 ? -1.0 : 1.0);
        return normalize(raypoint.xyz - camera);
    }

    float tvcloudcompositesilvermask(void)
    {
        if(tvcloudsilvermask.w <= 1.0e-4 || tvcloudsilvermask.z <= 1.0e-4) return 0.0;
        float sundist = length(tvcloudsilvermask.xy - gl_FragCoord.xy);
        float sunmask = 1.0 - smoothstep(0.0, tvcloudsilvermask.z, sundist);
        return sunmask * sunmask * tvcloudsilvermask.w;
    }

    void main(void)
    {
        vec4 cloud = texture2DRect(tex0, texcoord0);
        float sourceAlpha = clamp(cloud.a, 0.0, 1.0);
        if(sourceAlpha <= 1.0e-4)
        {
            fragcolor = cloud;
            return;
        }

        // Camera distance to the horizontal slab is zero throughout the cloud layer.
        float slabDistance = max(max(tvcloudbounds.x - camera.z, camera.z - tvcloudbounds.y), 0.0);
        float configuredFadeEnd = max(tvcloudcompositedetail2.y, 1.0);
        float nearScale = clamp(tvcloudcompositedetail1.w, 1.0, 4.0);
        float fadeEnd = max(configuredFadeEnd, tvcloudcompositedetail2.x / nearScale);
        float fadeStart = max(tvcloudcompositedetail2.x, fadeEnd + 1.0);
        float detailFade = smoothstep(0.0, fadeEnd, slabDistance);
        float detailAmount = clamp(tvcloudcompositedetail0.x, 0.0, 1.0) * detailFade;
        if(detailAmount <= 1.0e-4)
        {
            fragcolor = cloud;
            return;
        }

        // Project onto the nearest cloud boundary. A fixed cloud-space point now
        // receives a fixed noise coordinate while camera distance changes.
        vec3 viewDirection = tvcloudworldviewdirection();
        float rayDistance = min(slabDistance / max(abs(viewDirection.z), 1.0e-3), tvcloudbounds.z);
        vec3 cloudSpacePosition = camera + viewDirection * rayDistance;
        vec3 cloudSpaceCoord = cloudSpacePosition / fadeStart;
        vec3 scrollDirection = normalize(vec3(0.73, 0.21, 0.41));
        vec3 skyScroll = scrollDirection * (tvcloudbounds.w * tvcloudcompositedetail0.w);

        vec3 structureCoord = cloudSpaceCoord * tvcloudcompositedetail0.y + skyScroll;
        vec3 erosionCoord = cloudSpaceCoord * tvcloudcompositedetail0.z - skyScroll * 1.37 + vec3(5.2, 11.7, 3.1);
        float structureNoise = texture3D(tex10, structureCoord * tvcloudfbmparams.x).r;
        float erosionNoise = texture3D(tex10, erosionCoord * tvcloudfbmparams.x).r;

        float transmittance = 1.0 - sourceAlpha;
        float materialMask = smoothstep(0.015, 0.10, sourceAlpha);
        float edgeMask = clamp(4.0 * sourceAlpha * transmittance, 0.0, 1.0) * materialMask;

        // The finer layer is deliberately weaker and cannot erase or create detached cloud shapes.
        float fineNoise = clamp((erosionNoise - 0.5) * 2.0, -1.0, 1.0) * 0.35;
        float alphaDelta = fineNoise * edgeMask * detailAmount * clamp(tvcloudcompositedetail1.x, 0.0, 1.0);
        float minAlpha = max(sourceAlpha - min(0.06, sourceAlpha * 0.18), 0.0);
        float maxAlpha = min(sourceAlpha + min(0.025, transmittance * 0.08), 1.0);
        float detailedAlpha = clamp(sourceAlpha + alphaDelta, minAlpha, maxAlpha);
        cloud.rgb *= detailedAlpha / max(sourceAlpha, 1.0e-4);
        cloud.a = detailedAlpha;

        // Broad internal breakup is strongest in semi-dense material and attenuated in opaque cores.
        float semiDenseMask = smoothstep(0.04, 0.30, sourceAlpha) *
                              (1.0 - 0.80 * smoothstep(0.55, 0.95, sourceAlpha));
        float structuralDarkness = 1.0 - smoothstep(0.25, 0.60, structureNoise);
        float internalDarkening = structuralDarkness * semiDenseMask * detailAmount *
                                  clamp(tvcloudcompositedetail1.y, 0.0, 1.0);
        cloud.rgb *= 1.0 - min(internalDarkening, 0.12);

        // Break up only the existing bright, sun-facing edge; this never synthesizes a new lining.
        vec3 unpremultiplied = cloud.rgb / max(cloud.a, 1.0e-4);
        float highlightMask = smoothstep(0.45, 0.90, dot(unpremultiplied, vec3(0.299, 0.587, 0.114)));
        float silverBreakup = (1.0 - smoothstep(0.25, 0.58, erosionNoise)) * 0.35;
        float silverDarkening = silverBreakup * edgeMask * highlightMask * tvcloudcompositesilvermask() * detailAmount *
                                clamp(tvcloudcompositedetail1.z, 0.0, 1.0);
        cloud.rgb *= 1.0 - min(silverDarkening, 0.08);

        fragcolor = cloud;
    }
]

lazyshader 0 "volumetriccloudclarity" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    // tex0 = full-res cloud RT (RGBA, premultiplied)
    uniform sampler2DRect tex0;
    uniform vec4 vcclarityparams; // x=strength, y=radius, z=alpha edge k, w=luma edge k
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;

    float tvcloudluma(vec3 c)
    {
        return dot(c, vec3(0.299, 0.587, 0.114));
    }

    vec4 tvfetchclarity(vec2 uv)
    {
        return texture2DRect(tex0, clamp(uv, vec2(0.5), viewsize.xy - vec2(0.5)));
    }

    float tvclarityweight(vec4 center, vec4 tapcolor, float centerluma, float spatialweight)
    {
        float sampleluma = tvcloudluma(tapcolor.rgb);
        float alphaDiff = abs(tapcolor.a - center.a);
        float lumaDiff = abs(sampleluma - centerluma);
        return spatialweight * exp(-(alphaDiff * vcclarityparams.z + lumaDiff * vcclarityparams.w));
    }

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy;
        vec4 center = tvfetchclarity(uv);
        float strength = clamp(vcclarityparams.x, 0.0, 1.0);
        float radius = max(vcclarityparams.y, 0.5);
        float centerluma = tvcloudluma(center.rgb);

        // Five-tap ring blur so the pass boosts local cloud contrast without
        // becoming a directional sharpen or reintroducing denoise artifacts.
        vec2 o0 = vec2( 1.0,        0.0       ) * radius;
        vec2 o1 = vec2( 0.30901688, 0.95105654) * radius;
        vec2 o2 = vec2(-0.80901688, 0.58778524) * radius;
        vec2 o3 = vec2(-0.80901688,-0.58778524) * radius;
        vec2 o4 = vec2( 0.30901688,-0.95105654) * radius;

        vec4 s0 = tvfetchclarity(uv + o0);
        vec4 s1 = tvfetchclarity(uv + o1);
        vec4 s2 = tvfetchclarity(uv + o2);
        vec4 s3 = tvfetchclarity(uv + o3);
        vec4 s4 = tvfetchclarity(uv + o4);

        float w0 = tvclarityweight(center, s0, centerluma, 1.0);
        float w1 = tvclarityweight(center, s1, centerluma, 1.0);
        float w2 = tvclarityweight(center, s2, centerluma, 1.0);
        float w3 = tvclarityweight(center, s3, centerluma, 1.0);
        float w4 = tvclarityweight(center, s4, centerluma, 1.0);

        vec3 blur = center.rgb * 2.0;
        float totalWeight = 2.0;
        blur += s0.rgb * w0;
        blur += s1.rgb * w1;
        blur += s2.rgb * w2;
        blur += s3.rgb * w3;
        blur += s4.rgb * w4;
        totalWeight += w0 + w1 + w2 + w3 + w4;
        blur /= max(totalWeight, 1.0e-5);

        vec3 highpass = center.rgb - blur;
        float detailmask = smoothstep(0.04, 0.22, center.a);
        vec3 result = max(center.rgb + highpass * (strength * detailmask), vec3(0.0));

        // Preserve premultiplied alpha exactly; the clarity pass is RGB-only.
        fragcolor = vec4(result, center.a);
    }
]

lazyshader 0 "volumetriccloudsbilateral" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    // tex0 = cloud RT for this pass (RGBA)
    uniform sampler2DRect tex0;
    // tex1 = cached representative linear depth at cloud resolution
    uniform sampler2DRect tex1;
    // tex9 = full-res scene depth (rect or msaa)
    @(gfetchdefs tex9 $msaalight)
    uniform vec4 tvcloudscale;      // xy = output/src, zw = src/output (per pass)
    uniform vec2 tvclouddepthscale; // cloud-depth resolution/full-res
    uniform float tvbilateraledge;  // relative depth tolerance for cloud blur taps
    uniform float vcblurscale;           // bilateral tap spacing in full-res pixels
    uniform vec2 tvcloudblurdir;         // (1,0)=horizontal, (0,1)=vertical
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;

    float fetchDepthLinear(vec2 uv)
    {
        @(gdepthunpack depth [gfetch(tex9, uv)])
        return depth;
    }

    vec2 cloudPixFromOutputUV(vec2 uv, vec2 srcsize)
    {
        vec2 srcf = uv * tvcloudscale.zw - vec2(0.5);
        return floor(clamp(srcf, vec2(0.0), srcsize - vec2(1.0)));
    }

    vec2 depthPixFromOutputUV(vec2 uv, vec2 depthsize)
    {
        vec2 depthf = uv * tvclouddepthscale - vec2(0.5);
        return floor(clamp(depthf, vec2(0.0), depthsize - vec2(1.0)));
    }

    float cloudDepthErr(float sampleDepth, float centerDepth)
    {
        float depthTolerance = max(2.0, max(abs(centerDepth), abs(sampleDepth)) * max(tvbilateraledge, 1.0e-5));
        return abs(sampleDepth - centerDepth) / depthTolerance;
    }

    float gaussian1d9(int i)
    {
        // 9-tap separable gaussian-ish weights (sigma ~2.0).
        if(i == 0 || i == 8) return 0.02763;
        if(i == 1 || i == 7) return 0.06628;
        if(i == 2 || i == 6) return 0.12383;
        if(i == 3 || i == 5) return 0.18017;
        return 0.20418;
    }

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy;
        float centerDepth = fetchDepthLinear(uv);

        vec2 srcsize = max(floor(viewsize.xy * tvcloudscale.zw + vec2(0.5)), vec2(1.0));
        vec2 depthsize = max(floor(viewsize.xy * tvclouddepthscale + vec2(0.5)), vec2(1.0));
        vec2 centerCloudPix = cloudPixFromOutputUV(uv, srcsize);
        vec2 centerCloudUV = centerCloudPix + vec2(0.5);
        vec4 centerCloud = texture2DRect(tex0, centerCloudUV);
        float k = clamp(centerCloud.a * 2.0, 0.0, 1.0);
        float blurstep = max(vcblurscale, 1.0) * mix(2.0, 1.0, k);

        vec4 accumCloud = vec4(0.0);
        float totalWeight = 0.0;

        for(int i = -4; i <= 4; i++)
        {
            vec2 sampleUV = clamp(uv + tvcloudblurdir * (float(i) * blurstep), vec2(0.5), viewsize.xy - vec2(0.5));

            // Snap cloud and cached-depth sampling to their respective texel centers.
            vec2 cloudPix = cloudPixFromOutputUV(sampleUV, srcsize);
            vec2 cloudUV = cloudPix + vec2(0.5);
            vec2 depthUV = depthPixFromOutputUV(sampleUV, depthsize) + vec2(0.5);

            float sampleDepth = texture2DRect(tex1, depthUV).r;
            float depthDiff = cloudDepthErr(sampleDepth, centerDepth);
            if(depthDiff > 3.0) continue;
            float depthWeight = exp(-depthDiff * depthDiff);

            float spatialWeight = gaussian1d9(i + 4);
            float w = spatialWeight * depthWeight;

            accumCloud += texture2DRect(tex0, cloudUV) * w;
            totalWeight += w;
        }

        fragcolor = accumCloud / max(totalWeight, 1.0e-5);
    }
]

lazyshader 0 "volumetriccloudshadowmap" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2D tex0;          // weather map (coverage, type, moisture, erosion)
    uniform sampler3D tex10;         // periodic precomputed R8 FBM volume
    uniform vec4 tvcloudbounds;      // x=base z, y=top z, z=max dist, w=time
    uniform vec4 tvclouddome;        // x=dome z/r^2 (signed), y,z=dome center xy, w=cloud radius
    uniform vec2 tvcloudscroll;      // x,y = accumulated cloud wind offset
    uniform vec4 tvcloudnoise;       // x=base scale, y=detail scale, z=threshold, w=density
    uniform vec3 tvcloudfbmparams;   // x=1/period, y=texels/noise unit, z=max mip
    uniform vec4 tvcloudlodoffsets;  // x=base, y=macro, z=detail, w=light
    uniform float tvcloudstructure;
    uniform float vclouddensity;
    uniform float vcloudthickness;   // reused as shadow opacity/strength
    uniform vec4 tvshadowmapworld;   // x=minx, y=miny, z=world units/texel, w=map size
    uniform float tvcloudshadowsamples;
    fragdata(0) vec4 fragcolor;

    float tvlogworldstep(float worldStep)
    {
        return log2(max(worldStep, 1.0e-20));
    }

    float tvfbmlod(float logWorldStep, float lodOffset, float bias)
    {
        return clamp(max(logWorldStep + lodOffset, 0.0) + bias, 0.0, tvcloudfbmparams.z);
    }

    float tvfbm(vec3 p, float lod)
    {
        return textureLod(tex10, p * tvcloudfbmparams.x, lod).r;
    }

    struct TVCloudShadowState
    {
        vec4 weather;
        vec4 layerHeights;
        vec2 shapeThresholds;
        vec2 edgeThresholds;
        vec2 windXY;
        float cloudOffset;
        float normalizedHeightScale;
        float coverage;
        float moisture;
        float farfield;
        float macroWeight;
        float detailWeight;
        float breakup;
        float erosionWeight;
        float densityAmp;
        float radiusFade;
        float detailFade;
        float baseLod;
        float macroScale;
        float macroLod;
        float detailLod;
    };

    TVCloudShadowState tvshadowstate;

    vec4 tvweather(vec2 xy)
    {
        float period = max(tvclouddome.w * 2.0, 1.0);
        vec2 wind = tvcloudscroll * 0.35;
        return texture2D(tex0, (xy + wind) / period);
    }

    bool tvinitcloudshadowstate(vec2 worldxy, float thickness)
    {
        float densityk = clamp(vclouddensity, 0.0, 1.0);
        if(densityk <= 1.0e-4) return false;
        tvshadowstate.weather = tvweather(worldxy);
        float overcastk = smoothstep(0.5, 1.0, densityk);
        tvshadowstate.coverage = mix(tvshadowstate.weather.r * min(densityk * 2.0, 1.0), 1.0, overcastk);
        tvshadowstate.coverage = clamp(tvshadowstate.coverage, 0.0, 1.0);
        if(tvshadowstate.coverage <= 1.0e-4) return false;
        float cloudtype = mix(tvshadowstate.weather.g, 0.55, overcastk);
        tvshadowstate.moisture = mix(tvshadowstate.weather.b, 0.85, overcastk * 0.75);

        float radius = tvclouddome.w;
        if(radius <= 1.0e-4) return false;
        vec2 domeDelta = worldxy - tvclouddome.yz;
        float domeDist2 = dot(domeDelta, domeDelta);
        float inner = radius * 0.94;
        tvshadowstate.radiusFade = 1.0 - smoothstep(inner * inner, radius * radius, domeDist2);
        if(tvshadowstate.radiusFade <= 1.0e-4) return false;

        tvshadowstate.cloudOffset = tvclouddome.x * domeDist2;
        tvshadowstate.normalizedHeightScale = (tvcloudbounds.y - tvcloudbounds.x) / thickness;
        tvshadowstate.layerHeights = vec4(mix(0.03, 0.12, cloudtype), mix(0.30, 0.48, cloudtype),
                                          mix(0.58, 0.70, cloudtype), mix(0.92, 0.99, cloudtype));

        float detailRate = max(tvshadowmapworld.z, 0.0) * tvcloudnoise.y;
        tvshadowstate.farfield = smoothstep(0.28, 1.20, detailRate);
        float structurebias = clamp(tvcloudstructure - 1.0, -1.0, 1.0);
        tvshadowstate.detailFade = clamp(1.0 - detailRate * 1.45, 0.0, 1.0);
        tvshadowstate.detailFade = tvshadowstate.detailFade * tvshadowstate.detailFade * (3.0 - 2.0 * tvshadowstate.detailFade);
        tvshadowstate.macroWeight = clamp((0.50 + 0.18 * tvshadowstate.farfield) - 0.22 * structurebias, 0.0, 1.0);
        tvshadowstate.detailWeight = clamp(mix(mix(0.08, 0.22, cloudtype), mix(0.02, 0.07, cloudtype), tvshadowstate.farfield)
                                         + 0.18 * structurebias, 0.0, 0.75);
        float threshold = mix(tvcloudnoise.z + 0.40, tvcloudnoise.z - 0.32, tvshadowstate.coverage);
        threshold += mix(0.12, -0.06, cloudtype);
        threshold -= (tvshadowstate.moisture - 0.5) * 0.12;
        threshold -= 0.10 * overcastk;
        tvshadowstate.shapeThresholds = vec2(threshold - mix(0.02, 0.07, tvshadowstate.moisture),
                                             threshold + mix(0.22, 0.10, tvshadowstate.coverage));
        tvshadowstate.edgeThresholds = vec2(mix(0.06, 0.16, tvshadowstate.farfield), mix(0.78, 0.93, tvshadowstate.farfield));
        tvshadowstate.breakup = mix(0.28, 0.06, tvshadowstate.coverage) * mix(1.0, 0.12, overcastk)
                            * mix(0.78, 0.10, tvshadowstate.farfield) * clamp(1.0 + 0.45 * structurebias, 0.55, 1.45);
        tvshadowstate.erosionWeight = 0.0;
        if(tvshadowstate.breakup > 1.0 / 1024.0)
            tvshadowstate.erosionWeight = clamp(0.40 * (1.0 - overcastk) + 0.18 * structurebias, 0.0, 0.85);
        tvshadowstate.densityAmp = tvshadowstate.coverage * mix(0.80, 1.45, tvshadowstate.moisture);

        tvshadowstate.windXY = worldxy + tvcloudscroll;
        float logWorldStep = tvlogworldstep(tvshadowmapworld.z);
        tvshadowstate.baseLod = tvfbmlod(logWorldStep, tvcloudlodoffsets.x, 0.0);
        tvshadowstate.macroScale = tvcloudnoise.x * 0.22;
        tvshadowstate.macroLod = tvfbmlod(logWorldStep, tvcloudlodoffsets.y, 0.0);
        tvshadowstate.detailLod = 0.0;
        if(tvshadowstate.detailWeight * tvshadowstate.detailFade > 1.0 / 1024.0)
            tvshadowstate.detailLod = tvfbmlod(logWorldStep, tvcloudlodoffsets.z, 0.0);
        return true;
    }

    float tvdensitycheap(float z, float sampleHeight)
    {
        float h = clamp(sampleHeight * tvshadowstate.normalizedHeightScale, 0.0, 1.0);
        float layer = smoothstep(tvshadowstate.layerHeights.x, tvshadowstate.layerHeights.y, h)
                    * (1.0 - smoothstep(tvshadowstate.layerHeights.z, tvshadowstate.layerHeights.w, h));
        if(layer <= 1.0e-4) return 0.0;

        vec3 windp = vec3(tvshadowstate.windXY, z + tvcloudbounds.w * 2.0);
        float base = tvfbm(windp * tvcloudnoise.x, tvshadowstate.baseLod);
        float macro = tvfbm((windp + vec3(-23.0, 17.0, 9.0)) * tvshadowstate.macroScale, tvshadowstate.macroLod);
        float detailLod = base;
        if(tvshadowstate.detailWeight * tvshadowstate.detailFade > 1.0 / 1024.0)
        {
            float detail = tvfbm((windp + vec3(13.0, -9.0, 17.0)) * tvcloudnoise.y, tvshadowstate.detailLod);
            detailLod = mix(base, detail, tvshadowstate.detailFade);
        }
        float structure = mix(base, macro, tvshadowstate.macroWeight);
        float shape = mix(structure, detailLod, tvshadowstate.detailWeight);
        shape = smoothstep(tvshadowstate.shapeThresholds.x, tvshadowstate.shapeThresholds.y, shape);
        if(shape <= 1.0e-4) return 0.0;
        float billow = mix(smoothstep(0.20, 0.85, detailLod), tvshadowstate.moisture, 0.35);
        billow = mix(billow, smoothstep(0.26, 0.80, structure), 0.55 * tvshadowstate.farfield);
        float d = shape;
        if(tvshadowstate.breakup > 1.0 / 1024.0)
        {
            float edge = 1.0 - smoothstep(tvshadowstate.edgeThresholds.x, tvshadowstate.edgeThresholds.y, shape);
            float erosion = clamp(mix(smoothstep(0.34, 0.86, detailLod), tvshadowstate.weather.a,
                                        tvshadowstate.erosionWeight), 0.0, 1.0);
            erosion = mix(erosion, smoothstep(0.42, 0.88, structure), 0.78 * tvshadowstate.farfield);
            d *= 1.0 - tvshadowstate.breakup * edge * erosion;
        }
        d *= mix(0.88, 1.18, billow * shape);
        d = clamp(d, 0.0, 1.0);
        return d * layer * tvcloudnoise.w * tvshadowstate.densityAmp * tvshadowstate.radiusFade;
    }

    void main(void)
    {
        vec2 worldxy = tvshadowmapworld.xy + gl_FragCoord.xy * tvshadowmapworld.z;
        float thickness = max(tvcloudbounds.y - tvcloudbounds.x, 1.0);
        if(!tvinitcloudshadowstate(worldxy, thickness))
        {
            fragcolor = vec4(1.0);
            return;
        }

        int nsamples = int(clamp(tvcloudshadowsamples, 1.0, 8.0));
        float densitysum = 0.0;
        for(int i = 0; i < 8; ++i)
        {
            if(i >= nsamples) break;
            float h = nsamples <= 1 ? 0.6 : (float(i) + 0.5) / float(nsamples);
            float z = mix(tvcloudbounds.x, tvcloudbounds.y, h) + tvshadowstate.cloudOffset;
            densitysum += tvdensitycheap(z, h);
        }

        float densityavg = densitysum / float(max(nsamples, 1));
        float shadowk = 8.0 * max(vcloudthickness, 0.0);
        float trans = exp(-densityavg * shadowk);
        fragcolor = vec4(vec3(clamp(trans, 0.0, 1.0)), 1.0);
    }
]

lazyshader 0 "volumetriccloudshadowapply" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;      // cloud shadow map
    @(gfetchdefs tex8 $msaalight ngfetch)
    @(gfetchdefs tex9)
    uniform mat4 worldmatrix;
    uniform vec4 tvcloudsundir;      // xyz=normalized direction, w=abs(z)
    uniform vec4 tvcloudbounds;      // x=base z, y=top z, z=max dist, w=time
    uniform vec4 tvclouddome;        // x=dome z/r^2 (signed), y,z=dome center xy, w=cloud radius
    uniform vec4 tvshadowmapworld;   // x=minx, y=miny, z=world units/texel, w=map size
    uniform vec2 tvcloudshadowparams;// x=strength including horizon fade, y=cloud mid h
    uniform float tvcloudshadowpcf;
    fragdata(0) vec4 fragcolor;

    float tvcloudoffset(vec2 xy)
    {
        vec2 d = xy - tvclouddome.yz;
        return tvclouddome.x * dot(d, d);
    }

    float tvcloudflattenedh(vec3 p)
    {
        return p.z - tvcloudoffset(p.xy);
    }

    vec3 tvcloudhcoeffs(vec3 o, vec3 d)
    {
        vec2 q = o.xy - tvclouddome.yz;
        vec2 u = d.xy;
        float k = tvclouddome.x;
        float a = -k * dot(u, u);
        float b = d.z - 2.0 * k * dot(q, u);
        float c = o.z - k * dot(q, q);
        return vec3(a, b, c);
    }

    int tvquadraticroots(float a, float b, float c, out vec2 roots)
    {
        roots = vec2(0.0);
        if(abs(a) <= 1.0e-8)
        {
            if(abs(b) <= 1.0e-8) return 0;
            roots.x = -c / b;
            return 1;
        }

        float disc = b*b - 4.0*a*c;
        if(disc < 0.0) return 0;

        float s = sqrt(max(disc, 0.0));
        float q = -0.5 * (b + (b < 0.0 ? -s : s));
        float r0 = q / a;
        float r1 = abs(q) > 1.0e-8 ? c / q : (-b + s) / (2.0 * a);
        if(r0 > r1) { float t = r0; r0 = r1; r1 = t; }
        roots = vec2(r0, r1);
        return disc <= 1.0e-8 ? 1 : 2;
    }

    float tvrootnearestestimate(float a, float b, float c, float testimate)
    {
        vec2 roots;
        int nroots = tvquadraticroots(a, b, c, roots);
        if(nroots <= 0) return 1.0e16;
        float t = roots.x;
        if(nroots >= 2 && abs(roots.y - testimate) < abs(t - testimate)) t = roots.y;
        return t;
    }

    float tvfetchshadow(vec2 worldxy)
    {
        vec2 uv = (worldxy - tvshadowmapworld.xy) / max(tvshadowmapworld.z, 1.0e-4);
        if(uv.x < 0.5 || uv.y < 0.5 || uv.x > tvshadowmapworld.w - 0.5 || uv.y > tvshadowmapworld.w - 0.5)
            return 1.0;

        float pcf = clamp(tvcloudshadowpcf, 0.0, 2.0);
        if(pcf < 0.5) return texture2DRect(tex0, uv).r;

        float accum = 0.0;
        float weights = 0.0;
        accum += texture2DRect(tex0, uv).r * 4.0; weights += 4.0;
        accum += texture2DRect(tex0, uv + vec2( 1.0, 0.0)).r; weights += 1.0;
        accum += texture2DRect(tex0, uv + vec2(-1.0, 0.0)).r; weights += 1.0;
        accum += texture2DRect(tex0, uv + vec2(0.0,  1.0)).r; weights += 1.0;
        accum += texture2DRect(tex0, uv + vec2(0.0, -1.0)).r; weights += 1.0;

        if(pcf > 1.5)
        {
            accum += texture2DRect(tex0, uv + vec2( 1.0,  1.0)).r * 0.75; weights += 0.75;
            accum += texture2DRect(tex0, uv + vec2(-1.0,  1.0)).r * 0.75; weights += 0.75;
            accum += texture2DRect(tex0, uv + vec2( 1.0, -1.0)).r * 0.75; weights += 0.75;
            accum += texture2DRect(tex0, uv + vec2(-1.0, -1.0)).r * 0.75; weights += 0.75;
        }

        return accum / max(weights, 1.0e-4);
    }

    void main(void)
    {
        vec2 screentc = gl_FragCoord.xy;
        vec4 normalsample = ngfetch(tex8, screentc);
        if(dot(normalsample.rgb, normalsample.rgb) <= 1.0e-6)
        {
            fragcolor = vec4(1.0);
            return;
        }
        @(gdepthunpack depth [gfetch(tex9, screentc)] [
            vec3 wpos = (worldmatrix * vec4(depth*screentc, depth, 1.0)).xyz;
        ] [
            vec4 wpos = worldmatrix * vec4(screentc, depth, 1.0);
            wpos.xyz /= wpos.w;
        ])
        if(depth >= 0.999999)
        {
            fragcolor = vec4(1.0);
            return;
        }
        float h0 = tvcloudflattenedh(wpos.xyz);
        if(h0 >= tvcloudbounds.y)
        {
            fragcolor = vec4(1.0);
            return;
        }

        vec3 sdir = tvcloudsundir.xyz;

        float t;
        if(abs(tvclouddome.x) <= 1.0e-12)
        {
            t = (tvcloudshadowparams.y - wpos.z) / sdir.z;
        }
        else
        {
            vec3 hcoeff = tvcloudhcoeffs(wpos.xyz, sdir);
            float testimate = abs(hcoeff.y) > 1.0e-5 ? (tvcloudshadowparams.y - h0) / hcoeff.y : 0.0;
            t = tvrootnearestestimate(hcoeff.x, hcoeff.y, hcoeff.z - tvcloudshadowparams.y, testimate);
            if(abs(t) >= 1.0e15)
            {
                fragcolor = vec4(1.0);
                return;
            }
        }
        vec2 ps = wpos.xy + sdir.xy * t;
        float shadow = tvfetchshadow(ps);
        float factor = mix(1.0, shadow, tvcloudshadowparams.x);
        fragcolor = vec4(vec3(factor), 1.0);
    }
]
