rtreflectionspatialgen = [
    lazyshader 0 $arg1 (rtreflectionvertex) [
        @(cooktorrancebrdf)
        @(? $arg2 [
            uniform sampler2DMS tex0, tex1, tex2;
            vec4 rtFetch(sampler2DMS source, vec2 pixel) { return texelFetch(source, ivec2(pixel), 0); }
        ] [
            uniform sampler2DRect tex0, tex1, tex2;
            vec4 rtFetch(sampler2DRect source, vec2 pixel) { return texture2DRect(source, pixel); }
        ])
        uniform sampler2DRect tex3;
        uniform mat4 rtWorldMatrix;
        uniform vec4 rtFullSize, rtMaterialParams, rtSpatialParams;
        uniform vec3 camera;
        @(gdepthunpackparams)
        fragdata(0) vec4 rtFiltered;
        const float rtWavelet[2] = float[2](1.0, 2.0/3.0);

        struct RTSpecularLobe { vec3 axis; float sharpness; };

        vec3 rtSurfacePosition(vec2 pixel)
        {
            vec4 depthsamp = rtFetch(tex2, pixel);
            @(gdepthunpack depth depthsamp [
                return (rtWorldMatrix*vec4(depth*pixel, depth, 1.0)).xyz;
            ] [
                vec4 position = rtWorldMatrix*vec4(pixel, depth, 1.0);
                return position.xyz/position.w;
            ])
        }

        RTSpecularLobe rtRoughnessLobe(float roughness, vec3 normal, vec3 incident)
        {
            float alpha = max(roughness*roughness, 0.001);
            float ndotv = clamp(abs(dot(incident, normal)) + 1.0e-5, 0.0, 1.0);
            RTSpecularLobe result;
            result.axis = 2.0*ndotv*normal - incident;
            result.sharpness = 0.5/(alpha*alpha*max(ndotv, 0.1));
            return result;
        }

        float rtLobeWeight(RTSpecularLobe center, float sampleRoughness, vec3 sampleNormal, vec3 incident)
        {
            RTSpecularLobe sampleValue = rtRoughnessLobe(sampleRoughness, sampleNormal, incident);
            float inverseValue = 1.0/(center.sharpness + sampleValue.sharpness), beta = rtSpatialParams.y;
            float similarity = pow(2.0*sqrt(center.sharpness*sampleValue.sharpness)*inverseValue, beta);
            float axis = exp(-(beta*center.sharpness*sampleValue.sharpness*inverseValue)*
                             clamp(1.0 - dot(center.axis, sampleValue.axis), 0.0, 1.0));
            return similarity*axis;
        }

        float rtLuminance(vec3 color) { return dot(color, vec3(0.2125, 0.7154, 0.0721)); }
        vec3 rtReinhard(vec3 color) { return color/(1.0 + rtLuminance(color)); }
        vec3 rtInverseReinhard(vec3 color) { return color/max(1.0e-5, 1.0 - rtLuminance(color)); }

        void main(void)
        {
            vec2 pixel = gl_FragCoord.xy;
            vec4 center = texture2DRect(tex3, pixel), packedNormal = rtFetch(tex1, pixel);
            if(dot(packedNormal.rgb, vec3(1.0)) < 0.01)
            {
                rtFiltered = center;
                return;
            }
            vec4 packedMaterial = rtFetch(tex0, pixel);
            bool mirrorDebug = rtSpatialParams.w > 0.5;
            float centerRoughness = mirrorDebug ? 0.0 : pbrlegacyreflectionroughness(packedMaterial.a, rtMaterialParams.x);
            if(centerRoughness <= 0.05)
            {
                rtFiltered = center;
                return;
            }
            vec3 centerNormal = normalize(packedNormal.rgb*2.0 - 1.0), centerPosition = rtSurfacePosition(pixel);
            vec3 incident = normalize(camera - centerPosition);
            RTSpecularLobe centerLobe = rtRoughnessLobe(centerRoughness, centerNormal, incident);
            float primaryDistance = distance(camera, centerPosition);
            float fraction = center.a > 0.0 ? center.a/max(center.a + primaryDistance, 1.0e-5) : 1.0;
            float radius = clamp(pow(mix(centerRoughness, 1.0, fraction),
                                     pow(1.0 - centerRoughness, 1.0/1.4)*rtSpatialParams.z), 0.0, 1.0);
            vec3 sum = rtReinhard(max(center.rgb, vec3(0.0)));
            float totalWeight = 1.0;
            int stepSize = int(rtSpatialParams.x + 0.5);
            float depthThreshold = max(0.04, primaryDistance*0.0015*float(stepSize));
            for(int y = -1; y <= 1; ++y) for(int x = -1; x <= 1; ++x)
            {
                if(x == 0 && y == 0) continue;
                vec2 shift = vec2(x, y)*float(stepSize);
                if(length(shift) > radius*17.0) continue;
                vec2 samplePixel = pixel + shift;
                if(any(lessThan(samplePixel, vec2(1.5))) || any(greaterThanEqual(samplePixel, rtFullSize.xy - 1.5))) continue;
                vec4 samplePackedMaterial = rtFetch(tex0, samplePixel);
                if(abs(samplePackedMaterial.a - packedMaterial.a) > 1.5/255.0) continue;
                vec4 samplePackedNormal = rtFetch(tex1, samplePixel);
                if(dot(samplePackedNormal.rgb, vec3(1.0)) < 0.01) continue;
                vec3 samplePosition = rtSurfacePosition(samplePixel);
                float depthError = distance(samplePosition, centerPosition);
                if(depthError > depthThreshold) continue;
                vec3 sampleNormal = normalize(samplePackedNormal.rgb*2.0 - 1.0);
                float normalWeight = pow(max(dot(sampleNormal, centerNormal), 0.0), 16.0);
                if(normalWeight <= 0.0) continue;
                float sampleRoughness = mirrorDebug ? 0.0 : pbrlegacyreflectionroughness(samplePackedMaterial.a, rtMaterialParams.x);
                float specularWeight = pow(rtLobeWeight(centerLobe, sampleRoughness, sampleNormal, incident), 1.5);
                float kernelWeight = rtWavelet[abs(x)]*rtWavelet[abs(y)];
                float weight = clamp(kernelWeight*min(specularWeight, normalWeight*5.0), 0.0, 1.0);
                sum += rtReinhard(max(texture2DRect(tex3, samplePixel).rgb, vec3(0.0)))*weight;
                totalWeight += weight;
            }
            rtFiltered = vec4(rtInverseReinhard(sum/totalWeight), center.a);
        }
    ]
]

rtreflectionspatialgen "rtreflectionspatial" 0
rtreflectionspatialgen "rtreflectionspatialms" 1

rtreflectioncompositegen = [
    lazyshader 0 $arg1 (rtreflectionvertex) [
        @(cooktorrancebrdf)
        @(? $arg2 [
            uniform sampler2DMS tex0, tex1, tex2;
            vec4 rtFetch(sampler2DMS source, vec2 pixel) { return texelFetch(source, ivec2(pixel), 0); }
        ] [
            uniform sampler2DRect tex0, tex1, tex2;
            vec4 rtFetch(sampler2DRect source, vec2 pixel) { return texture2DRect(source, pixel); }
        ])
        uniform sampler2DRect tex3, tex4, tex5, tex6, tex7, tex8, tex9;
        uniform mat4 rtWorldMatrix;
        uniform vec4 rtFullSize, rtTraceSize, rtMaterialParams, rtDebugParams;
        uniform vec3 camera;
        @(gdepthunpackparams)
        fragdata(0) vec4 rtResult;

        vec3 rtSurfacePosition(vec2 pixel)
        {
            vec4 depthsamp = rtFetch(tex2, pixel);
            @(gdepthunpack depth depthsamp [
                return (rtWorldMatrix*vec4(depth*pixel, depth, 1.0)).xyz;
            ] [
                vec4 position = rtWorldMatrix*vec4(pixel, depth, 1.0);
                return position.xyz/position.w;
            ])
        }

        void main(void)
        {
            vec2 fullPixel = gl_FragCoord.xy, lowPixel = (fullPixel - 0.5)*rtTraceSize.xy/rtFullSize.xy + 0.5;
            vec4 packedNormal = rtFetch(tex1, fullPixel);
            if(dot(packedNormal.rgb, vec3(1.0)) < 0.01) discard;
            vec4 packedMaterial = rtFetch(tex0, fullPixel);
            int mode = int(rtDebugParams.x);
            bool mirrorDebug = mode == 14;
            vec3 normal = normalize(packedNormal.rgb*2.0 - 1.0), view = normalize(camera - rtSurfacePosition(fullPixel));
            float roughness = mirrorDebug ? 0.0 : pbrlegacyreflectionroughness(packedMaterial.a, rtMaterialParams.x);
            vec3 f0 = mirrorDebug ? vec3(1.0) : pbrlegacyf0(packedMaterial.a, rtMaterialParams.y);
            if(mode == 0 && (roughness >= 1.0 || max(max(f0.r, f0.g), f0.b) <= 0.0))
            {
                rtResult = vec4(0.0);
                return;
            }
            vec3 fresnel = pbrfresnelschlick(max(dot(normal, view), 0.0), f0);
            vec4 reflection = texture2DRect(tex3, fullPixel);
            if(any(isnan(reflection.rgb)) || any(isinf(reflection.rgb))) reflection = vec4(0.0, 0.0, 0.0, -3.0);
            float sharpWeight = pow(max(1.0 - roughness, 0.0), rtMaterialParams.z);
            vec3 contribution = reflection.a > -1.5 ? max(reflection.rgb, vec3(0.0))*fresnel*sharpWeight*rtMaterialParams.w : vec3(0.0);
            if(mode == 0) rtResult = vec4(contribution, 0.0);
            else if(mode == 1) rtResult = vec4(max(texture2DRect(tex4, lowPixel).rgb, vec3(0.0)), 1.0);
            else if(mode == 2) rtResult = vec4(max(texture2DRect(tex6, fullPixel).rgb, vec3(0.0)), 1.0);
            else if(mode == 3) rtResult = vec4(max(reflection.rgb, vec3(0.0)), 1.0);
            else
            {
                vec4 raw = texture2DRect(tex4, lowPixel), auxiliary = texture2DRect(tex5, lowPixel);
                float status = floor(auxiliary.w + 0.001), traversal = fract(auxiliary.w);
                if(mode == 4) rtResult = vec4(status == 1.0 ? vec3(0.1, 0.9, 0.2) : (status == 2.0 ? vec3(0.1, 0.2, 0.9) :
                                                        (status == 3.0 ? vec3(0.9, 0.65, 0.1) : vec3(0.9, 0.05, 0.05))), 1.0);
                else if(mode == 5) rtResult = vec4(vec3(raw.a > 0.0 ? 1.0 - exp(-raw.a/max(rtDebugParams.y*0.1, 1.0)) : 0.0), 1.0);
                else if(mode == 6) rtResult = vec4(auxiliary.xyz*0.5 + 0.5, 1.0);
                else if(mode == 7) rtResult = vec4(texture2DRect(tex8, lowPixel).xyz*0.5 + 0.5, 1.0);
                else if(mode == 8) rtResult = vec4(traversal, 0.1, 1.0 - traversal, 1.0);
                else if(mode == 9) rtResult = vec4(vec3(roughness), 1.0);
                else if(mode == 10) rtResult = vec4(status == 3.0 ? vec3(1.0, 0.65, 0.0) :
                                                         (status >= 1.0 ? vec3(0.1, 0.9, 0.2) : vec3(0.0)), 1.0);
                else if(mode == 11) rtResult = vec4(contribution, 1.0);
                else if(mode == 12) rtResult = vec4(vec3(clamp(texture2DRect(tex9, fullPixel).z/max(rtDebugParams.z, 1.0), 0.0, 1.0)), 1.0);
                else if(mode == 13) rtResult = vec4(fresnel, 1.0);
                else rtResult = vec4(reflection.a > -1.5 ? max(reflection.rgb, vec3(0.0)) : vec3(0.0), 1.0);
            }
        }
    ]
]

