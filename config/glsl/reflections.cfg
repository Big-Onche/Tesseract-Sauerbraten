////////////////////////////////////////////////
// deterministic raytraced reflections and specialized specular filtering.
////////////////////////////////////////////////

rtreflectionvertex = [result [
    attribute vec4 vvertex;
    void main(void) { gl_Position = vvertex; }
]]

rtreflectiontracegen = [
    lazyshader 0 $arg1 (rtreflectionvertex) [
        #extension GL_ARB_bindless_texture : require
        @bvhtraversal
        @(cooktorrancebrdf)
        @(? $arg2 [
            uniform sampler2DMS tex0, tex1, tex2;
            vec4 rtFetch(sampler2DMS source, vec2 pixel) { return texelFetch(source, ivec2(pixel), 0); }
        ] [
            uniform sampler2DRect tex0, tex1, tex2;
            vec4 rtFetch(sampler2DRect source, vec2 pixel) { return texture2DRect(source, pixel); }
        ])
        uniform sampler2D tex4, tex5, tex6, tex7, tex8, tex9;
        uniform mat4 rtWorldMatrix;
        uniform vec4 rtFullSize, rtTraceSize, rtMaterialParams, rtTraceParams, rtTraceOptions, rtAdaptiveParams;
        uniform vec3 camera, rtSunDirection, rtSunColor, rtSkyTint;
        uniform int rtLightCount;
        uniform vec4 rtLightPositionInvRadiusSquared[32], rtLightColor[32], rtLightDirectionCone[32];
        uniform vec3 rtSkyLeft, rtSkyRight, rtSkyBack, rtSkyFront, rtSkyDown, rtSkyUp;
        @(gdepthunpackparams)
        fragdata(0) vec4 rtRaw;
        @(? $arg4 [
            fragdata(1) vec4 rtAuxiliary;
            fragdata(2) vec4 rtHitNormal;
        ])

        @(? $arg3 [
            layout(std430, binding = 14) buffer RTProfilerBuffer
            {
                uint rtProfileCounters[16];
            };

            void rtProfileAdd(int counter, uint amount) { atomicAdd(rtProfileCounters[counter], amount); }
            void rtProfileTraversal(uint amount)
            {
                uint previous = atomicAdd(rtProfileCounters[12], amount);
                if(previous > 0xFFFFFFFFu - amount) atomicAdd(rtProfileCounters[15], 1u);
            }
        ] [
            void rtProfileAdd(int counter, uint amount) {}
            void rtProfileTraversal(uint amount) {}
        ])

        vec3 rtSanitizeRadiance(vec3 radiance)
        {
            if(any(isnan(radiance)) || any(isinf(radiance))) return vec3(0.0);
            return clamp(radiance, vec3(0.0), vec3(6.0));
        }

        vec3 rtSRGBToLinear(vec3 value)
        {
            bvec3 cutoff = lessThanEqual(value, vec3(0.04045));
            return mix(pow((value + 0.055)/1.055, vec3(2.4)), value/12.92, cutoff);
        }

        vec3 rtDirectRadiance(vec3 normal, vec3 view, vec3 lightDirection, float ndotl, vec3 albedo, vec3 f0, float roughness,
                              float ndotv, float roughnessAlphaSquared, float geometryView)
        {
            if(max(max(f0.r, f0.g), f0.b) <= 0.0) return albedo*ndotl;
            vec3 halfway = normalize(view + lightDirection);
            float ndoth = max(dot(normal, halfway), 0.0), vdoth = max(dot(view, halfway), 0.0);
            vec3 fresnel = pbrfresnelschlick(vdoth, f0);
            float denominator = ndoth*ndoth*(roughnessAlphaSquared - 1.0) + 1.0;
            float distribution = roughnessAlphaSquared/max(PBR_PI*denominator*denominator, PBR_EPSILON);
            float geometry = geometryView*pbrgeometryschlickggx(ndotl, roughness);
            vec3 diffuse = (vec3(1.0) - fresnel)*albedo*ndotl;
            vec3 specular = fresnel*distribution*geometry/max(4.0*ndotv*ndotl, PBR_EPSILON)*ndotl;
            return diffuse + specular;
        }

        vec3 rtSurfacePosition(vec2 pixel)
        {
            vec4 depthsamp = rtFetch(tex2, pixel);
            @(gdepthunpack depth depthsamp [
                return (rtWorldMatrix*vec4(depth*pixel, depth, 1.0)).xyz;
            ] [
                vec4 position = rtWorldMatrix*vec4(pixel, depth, 1.0);
                return position.xyz/position.w;
            ])
        }

        vec3 rtOffsetRayOrigin(vec3 position, vec3 normal)
        {
            const float origin = 1.0/32.0, floatScale = 1.0/65536.0;
            ivec3 offset = ivec3(normal*256.0), bits = floatBitsToInt(position);
            bits += ivec3(position.x < 0.0 ? -offset.x : offset.x, position.y < 0.0 ? -offset.y : offset.y,
                          position.z < 0.0 ? -offset.z : offset.z);
            vec3 shifted = intBitsToFloat(bits);
            return vec3(abs(position.x) < origin ? position.x + floatScale*normal.x : shifted.x,
                        abs(position.y) < origin ? position.y + floatScale*normal.y : shifted.y,
                        abs(position.z) < origin ? position.z + floatScale*normal.z : shifted.z);
        }

        vec3 rtTintFallback(vec3 direction)
        {
            vec3 ad = abs(direction);
            if(ad.x >= ad.y && ad.x >= ad.z) return direction.x < 0.0 ? rtSkyLeft : rtSkyRight;
            if(ad.y >= ad.z) return direction.y < 0.0 ? rtSkyBack : rtSkyFront;
            return direction.z < 0.0 ? rtSkyDown : rtSkyUp;
        }

        vec3 rtEnvironment(vec3 worldDirection)
        {
            float rotation = rtTraceOptions.w;
            vec2 rotated = mat2(cos(rotation), -sin(rotation), sin(rotation), cos(rotation))*worldDirection.xy;
            vec3 direction = vec3(rotated, worldDirection.z), ad = abs(direction);
            if(rtTraceOptions.z < 0.5) return rtTintFallback(direction);
            if(ad.x >= ad.y && ad.x >= ad.z)
            {
                vec2 uv = direction.x < 0.0 ? vec2(direction.y/ad.x, -direction.z/ad.x) :
                                              vec2(-direction.y/ad.x, -direction.z/ad.x);
                return (direction.x < 0.0 ? textureLod(tex4, uv*0.5 + 0.5, 0.0).rgb :
                                             textureLod(tex5, uv*0.5 + 0.5, 0.0).rgb)*rtSkyTint;
            }
            if(ad.y >= ad.z)
            {
                vec2 uv = direction.y < 0.0 ? vec2(-direction.x/ad.y, -direction.z/ad.y) :
                                              vec2(direction.x/ad.y, -direction.z/ad.y);
                return (direction.y < 0.0 ? textureLod(tex6, uv*0.5 + 0.5, 0.0).rgb :
                                             textureLod(tex7, uv*0.5 + 0.5, 0.0).rgb)*rtSkyTint;
            }
            vec2 uv = direction.z < 0.0 ? vec2(-direction.y/ad.z, -direction.x/ad.z) :
                                         vec2(-direction.y/ad.z, direction.x/ad.z);
            return (direction.z < 0.0 ? textureLod(tex8, uv*0.5 + 0.5, 0.0).rgb :
                                         textureLod(tex9, uv*0.5 + 0.5, 0.0).rgb)*rtSkyTint;
        }

        int rtSamplingClass(float roughness, float reflectance, float ndotv)
        {
            if(rtTraceParams.w > 0.5) return 3;
            if(rtTraceOptions.x < 0.5) return 3;
            float fresnel = reflectance + (1.0 - reflectance)*pow(1.0 - ndotv, 5.0);
            float coherence = pow(max(1.0 - roughness, 0.0), 1.6);
            float importance = fresnel*mix(0.2, 1.0, coherence);
            ivec2 orderedPixel = ivec2(gl_FragCoord.xy)&3;
            int orderedIndex = orderedPixel.x + orderedPixel.y*4;
            const float bayer[16] = float[16](0.0, 0.5, 0.125, 0.625, 0.75, 0.25, 0.875, 0.375,
                                              0.1875, 0.6875, 0.0625, 0.5625, 0.9375, 0.4375, 0.8125, 0.3125);
            float transition = (bayer[orderedIndex] - 0.5)*0.002;
            if(importance + transition >= rtAdaptiveParams.x) return 3;
            if(importance + transition >= rtAdaptiveParams.y) return 2;
            if(importance + transition >= rtAdaptiveParams.z) return 1;
            return 0;
        }

        bool rtScheduled(int quality)
        {
            if(quality >= 3) return true;
            int period = quality == 2 ? 2 : 4;
            ivec2 pixel = ivec2(gl_FragCoord.xy);
            return (pixel.x%period) == 0 && (pixel.y%period) == 0;
        }

        vec3 rtHitRadiance(BVHHit hit, BVHRay ray, out bool materialValid)
        {
            materialValid = hit.surface < uint(rtTraceOptions.y);
            if(!materialValid) return vec3(0.0);
            BVHMaterial material = bvhMaterials[hit.surface];
            materialValid = material.specular >= 0.0;
            if(!materialValid) return vec3(0.0);
            bool sunActive = any(notEqual(rtSunColor, vec3(0.0)));
            bool directLightingActive = sunActive || rtLightCount > 0;
            vec3 albedo = material.albedo;
            bool hasDiffuseTexture = any(notEqual(material.diffuseHandle, uvec2(0)));
            bool hasGlowTexture = any(notEqual(material.glowHandle, uvec2(0)));
            bool emissionActive = any(notEqual(material.emission, vec3(0.0)));
            vec2 texcoord = vec2(0.0);
            if((directLightingActive && hasDiffuseTexture) || (emissionActive && hasGlowTexture)) texcoord = bvhTextureCoordinate(hit);
            if(directLightingActive && hasDiffuseTexture)
                albedo *= rtSRGBToLinear(textureLod(sampler2D(material.diffuseHandle), texcoord, 0.0).rgb);
            vec3 emission = material.emission;
            if(emissionActive && hasGlowTexture) emission *= rtSRGBToLinear(textureLod(sampler2D(material.glowHandle), texcoord, 0.0).rgb);
            if(!directLightingActive) return emission;
            vec3 position = bvhHitPosition(ray, hit);
            vec3 normal = bvhGeometricNormal(hit), view = -ray.direction;
            float viewFacing = dot(normal, view);
            if(viewFacing < 0.0)
            {
                normal = -normal;
                viewFacing = -viewFacing;
            }
            float ndotv = max(viewFacing, PBR_EPSILON);
            float roughnessAlphaSquared = 0.0, geometryView = 0.0;
            if(material.specular > 0.0)
            {
                float roughnessAlpha = material.roughness*material.roughness;
                roughnessAlphaSquared = roughnessAlpha*roughnessAlpha;
                float geometryRoughness = material.roughness + 1.0;
                float geometryK = geometryRoughness*geometryRoughness/8.0;
                geometryView = ndotv/max(ndotv*(1.0 - geometryK) + geometryK, PBR_EPSILON);
            }
            vec3 radiance = emission;
            float sunFacing = dot(normal, rtSunDirection);
            if(sunActive && sunFacing > 0.0)
            {
                radiance += rtDirectRadiance(normal, view, rtSunDirection, sunFacing, albedo, vec3(material.specular), material.roughness, ndotv,
                                             roughnessAlphaSquared, geometryView)*rtSunColor;
            }
            for(int index = 0; index < rtLightCount; ++index)
            {
                vec3 lightVector = rtLightPositionInvRadiusSquared[index].xyz - position;
                float lightDistanceSquared = dot(lightVector, lightVector);
                float normalizedDistanceSquared = lightDistanceSquared*rtLightPositionInvRadiusSquared[index].w;
                if(lightDistanceSquared <= 1.0e-10 || normalizedDistanceSquared >= 1.0) continue;
                float lightFacing = dot(normal, lightVector);
                if(lightFacing <= 0.0) continue;
                float inverseLightDistance = inversesqrt(lightDistanceSquared);
                vec3 lightDirection = lightVector*inverseLightDistance;
                float spotlight = 1.0;
                float cone = rtLightDirectionCone[index].w;
                if(cone > -1.0)
                {
                    float spotCosine = dot(rtLightDirectionCone[index].xyz, -lightDirection);
                    if(spotCosine <= cone) continue;
                    spotlight = smoothstep(cone, min(cone + 0.08, 1.0), spotCosine);
                }
                float window = max(1.0 - normalizedDistanceSquared, 0.0);
                float attenuation = 0.125*window*window/max(normalizedDistanceSquared, 0.0025)*spotlight;
                if(attenuation <= 1.0e-5) continue;
                float ndotl = lightFacing*inverseLightDistance;
                vec3 f0 = vec3(material.specular*rtLightColor[index].a);
                radiance += rtDirectRadiance(normal, view, lightDirection, ndotl, albedo, f0, material.roughness, ndotv,
                                             roughnessAlphaSquared, geometryView)*rtLightColor[index].rgb*attenuation;
            }
            return radiance;
        }

        void main(void)
        {
            @(? $arg4 [rtHitNormal = vec4(0.0);])
            vec2 fullPixel = (gl_FragCoord.xy - 0.5)*rtFullSize.xy/rtTraceSize.xy + 0.5;
            vec4 packedNormal = rtFetch(tex1, fullPixel);
            if(dot(packedNormal.rgb, vec3(1.0)) < 0.01)
            {
                rtProfileAdd(0, 1u);
                rtRaw = vec4(0.0, 0.0, 0.0, -3.0);
                @(? $arg4 [rtAuxiliary = vec4(0.0);])
                return;
            }
            vec4 packedMaterial = rtFetch(tex0, fullPixel);
            vec3 normal = normalize(packedNormal.rgb*2.0 - 1.0);
            bool mirrorDebug = rtTraceParams.w > 0.5;
            float roughness = mirrorDebug ? 0.0 : pbrlegacyreflectionroughness(packedMaterial.a, rtMaterialParams.x);
            vec3 f0 = mirrorDebug ? vec3(1.0) : pbrlegacyf0(packedMaterial.a, rtMaterialParams.y);
            if(!mirrorDebug && (roughness >= 1.0 || max(max(f0.r, f0.g), f0.b) <= 0.0))
            {
                rtProfileAdd(1, 1u);
                rtRaw = vec4(0.0, 0.0, 0.0, -2.0);
                @(? $arg4 [rtAuxiliary = vec4(0.0, 0.0, 0.0, 3.0);])
                return;
            }
            vec3 position = rtSurfacePosition(fullPixel), incident = normalize(position - camera);
            int quality = rtSamplingClass(roughness, max(max(f0.r, f0.g), f0.b), abs(dot(normal, -incident)));
            rtProfileAdd(2 + quality, 1u);
            if(quality == 0)
            {
                rtProfileAdd(6, 1u);
                rtRaw = vec4(0.0, 0.0, 0.0, -2.0);
                @(? $arg4 [rtAuxiliary = vec4(0.0, 0.0, 0.0, 3.0);])
                return;
            }
            if(!rtScheduled(quality))
            {
                rtProfileAdd(7, 1u);
                rtRaw = vec4(0.0, 0.0, 0.0, -2.0);
                @(? $arg4 [rtAuxiliary = vec4(0.0, 0.0, 0.0, 3.0);])
                return;
            }
            vec3 direction = normalize(reflect(incident, normal));
            float offsetSign = dot(normal, direction) >= 0.0 ? 1.0 : -1.0;
            vec3 origin = rtOffsetRayOrigin(position, normal*offsetSign) + direction*rtTraceParams.y;
            BVHRay ray = bvhMakeRay(origin, direction, rtTraceParams.y, rtTraceParams.x);
            BVHHit hit;
            rtProfileAdd(8, 1u);
            bool found = bvhClosestHit(ray, uint(rtTraceParams.z), hit);
            rtProfileTraversal(hit.traversalCount);
            @(? $arg3 [atomicMax(rtProfileCounters[13], hit.traversalCount);])
            @(? $arg4 [float traversal = min(float(hit.traversalCount)/1024.0, 0.999);])
            if(hit.valid == 0u)
            {
                rtProfileAdd(11, 1u);
                rtRaw = vec4(0.0, 0.0, 0.0, -3.0);
                @(? $arg4 [rtAuxiliary = vec4(direction, traversal);])
                return;
            }
            if(!found)
            {
                rtProfileAdd(10, 1u);
                rtRaw = vec4(rtSanitizeRadiance(rtEnvironment(direction)), -1.0);
                @(? $arg4 [rtAuxiliary = vec4(direction, 2.0 + traversal);])
                return;
            }
            rtProfileAdd(9, 1u);
            bool materialValid;
            vec3 radiance = rtHitRadiance(hit, ray, materialValid);
            if(!materialValid)
            {
                rtProfileAdd(14, 1u);
                rtRaw = vec4(0.0, 0.0, 0.0, -3.0);
                @(? $arg4 [rtAuxiliary = vec4(direction, traversal);])
                return;
            }
            rtRaw = vec4(rtSanitizeRadiance(radiance), min(hit.distance, 65000.0));
            @(? $arg4 [
                rtAuxiliary = vec4(direction, 1.0 + traversal);
                rtHitNormal = vec4(bvhGeometricNormal(hit), 1.0);
            ])
        }
    ]
]

rtreflectiontracegen "rtreflectiontrace" 0
rtreflectiontracegen "rtreflectiontracems" 1
rtreflectiontracegen "rtreflectiontraceprofile" 0 1
rtreflectiontracegen "rtreflectiontracemsprofile" 1 1
rtreflectiontracegen "rtreflectiontracedebug" 0 0 1
rtreflectiontracegen "rtreflectiontracemsdebug" 1 0 1
rtreflectiontracegen "rtreflectiontracedebugprofile" 0 1 1
rtreflectiontracegen "rtreflectiontracemsdebugprofile" 1 1 1

rtreflectiontemporalgen = [
    lazyshader 0 $arg1 (rtreflectionvertex) [
        @(cooktorrancebrdf)
        @(? $arg2 [
            uniform sampler2DMS tex0, tex1, tex2;
            vec4 rtFetch(sampler2DMS source, vec2 pixel) { return texelFetch(source, ivec2(pixel), 0); }
        ] [
            uniform sampler2DRect tex0, tex1, tex2;
            vec4 rtFetch(sampler2DRect source, vec2 pixel) { return texture2DRect(source, pixel); }
        ])
        uniform sampler2DRect tex3, tex5, tex6, tex7;
        uniform mat4 rtWorldMatrix, rtPreviousWorldMatrix, rtPreviousViewProjection;
        uniform vec4 rtFullSize, rtTraceSize, rtMaterialParams, rtTemporalParams;
        uniform vec3 camera;
        @(gdepthunpackparams)
        fragdata(0) vec4 rtHistory;
        fragdata(1) vec4 rtSurface;
        fragdata(2) vec4 rtValidation;
        const int rtReconstructionRadius = @arg3;

        float rtSurfaceDepth(vec2 pixel)
        {
            vec4 depthsamp = rtFetch(tex2, pixel);
            @(gdepthunpack depth depthsamp [return depth;] [return depth;])
        }

        vec3 rtPositionFromDepth(vec2 pixel, float depth, mat4 reconstruction)
        {
            @(if $gdepthformat [result [
                return (reconstruction*vec4(depth*pixel, depth, 1.0)).xyz;
            ]] [result [
                vec4 position = reconstruction*vec4(pixel, depth, 1.0);
                return position.xyz/position.w;
            ]])
        }

        vec3 rtSurfacePosition(vec2 pixel) { return rtPositionFromDepth(pixel, rtSurfaceDepth(pixel), rtWorldMatrix); }

        bool rtOnscreen(vec2 pixel)
        {
            return all(greaterThan(pixel, vec2(1.5))) && all(lessThan(pixel, rtFullSize.xy - 1.5));
        }

        vec3 rtRGBToYCoCg(vec3 color)
        {
            return vec3(color.r*0.25 + color.g*0.5 + color.b*0.25, color.r*0.5 - color.b*0.5,
                        color.r*-0.25 + color.g*0.5 - color.b*0.25);
        }

        vec3 rtYCoCgToRGB(vec3 color) { return vec3(color.x + color.y - color.z, color.x + color.z, color.x - color.y - color.z); }
        float rtLuminance(vec3 color) { return dot(color, vec3(0.2125, 0.7154, 0.0721)); }
        vec3 rtReinhard(vec3 color) { return color/(1.0 + rtLuminance(color)); }
        vec3 rtInverseReinhard(vec3 color) { return color/max(1.0e-5, 1.0 - rtLuminance(color)); }

        vec3 rtClipToAABB(vec3 history, vec3 minimumValue, vec3 maximumValue)
        {
            vec3 center = 0.5*(maximumValue + minimumValue);
            vec3 extent = max(0.5*(maximumValue - minimumValue), vec3(1.0e-5));
            vec3 offset = history - center, unit = abs(offset/extent);
            float denominator = max(unit.x, max(unit.y, unit.z));
            return denominator > 1.0 ? center + offset/denominator : history;
        }

        vec4 rtCatmullRom(sampler2DRect source, vec2 pixel)
        {
            vec2 position1 = floor(pixel - 0.5) + 0.5, fractionValue = pixel - position1;
            vec2 weight0 = fractionValue*(-0.5 + fractionValue*(1.0 - 0.5*fractionValue));
            vec2 weight1 = 1.0 + fractionValue*fractionValue*(-2.5 + 1.5*fractionValue);
            vec2 weight2 = fractionValue*(0.5 + fractionValue*(2.0 - 1.5*fractionValue));
            vec2 weight3 = fractionValue*fractionValue*(-0.5 + 0.5*fractionValue);
            vec2 weight12 = weight1 + weight2;
            vec2 position0 = position1 - 1.0, position3 = position1 + 2.0, position12 = position1 + weight2/weight12;
            vec4 result = vec4(0.0);
            result += texture2DRect(source, vec2(position0.x, position0.y))*weight0.x*weight0.y;
            result += texture2DRect(source, vec2(position12.x, position0.y))*weight12.x*weight0.y;
            result += texture2DRect(source, vec2(position3.x, position0.y))*weight3.x*weight0.y;
            result += texture2DRect(source, vec2(position0.x, position12.y))*weight0.x*weight12.y;
            result += texture2DRect(source, vec2(position12.x, position12.y))*weight12.x*weight12.y;
            result += texture2DRect(source, vec2(position3.x, position12.y))*weight3.x*weight12.y;
            result += texture2DRect(source, vec2(position0.x, position3.y))*weight0.x*weight3.y;
            result += texture2DRect(source, vec2(position12.x, position3.y))*weight12.x*weight3.y;
            result += texture2DRect(source, vec2(position3.x, position3.y))*weight3.x*weight3.y;
            return result;
        }

        void rtConsiderRaw(ivec2 rawPixel, ivec2 offset, int candidateIndex, vec3 centerPosition, float positionScale, float centerMaterial,
                           float centerRoughness, vec3 centerNormal, inout float bestWeight, inout int bestIndex, inout vec4 best)
        {
            float spatialWeight = 1.0/(1.0 + float(offset.x*offset.x + offset.y*offset.y));
            // Normalized dot products can overshoot one slightly; keep a conservative margin on the cheap upper bound.
            float spatialUpperBound = spatialWeight*1.05;
            if(spatialUpperBound < bestWeight || (spatialUpperBound == bestWeight && candidateIndex >= bestIndex)) return;
            vec4 candidate = texture2DRect(tex3, vec2(rawPixel) + 0.5);
            if(candidate.a <= -1.5) return;
            vec2 samplePixel = min((vec2(rawPixel) + 0.5)*rtFullSize.xy/rtTraceSize.xy, rtFullSize.xy - 0.5);
            vec4 samplePackedMaterial = rtFetch(tex0, samplePixel);
            if(abs(samplePackedMaterial.a - centerMaterial) > 1.5/255.0) return;
            vec4 samplePackedNormal = rtFetch(tex1, samplePixel);
            if(dot(samplePackedNormal.rgb, vec3(1.0)) < 0.01) return;
            vec3 sampleNormal = normalize(samplePackedNormal.rgb*2.0 - 1.0);
            float sampleRoughness = rtTemporalParams.w > 0.5 ? 0.0 : pbrlegacyreflectionroughness(samplePackedMaterial.a, rtMaterialParams.x);
            float normalWeight = pow(max(dot(centerNormal, sampleNormal), 0.0), 32.0);
            float roughnessWeight = exp(-abs(sampleRoughness - centerRoughness)*24.0);
            float maximumWeight = normalWeight*roughnessWeight*spatialWeight;
            if(maximumWeight < bestWeight || (maximumWeight == bestWeight && candidateIndex >= bestIndex)) return;
            vec3 samplePosition = rtSurfacePosition(samplePixel);
            float depthWeight = exp(-distance(samplePosition, centerPosition)/positionScale);
            float weight = depthWeight*maximumWeight;
            if(weight > bestWeight || (weight == bestWeight && candidateIndex < bestIndex))
            {
                bestWeight = weight;
                bestIndex = candidateIndex;
                best = candidate;
            }
        }

        vec4 rtReconstructRaw(vec2 fullPixel, vec3 centerPosition, float primaryDistance, float centerMaterial, float centerRoughness,
                              vec3 centerNormal, out bool centerSelected)
        {
            ivec2 rawSize = ivec2(rtTraceSize.xy);
            ivec2 rawCenter = clamp(ivec2(fullPixel*rtTraceSize.xy/rtFullSize.xy), ivec2(0), rawSize - 1);
            @(? $arg4 [
                vec4 candidate = texture2DRect(tex3, vec2(rawCenter) + 0.5);
                if(candidate.a > -1.5)
                {
                    centerSelected = true;
                    return candidate;
                }
            ])
            float bestWeight = -1.0;
            float positionScale = max(0.02, primaryDistance*0.0015);
            const int diameter = 2*rtReconstructionRadius + 1;
            const int centerIndex = rtReconstructionRadius*diameter + rtReconstructionRadius;
            int bestIndex = diameter*diameter;
            vec4 best = vec4(0.0, 0.0, 0.0, -2.0);
            @(? $arg4 [/* The full-resolution center candidate was handled above. */] [
                rtConsiderRaw(rawCenter, ivec2(0), centerIndex, centerPosition, positionScale, centerMaterial, centerRoughness, centerNormal,
                              bestWeight, bestIndex, best);
            ])
            if(rtReconstructionRadius == 0 || bestWeight > 0.525)
            {
                centerSelected = bestIndex == centerIndex;
                return best;
            }
            for(int y = -rtReconstructionRadius; y <= rtReconstructionRadius; ++y)
                for(int x = -rtReconstructionRadius; x <= rtReconstructionRadius; ++x)
            {
                if(x == 0 && y == 0) continue;
                ivec2 rawPixel = clamp(rawCenter + ivec2(x, y), ivec2(0), rawSize - 1);
                int candidateIndex = (y + rtReconstructionRadius)*diameter + x + rtReconstructionRadius;
                rtConsiderRaw(rawPixel, ivec2(x, y), candidateIndex, centerPosition, positionScale, centerMaterial, centerRoughness,
                              centerNormal, bestWeight, bestIndex, best);
            }
            centerSelected = bestIndex == centerIndex;
            return best;
        }

        void rtStatistics(vec2 fullPixel, vec4 centerRaw, bool centerSelected, out vec3 meanValue, out vec3 deviation)
        {
            ivec2 rawSize = ivec2(rtTraceSize.xy);
            ivec2 pixel = clamp(ivec2(fullPixel*rtTraceSize.xy/rtFullSize.xy), ivec2(0), rawSize - 1);
            vec3 moment = vec3(0.0), moment2 = vec3(0.0);
            float count = 0.0;
            for(int y = -1; y <= 1; ++y) for(int x = -1; x <= 1; ++x)
            {
                ivec2 samplePixel = clamp(pixel + ivec2(x, y), ivec2(0), rawSize - 1);
                vec4 rawSample;
                if(x == 0 && y == 0 && centerSelected) rawSample = centerRaw;
                else rawSample = texture2DRect(tex3, vec2(samplePixel) + 0.5);
                if(rawSample.a <= -1.5) continue;
                vec3 sampleValue = rtRGBToYCoCg(max(rawSample.rgb, vec3(0.0)));
                moment += sampleValue;
                moment2 += sampleValue*sampleValue;
                count += 1.0;
            }
            count = max(count, 1.0);
            meanValue = moment/count;
            deviation = sqrt(max(moment2/count - meanValue*meanValue, vec3(0.0)));
        }

        void main(void)
        {
            vec2 fullPixel = gl_FragCoord.xy;
            vec4 packedNormal = rtFetch(tex1, fullPixel);
            if(dot(packedNormal.rgb, vec3(1.0)) < 0.01)
            {
                rtHistory = vec4(0.0, 0.0, 0.0, -3.0);
                rtSurface = rtValidation = vec4(0.0);
                return;
            }
            vec4 packedMaterial = rtFetch(tex0, fullPixel);
            vec3 normal = normalize(packedNormal.rgb*2.0 - 1.0);
            bool mirrorDebug = rtTemporalParams.w > 0.5;
            float roughness = mirrorDebug ? 0.0 : pbrlegacyreflectionroughness(packedMaterial.a, rtMaterialParams.x);
            float surfaceDepth = rtSurfaceDepth(fullPixel);
            rtSurface = vec4(normal, surfaceDepth);
            rtValidation = vec4(roughness, packedMaterial.a, 1.0, 1.0);
            if(roughness >= 1.0)
            {
                rtHistory = vec4(0.0, 0.0, 0.0, -2.0);
                return;
            }
            vec3 position = rtPositionFromDepth(fullPixel, surfaceDepth, rtWorldMatrix);
            float primaryDistance = distance(camera, position);
            bool centerSelected;
            vec4 current = rtReconstructRaw(fullPixel, position, primaryDistance, packedMaterial.a, roughness, normal, centerSelected);
            rtHistory = current;
            if(rtTemporalParams.x < 0.5 || rtTemporalParams.y <= 1.0) return;

            vec4 previousClip = rtPreviousViewProjection*vec4(position, 1.0);
            if(previousClip.w <= 0.0) return;
            vec2 previousPixel = (previousClip.xy/previousClip.w*0.5 + 0.5)*rtFullSize.xy;
            if(!rtOnscreen(previousPixel)) return;
            vec4 previousSurface = texture2DRect(tex6, previousPixel);
            if(abs(previousSurface.w) <= 1.0e-6) return;
            vec3 previousPosition = rtPositionFromDepth(previousPixel, previousSurface.w, rtPreviousWorldMatrix);
            vec2 motion = (previousPixel - fullPixel)*rtFullSize.zw;
            float motionLength = length(motion);
            float positionTolerance = max(0.08, primaryDistance*0.0025 + motionLength*8.0);
            float normalTolerance = motionLength > 0.001 ? 0.9 : 0.75;
            if(!(distance(previousPosition, position) < positionTolerance && dot(previousSurface.xyz, normal) > normalTolerance)) return;
            vec4 previousValidation = texture2DRect(tex7, previousPixel);
            if(!(abs(previousValidation.x - roughness) < 0.08 && abs(previousValidation.y - packedMaterial.a) < 1.5/255.0)) return;

            vec2 historyPixel = previousPixel;
            if(current.a > 0.0 && roughness < 0.96)
            {
                vec3 direction = normalize(reflect(normalize(position - camera), normal));
                vec4 hitClip = rtPreviousViewProjection*vec4(position + direction*current.a, 1.0);
                if(hitClip.w <= 0.0) return;
                historyPixel = (hitClip.xy/hitClip.w*0.5 + 0.5)*rtFullSize.xy;
            }
            if(!rtOnscreen(historyPixel)) return;
            vec4 history = rtCatmullRom(tex5, historyPixel);
            float hitTolerance = max(0.15, current.a*mix(0.08, 0.75, roughness));
            bool currentSkipped = current.a <= -1.5;
            bool hitValid = currentSkipped || (current.a <= 0.0 && history.a <= 0.0) ||
                (current.a > 0.0 && history.a > 0.0 && abs(history.a - current.a) < hitTolerance);
            if(!hitValid || any(isnan(history.rgb)) || any(isinf(history.rgb))) return;

            vec4 reflectionValidation = all(equal(historyPixel, previousPixel)) ? previousValidation : texture2DRect(tex7, historyPixel);
            float frames = min(reflectionValidation.z + 1.0, rtTemporalParams.y);
            if(currentSkipped)
            {
                rtHistory = history;
                rtValidation.zw = vec2(frames, 0.0);
                return;
            }
            vec3 meanValue, deviation;
            rtStatistics(fullPixel, current, centerSelected, meanValue, deviation);
            float clipStrength = max(mix(0.35, 5.0, pow(roughness, 1.7))*(motionLength > 0.0025 ? 0.45 : 2.0), 0.35);
            vec3 historyYCoCg = rtClipToAABB(rtRGBToYCoCg(max(history.rgb, vec3(0.0))), meanValue - deviation*clipStrength,
                                             meanValue + deviation*clipStrength);
            history.rgb = max(rtYCoCgToRGB(historyYCoCg), vec3(0.0));
            float blendFactor = 1.0 - 1.0/frames;
            rtHistory.rgb = rtInverseReinhard(mix(rtReinhard(max(current.rgb, vec3(0.0))), rtReinhard(history.rgb), blendFactor));
            rtHistory.a = current.a;
            rtValidation.zw = vec2(frames, 0.0);
        }
    ]
]

