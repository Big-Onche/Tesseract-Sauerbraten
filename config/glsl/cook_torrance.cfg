////////////////////////////////////////////////
//
// Candela-style Cook-Torrance material response
//
// Tesseract stores three legacy gloss buckets (exponents 5, 22 and 39) plus a
// compressed specular strength in gcolor.a. The PBR backend deliberately
// decodes that existing representation rather than changing the G-buffer.
//
////////////////////////////////////////////////

cooktorrancebrdf = [result [
    const float PBR_PI = 3.14159265359;
    const float PBR_EPSILON = 1.0e-5;

    void pbrdecodelegacy(float packedmaterial, out float gloss, out float specular)
    {
        float materialcode = min(3.0*(packedmaterial + 0.5/255.0), 2.999);
        float glossbucket = floor(materialcode);
        float strength = materialcode - glossbucket;
        specular = (0.35 + 0.15*glossbucket)*strength/(1.5 - strength);
        gloss = 5.0 + 17.0*glossbucket;
    }

    float pbrlegacyroughness(float packedmaterial, float roughnessscale)
    {
        float gloss, specular;
        pbrdecodelegacy(packedmaterial, gloss, specular);
        // GGX roughness converted from the legacy Blinn-Phong exponent.
        return clamp(sqrt(2.0/(gloss + 2.0))*roughnessscale, 0.045, 1.0);
    }

    float pbrlegacyreflectionroughness(float packedmaterial, float roughnessscale)
    {
        float gloss, specular;
        pbrdecodelegacy(packedmaterial, gloss, specular);
        // An unconfigured specular channel only contains packing quantization noise.
        if(specular <= 0.01) return 1.0;
        return clamp(sqrt(2.0/(gloss + 2.0))*roughnessscale, 0.045, 1.0);
    }

    vec3 pbrlegacyf0(float packedmaterial, float specularscale)
    {
        float gloss, specular;
        pbrdecodelegacy(packedmaterial, gloss, specular);
        if(specular <= 0.01) return vec3(0.0);
        // The normal legacy specscale=1 decode is approximately 0.5, mapping to F0=0.04.
        return vec3(clamp(0.08*specular*specularscale, 0.0, 0.25));
    }

    float pbrdistributionggx(float ndoth, float roughness)
    {
        float alpha = roughness*roughness;
        float alpha2 = alpha*alpha;
        float denominator = ndoth*ndoth*(alpha2 - 1.0) + 1.0;
        return alpha2/max(PBR_PI*denominator*denominator, PBR_EPSILON);
    }

    float pbrgeometryschlickggx(float ndotv, float roughness)
    {
        float r = roughness + 1.0;
        float k = r*r/8.0;
        return ndotv/max(ndotv*(1.0 - k) + k, PBR_EPSILON);
    }

    float pbrgeometrysmith(float ndotv, float ndotl, float roughness)
    {
        return pbrgeometryschlickggx(ndotv, roughness)*pbrgeometryschlickggx(ndotl, roughness);
    }

    vec3 pbrfresnelschlick(float vdoth, vec3 f0)
    {
        if(max(max(f0.r, f0.g), f0.b) <= 0.0) return vec3(0.0);
        return f0 + (vec3(1.0) - f0)*pow(1.0 - vdoth, 5.0);
    }

    void pbrdirect(vec3 normal, vec3 viewdir, vec3 lightdir, vec3 albedo, vec3 f0, float roughness, float metalness,
                   out vec3 diffusebrdf, out vec3 specularbrdf)
    {
        float ndotv = max(dot(normal, viewdir), PBR_EPSILON);
        float ndotl = max(dot(normal, lightdir), 0.0);
        vec3 halfway = normalize(viewdir + lightdir);
        float ndoth = max(dot(normal, halfway), 0.0);
        float vdoth = max(dot(viewdir, halfway), 0.0);
        vec3 fresnel = pbrfresnelschlick(vdoth, mix(f0, albedo, metalness));
        float distribution = pbrdistributionggx(ndoth, roughness);
        float geometry = pbrgeometrysmith(ndotv, ndotl, roughness);
        vec3 kd = (vec3(1.0) - fresnel)*(1.0 - metalness);

        // Candela omits 1/PI on diffuse; retaining that convention matches Tesseract's light units.
        diffusebrdf = kd*albedo*ndotl;
        specularbrdf = fresnel*distribution*geometry/max(4.0*ndotv*ndotl, PBR_EPSILON)*ndotl;
    }
]]
