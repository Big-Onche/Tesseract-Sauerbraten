////////////////////////////////////////////////
//
// sky shaders
//
////////////////////////////////////////////////

shader 0 "skybox" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        fragcolor = colorscale * color;
    }
]

shader 0 "skyboxoverbright" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    uniform vec3 overbrightparams;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        float lum = dot(vec3(@lumweights), color.rgb);
        float overbright = mix(overbrightparams.x, overbrightparams.y, clamp(lum - overbrightparams.z, 0.0, 1.0));
        color.rgb *= overbright;
        fragcolor = colorscale * color;
    }
]

shader 0 "deepstars" [
    attribute vec4 vvertex;
    uniform mat4 deepstarsmatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = vvertex;

        vec4 p = deepstarsmatrix * vvertex;
        camvec = p.xyz / p.w;
    }
] [
    uniform sampler2D tex0;
    uniform float ldrscale;
    uniform mat3 deepstarsrotation;
    uniform vec4 deepstarsparams; // tiles per face, seed, brightness, alpha
    uniform vec2 deepstarsoptions; // rotate, flip
    varying vec3 camvec;
    fragdata(0) vec4 fragcolor;

    float deepStarsHash(vec3 patchid)
    {
        return fract(sin(dot(patchid, vec3(12.9898, 78.233, 37.719)) + deepstarsparams.y*0.12345)*43758.5453);
    }

    void main(void)
    {
        vec3 dir = normalize(deepstarsrotation*camvec);

        vec3 adir = abs(dir);
        vec2 faceuv;
        float face;
        if(adir.x >= adir.y && adir.x >= adir.z)
        {
            if(dir.x >= 0.0) { face = 0.0; faceuv = vec2(-dir.y, dir.z)/adir.x; }
            else             { face = 1.0; faceuv = vec2( dir.y, dir.z)/adir.x; }
        }
        else if(adir.y >= adir.z)
        {
            if(dir.y >= 0.0) { face = 2.0; faceuv = vec2( dir.x, dir.z)/adir.y; }
            else             { face = 3.0; faceuv = vec2(-dir.x, dir.z)/adir.y; }
        }
        else
        {
            if(dir.z >= 0.0) { face = 4.0; faceuv = vec2( dir.x, -dir.y)/adir.z; }
            else             { face = 5.0; faceuv = vec2( dir.x,  dir.y)/adir.z; }
        }

        vec2 gridcoord = min((faceuv*0.5 + 0.5)*deepstarsparams.x, vec2(deepstarsparams.x - 1.0e-5));
        vec2 patchid = floor(gridcoord);
        vec2 texcoord = fract(gridcoord);
        float transformid = floor(deepStarsHash(vec3(patchid, face))*16.0);

        if(deepstarsoptions.x > 0.5)
        {
            float rotation = mod(transformid, 4.0);
            if(rotation > 0.5)
            {
                if(rotation < 1.5) texcoord = vec2(texcoord.y, 1.0 - texcoord.x);
                else if(rotation < 2.5) texcoord = vec2(1.0 - texcoord.x, 1.0 - texcoord.y);
                else texcoord = vec2(1.0 - texcoord.y, texcoord.x);
            }
        }
        if(deepstarsoptions.y > 0.5)
        {
            if(mod(floor(transformid*0.25), 2.0) > 0.5) texcoord.x = 1.0 - texcoord.x;
            if(mod(floor(transformid*0.125), 2.0) > 0.5) texcoord.y = 1.0 - texcoord.y;
        }

        fragcolor = vec4(texture2D(tex0, texcoord).rgb * (ldrscale*deepstarsparams.z), deepstarsparams.w);
    }
]

shader 0 "realstars" [
    attribute vec3 vvertex;
    attribute vec4 vcolor;
    attribute vec2 vtexcoord0; // magnitude, deterministic twinkle seed
    uniform mat4 realstarsmatrix;
    uniform mat3 realstarsworld;
    uniform vec4 realstarsparams; // brightness, point size, magnitude limit, night fade
    uniform vec4 realstarstwinkleparams; // strength, speed, time, transmittance LUT available
    uniform vec4 atmospherelutparams;
    uniform sampler2D tex0;
    varying vec3 starcolor;
    varying vec2 starparams; // seed, altitude

    void main(void)
    {
        vec3 worlddir = normalize(realstarsworld*vvertex);
        float altitude = worlddir.z;
        float magnitude = vtexcoord0.x;
        float horizonfade = smoothstep(0.0, 0.12, altitude);
        float visible = step(magnitude, realstarsparams.z)*horizonfade*realstarsparams.w;

        vec4 clip = realstarsmatrix*vec4(vvertex, 0.0);
        clip.z = clip.w;
        gl_Position = clip;

        float magnitudebrightness = clamp(exp2(-0.35*magnitude), 0.18, 2.5);
        float magnitudesize = clamp(1.0 + 0.22*(2.0 - magnitude), 0.8, 2.2);
        gl_PointSize = clamp(realstarsparams.y*magnitudesize, 1.0, 24.0);

        vec3 transmissioncolor = vec3(1.0);
        if(realstarstwinkleparams.w > 0.5)
        {
            vec2 logicalcoord = vec2(clamp(altitude*0.5 + 0.5, 0.0, 1.0), 0.0);
            vec3 transmission = texture2D(tex0, logicalcoord*atmospherelutparams.xy + atmospherelutparams.zw).rgb;
            float scalartransmission = dot(transmission, vec3(0.2126, 0.7152, 0.0722));
            transmissioncolor = transmission/max(scalartransmission, 1.0e-4);
        }

        starcolor = vcolor.rgb*transmissioncolor*(realstarsparams.x*magnitudebrightness*visible);
        starparams = vec2(vtexcoord0.y, clamp(altitude, 0.0, 1.0));
    }
] [
    uniform vec4 realstarstwinkleparams;
    varying vec3 starcolor;
    varying vec2 starparams;
    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 point = gl_PointCoord*2.0 - 1.0;
        float radius2 = dot(point, point);
        if(radius2 >= 1.0) discard;

        float phase = starparams.x*6.2831853;
        float time = realstarstwinkleparams.z*realstarstwinkleparams.y;
        float wave = sin(time + phase)*0.50 + sin(time*1.91 + phase*2.37)*0.30 + sin(time*0.37 + phase*1.73)*0.20;
        float amplitude = mix(0.26, 0.08, smoothstep(0.0, 0.8, starparams.y))*realstarstwinkleparams.x;
        float twinkle = clamp(1.0 + wave*amplitude, 0.55, 1.45);
        float shape = 1.0 - radius2;
        shape *= shape;
        fragcolor = vec4(starcolor*(shape*twinkle), 0.0);
    }
]

shader 0 "constellationlines" [
    attribute vec3 vvertex;
    uniform mat4 realstarsmatrix;
    uniform mat3 realstarsworld;
    uniform vec3 constellationparams; // brightness, night fade, pass opacity
    varying float linefade;

    void main(void)
    {
        vec3 worlddir = normalize(realstarsworld*vvertex);
        linefade = smoothstep(0.0, 0.12, worlddir.z)*constellationparams.x*constellationparams.y*constellationparams.z;
        vec4 clip = realstarsmatrix*vec4(vvertex, 0.0);
        clip.z = clip.w;
        gl_Position = clip;
    }
] [
    varying float linefade;
    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        if(linefade <= 0.0) discard;
        fragcolor = vec4(vec3(0.30, 0.62, 1.0), linefade);
    }
]

shader 0 "atmospheretransmittance" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform vec4 atmosphereparams; // ground/top radius, inverse Rayleigh/Mie scale heights (km^-1)
    uniform vec4 atmosphereparams2; // ozone center/inverse half-width
    uniform vec3 betarayleigh, mieextinction, betaozone;
    uniform vec2 atmospherelutsize;
    fragdata(0) vec4 fragcolor;

    const int SUN_STEPS = @atmosunsteps;

    vec3 densityAtAltitude(float altitude)
    {
        float rayleigh = exp(-altitude*atmosphereparams.z);
        float mie = exp(-altitude*atmosphereparams.w);
        float ozone = max(1.0 - abs(altitude - atmosphereparams2.x)*atmosphereparams2.y, 0.0);
        return vec3(rayleigh, mie, ozone);
    }

    float raySphereFar(vec3 origin, vec3 dir, float sphereRadius, float originRadiusSquared)
    {
        float b = dot(origin, dir);
        float c = originRadiusSquared - sphereRadius*sphereRadius;
        float discriminant = b*b - c;
        return discriminant > 0.0 ? max(-b + sqrt(discriminant), 0.0) : 0.0;
    }

    void main(void)
    {
        // Store endpoints at texel centers. Altitude is square-root encoded to
        // devote most of the small LUT to the dense lower atmosphere.
        vec2 logicalCoord = (gl_FragCoord.xy - vec2(0.5))/max(atmospherelutsize - vec2(1.0), vec2(1.0));
        float altitudeFraction = logicalCoord.y*logicalCoord.y;
        float radius = mix(atmosphereparams.x, atmosphereparams.y, altitudeFraction);
        float mu = logicalCoord.x*2.0 - 1.0;
        float groundToRadius = min(atmosphereparams.x/radius, 1.0);
        float horizonMu = -sqrt(max(1.0 - groundToRadius*groundToRadius, 0.0));
        if(mu < horizonMu)
        {
            fragcolor = vec4(0.0);
            return;
        }

        vec3 p = vec3(0.0, 0.0, radius);
        vec3 lightdir = vec3(sqrt(max(1.0 - mu*mu, 0.0)), 0.0, mu);
        float radiusSquared = radius*radius;
        float rayLength = raySphereFar(p, lightdir, atmosphereparams.y, radiusSquared);
        vec3 opticalDepth = vec3(0.0);
        float previousT = 0.0;
        for(int i = 0; i < SUN_STEPS; ++i)
        {
            float u = float(i + 1)/float(SUN_STEPS);
            float nextT = rayLength*u*u;
            float dt = nextT - previousT;
            float sampleRadius = length(p + lightdir*(previousT + 0.5*dt));
            vec3 density = densityAtAltitude(max(sampleRadius - atmosphereparams.x, 0.0));
            opticalDepth += (betarayleigh*density.x + mieextinction*density.y + betaozone*density.z)*dt;
            previousT = nextT;
        }
        fragcolor = vec4(exp(-min(opticalDepth, vec3(32.0))), 1.0);
    }
]

shader 0 "atmosphere" [
    attribute vec4 vvertex;
    uniform mat4 sunmatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = vvertex;

        vec4 p = sunmatrix * vvertex;
        camvec = p.xyz / p.w;
    }
] [
    uniform vec4 sunlight;
    uniform vec3 sundir;
    uniform vec4 atmosphereparams;  // ground/top radius, inverse Rayleigh/Mie scale heights (km^-1)
    uniform vec4 atmosphereparams2; // ozone center/inverse half-width, multiple scattering strength, Mie g
    uniform vec4 atmospherelutparams; // normalized-coordinate scale.xy and offset.zw
    uniform vec3 betarayleigh, betamie, mieextinction, betaozone;
    uniform sampler2D tex0; // solar atmospheric transmittance (radius/altitude, light cosine)
    uniform vec2 hdrgamma;
    varying vec3 camvec;
    fragdata(0) vec4 fragcolor;

    const float PI = 3.14159265;
    const float INV_4PI = 0.07957747155;
    const int VIEW_STEPS = @atmoviewsteps;

    vec3 densityAtAltitude(float altitude)
    {
        float rayleigh = exp(-altitude*atmosphereparams.z);
        float mie = exp(-altitude*atmosphereparams.w);
        float ozone = max(1.0 - abs(altitude - atmosphereparams2.x)*atmosphereparams2.y, 0.0);
        return vec3(rayleigh, mie, ozone);
    }

    float raySphereFar(vec3 origin, vec3 dir, float sphereRadius, float originRadiusSquared)
    {
        float b = dot(origin, dir);
        float c = originRadiusSquared - sphereRadius*sphereRadius;
        float discriminant = b*b - c;
        return discriminant > 0.0 ? max(-b + sqrt(discriminant), 0.0) : 0.0;
    }

    vec3 sunTransmittance(float radius, float lightMu)
    {
        float altitudeFraction = clamp((radius - atmosphereparams.x)/max(atmosphereparams.y - atmosphereparams.x, 1.0e-4), 0.0, 1.0);
        vec2 logicalCoord = vec2(clamp(lightMu*0.5 + 0.5, 0.0, 1.0), sqrt(altitudeFraction));
        return texture2D(tex0, logicalCoord*atmospherelutparams.xy + atmospherelutparams.zw).rgb;
    }

    vec3 indirectSunTransmittance(float radius, float sunMu, float horizonMu, bool planetShadow, vec3 directTransmittance)
    {
        if(!planetShadow) return directTransmittance;

        // Multiple scattering is evaluated without the local visibility term in
        // Hillaire's model. Approximate the neighboring illuminated atmosphere
        // with a representative clear path, then fade it by shadow depth. Using
        // the tangent itself would over-absorb blue light and turn civil twilight
        // uniformly brown.
        float safeMu = 0.3;
        float shadowDepth = max(horizonMu - sunMu, 0.0);
        return sunTransmittance(radius, safeMu)*exp(-20.0*shadowDepth);
    }

    void main(void)
    {
        vec3 viewdir = normalize(camvec);

        // A sky dome has no physical ground surface. Fold the lower hemisphere
        // over the local horizon so every direction follows the same atmospheric
        // integration path. The small smooth bias avoids selecting two different
        // paths at exactly zero elevation while remaining sub-pixel in practice.
        float foldedZ = sqrt(viewdir.z*viewdir.z + 2.5e-5);
        vec3 camdir = normalize(vec3(viewdir.xy, foldedZ));
        float costheta = dot(camdir, sundir);

        float g = atmosphereparams2.w;
        float rphase = 3.0*(1.0 + costheta*costheta)/(16.0*PI);
        float mieDenominator = max(1.0 + g*g - 2.0*g*costheta, 1.0e-3);
        float mphase = 3.0*(1.0 - g*g)*(1.0 + costheta*costheta)
                     / (8.0*PI*(2.0 + g*g)*pow(mieDenominator, 1.5));

        // The virtual camera sits just above the ground. A quadratic sample
        // distribution preserves the dense horizon profile without a sky LUT.
        vec3 cameraPosition = vec3(0.0, 0.0, atmosphereparams.x + 0.001);
        float cameraRadiusSquared = dot(cameraPosition, cameraPosition);
        float viewLength = raySphereFar(cameraPosition, camdir, atmosphereparams.y, cameraRadiusSquared);

        vec3 transmittance = vec3(1.0);
        vec3 inscatter = vec3(0.0);
        float previousT = 0.0;
        for(int i = 0; i < VIEW_STEPS; ++i)
        {
            float u = float(i + 1) / float(VIEW_STEPS);
            float nextT = viewLength*u*u;
            float dt = nextT - previousT;
            vec3 p = cameraPosition + camdir*(previousT + 0.5*dt);
            float radiusSquared = dot(p, p);
            float inverseRadius = inversesqrt(max(radiusSquared, 1.0e-8));
            float radius = radiusSquared*inverseRadius;
            vec3 up = p*inverseRadius;
            vec3 density = densityAtAltitude(max(radius - atmosphereparams.x, 0.0));
            vec3 rayleighScattering = betarayleigh*density.x;
            vec3 mieScattering = betamie*density.y;
            vec3 scattering = rayleighScattering + mieScattering;
            vec3 extinction = rayleighScattering + mieextinction*density.y + betaozone*density.z;

            float sunMu = dot(up, sundir);
            float groundToRadius = min(atmosphereparams.x*inverseRadius, 1.0);
            float horizonMu = -sqrt(max(1.0 - groundToRadius*groundToRadius, 0.0));
            bool planetShadow = sunMu < horizonMu;
            vec3 directSun = planetShadow ? vec3(0.0) : sunTransmittance(radius, sunMu);
            vec3 indirectSun = indirectSunTransmittance(radius, sunMu, horizonMu, planetShadow, directSun);

            vec3 source = directSun*(rayleighScattering*rphase + mieScattering*mphase);

            // O(1) high-order approximation following Equations 7-11: second
            // and higher scattering orders are isotropic and amplified by the
            // geometric-series transfer 1/(1-f_ms). The local 32 km transfer
            // scale matches the paper's aerial-perspective range.
            vec3 singleAlbedo = scattering/max(extinction, vec3(1.0e-5));
            vec3 fms = clamp(singleAlbedo*(vec3(1.0) - exp(-extinction*32.0)), vec3(0.0), vec3(0.9));
            vec3 Fms = vec3(1.0)/(vec3(1.0) - fms);
            vec3 secondOrder = scattering*INV_4PI*(vec3(1.0) - indirectSun)*sqrt(max(indirectSun, vec3(0.0)));
            source += secondOrder*Fms*atmosphereparams2.z;

            vec3 segmentTransmittance = exp(-min(extinction*dt, vec3(32.0)));
            vec3 segmentIntegral = (vec3(1.0) - segmentTransmittance)/max(extinction, vec3(1.0e-5));
            inscatter += transmittance*source*segmentIntegral;
            transmittance *= segmentTransmittance;
            previousT = nextT;
        }

        inscatter *= sunlight.rgb;
        inscatter *= sunlight.a;

        @(hdrgammaencode inscatter)

        // Premultiplied source color plus a scalar destination transmittance.
        float viewTransmittance = dot(transmittance, vec3(0.2126, 0.7152, 0.0722));
        fragcolor = vec4(inscatter, mix(1.0, clamp(viewTransmittance, 0.0, 1.0), sunlight.a));
    }
]

shader 0 "atmospheresundisk" [
    attribute vec4 vvertex;
    uniform mat4 celestialmatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = vvertex;
        vec4 p = celestialmatrix*vvertex;
        camvec = p.xyz/p.w;
    }
] [
    uniform sampler2D tex0;
    uniform vec3 sundir, moondir, sundiskcolor;
    uniform vec2 sundiskparams;
    uniform vec3 solareclipseparams; // outer cosine, inner cosine, opacity
    uniform vec4 atmosphereparams, atmospherelutparams;
    uniform float celestialalpha;
    uniform vec2 hdrgamma;
    varying vec3 camvec;
    fragdata(0) vec4 fragcolor;

    vec3 sunTransmittance(float radius, float lightMu)
    {
        float altitudeFraction = clamp((radius - atmosphereparams.x)/max(atmosphereparams.y - atmosphereparams.x, 1.0e-4), 0.0, 1.0);
        vec2 logicalCoord = vec2(clamp(lightMu*0.5 + 0.5, 0.0, 1.0), sqrt(altitudeFraction));
        return texture2D(tex0, logicalCoord*atmospherelutparams.xy + atmospherelutparams.zw).rgb;
    }

    void main(void)
    {
        vec3 viewdir = normalize(camvec);
        if(viewdir.z < 0.0) discard;
        float foldedZ = sqrt(viewdir.z*viewdir.z + 2.5e-5);
        vec3 camdir = normalize(vec3(viewdir.xy, foldedZ));
        float costheta = dot(camdir, sundir);
        float edgeoffset = max(1.0 - (1.0 - max(costheta, 0.0)*costheta)*sundiskparams.x, 0.0);
        if(edgeoffset <= 0.0) discard;

        vec3 limbdarken = pow(vec3(edgeoffset), vec3(0.397, 0.503, 0.64));
        float corona = min(edgeoffset*sundiskparams.y, 1.0);
        corona = max(0.1725/(1.15 - corona*corona) - 0.15, 0.0);
        float mooncover = solareclipseparams.z > 0.0
                        ? solareclipseparams.z*smoothstep(solareclipseparams.x, solareclipseparams.y, dot(camdir, moondir))
                        : 0.0;
        vec3 color = sundiskcolor*limbdarken*corona*(1.0 - mooncover);
        color *= sunTransmittance(atmosphereparams.x + 0.001, camdir.z)*celestialalpha;
        @(hdrgammaencode color)
        fragcolor = vec4(color, 0.0);
    }
]

shader 0 "atmospheremoon" [
    attribute vec4 vvertex;
    uniform mat4 celestialmatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = vvertex;
        vec4 p = celestialmatrix*vvertex;
        camvec = p.xyz/p.w;
    }
] [
    uniform sampler2D tex0, tex1;
    uniform vec3 moondir, moonright, moonup, sundir, moonlightcolor;
    uniform vec4 moonparams; // texture scale, disk cosine, apparent brightness, earthshine
    uniform vec4 atmosphereparams, atmospherelutparams;
    uniform vec2 lunareclipseparams; // umbra and penumbra angular chord radii
    uniform float celestialalpha, ldrscale;
    varying vec3 camvec;
    fragdata(0) vec4 fragcolor;

    vec3 atmosphereTransmittance(float radius, float lightMu)
    {
        float altitudeFraction = clamp((radius - atmosphereparams.x)/max(atmosphereparams.y - atmosphereparams.x, 1.0e-4), 0.0, 1.0);
        vec2 logicalCoord = vec2(clamp(lightMu*0.5 + 0.5, 0.0, 1.0), sqrt(altitudeFraction));
        return texture2D(tex0, logicalCoord*atmospherelutparams.xy + atmospherelutparams.zw).rgb;
    }

    void main(void)
    {
        vec3 viewdir = normalize(camvec);
        if(viewdir.z < 0.0 || dot(viewdir, moondir) < moonparams.y) discard;
        vec2 texcoord = vec2(dot(viewdir, moonright), dot(viewdir, moonup))*moonparams.x + vec2(0.5);
        vec4 moon = texture2D(tex1, texcoord);
        if(moon.a <= 0.001) discard;

        // Treat the texture as lunar albedo on the observer-facing hemisphere.
        // The sun and observer are effectively at infinity, so this produces the
        // correct crescent, quarter and full-moon terminator from their directions.
        vec2 diskpos = (texcoord - vec2(0.5))*2.0;
        float surfaceDepth = sqrt(max(1.0 - dot(diskpos, diskpos), 0.0));
        vec3 surfaceNormal = normalize(moonright*diskpos.x + moonup*diskpos.y - moondir*surfaceDepth);
        float directLight = pow(max(dot(surfaceNormal, sundir), 0.0), 0.55);
        float illumination = max(directLight, moonparams.w);

        // Earth's shadow is centred opposite the Sun. Its atmosphere absorbs
        // blue light and refracts a dim copper-red component into the umbra.
        float shadowDistance = sqrt(max(2.0*(1.0 + dot(viewdir, sundir)), 0.0));
        float umbraEdge = smoothstep(lunareclipseparams.x*0.30, lunareclipseparams.x, shadowDistance);
        vec3 umbraTransmission = mix(vec3(0.010, 0.0012, 0.0003), vec3(0.20, 0.040, 0.007), umbraEdge);
        float penumbraExit = smoothstep(lunareclipseparams.x, lunareclipseparams.y, shadowDistance);
        vec3 eclipseTransmission = mix(umbraTransmission, vec3(1.0), penumbraExit);
        vec3 color = moon.rgb*moonlightcolor*eclipseTransmission*(moon.a*illumination*moonparams.z*ldrscale*celestialalpha);

        // The full-screen atmosphere pass supplies scalar extinction and
        // in-scattering after the moon. Preserve only the wavelength-dependent
        // transmission ratio here so the moon receives colored aerial
        // perspective without applying extinction twice.
        vec3 transmission = mix(vec3(1.0), atmosphereTransmittance(atmosphereparams.x + 0.001, viewdir.z), celestialalpha);
        float scalarTransmission = dot(transmission, vec3(0.2126, 0.7152, 0.0722));
        color *= transmission/max(scalarTransmission, 1.0e-4);
        fragcolor = vec4(color, moon.a*celestialalpha);
    }
]

shader 0 "atmosphereupscale" [
    attribute vec4 vvertex;
    uniform vec2 atmosphereupscalesize;
    varying vec2 texcoord;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord = (vvertex.xy*0.5 + 0.5)*atmosphereupscalesize;
    }
] [
    uniform sampler2DRect tex0;
    varying vec2 texcoord;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = texture2DRect(tex0, texcoord);
    }
]

shader 0 "skyfog" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 color;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        color = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    varying vec4 color;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor =
            //:variantoverride vec4(color.rgb, color.a * color.a)
            color
            ;
    }
]
