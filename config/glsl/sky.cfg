////////////////////////////////////////////////
//
// sky shaders
//
////////////////////////////////////////////////

shader 0 "skybox" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        fragcolor = colorscale * color;
    }
]

shader 0 "skyboxoverbright" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    uniform vec3 overbrightparams;
    uniform float ldrscale;
    varying vec4 colorscale;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        float lum = dot(vec3(@lumweights), color.rgb);
        float overbright = mix(overbrightparams.x, overbrightparams.y, clamp(lum - overbrightparams.z, 0.0, 1.0));
        color.rgb *= overbright;
        fragcolor = colorscale * color;
    }
]

shader 0 "nightsky" [
    attribute vec4 vvertex;
    uniform mat4 nightskymatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = vvertex;

        vec4 p = nightskymatrix * vvertex;
        camvec = p.xyz / p.w;
    }
] [
    uniform sampler2D tex0;
    uniform float ldrscale;
    uniform float nightskyalpha;
    varying vec3 camvec;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 dir = normalize(camvec);
        // The procedural sky is a full sphere. Repeat the upper celestial
        // hemisphere below the horizon so it meets the atmosphere without a
        // different lower-pole texture seam.
        dir.z = abs(dir.z);
        vec2 texcoord = vec2(atan(dir.y, dir.x) * (0.5 / 3.14159265) + 0.5,
                             acos(clamp(dir.z, -1.0, 1.0)) / 3.14159265);
        fragcolor = vec4(texture2D(tex0, texcoord).rgb * ldrscale, nightskyalpha);
    }
]

shader 0 "atmosphere" [
    attribute vec4 vvertex;
    uniform mat4 sunmatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = vvertex;

        vec4 p = sunmatrix * vvertex;
        camvec = p.xyz / p.w;
    }
] [
    uniform vec4 sunlight;
    uniform vec3 sundir;
    uniform vec3 sundiskcolor;
    uniform vec2 sundiskparams;
    uniform vec4 atmosphereparams;  // ground radius, top radius, Rayleigh/Mie scale heights (km)
    uniform vec4 atmosphereparams2; // ozone center/half-width, multiple scattering strength, Mie g
    uniform vec3 betarayleigh, betamie, mieextinction, betaozone;
    uniform vec2 hdrgamma;
    varying vec3 camvec;
    fragdata(0) vec4 fragcolor;

    const float PI = 3.14159265;
    const float INV_4PI = 0.07957747155;
    const int VIEW_STEPS = @atmoviewsteps;
    const int SUN_STEPS = @atmosunsteps;

    vec3 densityAtAltitude(float altitude)
    {
        float rayleigh = exp(-altitude / max(atmosphereparams.z, 1.0e-3));
        float mie = exp(-altitude / max(atmosphereparams.w, 1.0e-3));
        float ozone = max(1.0 - abs(altitude - atmosphereparams2.x) / max(atmosphereparams2.y, 1.0e-3), 0.0);
        return vec3(rayleigh, mie, ozone);
    }

    vec3 densityAt(vec3 p)
    {
        return densityAtAltitude(max(length(p) - atmosphereparams.x, 0.0));
    }

    float raySphereFar(vec3 origin, vec3 dir, float sphereRadius, float originRadiusSquared)
    {
        float b = dot(origin, dir);
        float c = originRadiusSquared - sphereRadius*sphereRadius;
        float discriminant = b*b - c;
        return discriminant > 0.0 ? max(-b + sqrt(discriminant), 0.0) : 0.0;
    }

    vec3 sunTransmittance(vec3 p, float radiusSquared, vec3 lightdir)
    {
        float rayLength = raySphereFar(p, lightdir, atmosphereparams.y, radiusSquared);
        vec3 opticalDepth = vec3(0.0);
        float previousT = 0.0;
        for(int i = 0; i < SUN_STEPS; ++i)
        {
            float u = float(i + 1) / float(SUN_STEPS);
            float nextT = rayLength*u*u;
            float dt = nextT - previousT;
            vec3 density = densityAt(p + lightdir*(previousT + 0.5*dt));
            opticalDepth += (betarayleigh*density.x + mieextinction*density.y + betaozone*density.z)*dt;
            previousT = nextT;
        }
        return exp(-min(opticalDepth, vec3(32.0)));
    }

    vec3 indirectSunTransmittance(vec3 p, float radiusSquared, vec3 up, float sunMu, float horizonMu, bool planetShadow,
                                  vec3 directTransmittance)
    {
        if(!planetShadow) return directTransmittance;

        // Multiple scattering is evaluated without the local visibility term in
        // Hillaire's model. Approximate the neighboring illuminated atmosphere
        // with a representative clear path, then fade it by shadow depth. Using
        // the tangent itself would over-absorb blue light and turn civil twilight
        // uniformly brown.
        vec3 horizontal = sundir - up*sunMu;
        float horizontalLength = length(horizontal);
        horizontal = horizontalLength > 1.0e-4 ? horizontal/horizontalLength : vec3(1.0, 0.0, 0.0);
        float safeMu = 0.3;
        vec3 safeDirection = normalize(horizontal*sqrt(max(1.0 - safeMu*safeMu, 0.0)) + up*safeMu);
        float shadowDepth = max(horizonMu - sunMu, 0.0);
        return sunTransmittance(p, radiusSquared, safeDirection)*exp(-20.0*shadowDepth);
    }

    void main(void)
    {
        vec3 viewdir = normalize(camvec);

        // A sky dome has no physical ground surface. Fold the lower hemisphere
        // over the local horizon so every direction follows the same atmospheric
        // integration path. The small smooth bias avoids selecting two different
        // paths at exactly zero elevation while remaining sub-pixel in practice.
        float foldedZ = sqrt(viewdir.z*viewdir.z + 2.5e-5);
        vec3 camdir = normalize(vec3(viewdir.xy, foldedZ));
        float costheta = dot(camdir, sundir);

        // sun disk
        float edgeoffset = max(1.0 - (1.0 - max(costheta, 0.0)*costheta)*sundiskparams.x, 0.0);
        // limb darken with distance to edge
        vec3 limbdarken = pow(vec3(edgeoffset), vec3(0.397, 0.503, 0.64));
        // lighten edges for corona, but limit it to not interfere with limb darkening
        float corona = min(edgeoffset * sundiskparams.y, 1.0);
        corona = max(0.1725 / (1.15 - corona * corona) - 0.15, 0.0);
        // apply limb darkening and corona to clamped sunlight color
        vec3 sundisk = sundiskcolor * limbdarken * corona;

        float g = atmosphereparams2.w;
        float rphase = 3.0*(1.0 + costheta*costheta)/(16.0*PI);
        float mieDenominator = max(1.0 + g*g - 2.0*g*costheta, 1.0e-3);
        float mphase = 3.0*(1.0 - g*g)*(1.0 + costheta*costheta)
                     / (8.0*PI*(2.0 + g*g)*pow(mieDenominator, 1.5));

        // The virtual camera sits just above the ground. A quadratic sample
        // distribution preserves the dense horizon profile without a sky LUT.
        vec3 cameraPosition = vec3(0.0, 0.0, atmosphereparams.x + 0.001);
        float cameraRadiusSquared = dot(cameraPosition, cameraPosition);
        float viewLength = raySphereFar(cameraPosition, camdir, atmosphereparams.y, cameraRadiusSquared);

        vec3 transmittance = vec3(1.0);
        vec3 inscatter = vec3(0.0);
        float previousT = 0.0;
        for(int i = 0; i < VIEW_STEPS; ++i)
        {
            float u = float(i + 1) / float(VIEW_STEPS);
            float nextT = viewLength*u*u;
            float dt = nextT - previousT;
            vec3 p = cameraPosition + camdir*(previousT + 0.5*dt);
            float radiusSquared = dot(p, p);
            float inverseRadius = inversesqrt(max(radiusSquared, 1.0e-8));
            float radius = radiusSquared*inverseRadius;
            vec3 up = p*inverseRadius;
            vec3 density = densityAtAltitude(max(radius - atmosphereparams.x, 0.0));
            vec3 rayleighScattering = betarayleigh*density.x;
            vec3 mieScattering = betamie*density.y;
            vec3 scattering = rayleighScattering + mieScattering;
            vec3 extinction = rayleighScattering + mieextinction*density.y + betaozone*density.z;

            float sunMu = dot(up, sundir);
            float groundToRadius = min(atmosphereparams.x*inverseRadius, 1.0);
            float horizonMu = -sqrt(max(1.0 - groundToRadius*groundToRadius, 0.0));
            bool planetShadow = sunMu < horizonMu;
            vec3 directSun = planetShadow ? vec3(0.0) : sunTransmittance(p, radiusSquared, sundir);
            vec3 indirectSun = indirectSunTransmittance(p, radiusSquared, up, sunMu, horizonMu, planetShadow, directSun);

            vec3 source = directSun*(rayleighScattering*rphase + mieScattering*mphase);

            // O(1) high-order approximation following Equations 7-11: second
            // and higher scattering orders are isotropic and amplified by the
            // geometric-series transfer 1/(1-f_ms). The local 32 km transfer
            // scale matches the paper's aerial-perspective range.
            vec3 singleAlbedo = scattering/max(extinction, vec3(1.0e-5));
            vec3 fms = clamp(singleAlbedo*(vec3(1.0) - exp(-extinction*32.0)), vec3(0.0), vec3(0.9));
            vec3 Fms = vec3(1.0)/(vec3(1.0) - fms);
            vec3 secondOrder = scattering*INV_4PI*(vec3(1.0) - indirectSun)*sqrt(max(indirectSun, vec3(0.0)));
            source += secondOrder*Fms*atmosphereparams2.z;

            vec3 segmentTransmittance = exp(-min(extinction*dt, vec3(32.0)));
            vec3 segmentIntegral = (vec3(1.0) - segmentTransmittance)/max(extinction, vec3(1.0e-5));
            inscatter += transmittance*source*segmentIntegral;
            transmittance *= segmentTransmittance;
            previousT = nextT;
        }

        inscatter *= sunlight.rgb;

        // Direct solar radiance traverses the same camera-to-space medium. Do not
        // repeat the solar disk into the folded lower hemisphere.
        if(viewdir.z >= 0.0) inscatter += sundisk*transmittance;
        inscatter *= sunlight.a;

        @(hdrgammaencode inscatter)

        // Premultiplied source color plus a scalar destination transmittance.
        float viewTransmittance = dot(transmittance, vec3(0.2126, 0.7152, 0.0722));
        fragcolor = vec4(inscatter, mix(1.0, clamp(viewTransmittance, 0.0, 1.0), sunlight.a));
    }
]

shader 0 "skyfog" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 skymatrix;
    uniform float ldrscale;
    varying vec4 color;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        color = vec4(ldrscale * vcolor.rgb, vcolor.a);
    }
] [
    uniform sampler2D tex0;
    varying vec4 color;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor =
            //:variantoverride vec4(color.rgb, color.a * color.a)
            color
            ;
    }
]
