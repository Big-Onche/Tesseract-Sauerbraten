// Candela-derived sunlight volumetrics for Tesseract.
// Original concepts and shader pipeline by Samuel Rasquinha (@swr06), GPL-3.0.
// Rewritten for Tesseract's Z-up world, packed/linear/MSAA depth, CSM atlas,
// Radiance Hints and HDR composition. See candela/LICENSE.

cvolraymarchshader = [
    local multisample shadowrect
    multisample = $arg2
    shadowrect = $arg3
    shader 0 $arg1 [
        attribute vec4 vvertex;
        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        @(gfetchdefs tex0 $multisample)
        @(? $shadowrect [uniform sampler2DRectShadow tex2;] [uniform sampler2DShadow tex2;])
        uniform sampler3D tex3, tex4, tex5, tex6, tex7;
        uniform mat4 worldmatrix;
        uniform vec3 camera, cvolSunDirection, cvolSunColor, cvolambientcolor;
        uniform mat3 csmmatrix;
        uniform vec4 csmtc[8], rhtc[8];
        uniform vec3 csmoffset[8];
        uniform vec2 csmz;
        uniform float rhbounds;
        uniform vec3 skyocclscale, skyoccloffset;
        uniform vec2 shadowatlasscale;
        uniform vec4 cvolFullSize, cvolLowSize, cvolMedium, cvolLayer, cvolLighting, cvolLocalParams;
        uniform int cvolFrame, cvolLocalLightCount;
        uniform vec4 cvolLocalLightPositionRadius[16], cvolLocalLightColor[16], cvolLocalLightSecondary[16];
        uniform vec4 cvolLocalLightDirectionCone[16], cvolLocalLightAttenuation[16], cvolLocalLightShadowParams[16];
        uniform vec4 cvolLocalLightShadowOffsetFlags[16];
        fragdata(0) vec4 fragColor;
        fragdata(1) vec4 fragDebug;

        const float CVOL_PI = 3.14159265358979323846;

        float cvolHash(vec3 p)
        {
            p = fract(p*0.1031);
            p += dot(p, p.yzx + 33.33);
            return fract((p.x + p.y)*p.z);
        }

        float cvolPhase(float cosine, float g)
        {
            float gg = g*g;
            return (1.0 - gg)/(4.0*CVOL_PI*pow(max(1.0 + gg - 2.0*g*cosine, 1.0e-4), 1.5));
        }

        float cvolDensity(vec3 position)
        {
            if(cvolMedium.w > 0.5) return cvolMedium.x;
            // Tesseract is Z-up. volheight is the reference-density altitude
            // and volthickness controls exponential falloff in world units.
            float altitude = (position.z - cvolLayer.x)/max(cvolLayer.y, 1.0);
            return cvolMedium.x*clamp(exp2(-altitude), 0.0, 8.0);
        }

        float cvolSkyVisibility(vec3 position)
        {
            if(skyocclscale.x <= 0.0) return 1.0;
            vec3 tc = position*skyocclscale + skyoccloffset;
            if(any(notEqual(tc, clamp(tc, vec3(0.0), vec3(1.0))))) return 1.0;
            return clamp(texture3D(tex7, tc).r, 0.0, 1.0);
        }

        float cvolShadowTap(vec3 shadowtc)
        {
            @(? $shadowrect [
                return float(shadow2DRect(tex2, shadowtc));
            ] [
                return float(shadow2D(tex2, vec3(shadowtc.xy*shadowatlasscale, shadowtc.z)));
            ])
        }

        float cvolFilteredShadow(vec3 shadowtc)
        {
            vec2 f = fract(shadowtc.xy - 0.5);
            vec3 center = vec3(shadowtc.xy - f*0.5, shadowtc.z);
            vec4 size = vec4(f + 1.0, 2.0 - f);
            return (1.0/9.0)*dot(size.zxzx*size.wwyy,
                vec4(cvolShadowTap(center + vec3(-0.5, -0.5, 0.0)), cvolShadowTap(center + vec3(1.0, -0.5, 0.0)),
                     cvolShadowTap(center + vec3(-0.5, 1.0, 0.0)), cvolShadowTap(center + vec3(1.0, 1.0, 0.0))));
        }

        vec3 cvolLocalShadowCoordinate(vec3 direction, vec4 shadowParams, vec2 shadowOffset)
        {
            vec3 absoluteDirection = abs(direction);
            float planarMajor = max(absoluteDirection.x, absoluteDirection.y);
            float major = max(absoluteDirection.z, planarMajor);
            vec2 projectionParams = shadowParams.xy/max(major, 1.0e-5);
            vec4 projection = absoluteDirection.x > absoluteDirection.y ? vec4(direction.zyx, 0.0) : vec4(direction.xzy, 1.0);
            if(absoluteDirection.z > planarMajor) projection = vec4(direction, 2.0);
            return vec3(projection.xy*projectionParams.x + vec2(projection.w, step(0.0, projection.z))*shadowParams.z + shadowOffset,
                        projectionParams.y + shadowParams.w);
        }

        vec3 cvolLocalSpotShadowCoordinate(vec3 direction, float spotDistance, vec4 spotParams, vec4 shadowParams, vec2 shadowOffset)
        {
            vec2 projectionParams = shadowParams.xy/max(spotDistance, 1.0e-5);
            return vec3((direction.xy - spotParams.xy*(spotDistance + (spotParams.z > 0.0 ? 1.0 : -1.0)*direction.z)*shadowParams.z) *
                        projectionParams.x + shadowOffset, projectionParams.y + shadowParams.w);
        }

        float cvolLocalAttenuation(float centerDistance, vec4 parameters)
        {
            if(parameters.w < 0.5) return clamp(1.0 - centerDistance, 0.0, 1.0);
            float coreSquared = max(parameters.y*parameters.y, 1.0e-12);
            float attenuation = pow(coreSquared/(centerDistance*centerDistance + coreSquared), 0.5*parameters.x);
            float edge = max(parameters.z, 0.001);
            float fade = clamp((1.0 - centerDistance)/edge, 0.0, 1.0);
            return attenuation*fade*fade*(3.0 - 2.0*fade);
        }

        vec3 cvolResolveLocalLightColor(vec3 primary, vec4 secondary, float centerDistance)
        {
            if(secondary.w <= 0.0) return primary;
            float blend = clamp(centerDistance/secondary.w, 0.0, 1.0);
            blend = blend*blend*(3.0 - 2.0*blend);
            return mix(secondary.rgb, primary, blend);
        }

        vec3 cvolLocalLighting(vec3 position, vec3 viewDirection)
        {
            vec3 lighting = vec3(0.0);
            for(int lightIndex = 0; lightIndex < 16; ++lightIndex)
            {
                if(lightIndex >= cvolLocalLightCount) break;
                vec4 positionRadius = cvolLocalLightPositionRadius[lightIndex];
                vec3 toLightWorld = positionRadius.xyz - position;
                float radius = max(positionRadius.w, 1.0e-4);
                float centerDistance = length(toLightWorld)/radius;
                if(centerDistance >= 1.0) continue;
                vec3 toLight = toLightWorld/radius;
                vec3 lightDirection = toLightWorld/max(length(toLightWorld), 1.0e-5);
                vec4 spotParams = cvolLocalLightDirectionCone[lightIndex];
                vec4 shadowFlags = cvolLocalLightShadowOffsetFlags[lightIndex];
                float spotAttenuation = 1.0;
                float spotDistance = 0.0;
                if(shadowFlags.w > 0.5)
                {
                    spotDistance = dot(toLight, spotParams.xyz);
                    spotAttenuation = 1.0 - (1.0 - spotDistance/max(centerDistance, 1.0e-5))*spotParams.w;
                    if(spotAttenuation <= 0.0) continue;
                }
                float visibility = 1.0;
                if(shadowFlags.z > 0.5)
                {
                    vec4 shadowParams = cvolLocalLightShadowParams[lightIndex];
                    vec2 shadowOffset = shadowFlags.xy;
                    vec3 shadowCoordinate = shadowFlags.w > 0.5 ?
                        cvolLocalSpotShadowCoordinate(toLight, spotDistance, spotParams, shadowParams, shadowOffset) :
                        cvolLocalShadowCoordinate(toLight, shadowParams, shadowOffset);
                    visibility = clamp(cvolShadowTap(shadowCoordinate), 0.0, 1.0);
                }
                float attenuation = cvolLocalAttenuation(centerDistance, cvolLocalLightAttenuation[lightIndex]);
                float phase = cvolPhase(dot(viewDirection, lightDirection), 0.35);
                vec3 color = cvolResolveLocalLightColor(cvolLocalLightColor[lightIndex].rgb, cvolLocalLightSecondary[lightIndex], centerDistance);
                lighting += color*(attenuation*spotAttenuation*visibility*phase);
            }
            return lighting*cvolLocalParams.x;
        }

        // x=visibility, y=CSM coverage, z=selected cascade in [0,1]. The
        // outer cascade fades to Tesseract's sky-visibility volume rather than
        // to black or unconditionally lit fog.
        vec3 cvolDirectVisibility(vec3 position)
        {
            float fallbackVisibility = cvolSkyVisibility(position);
            int cascadeCount = int(cvolLighting.z + 0.5);
            if(cascadeCount <= 0) return vec3(fallbackVisibility, 0.0, 1.0);

            vec3 lightPosition = csmmatrix*position;
            float shadowz = csmz.x + lightPosition.z*csmz.y;
            float firstVisibility = fallbackVisibility, firstCoverage = 0.0, firstCascade = 1.0;
            bool found = false;
            for(int cascade = 0; cascade < 8; ++cascade)
            {
                if(cascade >= cascadeCount) break;
                vec2 tc = csmtc[cascade].xy + lightPosition.xy*csmtc[cascade].z;
                float edgeDistance = csmtc[cascade].w - max(abs(tc.x), abs(tc.y));
                if(edgeDistance <= 0.0) continue;
                float fadeWidth = max(csmtc[cascade].w*0.08, 1.0);
                float coverage = smoothstep(0.0, fadeWidth, edgeDistance);
                float visibility = clamp(cvolFilteredShadow(vec3(tc, shadowz) + csmoffset[cascade]), 0.0, 1.0);
                if(!found)
                {
                    firstVisibility = visibility;
                    firstCoverage = coverage;
                    firstCascade = float(cascade)/max(float(cascadeCount - 1), 1.0);
                    found = true;
                    if(coverage >= 0.999) return vec3(visibility, 1.0, firstCascade);
                }
                else
                {
                    float nextVisibility = mix(fallbackVisibility, visibility, coverage);
                    return vec3(mix(nextVisibility, firstVisibility, firstCoverage), max(firstCoverage, coverage), firstCascade);
                }
            }
            if(found) return vec3(mix(fallbackVisibility, firstVisibility, firstCoverage), firstCoverage, firstCascade);
            return vec3(fallbackVisibility, 0.0, 1.0);
        }

        vec3 cvolRadianceHints(vec3 position)
        {
            int splitCount = int(cvolLighting.w + 0.5);
            if(splitCount <= 0) return cvolambientcolor;
            for(int split = 0; split < 8; ++split)
            {
                if(split >= splitCount) break;
                vec3 tc = rhtc[split].xyz + position*rhtc[split].w;
                if(max(max(abs(tc.x), abs(tc.y)), abs(tc.z)) >= rhbounds) continue;
                tc.xy += 0.5;
                tc.z = tc.z/float(splitCount) + (float(split) + 0.5)/float(splitCount);
                vec4 shr = texture3D(tex3, tc), shg = texture3D(tex4, tc), shb = texture3D(tex5, tc);
                const float l0 = 0.886226*0.282095/CVOL_PI;
                return max(vec3(shr.a, shg.a, shb.a)*l0, vec3(0.0));
            }
            return cvolambientcolor;
        }

        void main(void)
        {
            vec2 fullPixel = clamp((gl_FragCoord.xy - vec2(0.5))*cvolLowSize.zw + vec2(0.5), vec2(0.5), cvolFullSize.xy - vec2(0.5));
            @(gdepthunpack sceneDepth [gfetch(tex0, fullPixel)] [
                vec3 scenePosition = (worldmatrix*vec4(sceneDepth*fullPixel, sceneDepth, 1.0)).xyz;
                float guideDepth = sceneDepth;
            ] [
                vec4 scenePosition4 = worldmatrix*vec4(fullPixel, sceneDepth, 1.0);
                vec3 scenePosition = scenePosition4.xyz/max(abs(scenePosition4.w), 1.0e-6);
                float guideDepth = gdepthscale.x/(sceneDepth*gdepthscale.y + gdepthscale.z);
            ])
            vec3 rayVector = scenePosition - camera;
            float sceneDistance = length(rayVector);
            vec3 direction = sceneDistance > 1.0e-5 ? rayVector/sceneDistance : vec3(0.0, 0.0, 1.0);
            float marchDistance = min(sceneDistance, cvolLayer.z);
            int stepCount = clamp(int(cvolLayer.w + 0.5), 4, 128);
            float stepSize = marchDistance/float(stepCount);
            float jitter = cvolHash(vec3(gl_FragCoord.xy, float(cvolFrame & 1023)));
            vec3 position = camera + direction*(jitter*stepSize);
            float phase = mix(cvolPhase(dot(direction, cvolSunDirection), 0.80),
                              cvolPhase(dot(direction, cvolSunDirection), 0.35), 0.35);
            float transmittance = 1.0;
            vec3 scattering = vec3(0.0);
            float densitySum = 0.0, visibilitySum = 0.0, cascadeSum = 0.0, activeSamples = 0.0;

            for(int stepIndex = 0; stepIndex < 128; ++stepIndex)
            {
                if(stepIndex >= stepCount || transmittance < 0.001) break;
                float density = cvolDensity(position);
                if(density > 1.0e-6)
                {
                    vec3 directVisibility = cvolDirectVisibility(position);
                    vec3 direct = cvolSunColor*(directVisibility.x*phase*cvolLighting.x) + cvolLocalLighting(position, direction);
                    vec3 indirect = cvolRadianceHints(position)*(cvolLighting.y/CVOL_PI);
                    float sigmaT = density*cvolMedium.y;
                    float sigmaS = sigmaT*cvolMedium.z;
                    float segmentTransmittance = exp(-sigmaT*stepSize);
                    float integrated = sigmaT > 1.0e-7 ? (1.0 - segmentTransmittance)/sigmaT : stepSize;
                    scattering += transmittance*(direct + indirect)*sigmaS*integrated;
                    transmittance *= segmentTransmittance;
                    densitySum += density;
                    visibilitySum += directVisibility.x;
                    cascadeSum += directVisibility.z;
                    activeSamples += 1.0;
                }
                position += direction*stepSize;
            }
            float invSamples = 1.0/max(activeSamples, 1.0);
            fragColor = vec4(max(scattering, vec3(0.0)), clamp(transmittance, 0.0, 1.0));
            fragDebug = vec4(densitySum*invSamples, visibilitySum*invSamples, cascadeSum*invSamples, guideDepth);
        }
    ]
]

cvolraymarchshader "cvolraymarchrect" 0 1
cvolraymarchshader "cvolraymarch2d" 0 0
cvolraymarchshader "cvolraymarchmsrect" 1 1
cvolraymarchshader "cvolraymarchms2d" 1 0

shader 0 "cvoltemporal" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0, tex1, tex2, tex3;
    uniform mat4 linearworldmatrix, cvolPreviousViewProjection, cvolPreviousWorldMatrix;
    uniform vec3 camera;
    uniform vec4 cvolLowSize, cvolTemporalParams;
    fragdata(0) vec4 fragColor;
    fragdata(1) float fragDepth;
    fragdata(2) vec4 fragValidity;

    void main(void)
    {
        vec2 pixel = gl_FragCoord.xy;
        vec4 current = texture2DRect(tex0, pixel);
        float currentDepth = texture2DRect(tex1, pixel).a;
        fragColor = current;
        fragDepth = currentDepth;
        fragValidity = vec4(0.0);
        if(cvolTemporalParams.x < 0.5) return;

        vec2 fullPixel = (pixel - vec2(0.5))*cvolLowSize.zw + vec2(0.5);
        vec3 worldPosition = (linearworldmatrix*vec4(currentDepth*fullPixel, currentDepth, 1.0)).xyz;
        // This is deliberately camera/world reprojection, not a fabricated
        // object motion vector. Moving geometry is accepted only when the
        // reprojected depth validation below still agrees.
        vec4 previousClip = cvolPreviousViewProjection*vec4(worldPosition, 1.0);
        if(previousClip.w <= 1.0e-6) return;
        vec2 previousUV = previousClip.xy/previousClip.w*0.5 + 0.5;
        if(any(notEqual(previousUV, clamp(previousUV, vec2(0.0), vec2(1.0))))) return;
        vec2 previousPixel = previousUV*cvolTemporalParams.zw;
        float previousDepth = texture2DRect(tex3, previousPixel).r;
        vec2 previousFullPixel = (previousPixel - vec2(0.5))*cvolLowSize.zw + vec2(0.5);
        vec3 previousWorldPosition =
            (cvolPreviousWorldMatrix*vec4(previousDepth*previousFullPixel, previousDepth, 1.0)).xyz;
        float tolerance = max(2.0, distance(worldPosition, camera)*0.02);
        if(distance(previousWorldPosition, worldPosition) > tolerance) return;

        vec4 history = texture2DRect(tex2, previousPixel);
        vec4 minimumValue = current, maximumValue = current;
        for(int y = -1; y <= 1; ++y) for(int x = -1; x <= 1; ++x)
        {
            vec4 sampleValue = texture2DRect(tex0, pixel + vec2(x, y));
            minimumValue = min(minimumValue, sampleValue);
            maximumValue = max(maximumValue, sampleValue);
        }
        history = clamp(history, minimumValue - vec4(0.02), maximumValue + vec4(0.02));
        float motion = length(previousPixel - pixel);
        float historyWeight = cvolTemporalParams.y*exp(-motion*0.08);
        fragColor = mix(current, history, clamp(historyWeight, 0.0, 0.95));
        fragValidity = vec4(vec3(1.0 - historyWeight), 1.0);
    }
]

shader 0 "cvolspatial" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0, tex1;
    uniform vec4 cvolFilterParams;
    fragdata(0) vec4 fragColor;
    void main(void)
    {
        vec2 pixel = gl_FragCoord.xy;
        vec4 center = texture2DRect(tex0, pixel), accumulated = center;
        float centerDepth = texture2DRect(tex1, pixel).a, totalWeight = 1.0;
        for(int y = -1; y <= 1; ++y) for(int x = -1; x <= 1; ++x)
        {
            if(x == 0 && y == 0) continue;
            vec2 samplePixel = clamp(pixel + vec2(x, y), vec2(0.5), cvolFilterParams.xy - vec2(0.5));
            vec4 sampleValue = texture2DRect(tex0, samplePixel);
            float sampleDepth = texture2DRect(tex1, samplePixel).a;
            float tolerance = max(2.0, max(abs(centerDepth), abs(sampleDepth))*cvolFilterParams.z);
            if(abs(sampleDepth - centerDepth) > tolerance) continue;
            float depthWeight = exp(-pow(abs(sampleDepth - centerDepth)/tolerance, 2.0)*cvolFilterParams.w);
            float radianceWeight = exp(-length(sampleValue.rgb - center.rgb)*2.0);
            float weight = depthWeight*radianceWeight;
            accumulated += sampleValue*weight;
            totalWeight += weight;
        }
        fragColor = accumulated/totalWeight;
    }
]

cvolcompositeshader = [
    local multisample
    multisample = $arg2
    shader 0 $arg1 [
        attribute vec4 vvertex;
        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        @(gfetchdefs tex0 $multisample)
        @(gfetchdefs tex1 $multisample cvolhdrfetch)
        uniform sampler2DRect tex2, tex3, tex4, tex5;
        uniform vec4 cvolCompositeScale, cvolCompositeParams;
        uniform int cvolDebug;
        fragdata(0) vec4 fragColor;

        vec3 cvolCascadeHeat(float value)
        {
            return value < 0.5 ? mix(vec3(0.0, 0.2, 1.0), vec3(0.0, 1.0, 0.1), value*2.0) :
                                 mix(vec3(0.0, 1.0, 0.1), vec3(1.0, 0.1, 0.0), (value - 0.5)*2.0);
        }

        vec4 cvolTruncate(vec4 volume, float distanceRatio)
        {
            float ratio = clamp(distanceRatio, 0.0, 1.0);
            float transmittance = clamp(volume.a, 1.0e-5, 1.0);
            float truncatedTransmittance = pow(transmittance, ratio);
            float opacity = 1.0 - transmittance;
            float scatteringRatio = opacity > 1.0e-5 ? (1.0 - truncatedTransmittance)/opacity : ratio;
            return vec4(volume.rgb*scatteringRatio, truncatedTransmittance);
        }

        vec4 cvolUpscale(vec2 pixel, float centerDepth)
        {
            vec2 source = pixel*cvolCompositeScale.zw - vec2(0.5);
            vec2 nearest = floor(source + vec2(0.5));
            if(cvolCompositeScale.z >= 0.999 && cvolCompositeScale.w >= 0.999)
            {
                vec2 samplePixel = clamp(nearest, vec2(0.0), cvolCompositeScale.xy - vec2(1.0)) + vec2(0.5);
                return texture2DRect(tex2, samplePixel);
            }

            vec4 bestValue = vec4(0.0);
            vec4 accumulated = vec4(0.0), truncated = vec4(0.0);
            float bestDifference = 1.0e20, totalWeight = 0.0;
            float truncatedWeight = 0.0;
            float tolerance = max(2.0, abs(centerDepth)*0.02);
            for(int y = -1; y <= 1; ++y) for(int x = -1; x <= 1; ++x)
            {
                vec2 offset = vec2(x, y);
                vec2 samplePixel = clamp(nearest + offset, vec2(0.0), cvolCompositeScale.xy - vec2(1.0)) + vec2(0.5);
                float sampleDepth = texture2DRect(tex4, samplePixel).a;
                float difference = abs(sampleDepth - centerDepth);
                vec4 sampleValue = texture2DRect(tex2, samplePixel);
                if(difference < bestDifference)
                {
                    bestDifference = difference;
                    bestValue = sampleValue;
                }
                float weight = exp(-dot(samplePixel - (source + vec2(0.5)), samplePixel - (source + vec2(0.5)))*0.5);
                if(difference <= tolerance)
                {
                    accumulated += sampleValue*weight;
                    totalWeight += weight;
                }
                else if(sampleDepth > centerDepth)
                {
                    float centerDistance = min(abs(centerDepth), cvolCompositeParams.x);
                    float sampleDistance = min(abs(sampleDepth), cvolCompositeParams.x);
                    float distanceRatio = centerDistance/max(sampleDistance, 1.0e-5);
                    truncated += cvolTruncate(sampleValue, distanceRatio)*weight;
                    truncatedWeight += weight;
                }
            }
            if(totalWeight > 1.0e-5)
            {
                vec4 matched = accumulated/totalWeight;
                if(truncatedWeight > 1.0e-5) matched = mix(truncated/truncatedWeight, matched, 0.75);
                return matched;
            }
            return truncatedWeight > 1.0e-5 ? truncated/truncatedWeight : bestValue;
        }

        void main(void)
        {
            vec2 pixel = gl_FragCoord.xy;
            @(gdepthunpack sceneDepth [gfetch(tex0, pixel)])
            vec4 volume = cvolUpscale(pixel, sceneDepth);
            vec4 scene = cvolhdrfetch(tex1, pixel);
            vec2 lowPixel = clamp(floor(pixel*cvolCompositeScale.zw) + vec2(0.5), vec2(0.5), cvolCompositeScale.xy - vec2(0.5));
            vec4 raw = texture2DRect(tex3, lowPixel), diagnostic = texture2DRect(tex4, lowPixel);
            vec4 validity = texture2DRect(tex5, lowPixel);
            vec3 result = scene.rgb*volume.a + volume.rgb;
            if(cvolDebug == 1) result = volume.rgb + vec3(1.0 - volume.a);
            else if(cvolDebug == 2) result = raw.rgb;
            else if(cvolDebug == 3) result = vec3(raw.a);
            else if(cvolDebug == 4) result = vec3(diagnostic.r*0.25);
            else if(cvolDebug == 5) result = vec3(diagnostic.g);
            else if(cvolDebug == 6) result = cvolCascadeHeat(diagnostic.b);
            else if(cvolDebug == 7) result = vec3(validity.r);
            fragColor = vec4(max(result, vec3(0.0)), scene.a);
        }
    ]
]

cvolcompositeshader "cvolcomposite" 0
cvolcompositeshader "cvolcompositems" 1

shader 0 "cvolcopy" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    fragdata(0) vec4 fragColor;
    void main(void)
    {
        fragColor = texture2DRect(tex0, gl_FragCoord.xy);
    }
]
