lazyshader 0 msaaresolve [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DMS tex0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = texelFetch(tex0, ivec2(gl_FragCoord.xy), 0);
    }
]

lazyshader 0 msaaresolvedepth [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DMS tex0;
    @(if $gdepthformat [result [
        @(gdepthunpackparams)
        uniform vec2 gdepthinvscale;
        fragdata(0) vec4 fragcolor;
    ]])
    void main(void)
    {
        @(if $gdepthformat [result [
            vec4 packdepth = texelFetch(tex0, ivec2(gl_FragCoord.xy), 0);
            @(gdepthunpack depth packdepth)
            fragcolor = packdepth;
            gl_FragDepth = gdepthinvscale.x/depth - gdepthinvscale.y;
        ]] [result [
            gl_FragDepth = texelFetch(tex0, ivec2(gl_FragCoord.xy), 0).r;
        ]])
    }
]

lumweights = "0.2126, 0.7152, 0.0722"

hdrgammadecode = [
    if (=f $hdrgamma 2) [result [
        @arg1 *= @arg1;
    ]] [result [
        @arg1 = pow(@arg1, vec3(hdrgamma.x));
    ]]
]

hdrgammaencode = [
    if (=f $hdrgamma 2) [result [
        @arg1 = sqrt(@arg1);
    ]] [result [
        @arg1 = pow(@arg1, vec3(hdrgamma.y));
    ]]
]

postvertex = [
    result [
        attribute vec4 vvertex;
        @(screentexcoord 0)
        @(screentexcoord 1)
        varying vec2 texcoord0, texcoord1;
        void main(void)
        {
            gl_Position = vvertex;
            texcoord0 = vtexcoord0;
            texcoord1 = vtexcoord1;
        }
    ]
]

shader 0 "bloommask" (postvertex) [
    uniform sampler2DRect tex0;
    uniform vec4 bloomParams;
    uniform vec2 hdrgamma;
    varying vec2 texcoord0, texcoord1;
    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec3 color = max(texture2DRect(tex0, texcoord0).rgb*2.0, vec3(0.0));
        @(hdrgammadecode color)
        float brightness = max(max(color.r, color.g), color.b);
        float knee = max(bloomParams.x*bloomParams.y, 1e-5);
        float soft = clamp(brightness - bloomParams.x + knee, 0.0, 2.0*knee);
        soft = soft*soft/(4.0*knee + 1e-5);
        float contribution = max(brightness - bloomParams.x, soft)/max(brightness, 1e-5);
        fragcolor = vec4(color*contribution, 1.0);
    }
]

shader 0 "bloomblur" (postvertex) [
    uniform sampler2DRect tex0;
    uniform vec4 blurParams;
    varying vec2 texcoord0, texcoord1;
    fragdata(0) vec4 fragcolor;

    const float GaussianWeightsWide[17] = float[17](0.000014, 0.000137, 0.000971, 0.005086, 0.019711, 0.056512, 0.119895, 0.188264,
                                                     0.218818, 0.188264, 0.119895, 0.056512, 0.019711, 0.005086, 0.000971, 0.000137,
                                                     0.000014);
    const float GaussianWeightsSmall[11] = float[11](0.000003, 0.000229, 0.005977, 0.060598, 0.241730, 0.382925, 0.241730, 0.060598,
                                                      0.005977, 0.000229, 0.000003);

    void main(void)
    {
        vec2 direction = blurParams.x > 0.5 ? vec2(blurParams.z, 0.0) : vec2(0.0, 1.0);
        vec2 dimensions = vec2(textureSize(tex0));
        vec3 total = vec3(0.0);
        float totalweight = 0.0;
        if(blurParams.y > 0.5)
        {
            for(int i = -8; i <= 8; ++i)
            {
                vec2 samplecoord = texcoord0 + float(i)*direction;
                if(samplecoord.x <= 0.001 || samplecoord.y <= 0.001 || samplecoord.x >= dimensions.x - 0.001 ||
                   samplecoord.y >= dimensions.y - 0.001) continue;
                total += texture2DRect(tex0, samplecoord).rgb*GaussianWeightsWide[i + 8];
                totalweight += GaussianWeightsWide[i + 8];
            }
        }
        else
        {
            for(int i = -5; i <= 5; ++i)
            {
                vec2 samplecoord = texcoord0 + float(i)*direction;
                if(samplecoord.x <= 0.001 || samplecoord.y <= 0.001 || samplecoord.x >= dimensions.x - 0.001 ||
                   samplecoord.y >= dimensions.y - 0.001) continue;
                total += texture2DRect(tex0, samplecoord).rgb*GaussianWeightsSmall[i + 5];
                totalweight += GaussianWeightsSmall[i + 5];
            }
        }
        fragcolor = vec4(total/max(totalweight, 0.01), 1.0);
    }
]

shader 0 "combine" (postvertex) [
    uniform sampler2DRect tex0, tex1, tex2, tex3, tex4, tex5, tex6;
    uniform vec4 combineParams, bloomSize0, bloomSize1, bloomSize2;
    uniform vec2 hdrgamma;
    varying vec2 texcoord0, texcoord1;
    fragdata(0) vec4 fragcolor;

    vec3 samplebloom(sampler2DRect image, vec2 size)
    {
        vec2 uv = gl_FragCoord.xy/combineParams.zw;
        return texture2DRect(image, uv*size).rgb;
    }

    void main(void)
    {
        vec3 scene = max(texture2DRect(tex0, texcoord0).rgb*2.0, vec3(0.0));
        @(hdrgammadecode scene)
        vec3 bright = vec3(0.0), bloom0 = vec3(0.0), bloom1 = vec3(0.0), bloom2 = vec3(0.0), bloom3 = vec3(0.0), bloom4 = vec3(0.0);
        int debugmode = int(combineParams.y + 0.5);
        if(combineParams.x > 0.0 || debugmode >= 2)
        {
            bright = samplebloom(tex1, bloomSize0.xy);
            bloom0 = samplebloom(tex2, bloomSize0.zw);
            bloom1 = samplebloom(tex3, bloomSize1.xy);
            bloom2 = samplebloom(tex4, bloomSize1.zw);
            bloom3 = samplebloom(tex5, bloomSize2.xy);
            bloom4 = samplebloom(tex6, bloomSize2.zw);
        }
        vec3 bloom = bright*10.2 + pow(max(bloom0, vec3(0.0)), vec3(1.0/1.1))*7.5 +
                     pow(max(bloom1, vec3(0.0)), vec3(1.0/1.1))*6.95 + pow(max(bloom2, vec3(0.0)), vec3(1.0/1.05))*6.9 +
                     pow(max(bloom3, vec3(0.0)), vec3(1.0/1.05))*6.8 + pow(max(bloom4, vec3(0.0)), vec3(1.0/1.05))*6.75;
        bloom *= 0.8/(10.2 + 7.5 + 6.95 + 6.9 + 6.8 + 6.75);
        vec3 result = scene + bloom*combineParams.x;
        if(debugmode == 1) result = scene;
        else if(debugmode == 2) result = bright;
        else if(debugmode == 3) result = bloom0;
        else if(debugmode == 4) result = bloom1;
        else if(debugmode == 5) result = bloom2;
        else if(debugmode == 6) result = bloom3;
        else if(debugmode == 7) result = bloom4;
        else if(debugmode == 8) result = bloom;
        fragcolor = vec4(max(result, vec3(0.0)), 1.0);
    }
]

tonemapshaders = [
    shader 0 [tonemap@arg1] (postvertex) [
        uniform sampler2DRect tex0;
        uniform sampler3D tex2;
        uniform vec4 toneParams;
        varying vec2 texcoord0, texcoord1;
        @arg2

        mat3 ACESInputMat = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
        mat3 ACESOutputMat = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);

        vec3 RRTAndODTFit(vec3 v)
        {
            vec3 a = v*(v + 0.0245786) - 0.000090537;
            vec3 b = v*(0.983729*v + 0.4329510) + 0.238081;
            return a/b;
        }

        vec3 ACESFitted(vec3 color) { return ACESOutputMat*RRTAndODTFit(ACESInputMat*color); }
        vec3 ACESFilmic(vec3 color) { return pow(clamp(ACESFitted(color), 0.0, 1.0), vec3(1.0/2.2)); }
        vec3 TonyMcMapface(vec3 color)
        {
            vec3 encoded = color/(color + 1.0);
            return texture3D(tex2, encoded*(47.0/48.0) + 0.5/48.0).rgb;
        }
        float LottesF(float x)
        {
            const float a = 1.6, d = 0.977, hdrmax = 8.0, midin = 0.18, midout = 0.267;
            float b = (-pow(midin, a) + pow(hdrmax, a)*midout)/((pow(hdrmax, a*d) - pow(midin, a*d))*midout);
            float c = (pow(hdrmax, a*d)*pow(midin, a) - pow(hdrmax, a)*pow(midin, a*d)*midout)/
                      ((pow(hdrmax, a*d) - pow(midin, a*d))*midout);
            return pow(x, a)/(pow(x, a*d)*b + c);
        }
        vec3 Lottes(vec3 color) { return vec3(LottesF(color.r), LottesF(color.g), LottesF(color.b)); }
        vec3 HejlBurgess(vec3 color)
        {
            vec3 maxima = max(vec3(0.0), color - 0.004);
            return maxima*(6.2*maxima + 0.05)/(maxima*(6.2*maxima + 2.3) + 0.06);
        }
        vec3 RomBinDaHouse(vec3 color) { return exp(-1.0/(2.72*color + 0.15)); }
        vec3 Uncharted2(vec3 color)
        {
            const float A = 0.15, B = 0.50, C = 0.10, D = 0.20, E = 0.02, F = 0.30, W = 11.2;
            color *= 2.0;
            color = ((color*(A*color + C*B) + D*E)/(color*(A*color + B) + D*F)) - E/F;
            float white = ((W*(A*W + C*B) + D*E)/(W*(A*W + B) + D*F)) - E/F;
            return color/white;
        }
        vec3 LinearToSRGB(vec3 color)
        {
            vec3 low = color*12.92;
            vec3 high = 1.055*pow(max(color, vec3(0.0)), vec3(1.0/2.4)) - 0.055;
            return mix(low, high, step(vec3(0.0031308), color));
        }

        vec4 tonemapresult()
        {
            vec3 color = max(texture2DRect(tex0, texcoord0).rgb, vec3(0.0))*(0.825*toneParams.x);
            int selected = int(toneParams.y + 0.5);
            if(selected == 0) color = ACESFitted(color);
            else if(selected == 1 && toneParams.z > 0.5) color = TonyMcMapface(color);
            else if(selected == 2) color = ACESFilmic(color);
            else if(selected == 3) color = Lottes(color);
            else if(selected == 4) color = HejlBurgess(color);
            else if(selected == 5) color = RomBinDaHouse(color);
            else if(selected == 6) color = Uncharted2(color);
            if(selected != 2) color = LinearToSRGB(max(color, vec3(0.0)));
            return vec4(clamp(color, 0.0, 1.0), 0.0);
        }

        void main(void)
        {
            vec4 result = tonemapresult();
            @arg3
            @arg4
        }
    ]
]

tonemapshaders "" [fragdata(0) vec4 fragcolor;] [] [fragcolor = result;]
tonemapshaders "luma" [fragdata(0) vec4 fragcolor;] [result.a = dot(result.rgb, vec3(@lumweights));] [fragcolor = result;]
tonemapshaders "masked" (if (= $gdepthformat 1) [result [
    fragdata(0) vec4 fragcolor;
    @(gfetchdefs tex3)
]] [result [
    fragdata(0) vec4 fragcolor;
    @(gfetchdefs tex4 $msaasamples)
]]) (if (= $gdepthformat 1) [result [
    result.a = gfetch(tex3, texcoord0).a;
]] [result [
    result.a = step(0.75, gfetch(tex4, texcoord0).a);
]]) [fragcolor = result;]

if (= $msaasamples 2) [
    tonemapshaders "split" [
        fragdata(0) vec4 fragcolor0;
        fragdata(1) vec4 fragcolor1;
    ] [] [fragcolor0 = result; fragcolor1 = result;]
    tonemapshaders "splitluma" [fragdata(0) vec4 fragcolor0; fragdata(1) vec4 fragcolor1;]
        [result.a = dot(result.rgb, vec3(@lumweights));] [fragcolor0 = result; fragcolor1 = result;]
    tonemapshaders "splitmasked" [
        fragdata(0) vec4 fragcolor0;
        fragdata(1) vec4 fragcolor1;
        @(gfetchdefs tex4 $msaasamples)
    ] [result.a = step(0.75, gfetch(tex4, texcoord0).a);] [fragcolor0 = result; fragcolor1 = result;]
]
