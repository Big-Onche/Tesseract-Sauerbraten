// world BVH traversal. The std430 declarations mirror renderer/bvh.cpp.
bvhtraversal = [
    const uint BVH_LEAF_BIT = 0x80000000u;
    const uint BVH_BLEND = 1u;
    const uint BVH_ALPHA_BACK = 2u;
    const uint BVH_ALPHA_FRONT = 4u;
    const uint BVH_REFRACT = 8u;
    const uint BVH_DOUBLE_SIDED = 16u;
    const int BVH_STACK_SIZE = 64;

    struct BVHNode
    {
        vec3 bmin;
        uint data0;
        vec3 bmax;
        uint data1;
    };

    struct BVHTriangle
    {
        vec4 a;
        vec4 edge1;
        vec4 edge2;
    };

    struct BVHTriangleUV
    {
        vec2 a;
        vec2 b;
        vec2 c;
    };

    struct BVHBlas
    {
        vec3 bmin;
        uint root;
        vec3 bmax;
        uint triangleOffset;
        uint triangleCount;
        uint triangleUVOffset;
        uint triangleUVCount;
        uint reserved;
    };

    struct BVHMaterial
    {
        uvec2 diffuseHandle;
        uvec2 glowHandle;
        vec3 albedo;
        float roughness;
        vec3 emission;
        float specular;
    };

    layout(std430, binding = 8) readonly buffer BVHNodeBuffer { BVHNode bvhNodes[]; };
    layout(std430, binding = 9) readonly buffer BVHTriangleBuffer { BVHTriangle bvhTriangles[]; };
    layout(std430, binding = 10) readonly buffer BVHTriangleUVBuffer { BVHTriangleUV bvhTriangleUVs[]; };
    layout(std430, binding = 11) readonly buffer BVHBlasBuffer { BVHBlas bvhBlases[]; };
    layout(std430, binding = 12) readonly buffer BVHInstanceBuffer { uint bvhInstances[]; };
    layout(std430, binding = 13) readonly buffer BVHMaterialBuffer { BVHMaterial bvhMaterials[]; };

    struct BVHRay
    {
        vec3 origin;
        vec3 direction;
        vec3 inverseDirection;
        float minimumDistance;
        float maximumDistance;
    };

    struct BVHHit
    {
        float distance;
        vec2 barycentric;
        uint triangle;
        uint surface;
        uint flags;
        uint blas;
        uint traversalCount;
        uint valid;
    };

    BVHRay bvhMakeRay(vec3 origin, vec3 direction, float minimumDistance, float maximumDistance)
    {
        BVHRay ray;
        ray.origin = origin;
        ray.direction = normalize(direction);
        vec3 directionSign = mix(vec3(-1.0), vec3(1.0), greaterThanEqual(ray.direction, vec3(0.0)));
        ray.inverseDirection = directionSign/max(abs(ray.direction), vec3(1e-8));
        ray.minimumDistance = minimumDistance;
        ray.maximumDistance = maximumDistance;
        return ray;
    }

    bool bvhIntersectBounds(BVHRay ray, vec3 bmin, vec3 bmax, float maximumDistance, out float nearDistance)
    {
        vec3 t0 = (bmin - ray.origin)*ray.inverseDirection;
        vec3 t1 = (bmax - ray.origin)*ray.inverseDirection;
        vec3 tmin = min(t0, t1), tmax = max(t0, t1);
        nearDistance = max(max(tmin.x, tmin.y), max(tmin.z, ray.minimumDistance));
        float farDistance = min(min(tmax.x, tmax.y), min(tmax.z, maximumDistance));
        return nearDistance <= farDistance;
    }

    bool bvhIntersectTriangle(BVHRay ray, BVHTriangle triangle, float maximumDistance, out float distance, out vec2 barycentric)
    {
        vec3 p = cross(ray.direction, triangle.edge2.xyz);
        float determinant = dot(triangle.edge1.xyz, p);
        if((floatBitsToUint(triangle.edge1.w)&BVH_DOUBLE_SIDED) != 0u)
        {
            if(abs(determinant) <= 1e-8) return false;
        }
        else if(determinant <= 1e-8) return false;
        float inverseDeterminant = 1.0/determinant;
        vec3 t = ray.origin - triangle.a.xyz;
        float u = dot(t, p)*inverseDeterminant;
        if(u < 0.0 || u > 1.0) return false;
        vec3 q = cross(t, triangle.edge1.xyz);
        float v = dot(ray.direction, q)*inverseDeterminant;
        if(v < 0.0 || u + v > 1.0) return false;
        distance = dot(triangle.edge2.xyz, q)*inverseDeterminant;
        barycentric = vec2(u, v);
        return distance >= ray.minimumDistance && distance <= maximumDistance;
    }

    bool bvhTraverseBLAS(BVHRay ray, uint blasIndex, bool anyHit, inout BVHHit hit)
    {
        uint stack[BVH_STACK_SIZE];
        int stackSize = 0;
        stack[stackSize++] = bvhBlases[blasIndex].root;
        bool found = false;
        while(stackSize > 0)
        {
            uint nodeIndex = stack[--stackSize];
            BVHNode node = bvhNodes[nodeIndex];
            hit.traversalCount++;
            float nodeNear;
            if(!bvhIntersectBounds(ray, node.bmin, node.bmax, hit.distance, nodeNear)) continue;
            if((node.data0&BVH_LEAF_BIT) != 0u)
            {
                uint first = node.data0&~BVH_LEAF_BIT;
                for(uint i = 0u; i < node.data1; ++i)
                {
                    BVHTriangle triangle = bvhTriangles[first + i];
                    float distance;
                    vec2 barycentric;
                    if(!bvhIntersectTriangle(ray, triangle, hit.distance, distance, barycentric)) continue;
                    hit.distance = distance;
                    hit.barycentric = barycentric;
                    hit.triangle = first + i;
                    hit.surface = floatBitsToUint(triangle.a.w);
                    hit.flags = floatBitsToUint(triangle.edge1.w);
                    hit.blas = blasIndex;
                    found = true;
                    if(anyHit) return true;
                }
                continue;
            }
            float leftNear, rightNear;
            BVHNode left = bvhNodes[node.data0], right = bvhNodes[node.data1];
            bool hitLeft = bvhIntersectBounds(ray, left.bmin, left.bmax, hit.distance, leftNear);
            bool hitRight = bvhIntersectBounds(ray, right.bmin, right.bmax, hit.distance, rightNear);
            if(hitLeft && hitRight)
            {
                if(stackSize + 2 > BVH_STACK_SIZE) { hit.valid = 0u; return found; }
                if(leftNear < rightNear) { stack[stackSize++] = node.data1; stack[stackSize++] = node.data0; }
                else { stack[stackSize++] = node.data0; stack[stackSize++] = node.data1; }
            }
            else if(hitLeft && stackSize < BVH_STACK_SIZE) stack[stackSize++] = node.data0;
            else if(hitRight && stackSize < BVH_STACK_SIZE) stack[stackSize++] = node.data1;
            else if(hitLeft || hitRight)
            {
                hit.valid = 0u;
                return found;
            }
        }
        return found;
    }

    bool bvhTraverse(BVHRay ray, bool anyHit, uint root, out BVHHit hit)
    {
        hit.distance = ray.maximumDistance;
        hit.barycentric = vec2(0.0);
        hit.triangle = hit.surface = hit.flags = hit.blas = hit.traversalCount = 0u;
        hit.valid = 1u;
        uint stack[BVH_STACK_SIZE];
        int stackSize = 0;
        stack[stackSize++] = root;
        bool found = false;
        while(stackSize > 0)
        {
            uint nodeIndex = stack[--stackSize];
            BVHNode node = bvhNodes[nodeIndex];
            hit.traversalCount++;
            float nodeNear;
            if(!bvhIntersectBounds(ray, node.bmin, node.bmax, hit.distance, nodeNear)) continue;
            if((node.data0&BVH_LEAF_BIT) != 0u)
            {
                uint first = node.data0&~BVH_LEAF_BIT;
                for(uint i = 0u; i < node.data1; ++i)
                {
                    if(bvhTraverseBLAS(ray, bvhInstances[first + i], anyHit, hit))
                    {
                        found = true;
                        if(anyHit) return true;
                    }
                    if(hit.valid == 0u) return found;
                }
                continue;
            }
            float leftNear, rightNear;
            BVHNode left = bvhNodes[node.data0], right = bvhNodes[node.data1];
            bool hitLeft = bvhIntersectBounds(ray, left.bmin, left.bmax, hit.distance, leftNear);
            bool hitRight = bvhIntersectBounds(ray, right.bmin, right.bmax, hit.distance, rightNear);
            if(hitLeft && hitRight)
            {
                if(stackSize + 2 > BVH_STACK_SIZE) { hit.valid = 0u; return found; }
                if(leftNear < rightNear) { stack[stackSize++] = node.data1; stack[stackSize++] = node.data0; }
                else { stack[stackSize++] = node.data0; stack[stackSize++] = node.data1; }
            }
            else if(hitLeft && stackSize < BVH_STACK_SIZE) stack[stackSize++] = node.data0;
            else if(hitRight && stackSize < BVH_STACK_SIZE) stack[stackSize++] = node.data1;
            else if(hitLeft || hitRight)
            {
                hit.valid = 0u;
                return found;
            }
        }
        return found;
    }

    bool bvhClosestHit(BVHRay ray, uint root, out BVHHit hit) { return bvhTraverse(ray, false, root, hit); }
    bool bvhAnyHit(BVHRay ray, uint root) { BVHHit hit; return bvhTraverse(ray, true, root, hit); }
    vec3 bvhHitPosition(BVHRay ray, BVHHit hit) { return ray.origin + ray.direction*hit.distance; }

    vec3 bvhGeometricNormal(BVHHit hit)
    {
        BVHTriangle triangle = bvhTriangles[hit.triangle];
        return normalize(cross(triangle.edge1.xyz, triangle.edge2.xyz));
    }

    vec2 bvhTextureCoordinate(BVHHit hit)
    {
        BVHTriangleUV triangleUV = bvhTriangleUVs[hit.triangle];
        return triangleUV.a*(1.0 - hit.barycentric.x - hit.barycentric.y) + triangleUV.b*hit.barycentric.x +
               triangleUV.c*hit.barycentric.y;
    }
]

lazyshader 0 "bvhdebug" [
    attribute vec4 vvertex;
    void main(void) { gl_Position = vvertex; }
] [
    @bvhtraversal
    uniform mat4 bvhInvViewProj;
    uniform vec4 bvhParams;
    uniform vec4 bvhViewport;
    uniform vec3 camera;
    fragdata(0) vec4 fragcolor;

    vec3 bvhHash(uint value)
    {
        uvec3 hash = uvec3(value)*uvec3(1597334677u, 3812015801u, 95828271u);
        hash = (hash^(hash >> 16u))*2246822519u;
        return vec3(hash&255u)/255.0;
    }

    void main(void)
    {
        vec2 ndc = gl_FragCoord.xy*bvhViewport.zw*2.0 - 1.0;
        vec4 world = bvhInvViewProj*vec4(ndc, 1.0, 1.0);
        world.xyz /= world.w;
        BVHRay ray = bvhMakeRay(camera, world.xyz - camera, bvhParams.y, bvhParams.z);
        BVHHit hit;
        bool found = bvhClosestHit(ray, uint(bvhParams.w), hit);
        int mode = int(bvhParams.x);
        vec3 color = found ? vec3(0.1, 0.8, 0.2) : vec3(0.35, 0.04, 0.05);
        if(found && mode == 2) color = bvhGeometricNormal(hit)*0.5 + 0.5;
        else if(found && mode == 3) color = vec3(1.0 - exp(-hit.distance/max(bvhParams.z*0.1, 1.0)));
        else if(found && mode == 4) color = bvhHash(hit.triangle);
        else if(found && mode == 5) color = bvhHash(hit.surface);
        else if(mode == 6)
        {
            float traversalHeat = clamp(float(hit.traversalCount)/128.0, 0.0, 1.0);
            color = vec3(traversalHeat, 0.1, 1.0 - traversalHeat);
        }
        else if(found && mode == 7) color = bvhHash(hit.blas);
        fragcolor = vec4(color, 1.0);
    }
]
