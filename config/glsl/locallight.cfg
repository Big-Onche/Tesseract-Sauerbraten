// Shared by surface and volumetric lighting; distances use light-range units.
locallightfunctions = [result [
    // Closest point on a continuous emitter, in light-radius units.
    vec3 emitterclosest(vec3 d, vec4 shape, vec3 x, vec3 y)
    {
        vec3 offset = vec3(0.0);
        if(shape.x == 2.0 || shape.x == 4.0)
        {
            vec2 q = -vec2(dot(d, x), dot(d, y));
            if(shape.x == 2.0) q *= min(1.0, shape.y/max(length(q), 1e-6));
            else q = clamp(q, -shape.zw, shape.zw);
            offset = x*q.x + y*q.y;
        }
        if(shape.x == 3.0) offset = x*clamp(-dot(d, x), -shape.z, shape.z);
        vec3 delta = d + offset;
        if(shape.x < 2.0 || shape.x == 3.0) delta *= max(1e-4, 1.0 - shape.y/max(length(delta), 1e-6));
        return delta;
    }

    float attenuatelocal(float emitterdist2, float centerdist, vec4 parameters)
    {
        if(parameters.w < 0.5)
            return clamp(min(1.0 - sqrt(max(emitterdist2, 0.0)), 4.0*(1.0-centerdist)), 0.0, 1.0);
        // A finite emitter core transitioning to 1/d^exponent. The core is normalized to one.
        float core2 = max(parameters.y*parameters.y, 1e-12);
        float attenuation = pow(core2/(max(emitterdist2, 0.0)+core2), 0.5*parameters.x);
        float edge = max(parameters.z, 0.001);
        float fade = clamp((1.0-centerdist)/edge, 0.0, 1.0);
        return attenuation*fade*fade*(3.0-2.0*fade);
    }
]]
