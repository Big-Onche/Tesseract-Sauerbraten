// shadow map filters, arg1 enables color sampling

smfiltercolor = [result [
    #define filtercolorshadow(tex, tc) texture2DRect(tex, tc.xy @(if $numargs [result [* @arg1]])).rgb
]]

smfilterg5 = [result [
    @(? (> $usetexgather 1) [
        #define shadowgather(center, xoff, yoff) textureGatherOffset(tex4, center, shadowtc.z, ivec2(xoff, yoff))
    ] [
        #define shadowgather(center, xoff, yoff) step(shadowtc.z, textureGatherOffset(tex4, center, ivec2(xoff, yoff)))
    ])
    float filtershadow(vec3 shadowtc)
    {
        vec2 offset = fract(shadowtc.xy - 0.5);
        vec2 center = (shadowtc.xy - offset) * shadowatlasscale;
        vec4 group1 = shadowgather(center, -2, -2);
        vec4 group2 = shadowgather(center,  0, -2);
        vec4 group3 = shadowgather(center,  2, -2);
        vec4 group4 = shadowgather(center, -2,  0);
        vec4 group5 = shadowgather(center,  0,  0);
        vec4 group6 = shadowgather(center,  2,  0);
        vec4 group7 = shadowgather(center, -2,  2);
        vec4 group8 = shadowgather(center,  0,  2);
        vec4 group9 = shadowgather(center,  2,  2);
        vec4 locols = vec4(group1.ab, group3.ab);
        vec4 hicols = vec4(group7.rg, group9.rg);
        locols.yz += group2.ab;
        hicols.yz += group8.rg;
        vec4 midcols = vec4(group1.rg, group3.rg) + vec4(group7.ab, group9.ab) +
                       vec4(group4.rg, group6.rg) + vec4(group4.ab, group6.ab) +
                       mix(locols, hicols, offset.y);
        vec4 cols = group5 + vec4(group2.rg, group8.ab);
        cols.xyz += mix(midcols.xyz, midcols.yzw, offset.x);
        return dot(cols, vec4(1.0/25.0));
    }
    @(if $arg1 [smfiltercolor 0.5])
]]

smfilterg3 = [result [
    @(? (> $usetexgather 1) [
        #define shadowgather(center, xoff, yoff) textureGatherOffset(tex4, center, shadowtc.z, ivec2(xoff, yoff))
    ] [
        #define shadowgather(center, xoff, yoff) step(shadowtc.z, textureGatherOffset(tex4, center, ivec2(xoff, yoff)))
    ])
    float filtershadow(vec3 shadowtc)
    {
        vec2 offset = fract(shadowtc.xy - 0.5);
        vec2 center = (shadowtc.xy - offset) * shadowatlasscale;
        vec4 group1 = shadowgather(center, -1, -1);
        vec4 group2 = shadowgather(center,  1, -1);
        vec4 group3 = shadowgather(center, -1,  1);
        vec4 group4 = shadowgather(center,  1,  1);
        vec4 cols = vec4(group1.rg, group2.rg) + vec4(group3.ab, group4.ab) + mix(vec4(group1.ab, group2.ab), vec4(group3.rg, group4.rg), offset.y);
        return dot(mix(cols.xyz, cols.yzw, offset.x), vec3(1.0/9.0));
    }
    @(if $arg1 [smfiltercolor 0.5])
]]

smfilterb5 = [result [
    #define shadowval(xy, xoff, yoff) float(shadow2DRect(tex4, vec3(xy + vec2(xoff, yoff), shadowtc.z)))
    float filtershadow(vec3 shadowtc)
    {
        vec2 offset = fract(shadowtc.xy - 0.5);
        vec4 center = vec4(shadowtc.xy - offset + 0.5, shadowtc.xy - offset*0.5);
        vec4 size = vec4(offset + 1.0, 2.0 - offset);
        return (1.0/25.0)*dot(size.zxzx*size.wwyy,
                vec4(shadowval(center.zw, -1.5, -1.5),
                     shadowval(center.zw, 2.0, -1.5),
                     shadowval(center.zw, -1.5, 2.0),
                     shadowval(center.zw, 2.0, 2.0))) +
               (2.0/25.0)*dot(size,
                vec4(shadowval(center.zy, 2.0, 0.0),
                     shadowval(center.xw, 0.0, 2.0),
                     shadowval(center.zy, -1.5, 0.0),
                     shadowval(center.xw, 0.0, -1.5))) +
               (4.0/25.0)*shadowval(center.xy, 0.0, 0.0);
    }
    @(if $arg1 [smfiltercolor 0.5])
]]

smfilterb3 = [result [
    #define shadowval(center, xoff, yoff) float(shadow2DRect(tex4, center + vec3(xoff, yoff, 0.0)))
    float filtershadow(vec3 shadowtc)
    {
        vec2 offset = fract(shadowtc.xy - 0.5);
        vec3 center = shadowtc;
        //center.xy -= offset;
        //vec4 size = vec4(offset + 1.0, 2.0 - offset), weight = vec4(2.0 - 1.0 / size.xy, 1.0 / size.zw - 1.0);
        //return (1.0/9.0)*dot(size.zxzx*size.wwyy,
        //    vec4(shadowval(center, weight.zw),
        //         shadowval(center, weight.xw),
        //         shadowval(center, weight.zy),
        //         shadowval(center, weight.xy)));
        center.xy -= offset*0.5;
        vec4 size = vec4(offset + 1.0, 2.0 - offset);
        return (1.0/9.0)*dot(size.zxzx*size.wwyy,
            vec4(shadowval(center, -0.5, -0.5),
                 shadowval(center, 1.0, -0.5),
                 shadowval(center, -0.5, 1.0),
                 shadowval(center, 1.0, 1.0)));
    }
    @(if $arg1 [smfiltercolor 0.5])
]]

smfilterrg = [result [
    #define shadowval(center, xoff, yoff) float(shadow2DRect(tex4, center + vec3(xoff, yoff, 0.0)))
    float filtershadow(vec3 shadowtc)
    {
        return dot(vec4(0.25),
                   vec4(shadowval(shadowtc, -0.4, 1.0),
                        shadowval(shadowtc, -1.0, -0.4),
                        shadowval(shadowtc, 0.4, -1.0),
                        shadowval(shadowtc, 1.0, 0.4)));
    }
    @(if $arg1 [smfiltercolor 0.5])
]]

smfilternone = [result [
    float filtershadow(vec3 shadowtc)
    {
        return float(shadow2DRect(tex4, shadowtc));
    }
    @(if $arg1 [smfiltercolor])
]]

lazyshader 0 "smalphaclear" [
    attribute vec4 vvertex;
    uniform vec2 shadowatlasscale;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy * shadowatlasscale * 2.0 - 1.0, 0.0, 1.0);
    }
] [
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = vec4(1.0);
    }
]

loop i 2 [
  lazyshader 0 (? $i "smalphablur2d" "smalphablurrect") [
    attribute vec4 vvertex;
    attribute vec4 vtexcoord0;
    uniform vec2 shadowatlasscale;
    flat varying vec4 smbounds;
    varying vec4 texcoord0;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy * shadowatlasscale * 2.0 - 1.0, 0.0, 1.0);
        smbounds = (vtexcoord0 + vec4(0.5, 0.5, -0.5, -0.5)) @(? $i [* shadowatlasscale.xyxy]);
        texcoord0 = (vvertex.xyxy + vec4(-1.0, -1.0, 1.0, 1.0)) @(? $i [* shadowatlasscale.xyxy]);
    }
  ] [
    @(? $i [
        uniform sampler2D tex0;
        #define texval(tc) texture2D(tex0, tc)
    ] [
        uniform sampler2DRect tex0;
        #define texval(tc) texture2DRect(tex0, tc)
    ])
    flat varying vec4 smbounds;
    varying vec4 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 tc = vec4(max(texcoord0.xy, smbounds.xy), min(texcoord0.zw, smbounds.zw));
        fragcolor = 0.25 * (texval(tc.xy) + texval(tc.zy) + texval(tc.xw) + texval(tc.zw));
    }
  ]
]

// Optional directional-light PCSS. Distances/radii are world units; tc is atlas pixels.
smpcss = [result [
    uniform vec4 csmpcssparams;
    uniform vec3 csmpcssdistance;
    uniform vec2 csmpcsscounts;
    uniform vec4 csmpcsseclipse;
    @(? (|| (dlopt "g") (dlopt "G")) [
        uniform sampler2D tex13;
        #define pcssdepth(tc) texture2D(tex13, (tc)*shadowatlasscale).r
    ] [
        uniform sampler2DRect tex13;
        #define pcssdepth(tc) texture2DRect(tex13, tc).r
    ])

    float pcsscompare(vec3 tc)
    {
        @(? (|| (dlopt "g") (dlopt "G")) [
            @(? (> $usetexgather 1) [
                return float(shadow2D(tex4, vec3(tc.xy*shadowatlasscale, tc.z)));
            ] [
                vec2 f = fract(tc.xy - 0.5);
                vec4 depths = textureGather(tex4, tc.xy*shadowatlasscale);
                vec4 visible = step(tc.z, depths);
                return mix(mix(visible.w, visible.z, f.x), mix(visible.x, visible.y, f.x), f.y);
            ])
        ] [
            return float(shadow2DRect(tex4, tc));
        ])
    }

    sunshadowtype pcsscascade(vec3 tc, vec3 norm, vec4 cascade, vec3 offset, float level, float fade)
    {
        sunshadowtype base = filtersunshadow(tc);
        float scale = cascade.z;
        float kernelcap = @(? (= $csmpcssquality 0) 6.0 (? (= $csmpcssquality 1) 12.0 20.0));
        float maxradius = min(csmpcssparams.z*scale, kernelcap);
        if(fade <= 0.0 || maxradius <= 0.5 || csmpcssparams.x <= 0.0) return base;

        // Stay inside this cascade's rendered footprint, including the bilinear footprint.
        vec2 lo = offset.xy - cascade.w + 1.0, hi = offset.xy + cascade.w - 1.0;
        // Receiver-plane correction removes self-blocking on sloping receivers, without adding constant bias.
        vec2 slope = -norm.xy / (abs(norm.z) > 0.05 ? norm.z : (norm.z < 0.0 ? -0.05 : 0.05)) * csmz.y / scale;
        float budget = mix(1.0, 1.0/(1.0 + level), csmpcssdistance.z) * mix(0.5, 1.0, fade);
        float searches = max(1.0, floor(min(csmpcsscounts.x,
            @(? (= $csmpcssquality 0) 8.0 (? (= $csmpcssquality 1) 16.0 32.0))) * budget));
        // Orthographic depth: the near plane bounds the maximum possible blocker separation.
        float searchradius = min(maxradius, max(tc.z, 0.0)*csmpcssparams.w*csmpcssparams.x*scale);
        if(searchradius <= 0.5) return base;
        float separation = 0.0, blockers = 0.0;
        vec2 direction = vec2(1.0, 0.0);
        for(int i = 0; i < @(? (= $csmpcssquality 0) 8 (? (= $csmpcssquality 1) 16 32)); ++i)
        {
            if(float(i) >= searches) break;
            vec2 disk = direction * sqrt((float(i) + 0.5)/searches);
            direction = mat2(-0.73736888, 0.67549029, -0.67549029, -0.73736888) * direction;
            float weight = 1.0;
            if(csmpcsseclipse.w > 0.0)
            {
                vec2 moon = disk - csmpcsseclipse.xy;
                if(dot(moon, moon) < csmpcsseclipse.z) weight -= csmpcsseclipse.w;
                if(weight <= 0.0) continue;
            }
            vec2 sampletc = clamp(tc.xy + disk*searchradius, lo, hi);
            sampletc = floor(sampletc) + 0.5;
            float delta = tc.z + dot(slope, sampletc - tc.xy) - pcssdepth(sampletc);
            if(delta > 0.0) { separation += delta*weight; blockers += weight; }
        }
        if(blockers == 0.0) return base;
        float radius = clamp(separation/blockers*csmpcssparams.w*csmpcssparams.x,
                             csmpcssparams.y, csmpcssparams.z)*scale;
        radius = min(radius, kernelcap);
        // Sub-texel penumbrae retain the existing reconstruction filter.
        fade *= smoothstep(0.5, 1.5, radius);
        if(fade <= 0.0) return base;
        float samples = max(1.0, floor(min(csmpcsscounts.y,
            @(? (= $csmpcssquality 0) 12.0 (? (= $csmpcssquality 1) 24.0 64.0))) * budget));
        sunshadowtype filtered = sunshadowtype(0.0);
        float totalweight = 0.0;
        direction = vec2(0.0, 1.0);
        for(int i = 0; i < @(? (= $csmpcssquality 0) 12 (? (= $csmpcssquality 1) 24 64)); ++i)
        {
            if(float(i) >= samples) break;
            vec2 disk = direction * sqrt((float(i) + 0.5)/samples);
            direction = mat2(-0.73736888, 0.67549029, -0.67549029, -0.73736888) * direction;
            float weight = 1.0;
            if(csmpcsseclipse.w > 0.0)
            {
                vec2 moon = disk - csmpcsseclipse.xy;
                if(dot(moon, moon) < csmpcsseclipse.z) weight -= csmpcsseclipse.w;
                if(weight <= 0.0) continue;
            }
            vec2 sampletc = clamp(tc.xy + disk*radius, lo, hi);
            vec3 tap = vec3(sampletc, tc.z + dot(slope, sampletc - tc.xy));
            filtered += weight*pcsscompare(tap) @(? $colorshadow [* filtercolorshadow(tex10, tap)]);
            totalweight += weight;
        }
        // Very thin crescents/rings may miss a low-budget pattern; keep a finite fallback.
        if(totalweight <= 0.0) return base;
        return mix(base, filtered/totalweight, fade);
    }

    sunshadowtype getpcssshadow(vec3 pos, vec3 norm, float distbias)
    {
        if(csmpcsseclipse.w < 0.0) return sunshadowtype(1.0);
        float fade = clamp((csmpcssdistance.x - distance(camera, pos))*csmpcssdistance.y, 0.0, 1.0);
        fade = fade*fade*(3.0 - 2.0*fade);
        if(fade <= 0.0) return filtersunshadow(getcsmtc(pos, distbias));
        pos = csmmatrix * pos;
        norm = csmmatrix * norm;
        pos.z -= distbias;
        float depth = csmz.x + pos.z*csmz.y;
        @(loopconcat j $numsplits [result [
            {
                vec2 localtc = csmtc[@@j].xy + pos.xy*csmtc[@@j].z;
                float edge = csmtc[@@j].w - max(abs(localtc.x), abs(localtc.y));
                if(edge > 0.0)
                {
                    vec3 tc = vec3(localtc, depth) + csmoffset[@@j];
                    sunshadowtype value = pcsscascade(tc, norm, csmtc[@@j], csmoffset[@@j], @j.0, fade);
                    // Blend overlapping cascades only in PCSS variants; legacy selection is untouched.
                    @(if (< (+ $j 1) $numsplits) [result [
                        vec2 nexttc = csmtc[@@(+ $j 1)].xy + pos.xy*csmtc[@@(+ $j 1)].z;
                        float nextedge = csmtc[@@(+ $j 1)].w - max(abs(nexttc.x), abs(nexttc.y));
                        float width = max(4.0, min(csmpcssparams.z*csmtc[@@j].z, 20.0) + 2.0);
                        if(edge < width && nextedge > 1.0)
                        {
                            vec3 next = vec3(nexttc, depth) + csmoffset[@@(+ $j 1)];
                            sunshadowtype other = pcsscascade(next, norm, csmtc[@@(+ $j 1)], csmoffset[@@(+ $j 1)],
                                                             @@(+ $j 1).0, fade);
                            value = mix(value, other, fade*(1.0 - smoothstep(0.0, width, edge)));
                        }
                    ]])
                    return value;
                }
            }
        ]])
        return sunshadowtype(1.0);
    }
]]
