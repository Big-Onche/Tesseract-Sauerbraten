tesselationworldcontrolshader = [
    local worldtype
    worldtype = $arg1
    result [
        layout(vertices = 3) out;
        uniform float tessfactor;

        in vec3 nvec[];
        out vec3 tess_nvec[];
        @(? (|| $gdepthformat $msaalight $msaasamples) [
            in float lineardepth[];
            out float tess_lineardepth[];
        ])
        @(if (wtopt "T") [result [
            in vec2 texcoordx[], texcoordy[], texcoordz[];
            out vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
        ]] [result [
            in vec2 texcoord0[];
            out vec2 tess_texcoord0[];
        ]])
        @(? (wtopt "r") [
            in vec3 camvec[];
            out vec3 tess_camvec[];
        ])

        void main(void)
        {
            gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;
            tess_nvec[gl_InvocationID] = nvec[gl_InvocationID];
            @(? (|| $gdepthformat $msaalight $msaasamples) [tess_lineardepth[gl_InvocationID] = lineardepth[gl_InvocationID];])
            @(if (wtopt "T") [result [
                tess_texcoordx[gl_InvocationID] = texcoordx[gl_InvocationID];
                tess_texcoordy[gl_InvocationID] = texcoordy[gl_InvocationID];
                tess_texcoordz[gl_InvocationID] = texcoordz[gl_InvocationID];
            ]] [result [
                tess_texcoord0[gl_InvocationID] = texcoord0[gl_InvocationID];
            ]])
            @(? (wtopt "r") [tess_camvec[gl_InvocationID] = camvec[gl_InvocationID];])

            if(gl_InvocationID == 0)
            {
                gl_TessLevelOuter[0] = tessfactor;
                gl_TessLevelOuter[1] = tessfactor;
                gl_TessLevelOuter[2] = tessfactor;
                gl_TessLevelInner[0] = tessfactor;
            }
        }
    ]
]

tesselationworldevaluationshader = [
    local worldtype
    worldtype = $arg1
    result [
        layout(triangles, equal_spacing, ccw) in;

        in vec3 tess_nvec[];
        out vec3 nvec;
        @(? (|| $gdepthformat $msaalight $msaasamples) [
            in float tess_lineardepth[];
            out float lineardepth;
        ])
        @(if (wtopt "T") [result [
            in vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
            out vec2 texcoordx, texcoordy, texcoordz;
        ]] [result [
            in vec2 tess_texcoord0[];
            out vec2 texcoord0;
        ]])
        @(? (wtopt "r") [
            in vec3 tess_camvec[];
            out vec3 camvec;
        ])
        @(? (wtopt "G") [
            uniform float millis;
            uniform vec4 pulseglowspeed;
            flat out float pulse;
        ])

        #define tessmix(value) (gl_TessCoord.x * value[0] + gl_TessCoord.y * value[1] + gl_TessCoord.z * value[2])

        void main(void)
        {
            gl_Position = gl_TessCoord.x * gl_in[0].gl_Position + gl_TessCoord.y * gl_in[1].gl_Position +
                          gl_TessCoord.z * gl_in[2].gl_Position;
            nvec = tessmix(tess_nvec);
            @(? (|| $gdepthformat $msaalight $msaasamples) [lineardepth = tessmix(tess_lineardepth);])
            @(if (wtopt "T") [result [
                texcoordx = tessmix(tess_texcoordx);
                texcoordy = tessmix(tess_texcoordy);
                texcoordz = tessmix(tess_texcoordz);
            ]] [result [
                texcoord0 = tessmix(tess_texcoord0);
            ]])
            @(? (wtopt "r") [camvec = tessmix(tess_camvec);])
            @(? (wtopt "G") [pulse = abs(fract(millis*pulseglowspeed.x)*2.0 - 1.0);])
        }
    ]
]

tesselationbumpcontrolshader = [
    local bumptype
    bumptype = $arg1
    result [
        layout(vertices = 3) out;
        uniform float tessfactor;
        uniform vec4 tessparams, tessadaptiveparams, tessadaptiveoptions, tessviewparams;
        uniform vec2 tessmapsize;

        in vec3 tess_vertex[];
        out vec3 tess_position[];
        patch out vec3 tess_edgelod;
        patch out vec4 tess_patchdebug;

        @(? (|| $gdepthformat $msaalight $msaasamples) [
            in float lineardepth[];
            out float tess_lineardepth[];
        ])
        @(if (btopt "T") [result [
            in vec2 texcoordx[], texcoordy[], texcoordz[];
            in vec3 normal[], tangentx[], tangenty[], tangentz[];
            out vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
            out vec3 tess_normal[], tess_tangentx[], tess_tangenty[], tess_tangentz[];
        ]] [result [
            in vec2 texcoord0[];
            in mat3 world[];
            out vec2 tess_texcoord0[];
            out mat3 tess_world[];
        ]])
        @(? (|| (btopt "p") (btopt "r") (btopt "T")) [
            in vec3 camvec[];
            out vec3 tess_camvec[];
        ])

        vec2 tessscreen(vec4 clip)
        {
            return clip.xy/max(abs(clip.w), 1e-4)*tessviewparams.xy;
        }

        float tessedgepixels(int a, int b)
        {
            return length(tessscreen(gl_in[a].gl_Position) - tessscreen(gl_in[b].gl_Position));
        }

        float tessedgeworld(int a, int b)
        {
            return length(tess_vertex[a] - tess_vertex[b]);
        }

        float tessedgetexels(int a, int b)
        {
            @(if (btopt "T") [result [
                float xcoverage = length((texcoordx[a] - texcoordx[b])*tessmapsize.xy);
                float ycoverage = length((texcoordy[a] - texcoordy[b])*tessmapsize.xy);
                float zcoverage = length((texcoordz[a] - texcoordz[b])*tessmapsize.xy);
                return max(xcoverage, max(ycoverage, zcoverage));
            ]] [result [
                return length((texcoord0[a] - texcoord0[b])*tessmapsize.xy);
            ]])
        }

        vec3 tessmetric(int a, int b)
        {
            float pixels = tessedgepixels(a, b);
            float texels = tessedgetexels(a, b);
            float screenfactor = pixels/max(tessadaptiveparams.z, 1.0);
            float detailfactor = max(texels/max(tessadaptiveparams.w, 1.0),
                                     tessedgeworld(a, b)/max(tessadaptiveoptions.x, 1.0));
            float minimum = min(tessadaptiveparams.x, tessadaptiveparams.y);
            float requested = max(minimum, min(screenfactor, detailfactor));
            float factor = tessadaptiveoptions.y > 0.5 ? ceil(requested) : tessfactor;
            return vec3(clamp(factor, minimum, tessadaptiveparams.y), requested, texels);
        }

        float tessedgemip(vec3 metric)
        {
            if(tessadaptiveoptions.z < 0.5) return tessparams.z;
            float texelspan = metric.z/max(metric.x, 1.0);
            return max(tessparams.z, log2(max(texelspan, 1.0)) + tessadaptiveoptions.w);
        }

        void main(void)
        {
            gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;
            tess_position[gl_InvocationID] = tess_vertex[gl_InvocationID];
            @(? (|| $gdepthformat $msaalight $msaasamples) [tess_lineardepth[gl_InvocationID] = lineardepth[gl_InvocationID];])
            @(if (btopt "T") [result [
                tess_texcoordx[gl_InvocationID] = texcoordx[gl_InvocationID];
                tess_texcoordy[gl_InvocationID] = texcoordy[gl_InvocationID];
                tess_texcoordz[gl_InvocationID] = texcoordz[gl_InvocationID];
                tess_normal[gl_InvocationID] = normal[gl_InvocationID];
                tess_tangentx[gl_InvocationID] = tangentx[gl_InvocationID];
                tess_tangenty[gl_InvocationID] = tangenty[gl_InvocationID];
                tess_tangentz[gl_InvocationID] = tangentz[gl_InvocationID];
            ]] [result [
                tess_texcoord0[gl_InvocationID] = texcoord0[gl_InvocationID];
                tess_world[gl_InvocationID] = world[gl_InvocationID];
            ]])
            @(? (|| (btopt "p") (btopt "r") (btopt "T")) [tess_camvec[gl_InvocationID] = camvec[gl_InvocationID];])

            if(gl_InvocationID == 0)
            {
                vec3 edge0 = tessmetric(1, 2);
                vec3 edge1 = tessmetric(2, 0);
                vec3 edge2 = tessmetric(0, 1);
                gl_TessLevelOuter[0] = edge0.x;
                gl_TessLevelOuter[1] = edge1.x;
                gl_TessLevelOuter[2] = edge2.x;
                gl_TessLevelInner[0] = max(edge0.x, max(edge1.x, edge2.x));

                tess_edgelod = vec3(tessedgemip(edge0), tessedgemip(edge1), tessedgemip(edge2));
                float requested = max(edge0.y, max(edge1.y, edge2.y));
                float texelspan = max(edge0.z/max(edge0.x, 1.0),
                                      max(edge1.z/max(edge1.x, 1.0), edge2.z/max(edge2.x, 1.0)));
                float maxlod = max(tess_edgelod.x, max(tess_edgelod.y, tess_edgelod.z));
                bool hardwarelimit = requested >= tessviewparams.z - 0.5;
                tess_patchdebug = vec4(gl_TessLevelInner[0], clamp(requested/max(tessviewparams.z, 1.0), 0.0, 1.0),
                                       clamp(log2(texelspan + 1.0)/8.0, 0.0, 1.0), hardwarelimit ? -(maxlod + 1.0) : maxlod);
            }
        }
    ]
]

tesselationbumpevaluationshader = [
    local bumptype
    bumptype = $arg1
    result [
        layout(triangles, equal_spacing, ccw) in;

        uniform mat4 camprojmatrix;
        uniform sampler2D normalmap;
        uniform vec4 parallaxscale, tessparams;
        patch in vec3 tess_edgelod;
        patch in vec4 tess_patchdebug;
        @(? (btopt "T") [
            uniform vec4 triplanarbias;
            @(? (btopt "d") [uniform sampler2D detailnormalmap;])
        ])

        @(? (|| $gdepthformat $msaalight $msaasamples) [
            uniform vec2 lineardepthscale;
            in float tess_lineardepth[];
            out float lineardepth;
        ])
        in vec3 tess_position[];
        @(if (btopt "T") [result [
            in vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
            in vec3 tess_normal[], tess_tangentx[], tess_tangenty[], tess_tangentz[];
            out vec2 texcoordx, texcoordy, texcoordz;
            out vec3 normal, tangentx, tangenty, tangentz;
        ]] [result [
            in vec2 tess_texcoord0[];
            in mat3 tess_world[];
            out vec2 texcoord0;
            out mat3 world;
        ]])
        @(? (|| (btopt "p") (btopt "r") (btopt "T")) [
            uniform vec3 camera;
            in vec3 tess_camvec[];
            out vec3 camvec;
        ])
        @(? (btopt "G") [
            uniform float millis;
            uniform vec4 pulseglowspeed;
            flat out float pulse;
        ])
        noperspective out vec3 tess_barycentric;
        flat out vec4 tess_debugdata;

        #define tessmix(value) (gl_TessCoord.x * value[0] + gl_TessCoord.y * value[1] + gl_TessCoord.z * value[2])

        void main(void)
        {
            vec4 clipposition = gl_TessCoord.x * gl_in[0].gl_Position + gl_TessCoord.y * gl_in[1].gl_Position +
                                gl_TessCoord.z * gl_in[2].gl_Position;
            vec3 position = tessmix(tess_position);
            tess_barycentric = gl_TessCoord;
            tess_debugdata = tess_patchdebug;
            float displacementlod = gl_TessCoord.x <= gl_TessCoord.y && gl_TessCoord.x <= gl_TessCoord.z ? tess_edgelod.x :
                                    gl_TessCoord.y <= gl_TessCoord.z ? tess_edgelod.y : tess_edgelod.z;
            @(if (btopt "T") [result [
                texcoordx = tessmix(tess_texcoordx);
                texcoordy = tessmix(tess_texcoordy);
                texcoordz = tessmix(tess_texcoordz);
                normal = tessmix(tess_normal);
                tangentx = tessmix(tess_tangentx);
                tangenty = tessmix(tess_tangenty);
                tangentz = tessmix(tess_tangentz);

                vec3 surfacenormal = normalize(normal);
                vec3 triblend = max(abs(normal) - triplanarbias.xyz, 0.001);
                triblend *= triblend;
                triblend /= triblend.x + triblend.y + triblend.z;
                float heightx = textureLod(normalmap, texcoordx, displacementlod).a;
                float heighty = textureLod(normalmap, texcoordy, displacementlod).a;
                float heightz = textureLod(@(? (btopt "d") "detailnormalmap" "normalmap"), texcoordz, displacementlod).a;
                float height = dot(vec3(heightx, heighty, heightz), triblend);
            ]] [result [
                texcoord0 = tessmix(tess_texcoord0);
                world = tessmix(tess_world);
                vec3 surfacenormal = normalize(world[2]);
                float height = textureLod(normalmap, texcoord0, displacementlod).a;
            ]])

            float displacement = (height*parallaxscale.x + parallaxscale.y)*tessparams.x;
            vec3 displacementvector = surfacenormal*displacement;
            position += displacementvector;
            gl_Position = clipposition + camprojmatrix*vec4(displacementvector, 0.0);

            @(? (|| $gdepthformat $msaalight $msaasamples) [lineardepth = dot(lineardepthscale, gl_Position.zw);])
            @(? (|| (btopt "p") (btopt "r") (btopt "T")) [camvec = camera - position;])
            @(? (btopt "G") [pulse = abs(fract(millis*pulseglowspeed.x)*2.0 - 1.0);])
        }
    ]
]

tesselationworldshader = [
    if $tesselationsupported [
        defershader $arg1 (concatword "tess_" $arg2) [
            local tcs tes
            tcs = (tesselationworldcontrolshader @arg3)
            tes = (tesselationworldevaluationshader @arg3)
            tesselationcopyshader (concatword "tess_" @arg2) @arg2 $tcs $tes
        ]
    ]
]

tesselationbumpshader = [
    if $tesselationsupported [
        defershader $arg1 (concatword "tess_" $arg2) [
            local tcs tes
            tcs = (tesselationbumpcontrolshader @arg3)
            tes = (tesselationbumpevaluationshader @arg3)
            tesselationcopyshader (concatword "tess_" @arg2) @arg2 $tcs $tes
        ]
    ]
]
