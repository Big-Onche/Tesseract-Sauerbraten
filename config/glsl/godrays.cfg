// Dedicated screen-space cloud crepuscular rays. This is intentionally separate
// from the world-space volumetric-light path in volumetric.cfg.
lazyshader 0 "crepuscularrays" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0; // geometry-independent low-resolution silver mask
    uniform vec4 crsource; // xy=source size, zw=sun position in source pixels
    uniform vec4 crrayscale; // xy=source/ray resolution, zw=ray/source resolution
    uniform vec4 crsun; // x=source mask radius, y=sun/edge fade, z=min source dimension, w=steps
    uniform vec4 crvariationparams; // x=strength, y=primary freq, z=detail freq, w=anisotropy
    uniform vec4 crvariationparams2; // x=distortion, y=band contrast, z=radial fade, w=stable jitter
    fragdata(0) vec4 fragcolor;

    float crHash(vec3 p)
    {
        p = fract(p * vec3(0.1031, 0.1030, 0.0973));
        p += dot(p, p.yxz + 33.33);
        return fract((p.x + p.y) * p.z);
    }

    float crNoise(vec3 p)
    {
        vec3 i = floor(p), f = fract(p);
        vec3 u = f*f*(3.0 - 2.0*f);
        float n000 = crHash(i + vec3(0.0, 0.0, 0.0));
        float n100 = crHash(i + vec3(1.0, 0.0, 0.0));
        float n010 = crHash(i + vec3(0.0, 1.0, 0.0));
        float n110 = crHash(i + vec3(1.0, 1.0, 0.0));
        float n001 = crHash(i + vec3(0.0, 0.0, 1.0));
        float n101 = crHash(i + vec3(1.0, 0.0, 1.0));
        float n011 = crHash(i + vec3(0.0, 1.0, 1.0));
        float n111 = crHash(i + vec3(1.0, 1.0, 1.0));
        return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y),
                   mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
    }

    float crSource(vec2 uv)
    {
        if(uv.x < 0.5 || uv.y < 0.5 || uv.x > crsource.x - 0.5 || uv.y > crsource.y - 0.5)
            return 0.0;

        return texture2DRect(tex0, uv).r;
    }

    float crShaftBand(vec2 pixel, out float radialGate)
    {
        vec2 sunDelta = pixel - crsource.zw;
        float radialPixels = length(sunDelta);
        vec2 rayDirection = radialPixels > 1.0e-4 ? sunDelta / radialPixels : vec2(1.0, 0.0);
        float radial = radialPixels / max(crsun.z, 1.0);
        float frequency = max(crvariationparams.y, 0.25);
        float detailFrequency = max(crvariationparams.z, frequency);
        float anisotropy = max(crvariationparams.w, 1.0);

        // Mapping the ray direction onto a circle makes the angular noise
        // continuous at +/-pi while radial/anisotropy keeps bands elongated.
        const float INV_TAU = 0.15915494309189535;
        vec3 warpCoord = vec3(rayDirection * (2.3 + frequency * 0.04), radial * 1.7);
        float warp = crNoise(warpCoord + vec3(4.7, -2.1, 8.3)) - 0.5;
        float distortion = clamp(crvariationparams2.x, 0.0, 0.5);
        float stableJitter = clamp(crvariationparams2.w, 0.0, 1.0) * warp;

        vec3 primaryCoord = vec3(rayDirection * (frequency * INV_TAU), radial * frequency / anisotropy);
        primaryCoord.xy += vec2(warp, -warp) * (distortion * frequency * INV_TAU);
        primaryCoord.z += stableJitter * 0.35;
        float primary = crNoise(primaryCoord + vec3(11.0, -17.0, 3.0));

        vec3 detailCoord = vec3(rayDirection * (detailFrequency * INV_TAU),
                                radial * detailFrequency / max(anisotropy * 0.72, 1.0));
        detailCoord.xy += vec2(-warp, warp) * (distortion * detailFrequency * INV_TAU * 0.55);
        detailCoord.z += stableJitter * 0.7;
        float detail = crNoise(detailCoord + vec3(-23.0, 9.0, 19.0));

        float layered = mix(primary, detail, 0.28);
        float contrast = max(crvariationparams2.y, 0.25);
        float halfWidth = 0.5 / contrast;
        float band = smoothstep(0.5 - halfWidth, 0.5 + halfWidth, layered);

        float normalizedRadius = radialPixels / max(crsun.x, 1.0);
        radialGate = smoothstep(0.16, 0.72, normalizedRadius) *
                     (1.0 - smoothstep(2.5, 5.5, normalizedRadius));
        radialGate = pow(clamp(radialGate, 0.0, 1.0), max(crvariationparams2.z, 0.1));
        return band;
    }

    void main(void)
    {
        vec2 pixel = (gl_FragCoord.xy - vec2(0.5)) * crrayscale.xy + vec2(0.5);
        float rawSource = crSource(pixel);
        int steps = int(clamp(crsun.w, 8.0, 64.0));
        vec2 rayStep = (crsource.zw - pixel) * (0.96 / float(steps));
        vec2 samplePixel = pixel;
        float illumination = 1.0, accumulated = 0.0, totalWeight = 0.0;
        for(int i = 0; i < 64; ++i)
        {
            if(i >= steps) break;
            samplePixel += rayStep;
            accumulated += crSource(samplePixel) * illumination;
            totalWeight += illumination;
            illumination *= 0.965;
        }
        float smoothRays = accumulated / max(totalWeight * 0.34, 1.0e-4);

        float radialGate;
        float band = crShaftBand(pixel, radialGate);
        float shaftPattern = mix(0.68, 1.32, band);
        float sourceGate = smoothstep(0.012, 0.20, max(smoothRays, rawSource * 0.75));
        float variationAmount = clamp(crvariationparams.x, 0.0, 1.0) *
                                radialGate * sourceGate * crsun.y;
        float finalRays = smoothRays * mix(1.0, shaftPattern, variationAmount);

        // Packed diagnostics: raw source, smooth accumulation, modulation, final.
        fragcolor = vec4(rawSource, smoothRays, band, finalRays);
    }
]

lazyshader 0 "crepuscularraysdepth" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    // tex9 = full-resolution scene depth (rect or MSAA)
    @(gfetchdefs tex9 $msaalight)
    uniform vec4 crscaleparams; // xy=full/ray resolution, zw=ray/full resolution
    uniform vec4 viewsize;
    fragdata(0) float fragdepth;

    void main(void)
    {
        vec2 rayPixel = floor(gl_FragCoord.xy);
        vec2 fullresUV = (rayPixel + vec2(0.5)) * crscaleparams.xy;
        fullresUV = clamp(floor(fullresUV) + vec2(0.5), vec2(0.5), viewsize.xy - vec2(0.5));
        @(gdepthunpack depth [gfetch(tex9, fullresUV)])
        fragdepth = depth;
    }
]

lazyshader 0 "crepuscularrayscomposite" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    uniform sampler2DRect tex1; // representative scene depth at ray resolution
    // tex8 = full-resolution scene/avatar normals (rect or MSAA)
    @(gfetchdefs tex8 $msaalight ngfetch)
    // tex9 = full-resolution scene depth (rect or MSAA)
    @(gfetchdefs tex9 $msaalight)
    uniform vec4 crcompositeparams; // xy=ray texture size, zw=ray/full resolution
    uniform vec4 crscaleparams; // xy=full/ray resolution, zw=ray/full resolution
    uniform vec2 crbilateralparams; // x=relative depth tolerance, y=depth-aware upscale enabled
    uniform vec4 crtint; // rgb=tint, w=strength
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;

    float fetchDepthLinear(vec2 uv)
    {
        @(gdepthunpack depth [gfetch(tex9, uv)])
        return depth;
    }

    float depthError(float sampleDepth, float centerDepth)
    {
        float tolerance = max(2.0, max(abs(centerDepth), abs(sampleDepth)) * max(crbilateralparams.x, 1.0e-5));
        return abs(sampleDepth - centerDepth) / tolerance;
    }

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy;
        float rays = 0.0;
        if(crbilateralparams.y < 0.5)
        {
            vec2 rayUV = clamp(uv, vec2(0.5), crcompositeparams.xy - vec2(0.5));
            rays = texture2DRect(tex0, rayUV).a;
        }
        else
        {
            float centerDepth = fetchDepthLinear(uv);
            vec2 srcf = clamp(uv * crscaleparams.zw - vec2(0.5),
                              vec2(0.0), crcompositeparams.xy - vec2(1.0));
            vec2 base = floor(srcf), fracp = srcf - base;
            float accumulated = 0.0, totalWeight = 0.0;
            for(int iy = 0; iy < 2; ++iy)
            {
                for(int ix = 0; ix < 2; ++ix)
                {
                    vec2 offset = vec2(float(ix), float(iy));
                    float spatialWeight = (ix == 0 ? 1.0 - fracp.x : fracp.x) *
                                          (iy == 0 ? 1.0 - fracp.y : fracp.y);
                    if(spatialWeight <= 1.0e-6) continue;
                    vec2 rayUV = clamp(base + offset, vec2(0.0), crcompositeparams.xy - vec2(1.0)) + vec2(0.5);
                    float error = depthError(texture2DRect(tex1, rayUV).r, centerDepth);
                    if(error > 3.0) continue;
                    float weight = spatialWeight * exp(-error * error);
                    accumulated += texture2DRect(tex0, rayUV).a * weight;
                    totalWeight += weight;
                }
            }
            rays = totalWeight > 1.0e-5 ? accumulated / totalWeight : 0.0;
        }
        // Explicit sky has no G-buffer normal. Solid world geometry and the
        // first-person avatar do, so reject both after the depth-aware upscale.
        vec4 normalSample = ngfetch(tex8, uv);
        float skyMask = 1.0 - step(1.0e-6, dot(normalSample.rgb, normalSample.rgb));
        rays *= skyMask;
        fragcolor = vec4(max(crtint.rgb, vec3(0.0)) * (rays * max(crtint.w, 0.0)), 0.0);
    }
]

lazyshader 0 "crepuscularraysdebug" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2DRect tex0;
    uniform int crdebugchannel;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 stages = texture2DRect(tex0, texcoord0);
        float value = crdebugchannel == 0 ? stages.r :
                      (crdebugchannel == 1 ? stages.g :
                      (crdebugchannel == 2 ? stages.b : stages.a));
        fragcolor = vec4(vec3(value), 1.0) * colorscale;
    }
]
