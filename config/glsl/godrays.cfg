// Dedicated screen-space cloud crepuscular rays. This is intentionally separate
// from the world-space volumetric-light path in volumetric.cfg.
lazyshader 0 "crepuscularrays" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0; // geometry-independent low-resolution silver mask
    uniform vec4 crsource; // xy=source size, zw=sun position in source pixels
    uniform vec4 crrayscale; // xy=source/ray resolution, zw=ray/source resolution
    uniform vec4 crsun; // x=source mask radius, y=sun/edge fade, z=min source dimension, w=steps
    uniform vec4 crvariationparams; // x=strength, y=primary freq, z=detail freq, w=anisotropy
    uniform vec4 crvariationparams2; // x=distortion, y=band contrast, z=radial fade, w=stable jitter
    fragdata(0) vec4 fragcolor;

    float crHash(vec3 p)
    {
        p = fract(p * vec3(0.1031, 0.1030, 0.0973));
        p += dot(p, p.yxz + 33.33);
        return fract((p.x + p.y) * p.z);
    }

    float crNoise(vec3 p)
    {
        vec3 i = floor(p), f = fract(p);
        vec3 u = f*f*(3.0 - 2.0*f);
        float n000 = crHash(i + vec3(0.0, 0.0, 0.0));
        float n100 = crHash(i + vec3(1.0, 0.0, 0.0));
        float n010 = crHash(i + vec3(0.0, 1.0, 0.0));
        float n110 = crHash(i + vec3(1.0, 1.0, 0.0));
        float n001 = crHash(i + vec3(0.0, 0.0, 1.0));
        float n101 = crHash(i + vec3(1.0, 0.0, 1.0));
        float n011 = crHash(i + vec3(0.0, 1.0, 1.0));
        float n111 = crHash(i + vec3(1.0, 1.0, 1.0));
        return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y),
                   mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
    }

    float crSource(vec2 uv)
    {
        if(uv.x < 0.5 || uv.y < 0.5 || uv.x > crsource.x - 0.5 || uv.y > crsource.y - 0.5)
            return 0.0;

        return texture2DRect(tex0, uv).r;
    }

    float crShaftBand(vec2 pixel, out float radialGate)
    {
        vec2 sunDelta = pixel - crsource.zw;
        float radialPixels = length(sunDelta);
        vec2 rayDirection = radialPixels > 1.0e-4 ? sunDelta / radialPixels : vec2(1.0, 0.0);
        float radial = radialPixels / max(crsun.z, 1.0);
        float frequency = max(crvariationparams.y, 0.25);
        float detailFrequency = max(crvariationparams.z, frequency);
        float anisotropy = max(crvariationparams.w, 1.0);

        // Mapping the ray direction onto a circle makes the angular noise
        // continuous at +/-pi while radial/anisotropy keeps bands elongated.
        const float INV_TAU = 0.15915494309189535;
        vec3 warpCoord = vec3(rayDirection * (2.3 + frequency * 0.04), radial * 1.7);
        float warp = crNoise(warpCoord + vec3(4.7, -2.1, 8.3)) - 0.5;
        float distortion = clamp(crvariationparams2.x, 0.0, 0.5);
        float stableJitter = clamp(crvariationparams2.w, 0.0, 1.0) * warp;

        vec3 primaryCoord = vec3(rayDirection * (frequency * INV_TAU), radial * frequency / anisotropy);
        primaryCoord.xy += vec2(warp, -warp) * (distortion * frequency * INV_TAU);
        primaryCoord.z += stableJitter * 0.35;
        float primary = crNoise(primaryCoord + vec3(11.0, -17.0, 3.0));

        vec3 detailCoord = vec3(rayDirection * (detailFrequency * INV_TAU),
                                radial * detailFrequency / max(anisotropy * 0.72, 1.0));
        detailCoord.xy += vec2(-warp, warp) * (distortion * detailFrequency * INV_TAU * 0.55);
        detailCoord.z += stableJitter * 0.7;
        float detail = crNoise(detailCoord + vec3(-23.0, 9.0, 19.0));

        float layered = mix(primary, detail, 0.28);
        float contrast = max(crvariationparams2.y, 0.25);
        float halfWidth = 0.5 / contrast;
        float band = smoothstep(0.5 - halfWidth, 0.5 + halfWidth, layered);

        float normalizedRadius = radialPixels / max(crsun.x, 1.0);
        radialGate = smoothstep(0.16, 0.72, normalizedRadius) *
                     (1.0 - smoothstep(2.5, 5.5, normalizedRadius));
        radialGate = pow(clamp(radialGate, 0.0, 1.0), max(crvariationparams2.z, 0.1));
        return band;
    }

    void main(void)
    {
        vec2 pixel = (gl_FragCoord.xy - vec2(0.5)) * crrayscale.xy + vec2(0.5);
        float rawSource = crSource(pixel);
        int steps = int(clamp(crsun.w, 8.0, 64.0));
        vec2 rayStep = (crsource.zw - pixel) * (0.96 / float(steps));
        vec2 samplePixel = pixel;
        float illumination = 1.0, accumulated = 0.0, totalWeight = 0.0;
        for(int i = 0; i < 64; ++i)
        {
            if(i >= steps) break;
            samplePixel += rayStep;
            accumulated += crSource(samplePixel) * illumination;
            totalWeight += illumination;
            illumination *= 0.965;
        }
        float smoothRays = accumulated / max(totalWeight * 0.34, 1.0e-4);

        float radialGate;
        float band = crShaftBand(pixel, radialGate);
        float shaftPattern = mix(0.68, 1.32, band);
        float sourceGate = smoothstep(0.012, 0.20, max(smoothRays, rawSource * 0.75));
        float variationAmount = clamp(crvariationparams.x, 0.0, 1.0) *
                                radialGate * sourceGate * crsun.y;
        float finalRays = smoothRays * mix(1.0, shaftPattern, variationAmount);

        // Packed diagnostics: raw source, smooth accumulation, modulation, final.
        fragcolor = vec4(rawSource, smoothRays, band, finalRays);
    }
]

lazyshader 0 "crepuscularraysdepth" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    // tex9 = full-resolution scene depth (rect or MSAA)
    @(gfetchdefs tex9 $msaalight)
    uniform vec4 crscaleparams; // xy=full/ray resolution, zw=ray/full resolution
    uniform vec4 viewsize;
    fragdata(0) float fragdepth;

    void main(void)
    {
        vec2 rayPixel = floor(gl_FragCoord.xy);
        vec2 fullresUV = (rayPixel + vec2(0.5)) * crscaleparams.xy;
        fullresUV = clamp(floor(fullresUV) + vec2(0.5), vec2(0.5), viewsize.xy - vec2(0.5));
        @(gdepthunpack depth [gfetch(tex9, fullresUV)])
        fragdepth = depth;
    }
]

lazyshader 0 "crepuscularrayscomposite" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    uniform sampler2DRect tex1; // representative scene depth at ray resolution
    // tex8 = full-resolution scene/avatar normals (rect or MSAA)
    @(gfetchdefs tex8 $msaalight ngfetch)
    // tex9 = full-resolution scene depth (rect or MSAA)
    @(gfetchdefs tex9 $msaalight)
    uniform vec4 crcompositeparams; // xy=ray texture size, zw=ray/full resolution
    uniform vec4 crscaleparams; // xy=full/ray resolution, zw=ray/full resolution
    uniform vec2 crbilateralparams; // x=relative depth tolerance, y=depth-aware upscale enabled
    uniform vec4 crtint; // rgb=tint, w=strength
    uniform vec4 viewsize;
    fragdata(0) vec4 fragcolor;

    float fetchDepthLinear(vec2 uv)
    {
        @(gdepthunpack depth [gfetch(tex9, uv)])
        return depth;
    }

    float depthError(float sampleDepth, float centerDepth)
    {
        float tolerance = max(2.0, max(abs(centerDepth), abs(sampleDepth)) * max(crbilateralparams.x, 1.0e-5));
        return abs(sampleDepth - centerDepth) / tolerance;
    }

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy;
        float rays = 0.0;
        if(crbilateralparams.y < 0.5)
        {
            vec2 rayUV = clamp(uv, vec2(0.5), crcompositeparams.xy - vec2(0.5));
            rays = texture2DRect(tex0, rayUV).a;
        }
        else
        {
            float centerDepth = fetchDepthLinear(uv);
            vec2 srcf = clamp(uv * crscaleparams.zw - vec2(0.5),
                              vec2(0.0), crcompositeparams.xy - vec2(1.0));
            vec2 base = floor(srcf), fracp = srcf - base;
            float accumulated = 0.0, totalWeight = 0.0;
            for(int iy = 0; iy < 2; ++iy)
            {
                for(int ix = 0; ix < 2; ++ix)
                {
                    vec2 offset = vec2(float(ix), float(iy));
                    float spatialWeight = (ix == 0 ? 1.0 - fracp.x : fracp.x) *
                                          (iy == 0 ? 1.0 - fracp.y : fracp.y);
                    if(spatialWeight <= 1.0e-6) continue;
                    vec2 rayUV = clamp(base + offset, vec2(0.0), crcompositeparams.xy - vec2(1.0)) + vec2(0.5);
                    float error = depthError(texture2DRect(tex1, rayUV).r, centerDepth);
                    if(error > 3.0) continue;
                    float weight = spatialWeight * exp(-error * error);
                    accumulated += texture2DRect(tex0, rayUV).a * weight;
                    totalWeight += weight;
                }
            }
            rays = totalWeight > 1.0e-5 ? accumulated / totalWeight : 0.0;
        }
        // Explicit sky has no G-buffer normal. Solid world geometry and the
        // first-person avatar do, so reject both after the depth-aware upscale.
        vec4 normalSample = ngfetch(tex8, uv);
        float skyMask = 1.0 - step(1.0e-6, dot(normalSample.rgb, normalSample.rgb));
        rays *= skyMask;
        fragcolor = vec4(max(crtint.rgb, vec3(0.0)) * (rays * max(crtint.w, 0.0)), 0.0);
    }
]

lazyshader 0 "crepuscularraysdebug" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2DRect tex0;
    uniform int crdebugchannel;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 stages = texture2DRect(tex0, texcoord0);
        float value = crdebugchannel == 0 ? stages.r :
                      (crdebugchannel == 1 ? stages.g :
                      (crdebugchannel == 2 ? stages.b : stages.a));
        fragcolor = vec4(vec3(value), 1.0) * colorscale;
    }
]

// CSM-driven raymarched shafts cast by world geometry. This remains separate
// from volumetric-cloud crepuscular rays above.
geometrygodraysshader = [
    local shadowrect
    shadowrect = $arg2
    shader 0 $arg1 [
        attribute vec4 vvertex;

        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        @(gfetchdefs tex0)
        @(? $shadowrect [uniform sampler2DRectShadow tex2;] [uniform sampler2DShadow tex2;])
        uniform mat4 worldmatrix;
        uniform vec3 camera;
        uniform vec3 sunDir;
        uniform vec3 sunColor;
        uniform mat3 csmmatrix;
        uniform vec4 csmtc[8];
        uniform vec3 csmoffset[8];
        uniform vec2 csmz;
        uniform int csmcount;
        uniform int godRayGeomSteps;
        uniform int godRayGeomDebug;
        uniform vec2 shadowatlasscale;
        uniform vec4 godRayGeomParams;
        uniform vec4 godRayGeomDistanceParams;
        uniform vec4 godRayGeomShapeParams;
        uniform vec2 godRayDepthScale;
        fragdata(0) vec4 fragColor;

        vec4 getcsmtc(vec3 pos, float distbias)
        {
            vec3 besttc = vec3(-1.0);
            float bestcoverage = 0.0;
            vec3 lightPos = csmmatrix * pos;
            lightPos.z -= distbias;
            float shadowz = csmz.x + lightPos.z*csmz.y;
            for(int i = 0; i < 8; ++i)
            {
                if(i >= csmcount) break;
                vec2 tc = csmtc[i].xy + lightPos.xy*csmtc[i].z;
                float edgeDistance = csmtc[i].w - max(abs(tc.x), abs(tc.y));
                if(edgeDistance <= 0.0) continue;

                float fadeWidth = csmtc[i].w * godRayGeomShapeParams.w;
                float coverage = fadeWidth > 1.0e-4 ? smoothstep(0.0, fadeWidth, edgeDistance) : 1.0;
                if(coverage > bestcoverage)
                {
                    besttc = vec3(tc, shadowz) + csmoffset[i];
                    bestcoverage = coverage;
                }
                if(coverage >= 0.999) break;
            }
            return vec4(besttc, bestcoverage);
        }

        float shadowTap(vec3 shadowtc, vec2 offset)
        {
            @(? $shadowrect [
                return float(shadow2DRect(tex2, shadowtc + vec3(offset, 0.0)));
            ] [
                return float(shadow2D(tex2, vec3((shadowtc.xy + offset)*shadowatlasscale, shadowtc.z)));
            ])
        }

        float filterSunShadow(vec3 shadowtc)
        {
            vec2 offset = fract(shadowtc.xy - 0.5);
            vec3 center = vec3(shadowtc.xy - offset*0.5, shadowtc.z);
            vec4 size = vec4(offset + 1.0, 2.0 - offset);
            return (1.0/9.0) * dot(size.zxzx*size.wwyy,
                                   vec4(shadowTap(center, vec2(-0.5, -0.5)), shadowTap(center, vec2(1.0, -0.5)),
                                        shadowTap(center, vec2(-0.5, 1.0)), shadowTap(center, vec2(1.0, 1.0))));
        }

        vec2 sampleSunVisibility(vec3 pos, float distbias)
        {
            vec4 shadowtc = getcsmtc(pos, distbias);
            if(shadowtc.w <= 0.0) return vec2(0.0);
            return vec2(clamp(filterSunShadow(shadowtc.xyz), 0.0, 1.0) * shadowtc.w, shadowtc.w);
        }

        vec2 sampleSunVisibilityRaw(vec3 pos, float distbias)
        {
            vec4 shadowtc = getcsmtc(pos, distbias);
            if(shadowtc.w <= 0.0) return vec2(0.0);
            return vec2(clamp(shadowTap(shadowtc.xyz, vec2(0.0)), 0.0, 1.0) * shadowtc.w, shadowtc.w);
        }

        float sampleLocalIsolation(vec3 pos, float distbias, float centerVisibility, vec3 axisX, vec3 axisY, float radius)
        {
            vec2 sampleX0 = sampleSunVisibilityRaw(pos - axisX*radius, distbias);
            vec2 sampleX1 = sampleSunVisibilityRaw(pos + axisX*radius, distbias);
            vec2 sampleY0 = sampleSunVisibilityRaw(pos - axisY*radius, distbias);
            vec2 sampleY1 = sampleSunVisibilityRaw(pos + axisY*radius, distbias);
            float neighborhoodOcclusion = (max(sampleX0.y - sampleX0.x, 0.0) + max(sampleX1.y - sampleX1.x, 0.0) +
                                           max(sampleY0.y - sampleY0.x, 0.0) + max(sampleY1.y - sampleY1.x, 0.0)) * 0.25;
            return centerVisibility * neighborhoodOcclusion;
        }

        vec3 debugHeat(float value)
        {
            return clamp(vec3(value*3.0, 2.0 - abs(value*6.0 - 3.0), 3.0 - value*3.0), 0.0, 1.0);
        }

        void main(void)
        {
            vec2 depthTexCoord = gl_FragCoord.xy * godRayDepthScale;
            @(gdepthunpack sceneDepth [gfetch(tex0, depthTexCoord)] [
                vec3 scenePos = (worldmatrix * vec4(sceneDepth*depthTexCoord, sceneDepth, 1.0)).xyz;
            ] [
                vec4 scenePos4 = worldmatrix * vec4(depthTexCoord, sceneDepth, 1.0);
                vec3 scenePos = scenePos4.xyz / scenePos4.w;
            ])

            vec3 rayVector = scenePos - camera;
            float sceneDistance = length(rayVector);
            if(sceneDistance <= 1.0e-4 || csmcount <= 0)
            {
                fragColor = vec4(0.0);
                return;
            }

            vec3 viewDirection = rayVector / sceneDistance;
            float maxDistance = min(sceneDistance, godRayGeomParams.z);
            int stepCount = clamp(godRayGeomSteps, 1, 64);
            float stepCountF = float(stepCount);
            float stepSize = maxDistance / stepCountF;
            if(stepSize <= 1.0e-5)
            {
                fragColor = vec4(0.0);
                return;
            }

            float farFadeStart = godRayGeomParams.z * 0.35;
            float sceneDistanceWeight = 1.0 - smoothstep(farFadeStart, godRayGeomParams.z, sceneDistance);
            float sunView = clamp(dot(viewDirection, sunDir)*0.5 + 0.5, 0.0, 1.0);
            float forwardScatter = mix(0.30, 1.0, pow(sunView, max(godRayGeomParams.w, 0.25)));
            float rayIntensity = max(godRayGeomParams.x, 0.25) * 0.16 * clamp(godRayGeomDistanceParams.x, 0.0, 2.0);
            float dither = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
            float runningVisibility = 0.10;
            float runningBlend = clamp(1.0 - godRayGeomParams.y, 1.0/64.0, 1.0);
            float shaftAccum = 0.0;
            vec3 isolationReference = abs(sunDir.z) < 0.99 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
            vec3 isolationAxisX = normalize(cross(sunDir, isolationReference));
            vec3 isolationAxisY = normalize(cross(sunDir, isolationAxisX));
            float isolationRadius = max(godRayGeomShapeParams.z, 0.0);
            float visibilityAccum = 0.0;
            float excessAccum = 0.0;
            float directAccum = 0.0;
            float isolationAccum = 0.0;
            float coverageAccum = 0.0;
            float biasAccum = 0.0;

            for(int stepIndex = 0; stepIndex < 64; ++stepIndex)
            {
                if(stepIndex >= stepCount) break;

                float sampleDistance = (float(stepIndex) + dither) * stepSize;
                vec3 samplePos = camera + viewDirection * sampleDistance;
                float distanceWeight = 1.0 - smoothstep(farFadeStart, godRayGeomParams.z, sampleDistance);
                float biasAmount = max(godRayGeomShapeParams.x + stepSize*0.35, 0.0);
                vec2 visibilityCoverage = sampleSunVisibility(samplePos, biasAmount);
                float visibility = visibilityCoverage.x;
                float excess = max(visibility - runningVisibility, 0.0);
                runningVisibility = mix(runningVisibility, visibility, runningBlend * visibilityCoverage.y);

                float localIsolation = sampleLocalIsolation(samplePos, biasAmount, visibility, isolationAxisX, isolationAxisY, isolationRadius);
                float isolationContrib = pow(localIsolation, max(godRayGeomDistanceParams.w, 0.25));
                float transitionContrib = pow(excess, 0.70) * pow(visibility, 0.80) * visibilityCoverage.y * godRayGeomDistanceParams.y;
                float directContrib = visibility * visibilityCoverage.y * distanceWeight * 0.25;
                float beamWeight = (isolationContrib + transitionContrib + directContrib*godRayGeomDistanceParams.z) * distanceWeight;
                shaftAccum += beamWeight;
                if(godRayGeomDebug != 0)
                {
                    visibilityAccum += visibility;
                    excessAccum += excess;
                    directAccum += directContrib * distanceWeight;
                    isolationAccum += localIsolation;
                    coverageAccum += visibilityCoverage.y;
                    biasAccum += biasAmount;
                }
            }

            float accumScale = max(stepCountF*0.25, 1.0e-4);
            float shaftSignal = clamp(shaftAccum/accumScale, 0.0, 1.0);
            float threshold = clamp(godRayGeomShapeParams.y, 0.0, 0.99);
            shaftSignal = max((shaftSignal - threshold)/max(1.0 - threshold, 1.0e-3), 0.0);
            shaftSignal = smoothstep(0.0, 1.0, pow(shaftSignal, 0.85));
            if(godRayGeomDebug != 0)
            {
                float sampleScale = 1.0/max(stepCountF, 1.0);
                float coverage = coverageAccum * sampleScale;
                vec3 debugColor = vec3(0.0);
                if(godRayGeomDebug == 1) debugColor = vec3(visibilityAccum * sampleScale);
                else if(godRayGeomDebug == 2) debugColor = vec3(excessAccum * sampleScale);
                else if(godRayGeomDebug == 3) debugColor = vec3(clamp(directAccum/accumScale, 0.0, 1.0));
                else if(godRayGeomDebug == 4) debugColor = vec3(shaftSignal);
                else if(godRayGeomDebug == 5) debugColor = vec3(1.0 - coverage, coverage, 0.0);
                else if(godRayGeomDebug == 6) debugColor = debugHeat(clamp(log2(1.0 + biasAccum*sampleScale)/8.0, 0.0, 1.0));
                else if(godRayGeomDebug == 7) debugColor = vec3(isolationAccum * sampleScale);
                fragColor = vec4(debugColor, dot(debugColor, vec3(0.2126, 0.7152, 0.0722)));
                return;
            }
            vec3 rayColor = sunColor * (rayIntensity * sceneDistanceWeight * forwardScatter * shaftSignal);
            float rayLuma = dot(rayColor, vec3(0.2126, 0.7152, 0.0722));
            rayColor *= 1.0/(1.0 + 4.0*rayLuma);
            fragColor = vec4(rayColor, shaftSignal);
        }
    ]
]

geometrygodraysshader "geometryGodRaysRect" 1
geometrygodraysshader "geometryGodRays2D" 0

shader 0 "geometrygodraysdepthguide" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 depthTexCoord;

    void main(void)
    {
        gl_Position = vvertex;
        depthTexCoord = vtexcoord0;
    }
] [
    @(gfetchdefs tex0)
    uniform vec3 gdepthpackparams;
    varying vec2 depthTexCoord;
    fragdata(0) vec4 fragColor;

    void main(void)
    {
        @(gdepthunpack sceneDepth [gfetch(tex0, depthTexCoord)])
        @(gpackdepth packedDepth sceneDepth)
        fragColor = vec4(packedDepth, 1.0);
    }
]

shader 0 "geometrygodraysatrous" [
    attribute vec4 vvertex;

    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    uniform sampler2DRect tex1;
    uniform vec3 gdepthunpackparams;
    uniform vec2 aTrousSize;
    uniform vec4 aTrousParams;
    fragdata(0) vec4 fragColor;

    float aTrousKernel(int kernelIndex)
    {
        if(kernelIndex <= 0) return 0.375;
        if(kernelIndex == 1) return 0.25;
        return 0.0625;
    }

    float fetchGuideDepth(vec2 sampleCoord)
    {
        return dot(texture2DRect(tex1, sampleCoord).rgb, gdepthunpackparams);
    }

    float relativeDepthDiff(float sampleDepth, float centerDepth)
    {
        return abs(sampleDepth - centerDepth)/max(max(abs(sampleDepth), abs(centerDepth)), 1.0);
    }

    void main(void)
    {
        vec2 pixelCoord = gl_FragCoord.xy;
        vec4 centerValue = texture2DRect(tex0, pixelCoord);
        float centerDepth = fetchGuideDepth(pixelCoord);
        float dilation = max(aTrousParams.x, 1.0);
        float signalStrength = max(aTrousParams.y, 0.0);
        float depthStrength = max(aTrousParams.z, 0.0);
        vec4 accumValue = vec4(0.0);
        float totalWeight = 0.0;

        for(int offsetY = -2; offsetY <= 2; ++offsetY)
        {
            int absOffsetY = offsetY < 0 ? -offsetY : offsetY;
            float weightY = aTrousKernel(absOffsetY);
            for(int offsetX = -2; offsetX <= 2; ++offsetX)
            {
                int absOffsetX = offsetX < 0 ? -offsetX : offsetX;
                float weightX = aTrousKernel(absOffsetX);
                vec2 sampleCoord = clamp(pixelCoord + vec2(float(offsetX), float(offsetY))*dilation, vec2(0.5), aTrousSize - vec2(0.5));
                vec4 sampleValue = texture2DRect(tex0, sampleCoord);
                float depthDiff = relativeDepthDiff(fetchGuideDepth(sampleCoord), centerDepth);
                float signalDiff = abs(sampleValue.a - centerValue.a);
                float edgeWeight = exp(-depthDiff*depthDiff*depthStrength - signalDiff*signalDiff*signalStrength);
                float sampleWeight = weightX * weightY * edgeWeight;
                accumValue += sampleValue * sampleWeight;
                totalWeight += sampleWeight;
            }
        }

        fragColor = accumValue/max(totalWeight, 1.0e-5);
    }
]

shader 0 "geometrygodraysupsample" [
    attribute vec4 vvertex;

    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    @(gfetchdefs tex1 $msaalight)
    uniform vec4 godrayScale;
    uniform float bilateralDepthScale;
    uniform vec4 viewsize;
    fragdata(0) vec4 fragColor;

    float fetchDepthLinear(vec2 uv)
    {
        @(gdepthunpack depth [gfetch(tex1, uv)])
        return depth;
    }

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy;
        if(godrayScale.z >= 0.9999 && godrayScale.w >= 0.9999)
        {
            fragColor = texture2DRect(tex0, uv);
            return;
        }

        float centerDepth = fetchDepthLinear(uv);
        vec2 srcSize = max(floor(viewsize.xy*godrayScale.zw + vec2(0.5)), vec2(1.0));
        vec2 srcF = uv*godrayScale.zw - vec2(0.5);
        vec2 base = floor(srcF);
        vec2 fracP = fract(srcF);
        vec4 accum = vec4(0.0);
        float totalWeight = 0.0;
        vec4 best = vec4(0.0);
        float bestDepthErr = 1.0e16;
        float depthThreshold = max(abs(centerDepth)*bilateralDepthScale, 1.0);

        for(int iy = 0; iy < 2; ++iy)
        {
            for(int ix = 0; ix < 2; ++ix)
            {
                vec2 offset = vec2(float(ix), float(iy));
                float wx = ix == 0 ? 1.0 - fracP.x : fracP.x;
                float wy = iy == 0 ? 1.0 - fracP.y : fracP.y;
                float spatialWeight = wx * wy;
                if(spatialWeight <= 1.0e-6) continue;

                vec2 pixel = clamp(base + offset, vec2(0.0), srcSize - vec2(1.0));
                vec2 sampleUV = pixel + vec2(0.5);
                vec2 depthProbeUV = clamp((pixel + vec2(0.5))*godrayScale.xy, vec2(0.5), viewsize.xy - vec2(0.5));
                float sampleDepth = fetchDepthLinear(depthProbeUV);
                float depthErr = abs(sampleDepth - centerDepth)/depthThreshold;
                vec4 sampleColor = texture2DRect(tex0, sampleUV);
                if(depthErr < bestDepthErr)
                {
                    bestDepthErr = depthErr;
                    best = sampleColor;
                }
                if(depthErr > 3.0) continue;
                float depthWeight = exp(-depthErr*depthErr);
                float weight = spatialWeight * depthWeight;
                accum += sampleColor * weight;
                totalWeight += weight;
            }
        }

        fragColor = totalWeight > 1.0e-5 ? accum/totalWeight : (bestDepthErr <= 3.0 ? best : vec4(0.0));
    }
]
