cortaoshader shared [
#define CORTAO_PACKED_NORMAL_BITS 10
const float CORTAO_PI2 = 6.2831853071795864769;
const float CORTAO_GOLDEN_ANGLE = 2.3999632297286533222;

uint CortaoSeed(uvec2 coords)
{
    uvec2 q = coords*uvec2(1719413u*929u, 140473u*2467u*11u);
    return q.x^q.y;
}

uint CortaoHash(uint n) { return n*(n^(n >> 15u)); }
uvec2 CortaoHash(uvec2 n) { return n*(n^(n >> 15u)); }

uint CortaoEncodeNormal(vec3 normal, vec2 dither)
{
    const uint bits = CORTAO_PACKED_NORMAL_BITS/2u;
    const uint mask = (1u << bits) - 1u;
    const uint maximum = mask >> 1u;
    vec2 encoded = normal.xy*inversesqrt(normal.z*2.0 + 2.0);
    ivec2 values = ivec2(floor(encoded*float(maximum) + dither));
    return (uint(values.x)&mask) | ((uint(values.y)&mask) << bits);
}

vec3 CortaoDecodeNormal(uint packedData)
{
    const uint bits = CORTAO_PACKED_NORMAL_BITS/2u;
    const uint mask = (1u << bits) - 1u;
    const uint maximum = mask >> 1u;
    ivec2 values = ivec2(int(packedData << (32u - bits)) >> int(32u - bits),
                         int(packedData << (32u - bits*2u)) >> int(32u - bits));
    vec2 e = vec2(values)/float(maximum);
    float z = 1.0 - dot(e, e);
    return vec3(e*(2.0*sqrt(max(z, 0.0))), z*2.0 - 1.0);
}

float CortaoUnpackDepth(uint packedData) { return uintBitsToFloat(packedData); }
]

cortaoshader prepass [
layout(local_size_x = 8, local_size_y = 8) in;
#if CORTAO_MSAA
layout(binding = 0) uniform sampler2DMS uDepthBuffer;
layout(binding = 1) uniform sampler2DMS uNormalBuffer;
#else
layout(binding = 0) uniform sampler2DRect uDepthBuffer;
layout(binding = 1) uniform sampler2DRect uNormalBuffer;
#endif
layout(r32ui, binding = 0) uniform writeonly uimage2D uPackedMips[8];

uniform vec2 uResolution;
uniform int uMipCount, uDepthFormat;
uniform float uNearPlane, uFarPlane, uDepthScale, uDepthOffset;
uniform uint uRandomSeed;
uniform mat3 uNormalMatrix;

vec4 CortaoLoadDepthSample(ivec2 pixel)
{
#if CORTAO_MSAA
    return texelFetch(uDepthBuffer, pixel, 0);
#else
    return texelFetch(uDepthBuffer, pixel);
#endif
}

vec3 CortaoLoadNormal(ivec2 pixel)
{
#if CORTAO_MSAA
    vec3 normal = texelFetch(uNormalBuffer, pixel, 0).rgb*2.0 - 1.0;
#else
    vec3 normal = texelFetch(uNormalBuffer, pixel).rgb*2.0 - 1.0;
#endif
    float lengthSquared = dot(normal, normal);
    if(lengthSquared <= 1.0e-8) return vec3(0.0);
    normal = uNormalMatrix*(normal*inversesqrt(lengthSquared));
    lengthSquared = dot(normal, normal);
    return lengthSquared > 1.0e-8 ? normal*inversesqrt(lengthSquared) : vec3(0.0);
}

float CortaoLoadLinearDepth(ivec2 pixel)
{
    vec4 value = CortaoLoadDepthSample(pixel);
    if(uDepthFormat == 0) return value.r >= 1.0 ? 0.0 : 1.0/(value.r*uDepthScale + uDepthOffset);
    if(uDepthFormat == 1)
    {
        if(all(greaterThanEqual(value.rgb, vec3(0.999)))) return 0.0;
        return -dot(value.rgb, vec3(-uFarPlane, -uFarPlane/255.0, -uFarPlane/(255.0*255.0)));
    }
    return value.r <= -uFarPlane*0.999 ? 0.0 : -value.r;
}

void main()
{
    uvec2 pixel = gl_GlobalInvocationID.xy, resolution = uvec2(uResolution);
    if(any(greaterThanEqual(pixel, resolution))) return;
    float linearDepth = CortaoLoadLinearDepth(ivec2(pixel));
    uint packedData = 0u;
    if(linearDepth > 0.0)
    {
        uint seed = CortaoHash(CortaoSeed(pixel) + uRandomSeed);
        vec2 dither = vec2(uvec2(seed&0xFFFFu, seed >> 16u))/float(0xFFFFu);
        uint mask = (1u << CORTAO_PACKED_NORMAL_BITS) - 1u;
        packedData = (floatBitsToUint(linearDepth)&~mask) | (CortaoEncodeNormal(CortaoLoadNormal(ivec2(pixel)), dither)&mask);
    }
    imageStore(uPackedMips[0], ivec2(pixel), uvec4(packedData));
    for(int level = 1; level < 8; ++level)
    {
        uvec2 nextPixel = pixel >> 1u;
        uvec2 dither = uvec2(uRandomSeed) >> uvec2(level*2, level*2 + 1);
        bool wrongPixel = (((pixel.x^nextPixel.y^dither.x) | (pixel.y^nextPixel.x^dither.y))&1u) != 0u;
        pixel = nextPixel;
        resolution = max(resolution >> 1u, uvec2(1));
        if(level >= uMipCount || wrongPixel || any(greaterThanEqual(pixel, resolution))) return;
        imageStore(uPackedMips[level], ivec2(pixel), uvec4(packedData));
    }
}
]

cortaoshader main [
layout(local_size_x = 16, local_size_y = 16) in;
layout(binding = 1) uniform sampler2DRect uNormalBuffer;
layout(binding = 2) uniform usampler2D uPackedData;
layout(binding = 3) uniform usampler3D uOccluderLUT;
layout(binding = 5) uniform sampler2DMS uNormalBufferMS;
layout(r8, binding = 0) uniform writeonly image2DRect uOutput;

uniform vec2 uResolution;
uniform int uMultisample;
uniform uint uRandomSeed;
uniform float uNormalBias, uMaxRadius, uMaxApparentRadius, uMipBias, uInverseMaxSlopeCompensation;
uniform float uBackfaceThreshold, uBackfaceBoost;
uniform vec4 uUnprojectParams, uProjectionParams;
uniform mat3 uNormalMatrix;

vec3 CortaoLoadNormal(ivec2 pixel)
{
    vec3 normal;
    if(uMultisample != 0) normal = texelFetch(uNormalBufferMS, pixel, 0).rgb*2.0 - 1.0;
    else normal = texelFetch(uNormalBuffer, pixel).rgb*2.0 - 1.0;
    float lengthSquared = dot(normal, normal);
    if(lengthSquared <= 1.0e-8) return vec3(0.0);
    normal = uNormalMatrix*(normal*inversesqrt(lengthSquared));
    lengthSquared = dot(normal, normal);
    return lengthSquared > 1.0e-8 ? normal*inversesqrt(lengthSquared) : vec3(0.0);
}

uint CortaoSamplePackedData(vec2 texCoords, float mipmap)
{
    int maximumLevel = textureQueryLevels(uPackedData) - 1;
    int level = clamp(int(floor(mipmap + 0.5)), 0, maximumLevel);
    ivec2 size = textureSize(uPackedData, level), pixel = ivec2(floor(texCoords*vec2(size)));
    if(any(lessThan(pixel, ivec2(0))) || any(greaterThanEqual(pixel, size))) return 0u;
    return texelFetch(uPackedData, pixel, level).r;
}

uint CortaoSampleOccluderLookupTable(vec3 texCoords)
{
    return textureLod(uOccluderLUT, clamp(texCoords, vec3(0.0), vec3(1.0)), 0.0).r;
}

vec3 CortaoRayDirection(uint rayIndex)
{
    float angle = float(rayIndex)*CORTAO_GOLDEN_ANGLE;
    float radius = sqrt((float(rayIndex) + 0.5)/float(CORTAO_RAY_COUNT));
    return vec3(cos(angle)*radius, sin(angle)*radius, sqrt(1.0 - radius*radius));
}

vec3 CortaoUnprojectWithOffset(vec2 texCoords, float linearDepth, vec3 offset)
{
    vec2 direction = texCoords*uUnprojectParams.xy + uUnprojectParams.zw;
    return vec3(direction, -1.0)*linearDepth + offset;
}

void CortaoConstructBasis(vec3 normal, out vec3 tangent, out vec3 bitangent)
{
    float a = 1.0/(1.0 + normal.z), b = normal.x*normal.y*a;
    tangent = vec3(normal.x*normal.x*a - 1.0, b, normal.x);
    bitangent = vec3(b, normal.y*normal.y*a - 1.0, normal.y);
}

uint CortaoComputeRayOcclusion(float offsetDither, mat3 offsetTransform, mat3 tangentBasis, float mipBias, vec3 viewPosition, vec3 normal,
                               vec3 viewDirection, float maximumRadius)
{
    uint rayBits = CORTAO_SAMPLE_COUNT > 4 ? CortaoSampleOccluderLookupTable(vec3(0.0)) : 0u;
    for(uint i = 0u; i < CORTAO_SAMPLE_COUNT; ++i)
    {
        float angle = float(i)*CORTAO_GOLDEN_ANGLE;
        vec2 spiral = vec2(cos(angle), sin(angle));
        float inverseSamples = 1.0/float(CORTAO_SAMPLE_COUNT), skew = 3.5;
        float innerRadius = pow(float(i)*inverseSamples, skew*0.5);
        float outerRadius = pow(float(i + 1u)*inverseSamples, skew*0.5);
        vec2 innerSpiral = spiral*innerRadius, outerSpiral = spiral*outerRadius;
        float sampleWeight = sqrt(outerRadius*outerRadius - innerRadius*innerRadius);
        vec2 sampleOffset = mix(innerSpiral, outerSpiral, offsetDither);
        vec3 projected = offsetTransform*vec3(sampleOffset, 1.0);
        vec2 sampleCoords = projected.xy/projected.z;
        float mipmap = mipBias + log2(outerRadius);
        uint packedData = CortaoSamplePackedData(sampleCoords, mipmap);
        float sampleDepth = CortaoUnpackDepth(packedData);
        vec3 deltaPosition = CortaoUnprojectWithOffset(sampleCoords, sampleDepth, -viewPosition);
        float lengthSquared = dot(deltaPosition, deltaPosition);
        if(lengthSquared < maximumRadius*maximumRadius && dot(deltaPosition, normal) > 0.0)
        {
            float inverseLength = inversesqrt(lengthSquared);
            vec3 direction = deltaPosition*inverseLength;
            vec3 sampleNormal = CortaoDecodeNormal(packedData);
            float slopeCompensation = inversesqrt(max(dot(sampleNormal, viewDirection), uInverseMaxSlopeCompensation));
            float occluderRadius = maximumRadius*sampleWeight*slopeCompensation*inverseLength;
            if(dot(sampleNormal, direction) < uBackfaceThreshold)
            {
                float adjustedOffset = -occluderRadius/max(1.0 - occluderRadius*occluderRadius*0.5, 0.000001);
                direction = normalize(sampleNormal*adjustedOffset + direction);
            }
            else occluderRadius *= mix(1.0, slopeCompensation, uBackfaceBoost);
            vec3 hemisphereDirection = transpose(tangentBasis)*direction;
            float sphereMultiplier = inversesqrt(hemisphereDirection.z*8.0 + 8.0);
            vec2 sphereCoords = hemisphereDirection.xy*sphereMultiplier + 0.5;
            uint occluderBits = CortaoSampleOccluderLookupTable(vec3(sphereCoords, occluderRadius*sqrt(0.5)));
            rayBits |= occluderBits & (hemisphereDirection.z > -0.99 ? 0xFFFFFFFFu : 0u);
        }
    }
    return rayBits;
}

uvec2 CortaoDeinterleave(uint index)
{
    uvec2 p = uvec2(index) >> uvec2(0, 1);
    p &= uvec2(0x5555u);
    p = (p^(p >> 1u))&uvec2(0x3333u);
    p = (p^(p >> 2u))&uvec2(0x0F0Fu);
    p = (p^(p >> 4u))&uvec2(0x00FFu);
    return p;
}

void main()
{
    uvec2 pixel = gl_WorkGroupID.xy*uvec2(16) + CortaoDeinterleave(gl_LocalInvocationIndex);
    uvec2 resolution = uvec2(uResolution);
    if(any(greaterThanEqual(pixel, resolution))) return;
    vec2 texCoords = (vec2(pixel) + 0.5)/uResolution;
    float linearDepth = CortaoUnpackDepth(CortaoSamplePackedData(texCoords, 0.0));
    if(linearDepth == 0.0) return;
    vec3 normal = CortaoLoadNormal(ivec2(pixel));
    vec3 viewPosition = CortaoUnprojectWithOffset(texCoords, linearDepth, vec3(0.0));
    uvec2 random = CortaoHash(CortaoSeed(pixel) + uvec2(uRandomSeed&0xFFFFu, uRandomSeed >> 16u));
    float sampleAngle = float(random.x)*(CORTAO_PI2/float(0xFFFFFFFFu));
    float offsetDither = float(random.y)/float(0xFFFFFFFFu);
    float tangentAngle = float(random.x^random.y^uRandomSeed)*(CORTAO_PI2/float(0xFFFFFFFFu));
    vec2 sampleRotation = vec2(sin(sampleAngle), cos(sampleAngle));
    float radius = min(uMaxRadius, linearDepth*uMaxApparentRadius);
    float apparentRadius = radius*inversesqrt(max(linearDepth*linearDepth - radius*radius, 1.0e-12));
    float circleRadius = apparentRadius*linearDepth;
    vec3 viewDirection = -normalize(viewPosition);
    float baseMipBias = log2(apparentRadius*inversesqrt(max(viewDirection.z, 1.0e-6))) + uMipBias;
    viewPosition += normal*(uNormalBias*linearDepth);
    vec2 scaledRotation = sampleRotation*circleRadius;
    mat3 rotation = mat3(vec3(scaledRotation.x, -scaledRotation.y, 0.0), vec3(scaledRotation.y, scaledRotation.x, 0.0), vec3(0, 0, 1));
    vec3 right, up;
    CortaoConstructBasis(viewDirection, right, up);
    if((random.x&1u) == 0u) right = -right;
    mat3 circle = mat3(right, up, viewPosition);
    mat3 projection = mat3(vec3(uProjectionParams.x, 0, 0), vec3(0, uProjectionParams.y, 0),
                           vec3(uProjectionParams.z, uProjectionParams.w, -1));
    mat3 offsetTransform = projection*circle*rotation;
    vec3 baseTangent, baseBitangent;
    CortaoConstructBasis(normal, baseTangent, baseBitangent);
    float sine = sin(tangentAngle), cosine = cos(tangentAngle);
    vec3 tangent = cosine*baseTangent + sine*baseBitangent;
    vec3 bitangent = cosine*baseBitangent - sine*baseTangent;
    mat3 tangentBasis = mat3(tangent, bitangent, normal);
    uint rayBits = CortaoComputeRayOcclusion(offsetDither, offsetTransform, tangentBasis, baseMipBias, viewPosition, normal, viewDirection,
                                             radius);
    float visibility = 1.0 - float(bitCount(rayBits))/float(CORTAO_RAY_COUNT);
    imageStore(uOutput, ivec2(pixel), vec4(visibility));
}
]

cortaoshader filter [
layout(local_size_x = 8, local_size_y = 8) in;
layout(binding = 2) uniform usampler2D uPackedData;
layout(binding = 4) uniform sampler2DRect uSSAO;
layout(r8, binding = 0) uniform writeonly image2DRect uOutput;
uniform vec2 uResolution;
uniform float uDepthSensitivity, uNormalSensitivity;

uint CortaoLoadPacked(ivec2 pixel)
{
    ivec2 size = ivec2(uResolution);
    return any(lessThan(pixel, ivec2(0))) || any(greaterThanEqual(pixel, size)) ? 0u : texelFetch(uPackedData, pixel, 0).r;
}

float CortaoLoadSSAO(ivec2 pixel)
{
    ivec2 size = ivec2(uResolution);
    return any(lessThan(pixel, ivec2(0))) || any(greaterThanEqual(pixel, size)) ? 1.0 : texelFetch(uSSAO, pixel).r;
}

uvec4 CortaoGatherPackedData(vec2 texCoords, ivec2 offset)
{
    ivec2 high = ivec2(floor(texCoords*uResolution)), low = high - 1;
    return uvec4(CortaoLoadPacked(ivec2(low.x, high.y) + offset), CortaoLoadPacked(high + offset),
                 CortaoLoadPacked(ivec2(high.x, low.y) + offset), CortaoLoadPacked(low + offset));
}

vec4 CortaoGatherSSAO(vec2 texCoords, ivec2 offset)
{
    ivec2 high = ivec2(floor(texCoords*uResolution)), low = high - 1;
    return vec4(CortaoLoadSSAO(ivec2(low.x, high.y) + offset), CortaoLoadSSAO(high + offset),
                CortaoLoadSSAO(ivec2(high.x, low.y) + offset), CortaoLoadSSAO(low + offset));
}

ivec4 CortaoUnpackNormalX(uvec4 packedData)
{
    const uint bits = CORTAO_PACKED_NORMAL_BITS/2u;
    return ivec4(packedData << (32u - bits)) >> int(32u - bits);
}

ivec4 CortaoUnpackNormalY(uvec4 packedData)
{
    const uint bits = CORTAO_PACKED_NORMAL_BITS/2u;
    return ivec4(packedData << (32u - bits*2u)) >> int(32u - bits);
}

vec4 CortaoCalculateWeight(uvec4 packedData, ivec2 offset, vec4 depthMultiplier, vec4 depthDeltaX, vec4 depthDeltaY,
                           ivec4 centerNormalX, ivec4 centerNormalY, float normalErrorMultiplier)
{
    vec4 sampleDepth = uintBitsToFloat(packedData)*depthMultiplier - uDepthSensitivity;
    vec4 error = abs(depthDeltaX*float(offset.x) + depthDeltaY*float(offset.y) + sampleDepth);
    ivec4 normalX = CortaoUnpackNormalX(packedData) - centerNormalX;
    ivec4 normalY = CortaoUnpackNormalY(packedData) - centerNormalY;
    vec4 normalError = vec4(normalX*normalX + normalY*normalY);
    return exp2(-(error + normalError*normalErrorMultiplier));
}

void main()
{
    uvec2 resolution = uvec2(uResolution);
    uvec2 pixel = (gl_GlobalInvocationID.xy << uvec2(1)) | uvec2(1);
    if(pixel.x > resolution.x || pixel.y > resolution.y) return;
    vec2 texCoords = vec2(pixel)/uResolution;
    uvec4 centerPackedData = CortaoGatherPackedData(texCoords, ivec2(0));
    if(all(equal(centerPackedData, uvec4(0)))) return;
    vec4 centerDepth = uintBitsToFloat(centerPackedData), inverseCenterDepth = 1.0/centerDepth;
    vec4 depthDeltaX = (centerDepth.xxww - centerDepth.yyzz)*inverseCenterDepth*uDepthSensitivity;
    vec4 depthDeltaY = (centerDepth.wzzw - centerDepth.xyyx)*inverseCenterDepth*uDepthSensitivity;
    vec4 depthMultiplier = uDepthSensitivity*inverseCenterDepth;
    ivec4 centerNormalX = CortaoUnpackNormalX(centerPackedData), centerNormalY = CortaoUnpackNormalY(centerPackedData);
    float normalErrorMultiplier = uNormalSensitivity/float(1u << (CORTAO_PACKED_NORMAL_BITS/2u));
    vec4 ssaoSum = CortaoGatherSSAO(texCoords, ivec2(0)), weightSum = vec4(1.0);
    const ivec2 offsets[6] = ivec2[6](ivec2(3, 0), ivec2(6, 0), ivec2(3, 3), ivec2(0, 3), ivec2(0, 6), ivec2(3, -3));
    for(int i = 0; i < 6; ++i)
    {
        vec4 weightA = CortaoCalculateWeight(CortaoGatherPackedData(texCoords, -offsets[i]), -offsets[i], depthMultiplier,
                                              depthDeltaX, depthDeltaY, centerNormalX, centerNormalY, normalErrorMultiplier);
        vec4 weightB = CortaoCalculateWeight(CortaoGatherPackedData(texCoords, offsets[i]), offsets[i], depthMultiplier,
                                              depthDeltaX, depthDeltaY, centerNormalX, centerNormalY, normalErrorMultiplier);
        vec4 symmetricWeight = min(weightA, weightB);
        weightSum += symmetricWeight*2.0;
        ssaoSum += CortaoGatherSSAO(texCoords, -offsets[i])*symmetricWeight;
        ssaoSum += CortaoGatherSSAO(texCoords, offsets[i])*symmetricWeight;
    }
    ssaoSum /= weightSum;
    uvec4 coords = uvec4(pixel - 1u, pixel);
    uvec2 outputCoords[4] = uvec2[4](coords.xw, coords.zw, coords.zy, coords.xy);
    for(int i = 0; i < 4; ++i)
    {
        if(centerPackedData[i] != 0u && all(lessThan(outputCoords[i], resolution)))
            imageStore(uOutput, ivec2(outputCoords[i]), vec4(ssaoSum[i]));
    }
}
]

cortaoshader denoise [
layout(local_size_x = 8, local_size_y = 8) in;
layout(binding = 2) uniform usampler2D uPackedData;
layout(binding = 4) uniform sampler2DRect uSSAO;
layout(r8, binding = 0) uniform writeonly image2DRect uOutput;
uniform vec2 uResolution;
uniform ivec2 uDirection;
uniform int uFilterEnabled, uApplyStrength;
uniform float uDepthSensitivity, uNormalSensitivity, uStrength;

uint CortaoDenoiseLoadPacked(ivec2 pixel)
{
    ivec2 size = ivec2(uResolution);
    return any(lessThan(pixel, ivec2(0))) || any(greaterThanEqual(pixel, size)) ? 0u : texelFetch(uPackedData, pixel, 0).r;
}

float CortaoDenoiseLoadSSAO(ivec2 pixel)
{
    ivec2 size = ivec2(uResolution);
    return any(lessThan(pixel, ivec2(0))) || any(greaterThanEqual(pixel, size)) ? 1.0 : texelFetch(uSSAO, pixel).r;
}

void main()
{
    ivec2 pixel = ivec2(gl_GlobalInvocationID.xy), size = ivec2(uResolution);
    if(any(greaterThanEqual(pixel, size))) return;
    uint centerPacked = CortaoDenoiseLoadPacked(pixel);
    if(centerPacked == 0u)
    {
        imageStore(uOutput, pixel, vec4(1.0));
        return;
    }

    float result = CortaoDenoiseLoadSSAO(pixel);
    if(uFilterEnabled != 0)
    {
        float centerDepth = CortaoUnpackDepth(centerPacked);
        vec3 centerNormal = CortaoDecodeNormal(centerPacked);
        uint beforePacked = CortaoDenoiseLoadPacked(pixel - uDirection);
        uint afterPacked = CortaoDenoiseLoadPacked(pixel + uDirection);
        float depthGradient = 0.0;
        if(beforePacked != 0u && afterPacked != 0u)
            depthGradient = (CortaoUnpackDepth(afterPacked) - CortaoUnpackDepth(beforePacked))*0.5;
        else if(afterPacked != 0u) depthGradient = CortaoUnpackDepth(afterPacked) - centerDepth;
        else if(beforePacked != 0u) depthGradient = centerDepth - CortaoUnpackDepth(beforePacked);

        const float spatialWeights[5] = float[5](1.0, 4.0, 6.0, 4.0, 1.0);
        float valueSum = 0.0, weightSum = 0.0;
        for(int i = -2; i <= 2; ++i)
        {
            ivec2 samplePixel = pixel + uDirection*i;
            uint samplePacked = CortaoDenoiseLoadPacked(samplePixel);
            if(samplePacked == 0u) continue;
            float sampleDepth = CortaoUnpackDepth(samplePacked);
            float predictedDepth = centerDepth + depthGradient*float(i);
            float depthError = abs(sampleDepth - predictedDepth)/max(centerDepth, 1.0e-6);
            float normalError = 1.0 - clamp(dot(centerNormal, CortaoDecodeNormal(samplePacked)), 0.0, 1.0);
            float bilateralWeight = exp2(-(depthError*uDepthSensitivity + normalError*uNormalSensitivity));
            float weight = spatialWeights[i + 2]*bilateralWeight;
            valueSum += CortaoDenoiseLoadSSAO(samplePixel)*weight;
            weightSum += weight;
        }
        result = weightSum > 0.0 ? valueSum/weightSum : result;
    }
    if(uApplyStrength != 0) result = clamp(1.0 - (1.0 - result)*uStrength, 0.0, 1.0);
    imageStore(uOutput, pixel, vec4(result));
}
]

cortaoshader debug [
layout(local_size_x = 8, local_size_y = 8) in;
layout(binding = 2) uniform usampler2D uPackedData;
layout(binding = 3) uniform usampler3D uOccluderLUT;
layout(binding = 4) uniform sampler2DRect uRawSSAO;
layout(binding = 6) uniform sampler2DRect uFinalSSAO;
layout(rgba8, binding = 0) uniform writeonly image2DRect uOutput;
uniform vec2 uResolution;
uniform int uDebugMode, uDebugMip, uMipCount, uDebugLUTSlice;
uniform float uMaxRadius, uMaxApparentRadius, uProjectionY, uMipBias;
uniform float uDepthDisplayRange, uWorldRadiusDisplayRange, uPixelRadiusDisplayRange, uPositionDisplayRange;
uniform vec3 uLUTSize;
uniform vec4 uUnprojectParams;

vec3 CortaoDebugHeatmap(float value)
{
    value = clamp(value, 0.0, 1.0);
    return clamp(vec3(1.5 - abs(4.0*value - 3.0), 1.5 - abs(4.0*value - 2.0), 1.5 - abs(4.0*value - 1.0)), 0.0, 1.0);
}

vec3 CortaoDebugPosition(vec2 texCoords, float linearDepth)
{
    vec2 direction = texCoords*uUnprojectParams.xy + uUnprojectParams.zw;
    return vec3(direction, -1.0)*linearDepth;
}

void main()
{
    ivec2 pixel = ivec2(gl_GlobalInvocationID.xy);
    if(any(greaterThanEqual(pixel, ivec2(uResolution)))) return;
    vec2 texCoords = (vec2(pixel) + 0.5)/uResolution;
    int level = uDebugMode == 5 ? uDebugMip : 0;
    ivec2 size = textureSize(uPackedData, level);
    ivec2 sourcePixel = clamp(ivec2((vec2(pixel) + 0.5)*vec2(size)/uResolution), ivec2(0), size - 1);
    uint packedData = texelFetch(uPackedData, sourcePixel, level).r;
    float linearDepth = CortaoUnpackDepth(packedData);
    vec4 color = vec4(0.0, 0.0, 0.0, 1.0);

    if(uDebugMode == 1) color.rgb = vec3(texelFetch(uRawSSAO, pixel).r);
    else if(uDebugMode == 2) color.rgb = vec3(texelFetch(uFinalSSAO, pixel).r);
    else if(uDebugMode == 10)
    {
        ivec3 lutCoords = ivec3(clamp(ivec2(texCoords*uLUTSize.xy), ivec2(0), ivec2(uLUTSize.xy) - 1),
                                clamp(uDebugLUTSlice, 0, int(uLUTSize.z) - 1));
        uint rayBits = texelFetch(uOccluderLUT, lutCoords, 0).r;
        color.rgb = CortaoDebugHeatmap(float(bitCount(rayBits))/16.0);
    }
    else if(packedData != 0u)
    {
        vec3 viewPosition = CortaoDebugPosition(texCoords, linearDepth);
        float radius = min(uMaxRadius, linearDepth*uMaxApparentRadius);
        float denominator = sqrt(max(linearDepth*linearDepth - radius*radius, 1.0e-12));
        float apparentRadius = radius/denominator;
        float pixelRadius = apparentRadius*abs(uProjectionY)*uResolution.y*0.5;
        if(uDebugMode == 3) color.rgb = vec3(clamp(linearDepth/max(uDepthDisplayRange, 1.0e-6), 0.0, 1.0));
        else if(uDebugMode == 4) color.rgb = CortaoDecodeNormal(packedData)*0.5 + 0.5;
        else if(uDebugMode == 5)
        {
            float depthValue = clamp(linearDepth/max(uDepthDisplayRange, 1.0e-6), 0.0, 1.0);
            color.rgb = mix(vec3(depthValue), CortaoDebugHeatmap(float(level)/max(float(uMipCount - 1), 1.0)), 0.65);
        }
        else if(uDebugMode == 6) color.rgb = CortaoDebugHeatmap(radius/max(uWorldRadiusDisplayRange, 1.0e-6));
        else if(uDebugMode == 7) color.rgb = CortaoDebugHeatmap(pixelRadius/max(uPixelRadiusDisplayRange, 1.0e-6));
        else if(uDebugMode == 8) color.rgb = clamp(viewPosition/max(uPositionDisplayRange, 1.0e-6)*0.5 + 0.5, 0.0, 1.0);
        else if(uDebugMode == 9)
        {
            vec3 viewDirection = -normalize(viewPosition);
            float selectedMip = log2(max(apparentRadius*inversesqrt(max(viewDirection.z, 1.0e-6)), 1.0e-6)) + uMipBias;
            color.rgb = CortaoDebugHeatmap(clamp(selectedMip, 0.0, float(uMipCount - 1))/max(float(uMipCount - 1), 1.0));
        }
    }
    imageStore(uOutput, pixel, color);
}
]
