////////////////////////////////////////////////
//
// procedural instanced grass shaders
//
////////////////////////////////////////////////

// grassType:
//   b -> blendmap
//   d -> burn damage
//   i -> transient local impulses

grassOpt = [ >= (strstr $grassType $arg1) 0 ]

grassVertexDefs = [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    attribute vec4 vtexcoord1;
    uniform vec3 camera;
    uniform vec4 grassMeshParams;  // width, height, wind scale
    uniform vec4 grassDrawParams;  // density, transition fade, distance, taper start
    uniform vec4 grassWindParams;  // phase, strength, direction
    uniform vec4 grassWindSpatial; // spatial frequency, margin, margin fade
    uniform vec4 grassWindNoiseParams;  // broad scale, scroll, gust strength, direction variation
    uniform vec4 grassWindDetailParams; // detail scale, detail strength
    uniform vec4 grassShadowParams;     // split-edge transition width, next-cascade density
    uniform sampler2D tex4;
    uniform float grassBlendThreshold;

    float grassEdgeCoverage()
    {
        float margin = grassWindSpatial.y > 0.0 ? smoothstep(0.0, grassWindSpatial.y, vtexcoord1.z) : 1.0;
        return mix(1.0, margin, grassWindSpatial.z);
    }

    bool grassRejectInstance(out float instancehash, out float coverage)
    {
        instancehash = vtexcoord1.y;
        if(instancehash > grassDrawParams.x)
        {
            coverage = 0.0;
            return true;
        }

        coverage = grassEdgeCoverage();
        return coverage <= grassBlendThreshold;
    }

    bool grassRejectShadowInstance(vec4 shadoworigin, out float instancehash, out float coverage)
    {
        instancehash = vtexcoord1.y;
        float density = grassDrawParams.x;
        if(grassShadowParams.x > 0.0)
        {
            float splitedge = max(abs(shadoworigin.x), abs(shadoworigin.y))/max(abs(shadoworigin.w), 0.0001);
            float interior = 1.0 - smoothstep(1.0 - grassShadowParams.x, 1.0, splitedge);
            density = mix(min(grassShadowParams.y, density), density, interior);
        }
        if(instancehash > density)
        {
            coverage = 0.0;
            return true;
        }

        coverage = grassEdgeCoverage();
        return coverage <= grassBlendThreshold;
    }

    vec3 grassWorldVertex(float instancehash)
    {
        float angle = vcolor.w;
        float ca = cos(angle), sa = sin(angle);
        vec2 localxy = vec2(ca*vvertex.x - sa*vvertex.y, sa*vvertex.x + ca*vvertex.y) * grassMeshParams.x * vtexcoord1.x;
        float taper = 1.0;
        if(grassDrawParams.z > grassDrawParams.w)
        {
            float dist = distance(camera, vcolor.xyz);
            taper = clamp((grassDrawParams.z - dist)/(grassDrawParams.z - grassDrawParams.w), 0.0, 1.0);
        }
        float height = grassMeshParams.y * vtexcoord1.x * taper;
        vec3 worldpos = vec3(vcolor.xyz + vec3(localxy, height*vvertex.z - 0.197*grassMeshParams.y));

        if(grassMeshParams.z > 0.0 && grassWindParams.y != 0.0)
        {
            vec2 winddir = grassWindParams.zw;
            vec2 scroll = -winddir*grassWindNoiseParams.y;
            float gustnoise = texture2D(tex4, vcolor.xy*grassWindNoiseParams.x + scroll).r*2.0 - 1.0;
            float detailnoise = texture2D(tex4, vcolor.xy*(grassWindNoiseParams.x*grassWindDetailParams.x) +
                                               scroll*1.371 + vec2(0.413, 0.719)).r*2.0 - 1.0;
            float localstrength = max(0.0, 1.0 + gustnoise*grassWindNoiseParams.z + detailnoise*grassWindDetailParams.y);
            vec2 localdir = normalize(winddir + vec2(-winddir.y, winddir.x)*(detailnoise*grassWindNoiseParams.w));
            float phase = 6.283185307 * (grassWindParams.x + instancehash +
                          dot(vcolor.xy, vec2(grassWindSpatial.x, grassWindSpatial.x*1.371)));
            float bend = sin(phase) * grassWindParams.y * localstrength * grassMeshParams.z * height * vvertex.z*vvertex.z;
            worldpos.xy += localdir * bend;
        }

        return worldpos;
    }
]

grassBurnVertexDefs = [
    uniform sampler2D tex3;
    uniform vec4 grassBurnFieldParams; // inverse world size, inverse field dimension, current timestamp tick
    uniform vec4 grassBurnTimeParams;  // timestamp quantum, ignition fade, glow duration, recovery fade (milliseconds)

    vec2 grassBurnSample(vec2 texcoord)
    {
        vec3 burnstate = texture2D(tex3, texcoord).rgb;
        if(burnstate.b <= 0.0) return vec2(0.0);

        float ignitiontick = floor(burnstate.r*65535.0 + 0.5) - 1.0,
              recovertick = floor(burnstate.g*65535.0 + 0.5) - 1.0,
              elapsedticks = mod(grassBurnFieldParams.w - ignitiontick + 65535.0, 65535.0),
              recoverydelay = mod(recovertick - ignitiontick + 65535.0, 65535.0),
              recoveryticks = grassBurnTimeParams.w/grassBurnTimeParams.x;
        // A modular timestamp just ahead of the current tick otherwise looks almost one full period old.
        if(elapsedticks > recoverydelay + recoveryticks + 1.0) return vec2(0.0);
        float burnage = elapsedticks*grassBurnTimeParams.x,
              ignition = clamp(burnage/max(grassBurnTimeParams.y, 1.0), 0.0, 1.0),
              glowphase = clamp(burnage/max(grassBurnTimeParams.z, 1.0), 0.0, 1.0),
              recovery = elapsedticks <= recoverydelay ? 0.0 :
                         clamp((elapsedticks - recoverydelay)*grassBurnTimeParams.x/max(grassBurnTimeParams.w, 1.0), 0.0, 1.0),
              strength = (1.0 - recovery)*ignition*burnstate.b;
        return vec2(strength, strength*(1.0 - abs(2.0*glowphase - 1.0)));
    }

    void grassBurnState(vec3 grassWorldPos, out float burndamage, out float burnglow)
    {
        float fielddimension = 1.0/grassBurnFieldParams.z;
        vec2 fieldcoord = grassWorldPos.xy*grassBurnFieldParams.xy*fielddimension - vec2(0.5),
             basecoord = floor(fieldcoord), blend = fract(fieldcoord),
             maxcoord = vec2(fielddimension - 1.0),
             uv00 = (clamp(basecoord, vec2(0.0), maxcoord) + vec2(0.5))*grassBurnFieldParams.z,
             uv10 = (clamp(basecoord + vec2(1.0, 0.0), vec2(0.0), maxcoord) + vec2(0.5))*grassBurnFieldParams.z,
             uv01 = (clamp(basecoord + vec2(0.0, 1.0), vec2(0.0), maxcoord) + vec2(0.5))*grassBurnFieldParams.z,
             uv11 = (clamp(basecoord + vec2(1.0), vec2(0.0), maxcoord) + vec2(0.5))*grassBurnFieldParams.z;
        vec2 burnstate = mix(mix(grassBurnSample(uv00), grassBurnSample(uv10), blend.x),
                             mix(grassBurnSample(uv01), grassBurnSample(uv11), blend.x), blend.y);
        burndamage = burnstate.r;
        burnglow = burnstate.g;
    }
]

grassImpulseVertexDefs = [
    uniform int grassImpulseCount;
    uniform vec4 grassImpulsePositions[8];  // xyz = origin, w = maximum radius
    uniform vec4 grassImpulseDirections[8]; // xyz = projectile direction, w = normalized bend intensity
    uniform vec4 grassImpulseParams[8];     // type, age seconds, propagation speed/bullet direction bias, lifetime seconds
    uniform vec4 grassImpulseControl;        // strength scale, wobble amount, wobble speed, after-wind strength
    uniform vec4 grassImpulseAfterWindParams; // duration seconds, wobble speed

    vec2 grassAfterImpulseWind(float envelope, float edgefade, float intensity, float phase)
    {
        if(envelope <= 0.0 || grassImpulseControl.w <= 0.0) return vec2(0.0);
        vec2 chaosdir = vec2(sin(phase*1.13 + vtexcoord1.y*11.7),
                             sin(phase*0.79 + vtexcoord1.y*19.3 + 2.4));
        float forcevariation = 0.68 + 0.32*sin(phase*0.61 + vtexcoord1.y*13.7 + 4.1);
        return chaosdir/max(length(chaosdir), 0.001)*
               (grassImpulseControl.x*grassImpulseControl.w*intensity*0.436332313*edgefade*envelope*forcevariation);
    }

    float grassImpulseSpring(float age, float risetime, float holdtime, float recoverytime, float variation)
    {
        if(age <= 0.0) return 0.0;
        float attack = smoothstep(0.0, risetime, age);
        if(age <= risetime + holdtime) return attack;
        float progress = clamp((age - risetime - holdtime)/max(recoverytime, 0.001), 0.0, 1.0),
              decay = (1.0 - progress)*(1.0 - progress),
              spring = sin(progress*3.141592654*mix(2.2, 3.8, variation))*(1.0 - progress)*0.24;
        return decay + spring;
    }

    vec2 grassImpulseBend(vec3 instanceorigin)
    {
        vec2 bend = vec2(0.0);
        for(int i = 0; i < 8; ++i)
        {
            if(i >= grassImpulseCount) break;
            vec3 offset = instanceorigin - grassImpulsePositions[i].xyz;
            float distancefromimpulse = length(offset.xy);
            if(distancefromimpulse >= grassImpulsePositions[i].w) continue;

            vec2 radialdir = offset.xy/max(length(offset.xy), 0.001);
            float radius = grassImpulsePositions[i].w, intensity = clamp(grassImpulseDirections[i].w, 0.0, 1.0), response;
            float normalizeddistance = clamp(distancefromimpulse/radius, 0.0, 1.0);
            float spatialphase = vtexcoord1.y*17.0 + distancefromimpulse*0.37 +
                                 dot(grassImpulsePositions[i].xy, vec2(0.071, 0.113));
            float wobblephase = grassImpulseParams[i].y*grassImpulseControl.z + spatialphase;
            float wobble = sin(wobblephase), wobbleamount = grassImpulseControl.y;
            if(grassImpulseParams[i].x < 0.5)
            {
                float corelifetime = max(grassImpulseParams[i].w - grassImpulseAfterWindParams.x, 0.001);
                float variation = fract(vtexcoord1.y*7.31 + spatialphase*0.17),
                      variation2 = fract(vtexcoord1.y*13.17 + spatialphase*0.11),
                      risetime = mix(0.035, 0.075, variation),
                      holdtime = mix(0.05, 0.12, variation2),
                      primarytime = corelifetime + min(grassImpulseAfterWindParams.x*0.18, 0.25),
                      recoverytime = max(primarytime - risetime - holdtime, 0.12)*mix(0.76, 1.0, variation2);
                response = grassImpulseSpring(grassImpulseParams[i].y, risetime, holdtime, recoverytime, variation);
                float edgefade = 1.0 - smoothstep(0.0, 1.0, normalizeddistance),
                      recoveryprogress = clamp((grassImpulseParams[i].y - risetime - holdtime)/max(recoverytime, 0.001), 0.0, 1.0),
                      wobblefade = edgefade*smoothstep(0.0, risetime, grassImpulseParams[i].y)*(1.0 - recoveryprogress),
                      afterage = grassImpulseParams[i].y,
                      afterduration = max(grassImpulseAfterWindParams.x, 0.001),
                      afterwind = smoothstep(0.0, min(0.10, afterduration*0.15), afterage)*
                                  (1.0 - smoothstep(afterduration*0.40, afterduration, afterage));
                vec2 shotdir = grassImpulseDirections[i].xy/max(length(grassImpulseDirections[i].xy), 0.001);
                vec2 rejectdir = radialdir - shotdir*grassImpulseParams[i].z;
                float bladevariation = vtexcoord1.y*2.0 - 1.0;
                rejectdir += vec2(-rejectdir.y, rejectdir.x)*(0.18*bladevariation + 0.55*wobbleamount*wobble*wobblefade);
                float bendresponse = response + 0.16*wobbleamount*wobble*wobblefade;
                bend += rejectdir/max(length(rejectdir), 0.001)*
                        (grassImpulseControl.x*intensity*1.396263402*edgefade*bendresponse);
                float afterphase = afterage*grassImpulseAfterWindParams.y + spatialphase;
                bend += grassAfterImpulseWind(afterwind, edgefade, intensity, afterphase);
            }
            else
            {
                float speed = max(grassImpulseParams[i].z, 0.001), arrivaltime = distancefromimpulse/speed,
                      timesinceimpact = grassImpulseParams[i].y - arrivaltime,
                      corelifetime = max(grassImpulseParams[i].w - grassImpulseAfterWindParams.x, 0.001),
                      remainingtime = max(corelifetime - arrivaltime, 0.001),
                      variation = fract(vtexcoord1.y*7.31 + spatialphase*0.17),
                      variation2 = fract(vtexcoord1.y*13.17 + spatialphase*0.11),
                      risetime = mix(0.05, 0.13, variation),
                      holdtime = min(mix(0.12, 0.28, intensity)*mix(0.75, 1.25, variation2), remainingtime*0.30),
                      primarytime = remainingtime + min(grassImpulseAfterWindParams.x*0.35, 0.55),
                      recoverytime = max(primarytime - risetime - holdtime, 0.16)*mix(0.78, 1.0, variation2),
                      recoveryprogress = clamp((timesinceimpact - risetime - holdtime)/max(recoverytime, 0.001), 0.0, 1.0),
                      returnphase = max(timesinceimpact - risetime - holdtime, 0.0)*grassImpulseAfterWindParams.y + spatialphase,
                      returnwobble = sin(returnphase) + 0.35*sin(returnphase*1.73 + vtexcoord1.y*8.3);
                if(timesinceimpact < 0.0) response = 0.0;
                else response = grassImpulseSpring(timesinceimpact, risetime, holdtime, recoverytime, variation);
                float afterwindedgefade = max(1.0 - normalizeddistance, 0.0),
                      impulseedgefade = afterwindedgefade*(1.0 + 1.25*normalizeddistance),
                      recoverychaos = (1.0 - recoveryprogress)*step(risetime + holdtime, timesinceimpact),
                      wakewobble = afterwindedgefade*step(0.0, timesinceimpact)*response*wobbleamount*
                                   mix(0.30*wobble, returnwobble, recoverychaos),
                      afterage = max(timesinceimpact, 0.0),
                      afterduration = max(grassImpulseAfterWindParams.x, 0.001),
                      afterwind = smoothstep(0.0, min(0.10, afterduration*0.15), afterage)*
                                  (1.0 - smoothstep(afterduration*0.40, afterduration, afterage));
                vec2 explosiondir = radialdir + vec2(-radialdir.y, radialdir.x)*(0.70*wakewobble);
                float bendresponse = response*(1.0 + 0.18*wobbleamount*returnwobble*recoverychaos);
                bend += explosiondir/max(length(explosiondir), 0.001)*
                        (grassImpulseControl.x*intensity*1.483529864*impulseedgefade*bendresponse);
                float afterphase = afterage*grassImpulseAfterWindParams.y + spatialphase;
                bend += grassAfterImpulseWind(afterwind, afterwindedgefade, intensity, afterphase);
            }
        }
        return bend;
    }

    vec3 grassBendBlade(vec3 worldpos, vec3 instanceorigin, float bladeheight)
    {
        vec2 bend = grassImpulseBend(instanceorigin);
        float bendangle = min(length(bend), 1.483529864);
        if(bendangle <= 0.0001 || vvertex.z <= 0.0) return worldpos;
        vec2 benddir = bend/bendangle;
        float arcangle = bendangle*vvertex.z, arcradius = bladeheight/bendangle;
        vec2 horizontaloffset = benddir*(arcradius*(1.0 - cos(arcangle)));
        float bentheight = arcradius*sin(arcangle);
        return worldpos + vec3(horizontaloffset, bentheight - bladeheight*vvertex.z);
    }
]

grassVariantShader = [
    local grassType
    grassType = $arg2
    variantshader 0 $arg1 (? (grassOpt "b") 0 -1) [
        @grassVertexDefs
        @(? (grassOpt "d") [@grassBurnVertexDefs])
        @(? (grassOpt "i") [@grassImpulseVertexDefs])
        uniform mat4 camprojmatrix;
        @(ginterpvert)
        varying vec2 texcoord0;
        varying float coverage;
        @(? (grassOpt "d") [varying float burndamage, burnglow;])
        @(? (grassOpt "b") [uniform vec4 blendmapparams; varying vec2 texcoord1;])
        void main(void)
        {
            float instancehash;
            if(grassRejectInstance(instancehash, coverage))
            {
                // Collapse every vertex in the rejected instance outside the clip volume.
                gl_Position = vec4(2.0, 0.0, 0.0, 1.0);
                texcoord0 = vec2(0.0);
                coverage = 0.0;
                @(? (grassOpt "d") [burndamage = burnglow = 0.0;])
                @(? (grassOpt "b") [texcoord1 = vec2(0.0);])
                return;
            }
            vec3 worldpos = grassWorldVertex(instancehash);
            @(? (grassOpt "i") [
                float taper = 1.0;
                if(grassDrawParams.z > grassDrawParams.w)
                {
                    float dist = distance(camera, vcolor.xyz);
                    taper = clamp((grassDrawParams.z - dist)/(grassDrawParams.z - grassDrawParams.w), 0.0, 1.0);
                }
                float bladeheight = grassMeshParams.y*vtexcoord1.x*taper;
                worldpos = grassBendBlade(worldpos, vcolor.xyz, bladeheight);
            ])
            @(? (grassOpt "d") [grassBurnState(vcolor.xyz, burndamage, burnglow);])
            gl_Position = camprojmatrix * vec4(worldpos, 1.0);
            texcoord0 = vtexcoord0;
            @(? (grassOpt "b") [
                texcoord1 = (worldpos.xy - blendmapparams.xy)*blendmapparams.zw;
            ])
            @(gdepthpackvert)
        }
    ] [
        uniform sampler2D tex0;
        @(? (grassOpt "d") [uniform sampler2D tex2;])
        uniform vec4 grassColourParams, grassDrawParams;
        uniform float grassRootDarknessPower;
        @(? (grassOpt "d") [uniform vec3 grassBurnColourParams, grassBurnGlowColourParams, grassBurnAnimParams;])
        uniform float grassBlendThreshold;
        @(ginterpfrag)
        varying vec2 texcoord0;
        varying float coverage;
        @(? (grassOpt "d") [varying float burndamage, burnglow;])
        @(? (grassOpt "b") [uniform sampler2D tex1; varying vec2 texcoord1;])
        void main(void)
        {
            vec4 color = texture2D(tex0, texcoord0);
            float rootfade = pow(texcoord0.y, grassRootDarknessPower);
            color.rgb *= grassColourParams.rgb * (1.0 - grassColourParams.a*rootfade);
            @(? (grassOpt "d") [color.rgb *= mix(vec3(1.0), grassBurnColourParams, burndamage);])
            color.a *= coverage;
            @(? (grassOpt "b") [
                color.a *= texture2D(tex1, texcoord1).r;
            ])
            float alphatest = mix(1.0, grassBlendThreshold, grassDrawParams.y);
            if(color.a <= alphatest) discard;
            gcolor = vec4(color.rgb, 0.0);
            vec3 glow = vec3(0.0);
            @(? (grassOpt "d") [
                float burnmask = texture2D(tex2, texcoord0 + grassBurnAnimParams.xy).r;
                glow = grassBurnGlowColourParams * (burnmask*burnglow*grassBurnAnimParams.z);
            ])
            @(gglowpack glow packnorm)
            @(gnormpackdef [vec3(0.5, 0.5, 1.0)] packnorm)
            @(gdepthpackfrag)
        }
    ]
]

grassShadowVariantShader = [
    local grassType
    grassType = $arg2
    variantshader 0 $arg1 (? (grassOpt "b") 0 -1) [
        @grassVertexDefs
        uniform mat4 shadowmatrix;
        varying vec2 texcoord0;
        varying float coverage;
        @(? (grassOpt "b") [uniform vec4 blendmapparams; varying vec2 texcoord1;])
        void main(void)
        {
            float instancehash;
            vec4 shadoworigin = shadowmatrix * vec4(vcolor.xyz, 1.0);
            if(grassRejectShadowInstance(shadoworigin, instancehash, coverage))
            {
                // Collapse every vertex in the rejected instance outside the clip volume.
                gl_Position = vec4(2.0, 0.0, 0.0, 1.0);
                texcoord0 = vec2(0.0);
                coverage = 0.0;
                @(? (grassOpt "b") [texcoord1 = vec2(0.0);])
                return;
            }
            vec3 worldpos = grassWorldVertex(instancehash);
            gl_Position = shadowmatrix * vec4(worldpos, 1.0);
            texcoord0 = vtexcoord0;
            @(? (grassOpt "b") [
                texcoord1 = (worldpos.xy - blendmapparams.xy)*blendmapparams.zw;
            ])
        }
    ] [
        uniform sampler2D tex0;
        uniform float grassBlendThreshold;
        varying vec2 texcoord0;
        varying float coverage;
        @(? (grassOpt "b") [uniform sampler2D tex1; varying vec2 texcoord1;])
        void main(void)
        {
            float alpha = texture2D(tex0, texcoord0).a * coverage;
            @(? (grassOpt "b") [
                alpha *= texture2D(tex1, texcoord1).r;
            ])
            if(alpha <= grassBlendThreshold) discard;
        }
    ]
]

grassShader = [
    grassVariantShader "grass" ""
    grassVariantShader "grass" "b"
]

grassImpulseShader = [
    grassVariantShader "grassimpulse" "i"
    grassVariantShader "grassimpulse" "bi"
]

grassBurnShader = [
    grassVariantShader "grassburn" "d"
    grassVariantShader "grassburn" "bd"
]

grassBurnImpulseShader = [
    grassVariantShader "grassburnimpulse" "di"
    grassVariantShader "grassburnimpulse" "bdi"
]

grassShadowShader = [
    grassShadowVariantShader "grassshadow" ""
    grassShadowVariantShader "grassshadow" "b"
]
