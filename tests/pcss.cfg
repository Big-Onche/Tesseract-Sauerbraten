// Compile PCSS and legacy deferred variants without changing gameplay settings.
pcsssavedquality = $csmpcssquality
loop pcssq 3 [
    csmpcssquality $pcssq
    looplist pcssmode [N f F E g G] [
        looplist pcsscolor [c ch chC] [
            looplist pcsssplits [1 3 8] [
                echo (concat PCSS_SHADER_CHECK $pcssq $pcssmode $pcsscolor $pcsssplits)
                deferredlightshader (concatword $pcssmode td) p (concatword $pcsscolor $pcssq $pcsssplits) $pcsssplits 0 0
            ]
        ]
    ]
]
csmpcssquality $pcsssavedquality
echo PCSS_SHADER_CHECK_DONE
