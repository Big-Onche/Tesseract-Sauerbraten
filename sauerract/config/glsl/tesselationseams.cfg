// Shared edge evaluation. Tables are independent of draw order, UV seams and VA ownership.
tesselationconstraints = [
    uniform sampler2D tessconstraints, tessheights;
    uniform vec4 tessconstraintparams;

    vec4 tessdata(int address)
    {
        int width = int(tessconstraintparams.x);
        return texelFetch(tessconstraints, ivec2(address % width, address / width), 0);
    }

    int tesswrap(int value, int size, bool clamped, bool mirrored)
    {
        if(clamped) return clamp(value, 0, size-1);
        int period = mirrored ? size*2 : size;
        value = ((value % period) + period) % period;
        return mirrored && value >= size ? period-1-value : value;
    }

    float tessheighttexel(vec4 mip, ivec2 pixel)
    {
        int mode = int(mip.w);
        pixel.x = tesswrap(pixel.x, int(mip.y), (mode & 1) != 0, (mode & 4) != 0);
        pixel.y = tesswrap(pixel.y, int(mip.z), (mode & 2) != 0, (mode & 4) != 0);
        int address = int(mip.x)*4 + pixel.y*int(mip.y) + pixel.x;
        int width = int(tessconstraintparams.x), packedindex = address/4;
        return texelFetch(tessheights, ivec2(packedindex % width, packedindex / width), 0)[address % 4];
    }

    float tessheightlevel(int address, vec2 uv)
    {
        vec4 mip = tessdata(address);
        vec2 pixel = uv*mip.yz - 0.5;
        ivec2 origin = ivec2(floor(pixel));
        vec2 f = fract(pixel);
        return mix(mix(tessheighttexel(mip, origin), tessheighttexel(mip, origin + ivec2(1, 0)), f.x),
                   mix(tessheighttexel(mip, origin + ivec2(0, 1)), tessheighttexel(mip, origin + ivec2(1, 1)), f.x), f.y);
    }

    float tesssharedheight(int address, vec2 uv)
    {
        if(address < 0) return 0.0;
        vec4 header = tessdata(address);
        float lod = clamp(tessparams.z, 0.0, max(header.y-1.0, 0.0));
        if(header.y < 0.5) return 0.0;
        int low = int(floor(lod)), high = min(low+1, int(header.y)-1);
        if(fract(lod) == 0.0) return tessheightlevel(int(header.x)+low, uv);
        return mix(tessheightlevel(int(header.x)+low, uv), tessheightlevel(int(header.x)+high, uv), fract(lod));
    }

    float tesssharedmaterial(int address, vec3 position, vec3 normal, vec3 plane)
    {
        if(address < 0) return 0.0;
        vec4 displacement = tessdata(address), uv = tessdata(address+1), scale = tessdata(address+2);
        vec4 bias = tessdata(address+3), options = tessdata(address+4);
        float height;
        if(options.z > 0.5)
        {
            vec3 weights = tessmaterialtriplanar(normal, bias.xyz);
            height = dot(weights, vec3(tesssharedheight(int(displacement.z), vec2(position.y, -position.z)*scale.xy),
                                      tesssharedheight(int(displacement.z), vec2(position.x, -position.z)*scale.xy),
                                      tesssharedheight(int(displacement.w), position.xy*scale.zw)));
        }
        else
        {
            uv.zw += options.xy*tessconstraintparams.z;
            height = tesssharedheight(int(displacement.z), tessmaterialuv(position, plane, uv, bias.w));
        }
        return (height*displacement.x + displacement.y)*tessconstraintparams.y;
    }

    float tesssharedblend(int address, float along, vec3 position)
    {
        if(address < 0) return 1.0;
        vec4 header = tessdata(address);
        int low = 0, high = int(header.y)-1;
        while(low < high)
        {
            int middle = (low+high)/2;
            if(along >= tessdata(int(header.x)+2*middle).y) low = middle+1;
            else high = middle;
        }
        int cell = int(header.x)+2*low;
        vec4 bounds = tessdata(cell), values = tessdata(cell+1);
        vec2 f = clamp(position.xy*header.z-0.5-bounds.zw, 0.0, 1.0);
        return mix(mix(values.x, values.y, f.x), mix(values.z, values.w, f.x), f.y);
    }

    void tesssharedsurface(int address, float along, vec3 position, out vec3 normal, out float height)
    {
        vec4 a = tessdata(address), b = tessdata(address+1), plane = tessdata(address+2);
        vec3 raw = mix(a.xyz, b.xyz, along);
        normal = normalize(raw);
        float base = tesssharedmaterial(int(a.w), position, raw, plane.xyz);
        float layer = tesssharedmaterial(int(b.w), position, raw, plane.xyz);
        float blend = plane.w > 0.5 ? tesssharedblend(int(tessdata(address+3).w), along, position) : 1.0;
        height = mix(layer, base, blend);
    }

    vec3 tessboundedsolve(mat3 system, vec3 rhs, float budget, float count, float heightbound)
    {
        // Regularized plane intersection: convex and reentrant corners use the same signed plane constraints.
        // A local trust radius bounds acute/opposed-normal solutions instead of amplifying displacement without limit.
        float damping = max(0.0001, (1.0-cos(radians(tessseamparams.z)))*0.0075);
        vec3 displacement = inverse(system + mat3(damping))*(rhs + damping*rhs/max(count, 1.0));
        return displacement*min(1.0, min(budget, 2.0*heightbound)/max(length(displacement), 1e-8));
    }

    vec3 tesssharedcorner(int vertex)
    {
        vec4 info = tessdata(2*vertex+1);
        if(info.w > 1.5) return vec3(0.0);
        vec3 position = tessdata(2*vertex).xyz, rhs = vec3(0.0);
        mat3 system = mat3(0.0);
        float count = 0.0, heightbound = 0.0;
        vec3 first = vec3(0.0);
        for(int node = int(info.x); node >= 0; node = int(tessdata(node).z))
        {
            vec4 entry = tessdata(node);
            vec3 normal;
            float height;
            tesssharedsurface(int(entry.x), entry.y, position, normal, height);
            if(count == 0.0) first = normal*height;
            system += outerProduct(normal, normal);
            rhs += normal*height;
            count += 1.0;
            heightbound = max(heightbound, abs(height));
        }
        return info.w < 0.5 ? first : tessboundedsolve(system, rhs, info.z, count, heightbound);
    }

    vec3 tesspatchmapping()
    {
        int edge = tess_edges.x;
        if(edge >= 0)
        {
            vec4 header = tessdata(edge);
            for(int i = 0; i < int(header.w); ++i)
            {
                int surface = int(tessdata(int(header.z)+i).x);
                if(all(equal(tessdata(surface+3).xyz, tess_position[0]))) return tessdata(surface+2).xyz;
            }
        }
        return cross(tess_position[1]-tess_position[0], tess_position[2]-tess_position[0]);
    }

    vec3 tessedgevalue(int edge, float along)
    {
        vec4 header = tessdata(edge), info = tessdata(edge+1);
        if(info.x == 1.0) return vec3(0.0);
        vec3 position = mix(tessdata(2*int(header.x)).xyz, tessdata(2*int(header.y)).xyz, along);
        vec3 rhs = vec3(0.0), first = vec3(0.0);
        mat3 system = mat3(0.0);
        float heightbound = 0.0;
        for(int i = 0; i < int(header.w); ++i)
        {
            vec3 normal;
            float height;
            tesssharedsurface(int(tessdata(int(header.z)+i).x), along, position, normal, height);
            heightbound = max(heightbound, abs(height));
            if(i == 0) first = normal*height;
            if(info.x == 0.0) return first;
            system += outerProduct(normal, normal);
            rhs += normal*height;
        }
        return tessboundedsolve(system, rhs, info.y, header.w, heightbound);
    }

    vec3 tesssharededge(int edge, float along)
    {
        vec4 header = tessdata(edge);
        int a = int(header.x), b = int(header.y);
        if(along <= 0.0) return tesssharedcorner(a);
        if(along >= 1.0) return tesssharedcorner(b);
        vec3 result = tessedgevalue(edge, along);
        float span = min(max(tessseamparams.y, 0.001)/max(distance(tessdata(2*a).xyz, tessdata(2*b).xyz), 1e-6), 0.25);
        if(along < span && tessdata(2*a+1).w > 0.5)
            result = mix(result, tesssharedcorner(a), 1.0 - smoothstep(0.0, span, along));
        if(along > 1.0-span && tessdata(2*b+1).w > 0.5)
            result = mix(result, tesssharedcorner(b), 1.0 - smoothstep(0.0, span, 1.0-along));
        return result;
    }

    vec3 tesscanonicalposition(vec3 barycentric)
    {
        if(tessconstraintparams.x <= 0.0)
            return barycentric.x*tess_position[0] + barycentric.y*tess_position[1] + barycentric.z*tess_position[2];
        // Endpoint ordering is shared across patches; never interpolate the float IDs.
        for(int i = 0; i < 3; ++i) if(barycentric[i] == 1.0) return tess_position[i];
        for(int i = 0; i < 3; ++i) if(barycentric[i] == 0.0)
        {
            int a = (i+1)%3, b = (i+2)%3;
            int edge = tess_edges[i];
            if(edge >= 0)
            {
                vec4 header = tessdata(edge);
                if(int(header.x) != int(tess_seamvertexdistance[a])) { int temporary = a; a = b; b = temporary; }
                return mix(tessdata(2*int(header.x)).xyz, tessdata(2*int(header.y)).xyz, barycentric[b]);
            }
            if(tess_seamvertexdistance[a] > tess_seamvertexdistance[b]) { int temporary = a; a = b; b = temporary; }
            return mix(tess_position[a], tess_position[b], barycentric[b]);
        }
        return barycentric.x*tess_position[0] + barycentric.y*tess_position[1] + barycentric.z*tess_position[2];
    }

    vec3 tessconstrain(vec3 position, vec3 regular, out vec3 debug)
    {
        debug = vec3(0.0);
        if(tessseamparams.x < 0.5 || tessconstraintparams.y <= 0.0) return regular;
        vec3 sum = vec3(0.0);
        float total = 0.0, influence = 0.0;
        for(int i = 0; i < 3; ++i)
        {
            int ai = (i+1)%3, bi = (i+2)%3;
            int a = int(tess_seamvertexdistance[ai]), b = int(tess_seamvertexdistance[bi]);
            int edge = tess_edges[i];
            if(edge < 0) continue;
            vec4 header = tessdata(edge), info = tessdata(edge+1);
            vec3 start = tessdata(2*int(header.x)).xyz, end = tessdata(2*int(header.y)).xyz;
            vec3 direction = end-start;
            float squared = max(dot(direction, direction), 1e-12);
            float along = clamp(dot(position-start, direction)/squared, 0.0, 1.0);
            vec3 nearest = mix(start, end, along);
            float dist = distance(position, nearest);
            float altitude = length(cross(tess_position[i]-start, direction))/sqrt(squared);
            float width = min(max(tessseamparams.y, 0.001), 0.25*altitude);
            float cornerwidth = min(max(tessseamparams.y, 0.001)/sqrt(squared), 0.25);
            bool affected = info.x > 0.5 || (tessdata(2*int(header.x)+1).w > 0.5 && along < cornerwidth) ||
                            (tessdata(2*int(header.y)+1).w > 0.5 && along > 1.0-cornerwidth);
            // An exact boundary always evaluates its shared function, even on otherwise continuous edges.
            if(dist < 1e-5)
            {
                debug = info.x == 1.0 ? vec3(1.0, 0.0, 0.0) : info.x > 0.5 ? vec3(1.0, 0.5, 0.0) : vec3(0.0, 1.0, 0.0);
                return tesssharededge(edge, along);
            }
            if(!affected || dist >= width) continue;
            float fade = 1.0 - smoothstep(0.0, max(width, 1e-6), dist);
            float weight = fade/max(dist*dist, 1e-10);
            sum += weight*tesssharededge(edge, along);
            total += weight;
            influence = max(influence, fade);
            debug = max(debug, vec3(fade, 0.25*fade, 1.0-fade));
        }
        return total > 0.0 ? mix(regular, sum/total, influence) : regular;
    }
    vec3 tesspatchdisplacement(vec3 position, vec3 regular, out vec3 debug)
    {
        if(tessseamparams.x > 0.5 && tessconstraintparams.y > 0.0)
        {
            for(int i = 0; i < 3; ++i) if(gl_TessCoord[i] == 1.0)
            {
                int vertex = int(tess_seamvertexdistance[i]);
                debug = vec3(tessdata(2*vertex+1).w > 0.5 ? 1.0 : 0.0, 1.0, 0.0);
                return tesssharedcorner(vertex);
            }
            for(int i = 0; i < 3; ++i) if(gl_TessCoord[i] == 0.0 && tess_edges[i] >= 0)
            {
                int edge = tess_edges[i], a = (i+1)%3, b = (i+2)%3;
                vec4 header = tessdata(edge), info = tessdata(edge+1);
                if(int(header.x) != int(tess_seamvertexdistance[a])) b = a;
                debug = vec3(info.x > 0.5 ? 1.0 : 0.0, 1.0, 0.0);
                return tesssharededge(edge, gl_TessCoord[b]);
            }
        }
        return tessconstrain(position, regular, debug);
    }

    vec4 tessseamvisualization(vec3 position, vec3 transition)
    {
        float mode = tessconstraintparams.w;
        vec3 color = mode > 3.5 ? vec3(transition.x) : vec3(0.03);
        if(mode < 0.5 || mode > 3.5) return vec4(color, mode);
        for(int i = 0; i < 3; ++i)
        {
            int edge = tess_edges[i];
            if(edge < 0) continue;
            vec4 header = tessdata(edge), info = tessdata(edge+1);
            vec3 a = tessdata(2*int(header.x)).xyz, b = tessdata(2*int(header.y)).xyz;
            vec3 delta = b-a;
            float along = clamp(dot(position-a, delta)/max(dot(delta, delta), 1e-12), 0.0, 1.0);
            float dist = distance(position, mix(a, b, along));
            float line = 1.0-smoothstep(0.0, min(0.5, length(delta)*0.03), dist);
            vec3 edgecolor = info.x == 1.0 ? vec3(1.0, 0.0, 0.0) : info.x > 0.5 ? vec3(1.0, 0.5, 0.0) : vec3(0.0, 0.7, 0.1);
            if(mode > 1.5 && mode < 2.5)
                edgecolor = 0.2 + 0.8*fract(vec3(0.1031, 0.11369, 0.13787)*float(edge));
            if(mode > 2.5)
            {
                bool junction = (info.z > 0.5 && along < 0.15) || (info.w > 0.5 && along > 0.85);
                edgecolor = junction ? vec3(1.0, 0.0, 1.0) : info.x == 1.0 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 0.25, 0.3);
            }
            color = max(color, edgecolor*line);
        }
        return vec4(color, mode);
    }

]
tesselationedgefactor = [
    uniform sampler2D tessconstraints;
    uniform vec4 tessconstraintparams;

    vec4 tesscontroldata(int address)
    {
        int width = int(tessconstraintparams.x);
        return texelFetch(tessconstraints, ivec2(address % width, address / width), 0);
    }

    int tesscontroledge(int ia, int ib)
    {
        if(tessconstraintparams.x <= 0.0 || tess_seamdistance[ia] < 0.0 || tess_seamdistance[ib] < 0.0) return -1;
        int a = int(tess_seamdistance[ia]), b = int(tess_seamdistance[ib]);
        for(int node = int(tesscontroldata(2*a).w); node >= 0; node = int(tesscontroldata(node).z))
        {
            vec4 entry = tesscontroldata(node);
            if(int(entry.x) == b) return int(entry.y);
        }
        return -1;
    }

    float tesscommonfactor(int ia, int ib, int edge)
    {
        if(tess_seamdistance[ia] > tess_seamdistance[ib]) { int temporary = ia; ia = ib; ib = temporary; }
        if(tessseamparams.x > 0.5 && edge >= 0 && tesscontroldata(edge+1).x == 1.0) return 1.0;
        vec3 a = tess_vertex[ia], b = tess_vertex[ib], delta = b-a;
        float along = clamp(dot(camera-a, delta)/max(dot(delta, delta), 1e-12), 0.0, 1.0);
        float dist = distance(camera, mix(a, b, along));
        if(tessdistanceparams.x <= 0.0 || dist >= tessdistanceparams.x) return 1.0;
        float minimum = min(tessadaptiveparams.x, tessadaptiveparams.y);
        if(tessadaptiveoptions.y < 0.5) return clamp(tessfactor, minimum, tessadaptiveparams.y);
        float screen = length(delta)*tessviewparams.y/max(dist, 1.0)/max(tessadaptiveparams.z, 1.0);
        float texels = edge >= 0 ? tesscontroldata(edge+2).x : 0.0;
        float detail = max(length(delta)/max(tessadaptiveoptions.x, 1.0), texels/max(tessadaptiveparams.w, 1.0));
        return ceil(clamp(min(screen, detail), minimum, tessadaptiveparams.y));
    }
]
