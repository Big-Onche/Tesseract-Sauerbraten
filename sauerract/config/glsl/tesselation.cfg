tesselationblenddisplacement = [
    vec2 tessmaterialuv(vec3 position, vec3 surfacenormal, vec4 uvparams, float uvrotation)
    {
        vec3 axis = abs(surfacenormal);
        int dim = axis.x >= axis.y && axis.x >= axis.z ? 0 : (axis.y >= axis.z ? 1 : 2);
        float s = dim == 0 ? position.y : position.x;
        float t = dim == 2 ? position.y : position.z;
        if(uvrotation > 0.5)
        {
            float swapped = dim <= 1 ? -t : t;
            return vec2(swapped*uvparams.x + uvparams.z, s*uvparams.y + uvparams.w);
        }
        return vec2(s*uvparams.x + uvparams.z, (dim <= 1 ? -t : t)*uvparams.y + uvparams.w);
    }

    vec3 tessmaterialtriplanar(vec3 surfacenormal, vec3 bias)
    {
        vec3 blend = max(abs(surfacenormal) - bias, 0.001);
        blend *= blend;
        return blend/(blend.x + blend.y + blend.z);
    }

    float tessmaterialdisplacement(sampler2D normaltex, sampler2D detailtex, vec3 position, vec3 surfacenormal, vec3 mappingnormal,
                                   vec4 displace, vec4 uvparams, float uvrotation, vec4 triscale, vec4 tripbias, float lod)
    {
        if(displace.z < 0.5) return 0.0;
        float height;
        if(displace.w > 0.5)
        {
            vec3 blend = tessmaterialtriplanar(surfacenormal, tripbias.xyz);
            float heightx = textureLod(normaltex, vec2(position.y, -position.z)*triscale.xy, lod).a;
            float heighty = textureLod(normaltex, vec2(position.x, -position.z)*triscale.xy, lod).a;
            float heightz = tripbias.w > 0.5 ? textureLod(detailtex, position.xy*triscale.zw, lod).a :
                                              textureLod(normaltex, position.xy*triscale.xy, lod).a;
            height = dot(vec3(heightx, heighty, heightz), blend);
        }
        else height = textureLod(normaltex, tessmaterialuv(position, mappingnormal, uvparams, uvrotation), lod).a;
        return height*displace.x + displace.y;
    }

    float tessblenddisplacement(vec3 position, vec3 surfacenormal, vec3 mappingnormal, float baselod, float layerlod,
                                out float basedisplacement, out float layerdisplacement, out float blendweight)
    {
        basedisplacement = tessmaterialdisplacement(tessbasenormalmap, tessbasedetailnormalmap, position, surfacenormal, mappingnormal,
                                                    tessbasedisplace, tessbaseuvparams, tessbaseuvrotation,
                                                    tessbasetriscale, tessbasetripbias, baselod);
        layerdisplacement = tessmaterialdisplacement(tesslayernormalmap, tesslayerdetailnormalmap, position, surfacenormal, mappingnormal,
                                                     tesslayerdisplace, tesslayeruvparams, tesslayeruvrotation,
                                                     tesslayertriscale, tesslayertripbias, layerlod);
        blendweight = tessblendparams.x > 0.5 ? textureLod(blendmap, (position.xy - blendmapparams.xy)*blendmapparams.zw, 0.0).r : 1.0;
        return mix(layerdisplacement, basedisplacement, blendweight);
    }
]

tesselationworldcontrolshader = [
    local worldtype
    worldtype = $arg1
    result [
        layout(vertices = 3) out;
        uniform float tessfactor;
        uniform vec4 tessadaptiveparams, tessdistanceparams;
        uniform vec3 camera;

        in vec3 nvec[];
        out vec3 tess_nvec[];
        in vec3 tess_vertex[];
        in float tess_seamdistance[];
        out vec3 tess_position[];
        out float tess_seamvertexdistance[];
        @(? (|| $gdepthformat $msaalight $msaasamples) [
            in float lineardepth[];
            out float tess_lineardepth[];
        ])
        @(if (wtopt "T") [result [
            in vec2 texcoordx[], texcoordy[], texcoordz[];
            out vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
        ]] [result [
            in vec2 texcoord0[];
            out vec2 tess_texcoord0[];
        ]])
        @(? (wtopt "r") [
            in vec3 camvec[];
            out vec3 tess_camvec[];
        ])

        bool tessworldedgeeligible(int a, int b)
        {
            vec3 edge = tess_vertex[b] - tess_vertex[a];
            float edgesquared = dot(edge, edge);
            float along = edgesquared > 1e-8 ? clamp(dot(camera - tess_vertex[a], edge)/edgesquared, 0.0, 1.0) : 0.0;
            return tessdistanceparams.x > 0.0 && distance(camera, tess_vertex[a] + edge*along) < tessdistanceparams.x;
        }

        bool tessworldpatcheligible(void)
        {
            vec3 bbmin = min(tess_vertex[0], min(tess_vertex[1], tess_vertex[2]));
            vec3 bbmax = max(tess_vertex[0], max(tess_vertex[1], tess_vertex[2]));
            return tessdistanceparams.x > 0.0 && distance(camera, clamp(camera, bbmin, bbmax)) < tessdistanceparams.x;
        }

        void main(void)
        {
            gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;
            tess_nvec[gl_InvocationID] = nvec[gl_InvocationID];
            tess_position[gl_InvocationID] = tess_vertex[gl_InvocationID];
            tess_seamvertexdistance[gl_InvocationID] = tess_seamdistance[gl_InvocationID];
            @(? (|| $gdepthformat $msaalight $msaasamples) [tess_lineardepth[gl_InvocationID] = lineardepth[gl_InvocationID];])
            @(if (wtopt "T") [result [
                tess_texcoordx[gl_InvocationID] = texcoordx[gl_InvocationID];
                tess_texcoordy[gl_InvocationID] = texcoordy[gl_InvocationID];
                tess_texcoordz[gl_InvocationID] = texcoordz[gl_InvocationID];
            ]] [result [
                tess_texcoord0[gl_InvocationID] = texcoord0[gl_InvocationID];
            ]])
            @(? (wtopt "r") [tess_camvec[gl_InvocationID] = camvec[gl_InvocationID];])

            if(gl_InvocationID == 0)
            {
                float minimum = min(tessadaptiveparams.x, tessadaptiveparams.y);
                gl_TessLevelOuter[0] = tessworldedgeeligible(1, 2) ? tessfactor : minimum;
                gl_TessLevelOuter[1] = tessworldedgeeligible(2, 0) ? tessfactor : minimum;
                gl_TessLevelOuter[2] = tessworldedgeeligible(0, 1) ? tessfactor : minimum;
                gl_TessLevelInner[0] = tessworldpatcheligible() ? tessfactor : minimum;
            }
        }
    ]
]

tesselationworldevaluationshader = [
    local worldtype
    worldtype = $arg1
    result [
        layout(triangles, equal_spacing, ccw) in;

        uniform mat4 camprojmatrix;
        uniform sampler2D blendmap, tessbasenormalmap, tessbasedetailnormalmap, tesslayernormalmap, tesslayerdetailnormalmap;
        uniform vec4 tessparams, tessdistanceparams, tessseamparams, tessblendparams, blendmapparams;
        uniform vec4 tessbasedisplace, tessbaseuvparams, tessbasemapsize, tessbasetriscale, tessbasetripbias;
        uniform vec4 tesslayerdisplace, tesslayeruvparams, tesslayermapsize, tesslayertriscale, tesslayertripbias;
        uniform float tessbaseuvrotation, tesslayeruvrotation;
        uniform vec3 camera;
        in vec3 tess_nvec[];
        in vec3 tess_position[];
        in float tess_seamvertexdistance[];
        out vec3 nvec;
        out vec2 texcoord1;
        @(? (|| $gdepthformat $msaalight $msaasamples) [
            uniform vec2 lineardepthscale;
            in float tess_lineardepth[];
            out float lineardepth;
        ])
        @(if (wtopt "T") [result [
            in vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
            out vec2 texcoordx, texcoordy, texcoordz;
        ]] [result [
            in vec2 tess_texcoord0[];
            out vec2 texcoord0;
        ]])
        @(? (wtopt "r") [
            in vec3 tess_camvec[];
            out vec3 camvec;
        ])
        @(? (wtopt "G") [
            uniform float millis;
            uniform vec4 pulseglowspeed;
            flat out float pulse;
        ])

        #define tessmix(value) (gl_TessCoord.x * value[0] + gl_TessCoord.y * value[1] + gl_TessCoord.z * value[2])

        @tesselationblenddisplacement

        float tessworlddistancefade(vec3 position)
        {
            float cameradistance = distance(position, camera);
            if(tessdistanceparams.x <= 0.0) return 0.0;
            if(tessdistanceparams.z <= 0.0) return cameradistance < tessdistanceparams.x ? 1.0 : 0.0;
            return 1.0 - smoothstep(tessdistanceparams.y, tessdistanceparams.x, cameradistance);
        }

        void main(void)
        {
            vec4 clipposition = gl_TessCoord.x * gl_in[0].gl_Position + gl_TessCoord.y * gl_in[1].gl_Position +
                                gl_TessCoord.z * gl_in[2].gl_Position;
            vec3 position = tessmix(tess_position);
            texcoord1 = (position.xy - blendmapparams.xy)*blendmapparams.zw;
            vec3 rawnormal = tessmix(tess_nvec);
            vec3 surfacenormal = normalize(rawnormal);
            vec3 positionedge0 = tess_position[0] - tess_position[2], positionedge1 = tess_position[1] - tess_position[2];
            vec3 normaledge0 = tess_nvec[0] - tess_nvec[2], normaledge1 = tess_nvec[1] - tess_nvec[2];
            vec3 mappingnormal = cross(positionedge0, positionedge1);
            float basedisplacement, layerdisplacement, blendweight;
            float displacement = tessblenddisplacement(position, rawnormal, mappingnormal, tessparams.z, tessparams.z, basedisplacement,
                                                        layerdisplacement, blendweight);
            const float derivativeepsilon = 0.05;
            vec3 edgedirection0 = positionedge0/max(length(positionedge0), 1e-5);
            vec3 edgedirection1 = positionedge1/max(length(positionedge1), 1e-5);
            float ignored0, ignored1, ignored2;
            float derivative0 = (tessblenddisplacement(position + edgedirection0*derivativeepsilon,
                                                        rawnormal + normaledge0*derivativeepsilon/max(length(positionedge0), 1e-5),
                                                        mappingnormal, tessparams.z, tessparams.z, ignored0, ignored1, ignored2) -
                                 tessblenddisplacement(position - edgedirection0*derivativeepsilon,
                                                        rawnormal - normaledge0*derivativeepsilon/max(length(positionedge0), 1e-5),
                                                        mappingnormal, tessparams.z, tessparams.z, ignored0, ignored1, ignored2))*
                                length(positionedge0)/(2.0*derivativeepsilon);
            float derivative1 = (tessblenddisplacement(position + edgedirection1*derivativeepsilon,
                                                        rawnormal + normaledge1*derivativeepsilon/max(length(positionedge1), 1e-5),
                                                        mappingnormal, tessparams.z, tessparams.z, ignored0, ignored1, ignored2) -
                                 tessblenddisplacement(position - edgedirection1*derivativeepsilon,
                                                        rawnormal - normaledge1*derivativeepsilon/max(length(positionedge1), 1e-5),
                                                        mappingnormal, tessparams.z, tessparams.z, ignored0, ignored1, ignored2))*
                                length(positionedge1)/(2.0*derivativeepsilon);
            float seamdistance = tessmix(tess_seamvertexdistance);
            float seamfade = tessseamparams.x > 0.5 && seamdistance >= 0.0 ?
                             smoothstep(0.0, max(tessseamparams.y, 1e-5), seamdistance) : 1.0;
            float fade = tessworlddistancefade(position)*seamfade;
            displacement *= fade;
            float normalmagnitude = max(length(rawnormal), 1e-5);
            vec3 normalderivative0 = (normaledge0 - surfacenormal*dot(surfacenormal, normaledge0))/normalmagnitude;
            vec3 normalderivative1 = (normaledge1 - surfacenormal*dot(surfacenormal, normaledge1))/normalmagnitude;
            vec3 edge0 = positionedge0 + normalderivative0*displacement + surfacenormal*derivative0*fade;
            vec3 edge1 = positionedge1 + normalderivative1*displacement + surfacenormal*derivative1*fade;
            nvec = normalize(cross(edge0, edge1));
            if(dot(nvec, surfacenormal) < 0.0) nvec = -nvec;
            vec3 displacementvector = surfacenormal*displacement;
            position += displacementvector;
            gl_Position = clipposition + camprojmatrix*vec4(displacementvector, 0.0);
            @(? (|| $gdepthformat $msaalight $msaasamples) [lineardepth = dot(lineardepthscale, gl_Position.zw);])
            @(if (wtopt "T") [result [
                texcoordx = tessmix(tess_texcoordx);
                texcoordy = tessmix(tess_texcoordy);
                texcoordz = tessmix(tess_texcoordz);
            ]] [result [
                texcoord0 = tessmix(tess_texcoord0);
            ]])
            @(? (wtopt "r") [camvec = camera - position;])
            @(? (wtopt "G") [pulse = abs(fract(millis*pulseglowspeed.x)*2.0 - 1.0);])
        }
    ]
]

tesselationbumpcontrolshader = [
    local bumptype
    bumptype = $arg1
    result [
        layout(vertices = 3) out;
        uniform float tessfactor;
        uniform vec4 tessparams, tessadaptiveparams, tessadaptiveoptions, tessviewparams, tessdistanceparams, tessblendparams;
        uniform vec4 tessbasedisplace, tessbaseuvparams, tessbasemapsize, tessbasetriscale;
        uniform vec4 tesslayerdisplace, tesslayeruvparams, tesslayermapsize, tesslayertriscale;
        uniform float tessbaseuvrotation, tesslayeruvrotation;
        uniform vec2 tessmapsize;
        uniform vec3 camera;

        in vec3 tess_vertex[];
        in float tess_seamdistance[];
        out vec3 tess_position[];
        out float tess_seamvertexdistance[];
        patch out vec3 tess_edgelod;
        patch out vec3 tess_baselod, tess_layerlod;
        patch out vec4 tess_patchdebug;

        @(? (|| $gdepthformat $msaalight $msaasamples) [
            in float lineardepth[];
            out float tess_lineardepth[];
        ])
        @(if (btopt "T") [result [
            in vec2 texcoordx[], texcoordy[], texcoordz[];
            in vec3 normal[], tangentx[], tangenty[], tangentz[];
            out vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
            out vec3 tess_normal[], tess_tangentx[], tess_tangenty[], tess_tangentz[];
        ]] [result [
            in vec2 texcoord0[];
            in mat3 world[];
            out vec2 tess_texcoord0[];
            out mat3 tess_world[];
        ]])
        @(? (|| (btopt "p") (btopt "r") (btopt "T")) [
            in vec3 camvec[];
            out vec3 tess_camvec[];
        ])

        vec2 tessscreen(vec4 clip)
        {
            return clip.xy/max(abs(clip.w), 1e-4)*tessviewparams.xy;
        }

        float tessedgepixels(int a, int b)
        {
            return length(tessscreen(gl_in[a].gl_Position) - tessscreen(gl_in[b].gl_Position));
        }

        float tessedgeworld(int a, int b)
        {
            return length(tess_vertex[a] - tess_vertex[b]);
        }

        bool tessedgeeligible(int a, int b)
        {
            vec3 edge = tess_vertex[b] - tess_vertex[a];
            float edgesquared = dot(edge, edge);
            float along = edgesquared > 1e-8 ? clamp(dot(camera - tess_vertex[a], edge)/edgesquared, 0.0, 1.0) : 0.0;
            return tessdistanceparams.x > 0.0 && distance(camera, tess_vertex[a] + edge*along) < tessdistanceparams.x;
        }

        bool tesspatcheligible(void)
        {
            vec3 bbmin = min(tess_vertex[0], min(tess_vertex[1], tess_vertex[2]));
            vec3 bbmax = max(tess_vertex[0], max(tess_vertex[1], tess_vertex[2]));
            return tessdistanceparams.x > 0.0 && distance(camera, clamp(camera, bbmin, bbmax)) < tessdistanceparams.x;
        }

        vec2 tesscontrolmaterialuv(vec3 position, vec3 surfacenormal, vec4 uvparams, float uvrotation)
        {
            vec3 axis = abs(surfacenormal);
            int dim = axis.x >= axis.y && axis.x >= axis.z ? 0 : (axis.y >= axis.z ? 1 : 2);
            float s = dim == 0 ? position.y : position.x;
            float t = dim == 2 ? position.y : position.z;
            if(uvrotation > 0.5)
                return vec2((dim <= 1 ? -t : t)*uvparams.x + uvparams.z, s*uvparams.y + uvparams.w);
            return vec2(s*uvparams.x + uvparams.z, (dim <= 1 ? -t : t)*uvparams.y + uvparams.w);
        }

        float tessmaterialtexels(int a, int b, vec3 surfacenormal, vec4 displace, vec4 uvparams, float uvrotation, vec4 mapsize,
                                 vec4 triscale)
        {
            if(displace.z < 0.5) return 0.0;
            vec3 edge = tess_vertex[a] - tess_vertex[b];
            if(displace.w > 0.5)
            {
                float xcoverage = length(vec2(edge.y, -edge.z)*triscale.xy*mapsize.xy);
                float ycoverage = length(vec2(edge.x, -edge.z)*triscale.xy*mapsize.xy);
                float zcoverage = length(edge.xy*triscale.zw*mapsize.zw);
                return max(xcoverage, max(ycoverage, zcoverage));
            }
            vec2 uva = tesscontrolmaterialuv(tess_vertex[a], surfacenormal, uvparams, uvrotation);
            vec2 uvb = tesscontrolmaterialuv(tess_vertex[b], surfacenormal, uvparams, uvrotation);
            return length((uva - uvb)*mapsize.xy);
        }

        float tessedgetexels(int a, int b)
        {
            if(tessblendparams.x < 0.5)
            {
                @(if (btopt "T") [result [
                    float xcoverage = length((texcoordx[a] - texcoordx[b])*tessmapsize);
                    float ycoverage = length((texcoordy[a] - texcoordy[b])*tessmapsize);
                    float zcoverage = length((texcoordz[a] - texcoordz[b])*tessmapsize);
                    return max(xcoverage, max(ycoverage, zcoverage));
                ]] [result [
                    return length((texcoord0[a] - texcoord0[b])*tessmapsize);
                ]])
            }
            vec3 surfacenormal = cross(tess_vertex[1] - tess_vertex[0], tess_vertex[2] - tess_vertex[0]);
            float basecoverage = tessmaterialtexels(a, b, surfacenormal, tessbasedisplace, tessbaseuvparams, tessbaseuvrotation,
                                                    tessbasemapsize, tessbasetriscale);
            float layercoverage = tessmaterialtexels(a, b, surfacenormal, tesslayerdisplace, tesslayeruvparams, tesslayeruvrotation,
                                                     tesslayermapsize, tesslayertriscale);
            return max(basecoverage, layercoverage);
        }

        vec3 tessmetric(int a, int b)
        {
            float pixels = tessedgepixels(a, b);
            float texels = tessedgetexels(a, b);
            float screenfactor = pixels/max(tessadaptiveparams.z, 1.0);
            float detailfactor = max(texels/max(tessadaptiveparams.w, 1.0),
                                     tessedgeworld(a, b)/max(tessadaptiveoptions.x, 1.0));
            float minimum = min(tessadaptiveparams.x, tessadaptiveparams.y);
            float requested = max(minimum, min(screenfactor, detailfactor));
            float factor = tessadaptiveoptions.y > 0.5 ? ceil(requested) : tessfactor;
            return vec3(clamp(factor, minimum, tessadaptiveparams.y), requested, texels);
        }

        float tessedgemip(vec3 metric)
        {
            if(tessadaptiveoptions.z < 0.5) return tessparams.z;
            float texelspan = metric.z/max(metric.x, 1.0);
            return max(tessparams.z, log2(max(texelspan, 1.0)) + tessadaptiveoptions.w);
        }

        float tesscoveragemip(float coverage, float factor)
        {
            if(tessadaptiveoptions.z < 0.5) return tessparams.z;
            return max(tessparams.z, log2(max(coverage/max(factor, 1.0), 1.0)) + tessadaptiveoptions.w);
        }

        void main(void)
        {
            gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;
            tess_position[gl_InvocationID] = tess_vertex[gl_InvocationID];
            tess_seamvertexdistance[gl_InvocationID] = tess_seamdistance[gl_InvocationID];
            @(? (|| $gdepthformat $msaalight $msaasamples) [tess_lineardepth[gl_InvocationID] = lineardepth[gl_InvocationID];])
            @(if (btopt "T") [result [
                tess_texcoordx[gl_InvocationID] = texcoordx[gl_InvocationID];
                tess_texcoordy[gl_InvocationID] = texcoordy[gl_InvocationID];
                tess_texcoordz[gl_InvocationID] = texcoordz[gl_InvocationID];
                tess_normal[gl_InvocationID] = normal[gl_InvocationID];
                tess_tangentx[gl_InvocationID] = tangentx[gl_InvocationID];
                tess_tangenty[gl_InvocationID] = tangenty[gl_InvocationID];
                tess_tangentz[gl_InvocationID] = tangentz[gl_InvocationID];
            ]] [result [
                tess_texcoord0[gl_InvocationID] = texcoord0[gl_InvocationID];
                tess_world[gl_InvocationID] = world[gl_InvocationID];
            ]])
            @(? (|| (btopt "p") (btopt "r") (btopt "T")) [tess_camvec[gl_InvocationID] = camvec[gl_InvocationID];])

            if(gl_InvocationID == 0)
            {
                vec3 edge0 = tessmetric(1, 2);
                vec3 edge1 = tessmetric(2, 0);
                vec3 edge2 = tessmetric(0, 1);
                float minimum = min(tessadaptiveparams.x, tessadaptiveparams.y);
                gl_TessLevelOuter[0] = tessedgeeligible(1, 2) ? edge0.x : minimum;
                gl_TessLevelOuter[1] = tessedgeeligible(2, 0) ? edge1.x : minimum;
                gl_TessLevelOuter[2] = tessedgeeligible(0, 1) ? edge2.x : minimum;
                gl_TessLevelInner[0] = tesspatcheligible() ? max(edge0.x, max(edge1.x, edge2.x)) : minimum;

                tess_edgelod = vec3(tessedgemip(edge0), tessedgemip(edge1), tessedgemip(edge2));
                vec3 surfacenormal = cross(tess_vertex[1] - tess_vertex[0], tess_vertex[2] - tess_vertex[0]);
                tess_baselod = vec3(
                    tesscoveragemip(tessmaterialtexels(1, 2, surfacenormal, tessbasedisplace, tessbaseuvparams, tessbaseuvrotation,
                                                       tessbasemapsize, tessbasetriscale), edge0.x),
                    tesscoveragemip(tessmaterialtexels(2, 0, surfacenormal, tessbasedisplace, tessbaseuvparams, tessbaseuvrotation,
                                                       tessbasemapsize, tessbasetriscale), edge1.x),
                    tesscoveragemip(tessmaterialtexels(0, 1, surfacenormal, tessbasedisplace, tessbaseuvparams, tessbaseuvrotation,
                                                       tessbasemapsize, tessbasetriscale), edge2.x));
                tess_layerlod = vec3(
                    tesscoveragemip(tessmaterialtexels(1, 2, surfacenormal, tesslayerdisplace, tesslayeruvparams, tesslayeruvrotation,
                                                       tesslayermapsize, tesslayertriscale), edge0.x),
                    tesscoveragemip(tessmaterialtexels(2, 0, surfacenormal, tesslayerdisplace, tesslayeruvparams, tesslayeruvrotation,
                                                       tesslayermapsize, tesslayertriscale), edge1.x),
                    tesscoveragemip(tessmaterialtexels(0, 1, surfacenormal, tesslayerdisplace, tesslayeruvparams, tesslayeruvrotation,
                                                       tesslayermapsize, tesslayertriscale), edge2.x));
                float requested = max(edge0.y, max(edge1.y, edge2.y));
                float texelspan = max(edge0.z/max(edge0.x, 1.0),
                                      max(edge1.z/max(edge1.x, 1.0), edge2.z/max(edge2.x, 1.0)));
                float maxlod = max(tess_edgelod.x, max(tess_edgelod.y, tess_edgelod.z));
                bool hardwarelimit = requested >= tessviewparams.z - 0.5;
                tess_patchdebug = vec4(gl_TessLevelInner[0], clamp(requested/max(tessviewparams.z, 1.0), 0.0, 1.0),
                                       clamp(log2(texelspan + 1.0)/8.0, 0.0, 1.0), hardwarelimit ? -(maxlod + 1.0) : maxlod);
            }
        }
    ]
]

tesselationbumpevaluationshader = [
    local bumptype
    bumptype = $arg1
    result [
        layout(triangles, equal_spacing, ccw) in;

        uniform mat4 camprojmatrix;
        uniform sampler2D normalmap, blendmap, tessbasenormalmap, tessbasedetailnormalmap, tesslayernormalmap, tesslayerdetailnormalmap;
        uniform vec4 parallaxscale, tessparams, tessdistanceparams, tessseamparams, tessblendparams, blendmapparams;
        uniform vec4 tessbasedisplace, tessbaseuvparams, tessbasemapsize, tessbasetriscale, tessbasetripbias;
        uniform vec4 tesslayerdisplace, tesslayeruvparams, tesslayermapsize, tesslayertriscale, tesslayertripbias;
        uniform float tessbaseuvrotation, tesslayeruvrotation;
        uniform vec2 tessmapsize, tessdetailmapsize;
        uniform vec3 camera;
        patch in vec3 tess_edgelod;
        patch in vec3 tess_baselod, tess_layerlod;
        patch in vec4 tess_patchdebug;
        @(? (btopt "T") [
            uniform vec4 triplanarbias;
            @(? (btopt "d") [uniform sampler2D detailnormalmap;])
        ])

        @(? (|| $gdepthformat $msaalight $msaasamples) [
            uniform vec2 lineardepthscale;
            in float tess_lineardepth[];
            out float lineardepth;
        ])
        in vec3 tess_position[];
        in float tess_seamvertexdistance[];
        @(if (btopt "T") [result [
            in vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
            in vec3 tess_normal[], tess_tangentx[], tess_tangenty[], tess_tangentz[];
            out vec2 texcoordx, texcoordy, texcoordz;
            out vec3 normal, tangentx, tangenty, tangentz;
        ]] [result [
            in vec2 tess_texcoord0[];
            in mat3 tess_world[];
            out vec2 texcoord0;
            out mat3 world;
        ]])
        @(? (|| (btopt "p") (btopt "r") (btopt "T")) [
            in vec3 tess_camvec[];
            out vec3 camvec;
        ])
        @(? (btopt "G") [
            uniform float millis;
            uniform vec4 pulseglowspeed;
            flat out float pulse;
        ])
        noperspective out vec3 tess_barycentric;
        flat out vec4 tess_debugdata;
        out float tess_seamdebug;
        out vec3 tess_originalnormal, tess_reconstructednormal;
        out vec4 tess_blenddebug;
        out vec2 texcoord1;

        #define tessmix(value) (gl_TessCoord.x * value[0] + gl_TessCoord.y * value[1] + gl_TessCoord.z * value[2])

        vec2 tessheightgradient(sampler2D map, vec2 mapsize, vec2 texcoord, float lod)
        {
            vec2 offset = exp2(lod)/max(mapsize, vec2(1.0));
            float left = textureLod(map, texcoord - vec2(offset.x, 0.0), lod).a;
            float right = textureLod(map, texcoord + vec2(offset.x, 0.0), lod).a;
            float down = textureLod(map, texcoord - vec2(0.0, offset.y), lod).a;
            float up = textureLod(map, texcoord + vec2(0.0, offset.y), lod).a;
            return vec2(right - left, up - down)/(2.0*offset);
        }

        mat3 tessnormalrotation(vec3 from, vec3 to)
        {
            from = normalize(from);
            to = normalize(to);
            vec3 axis = cross(from, to);
            float cosine = clamp(dot(from, to), -1.0, 1.0);
            if(cosine < -0.9999)
            {
                vec3 helper = abs(from.x) < abs(from.z) ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 0.0, 1.0);
                axis = normalize(cross(from, helper));
                return mat3(2.0*axis.x*axis - vec3(1.0, 0.0, 0.0),
                            2.0*axis.y*axis - vec3(0.0, 1.0, 0.0),
                            2.0*axis.z*axis - vec3(0.0, 0.0, 1.0));
            }
            float factor = 1.0/max(1.0 + cosine, 1e-5);
            return mat3(vec3(cosine + axis.x*axis.x*factor, axis.y*axis.x*factor + axis.z,
                             axis.z*axis.x*factor - axis.y),
                        vec3(axis.x*axis.y*factor - axis.z, cosine + axis.y*axis.y*factor,
                             axis.z*axis.y*factor + axis.x),
                        vec3(axis.x*axis.z*factor + axis.y, axis.y*axis.z*factor - axis.x,
                             cosine + axis.z*axis.z*factor));
        }

        vec3 tesstriplanarblend(vec3 value, vec3 bias)
        {
            vec3 blend = max(abs(value) - bias, 0.001);
            blend *= blend;
            return blend/(blend.x + blend.y + blend.z);
        }

        vec2 tessdistancefade(float cameradistance)
        {
            if(tessdistanceparams.x <= 0.0) return vec2(0.0);
            if(tessdistanceparams.z <= 0.0) return vec2(cameradistance < tessdistanceparams.x ? 1.0 : 0.0, 0.0);
            float progress = clamp((cameradistance - tessdistanceparams.y)/tessdistanceparams.z, 0.0, 1.0);
            return vec2(1.0 - progress*progress*(3.0 - 2.0*progress), -6.0*progress*(1.0 - progress)/tessdistanceparams.z);
        }

        @tesselationblenddisplacement

        void main(void)
        {
            vec4 clipposition = gl_TessCoord.x * gl_in[0].gl_Position + gl_TessCoord.y * gl_in[1].gl_Position +
                                gl_TessCoord.z * gl_in[2].gl_Position;
            vec3 position = tessmix(tess_position);
            texcoord1 = (position.xy - blendmapparams.xy)*blendmapparams.zw;
            float seamdistance = tessmix(tess_seamvertexdistance);
            float seamwidth = max(tessseamparams.y, 1e-5);
            float seamprogress = clamp(seamdistance/seamwidth, 0.0, 1.0);
            float seamfade = tessseamparams.x > 0.5 && seamdistance >= 0.0 ? seamprogress*seamprogress*(3.0 - 2.0*seamprogress) : 1.0;
            float seamgradient = tessseamparams.x > 0.5 && seamdistance >= 0.0 && seamprogress < 1.0 ?
                                 6.0*seamprogress*(1.0 - seamprogress)/seamwidth : 0.0;
            float seamderivative0 = seamgradient*(tess_seamvertexdistance[0] - tess_seamvertexdistance[2]);
            float seamderivative1 = seamgradient*(tess_seamvertexdistance[1] - tess_seamvertexdistance[2]);
            tess_seamdebug = tessparams.y < 15.5 ? seamprogress : seamfade;
            tess_barycentric = gl_TessCoord;
            tess_debugdata = tess_patchdebug;
            float originaldisplacementlod = gl_TessCoord.x <= gl_TessCoord.y && gl_TessCoord.x <= gl_TessCoord.z ? tess_edgelod.x :
                                            gl_TessCoord.y <= gl_TessCoord.z ? tess_edgelod.y : tess_edgelod.z;
            float baselod = gl_TessCoord.x <= gl_TessCoord.y && gl_TessCoord.x <= gl_TessCoord.z ? tess_baselod.x :
                            gl_TessCoord.y <= gl_TessCoord.z ? tess_baselod.y : tess_baselod.z;
            float layerlod = gl_TessCoord.x <= gl_TessCoord.y && gl_TessCoord.x <= gl_TessCoord.z ? tess_layerlod.x :
                             gl_TessCoord.y <= gl_TessCoord.z ? tess_layerlod.y : tess_layerlod.z;
            float displacementlod = tessblendparams.x > 0.5 ? mix(baselod, layerlod, tessblendparams.y) : originaldisplacementlod;
            @(if (btopt "T") [result [
                texcoordx = tessmix(tess_texcoordx);
                texcoordy = tessmix(tess_texcoordy);
                texcoordz = tessmix(tess_texcoordz);
                normal = tessmix(tess_normal);
                tangentx = tessmix(tess_tangentx);
                tangenty = tessmix(tess_tangenty);
                tangentz = tessmix(tess_tangentz);

                vec3 rawsurfacenormal = normal;
                vec3 normaledge0 = tess_normal[0] - tess_normal[2], normaledge1 = tess_normal[1] - tess_normal[2];
                vec3 surfacenormal = normalize(rawsurfacenormal);
                vec3 triblend = tesstriplanarblend(rawsurfacenormal, triplanarbias.xyz);
                vec4 normalsamplex = textureLod(normalmap, texcoordx, displacementlod);
                vec4 normalsampley = textureLod(normalmap, texcoordy, displacementlod);
                vec4 normalsamplez = textureLod(@(? (btopt "d") "detailnormalmap" "normalmap"), texcoordz, displacementlod);
                float height = 0.0;
                float heightderivative0 = 0.0;
                float heightderivative1 = 0.0;
                if(tessblendparams.x < 0.5)
                {
                    const float blendstep = 1e-3;
                    vec3 blendderivative0 = (tesstriplanarblend(rawsurfacenormal + normaledge0*blendstep, triplanarbias.xyz) -
                                             triblend)/blendstep;
                    vec3 blendderivative1 = (tesstriplanarblend(rawsurfacenormal + normaledge1*blendstep, triplanarbias.xyz) -
                                             triblend)/blendstep;
                    vec3 heights = vec3(normalsamplex.a, normalsampley.a, normalsamplez.a);
                    height = dot(heights, triblend);
                    vec2 gradientx = tessheightgradient(normalmap, tessmapsize, texcoordx, displacementlod);
                    vec2 gradienty = tessheightgradient(normalmap, tessmapsize, texcoordy, displacementlod);
                    vec2 gradientz = tessheightgradient(@(? (btopt "d") "detailnormalmap, tessdetailmapsize" "normalmap, tessmapsize"),
                                                        texcoordz, displacementlod);
                    vec2 texedgex0 = tess_texcoordx[0] - tess_texcoordx[2], texedgex1 = tess_texcoordx[1] - tess_texcoordx[2];
                    vec2 texedgey0 = tess_texcoordy[0] - tess_texcoordy[2], texedgey1 = tess_texcoordy[1] - tess_texcoordy[2];
                    vec2 texedgez0 = tess_texcoordz[0] - tess_texcoordz[2], texedgez1 = tess_texcoordz[1] - tess_texcoordz[2];
                    heightderivative0 = dot(vec3(dot(gradientx, texedgex0), dot(gradienty, texedgey0), dot(gradientz, texedgez0)), triblend) +
                                        dot(heights, blendderivative0);
                    heightderivative1 = dot(vec3(dot(gradientx, texedgex1), dot(gradienty, texedgey1), dot(gradientz, texedgez1)), triblend) +
                                        dot(heights, blendderivative1);
                }
                vec3 bumpx = (normalsamplex.rgb*2.0 - 1.0)*triblend.x;
                vec3 bumpy = (normalsampley.rgb*2.0 - 1.0)*triblend.y;
                vec3 bumpz = (normalsamplez.rgb*2.0 - 1.0)*triblend.z;
                vec3 materialnormal = normalize(mat3(tangenty, tangentz, normal)*bumpx + mat3(tangentx, tangentz, normal)*bumpy +
                                                mat3(tangentx, tangenty, normal)*bumpz);
            ]] [result [
                texcoord0 = tessmix(tess_texcoord0);
                mat3 baseworld = tessmix(tess_world);
                world = baseworld;
                vec3 rawsurfacenormal = baseworld[2];
                vec3 normaledge0 = tess_world[0][2] - tess_world[2][2], normaledge1 = tess_world[1][2] - tess_world[2][2];
                vec3 surfacenormal = normalize(rawsurfacenormal);
                vec4 normalsample = textureLod(normalmap, texcoord0, displacementlod);
                float height = 0.0;
                float heightderivative0 = 0.0;
                float heightderivative1 = 0.0;
                if(tessblendparams.x < 0.5)
                {
                    height = normalsample.a;
                    vec2 heightgradient = tessheightgradient(normalmap, tessmapsize, texcoord0, displacementlod);
                    vec2 texedge0 = tess_texcoord0[0] - tess_texcoord0[2], texedge1 = tess_texcoord0[1] - tess_texcoord0[2];
                    heightderivative0 = dot(heightgradient, texedge0);
                    heightderivative1 = dot(heightgradient, texedge1);
                }
                vec3 materialnormal = normalize(baseworld*(normalsample.rgb*2.0 - 1.0));
            ]])

            vec3 positionedge0 = tess_position[0] - tess_position[2], positionedge1 = tess_position[1] - tess_position[2];
            vec3 mappingnormal = cross(positionedge0, positionedge1);
            float basedisplacement;
            float layerdisplacement = 0.0;
            float blendweight = 1.0;
            float blendeddisplacement;
            float displacementderivative0;
            float displacementderivative1;
            if(tessblendparams.x > 0.5)
            {
                blendeddisplacement = tessblenddisplacement(position, rawsurfacenormal, mappingnormal, baselod, layerlod, basedisplacement,
                                                             layerdisplacement, blendweight);
                const float derivativeepsilon = 0.05;
                vec3 edgedirection0 = positionedge0/max(length(positionedge0), 1e-5);
                vec3 edgedirection1 = positionedge1/max(length(positionedge1), 1e-5);
                float ignored0, ignored1, ignored2;
                displacementderivative0 = (tessblenddisplacement(position + edgedirection0*derivativeepsilon,
                                                                   rawsurfacenormal + normaledge0*derivativeepsilon/max(length(positionedge0), 1e-5),
                                                                   mappingnormal, baselod, layerlod, ignored0, ignored1, ignored2) -
                                           tessblenddisplacement(position - edgedirection0*derivativeepsilon,
                                                                   rawsurfacenormal - normaledge0*derivativeepsilon/max(length(positionedge0), 1e-5),
                                                                   mappingnormal, baselod, layerlod, ignored0, ignored1, ignored2))*
                                          length(positionedge0)/(2.0*derivativeepsilon);
                displacementderivative1 = (tessblenddisplacement(position + edgedirection1*derivativeepsilon,
                                                                   rawsurfacenormal + normaledge1*derivativeepsilon/max(length(positionedge1), 1e-5),
                                                                   mappingnormal, baselod, layerlod, ignored0, ignored1, ignored2) -
                                           tessblenddisplacement(position - edgedirection1*derivativeepsilon,
                                                                   rawsurfacenormal - normaledge1*derivativeepsilon/max(length(positionedge1), 1e-5),
                                                                   mappingnormal, baselod, layerlod, ignored0, ignored1, ignored2))*
                                          length(positionedge1)/(2.0*derivativeepsilon);
            }
            else
            {
                basedisplacement = (height*parallaxscale.x + parallaxscale.y)*tessparams.x;
                blendeddisplacement = basedisplacement;
                displacementderivative0 = heightderivative0*parallaxscale.x*tessparams.x;
                displacementderivative1 = heightderivative1*parallaxscale.x*tessparams.x;
            }
            float normalmagnitude = max(length(rawsurfacenormal), 1e-5);
            vec3 normalderivative0 = (normaledge0 - surfacenormal*dot(surfacenormal, normaledge0))/normalmagnitude;
            vec3 normalderivative1 = (normaledge1 - surfacenormal*dot(surfacenormal, normaledge1))/normalmagnitude;
            vec3 cameravector = position - camera;
            float cameradistance = length(cameravector);
            vec2 distancefade = tessdistancefade(cameradistance);
            vec3 cameradirection = cameravector/max(cameradistance, 1e-5);
            float displacement = blendeddisplacement*distancefade.x*seamfade;
            float fadederivative0 = distancefade.y*dot(cameradirection, positionedge0);
            float fadederivative1 = distancefade.y*dot(cameradirection, positionedge1);
            vec3 displacededge0 = positionedge0 + normalderivative0*displacement +
                                  surfacenormal*(displacementderivative0*distancefade.x*seamfade +
                                                blendeddisplacement*(fadederivative0*seamfade + distancefade.x*seamderivative0));
            vec3 displacededge1 = positionedge1 + normalderivative1*displacement +
                                  surfacenormal*(displacementderivative1*distancefade.x*seamfade +
                                                blendeddisplacement*(fadederivative1*seamfade + distancefade.x*seamderivative1));
            vec3 reconstructednormal = normalize(cross(displacededge0, displacededge1));
            if(dot(reconstructednormal, surfacenormal) < 0.0) reconstructednormal = -reconstructednormal;
            mat3 normalrotation = tessnormalrotation(materialnormal, reconstructednormal);
            tess_originalnormal = surfacenormal;
            tess_reconstructednormal = reconstructednormal;
            tess_blenddebug = vec4(basedisplacement, layerdisplacement, blendweight, blendeddisplacement);
            @(if (btopt "T") [result [
                normal = normalrotation*normal;
                tangentx = normalrotation*tangentx;
                tangenty = normalrotation*tangenty;
                tangentz = normalrotation*tangentz;
            ]] [result [
                world = normalrotation*world;
            ]])

            vec3 displacementvector = surfacenormal*displacement;
            position += displacementvector;
            gl_Position = clipposition + camprojmatrix*vec4(displacementvector, 0.0);

            @(? (|| $gdepthformat $msaalight $msaasamples) [lineardepth = dot(lineardepthscale, gl_Position.zw);])
            @(? (|| (btopt "p") (btopt "r") (btopt "T")) [camvec = camera - position;])
            @(? (btopt "G") [pulse = abs(fract(millis*pulseglowspeed.x)*2.0 - 1.0);])
        }
    ]
]

tesselationshadowevaluationshader = [
    local bumptype
    bumptype = $arg1
    result [
        layout(triangles, equal_spacing, ccw) in;
        uniform mat4 shadowmatrix;
        uniform sampler2D normalmap, blendmap, tessbasenormalmap, tessbasedetailnormalmap, tesslayernormalmap, tesslayerdetailnormalmap;
        uniform vec4 parallaxscale, tessparams, tessdistanceparams, tessseamparams, tessblendparams, blendmapparams;
        uniform vec4 tessbasedisplace, tessbaseuvparams, tessbasemapsize, tessbasetriscale, tessbasetripbias;
        uniform vec4 tesslayerdisplace, tesslayeruvparams, tesslayermapsize, tesslayertriscale, tesslayertripbias;
        uniform float tessbaseuvrotation, tesslayeruvrotation;
        uniform vec3 camera;
        patch in vec3 tess_edgelod;
        patch in vec3 tess_baselod, tess_layerlod;
        in vec3 tess_position[];
        in float tess_seamvertexdistance[];
        @(if (btopt "T") [result [
            uniform vec4 triplanarbias;
            @(? (btopt "d") [uniform sampler2D detailnormalmap;])
            in vec2 tess_texcoordx[], tess_texcoordy[], tess_texcoordz[];
            in vec3 tess_normal[], tess_tangentx[], tess_tangenty[], tess_tangentz[];
            out vec2 shadow_fragmenttexcoordx, shadow_fragmenttexcoordy, shadow_fragmenttexcoordz;
            out vec3 shadow_fragmentnormal;
        ]] [result [
            in vec2 tess_texcoord0[];
            in mat3 tess_world[];
            out vec2 shadow_fragmenttexcoord;
        ]])

        #define tessshadowmix(value) (gl_TessCoord.x*value[0] + gl_TessCoord.y*value[1] + gl_TessCoord.z*value[2])

        float tessshadowdistancefade(vec3 position)
        {
            float cameradistance = distance(position, camera);
            if(tessdistanceparams.x <= 0.0) return 0.0;
            if(tessdistanceparams.z <= 0.0) return cameradistance < tessdistanceparams.x ? 1.0 : 0.0;
            return 1.0 - smoothstep(tessdistanceparams.y, tessdistanceparams.x, cameradistance);
        }

        @tesselationblenddisplacement

        void main(void)
        {
            vec3 position = tessshadowmix(tess_position);
            float seamdistance = tessshadowmix(tess_seamvertexdistance);
            float seamfade = tessseamparams.x > 0.5 && seamdistance >= 0.0 ?
                             smoothstep(0.0, max(tessseamparams.y, 1e-5), seamdistance) : 1.0;
            float originaldisplacementlod = gl_TessCoord.x <= gl_TessCoord.y && gl_TessCoord.x <= gl_TessCoord.z ? tess_edgelod.x :
                                            gl_TessCoord.y <= gl_TessCoord.z ? tess_edgelod.y : tess_edgelod.z;
            float baselod = gl_TessCoord.x <= gl_TessCoord.y && gl_TessCoord.x <= gl_TessCoord.z ? tess_baselod.x :
                            gl_TessCoord.y <= gl_TessCoord.z ? tess_baselod.y : tess_baselod.z;
            float layerlod = gl_TessCoord.x <= gl_TessCoord.y && gl_TessCoord.x <= gl_TessCoord.z ? tess_layerlod.x :
                             gl_TessCoord.y <= gl_TessCoord.z ? tess_layerlod.y : tess_layerlod.z;
            float displacementlod = tessblendparams.x > 0.5 ? mix(baselod, layerlod, tessblendparams.y) : originaldisplacementlod;
            float height = 0.0;
            @(if (btopt "T") [result [
                shadow_fragmenttexcoordx = tessshadowmix(tess_texcoordx);
                shadow_fragmenttexcoordy = tessshadowmix(tess_texcoordy);
                shadow_fragmenttexcoordz = tessshadowmix(tess_texcoordz);
                shadow_fragmentnormal = tessshadowmix(tess_normal);
                vec3 surfacenormal = normalize(shadow_fragmentnormal);
                if(tessblendparams.x < 0.5)
                {
                    vec3 blend = max(abs(shadow_fragmentnormal) - triplanarbias.xyz, 0.001);
                    blend *= blend;
                    blend /= blend.x + blend.y + blend.z;
                    float heightx = textureLod(normalmap, shadow_fragmenttexcoordx, displacementlod).a;
                    float heighty = textureLod(normalmap, shadow_fragmenttexcoordy, displacementlod).a;
                    float heightz = textureLod(@(? (btopt "d") "detailnormalmap" "normalmap"), shadow_fragmenttexcoordz,
                                               displacementlod).a;
                    height = dot(vec3(heightx, heighty, heightz), blend);
                }
            ]] [result [
                shadow_fragmenttexcoord = tessshadowmix(tess_texcoord0);
                mat3 shadowworld = tessshadowmix(tess_world);
                vec3 surfacenormal = normalize(shadowworld[2]);
                if(tessblendparams.x < 0.5) height = textureLod(normalmap, shadow_fragmenttexcoord, displacementlod).a;
            ]])
            vec3 mappingnormal = cross(tess_position[0] - tess_position[2], tess_position[1] - tess_position[2]);
            float basedisplacement, layerdisplacement, blendweight;
            float displacement;
            if(tessblendparams.x > 0.5)
                displacement = tessblenddisplacement(position, surfacenormal, mappingnormal, baselod, layerlod, basedisplacement,
                                                      layerdisplacement, blendweight);
            else displacement = (height*parallaxscale.x + parallaxscale.y)*tessparams.x;
            position += surfacenormal*(displacement*tessshadowdistancefade(position)*seamfade);
            gl_Position = shadowmatrix*vec4(position, 1.0);
        }
    ]
]

tesselationshadowshader = [
    if $tesselationsupported [
        local bumptype shadowvs shadowtcs shadowtes
        bumptype = $arg2
        shadowvs = [
            attribute vec4 vvertex, vtangent;
            attribute vec3 vnormal;
            attribute vec3 vtexcoord0;
            uniform mat4 camprojmatrix;
            uniform vec3 camera;
            uniform vec2 lineardepthscale, texgenscroll;
            out float lineardepth;
            out vec3 tess_vertex, camvec;
            out float tess_seamdistance;
            @(if (btopt "T") [result [
                uniform vec2 texgenscale;
                @(? (btopt "d") [uniform vec2 detailscale;])
                out vec2 texcoordx, texcoordy, texcoordz;
                out vec3 normal, tangentx, tangenty, tangentz;
            ]] [result [
                out vec2 texcoord0;
                out mat3 world;
            ]])
            void main(void)
            {
                // Keep the control shader camera-relative so its edge factors and displacement mip match the G-buffer pass.
                gl_Position = camprojmatrix*vvertex;
                lineardepth = dot(lineardepthscale, gl_Position.zw);
                tess_vertex = vvertex.xyz;
                tess_seamdistance = vtexcoord0.z;
                camvec = camera - vvertex.xyz;
                @(if (btopt "T") [result [
                    texcoordx = vec2(vvertex.y, -vvertex.z)*texgenscale;
                    texcoordy = vec2(vvertex.x, -vvertex.z)*texgenscale;
                    texcoordz = vvertex.xy*@(? (btopt "d") "detailscale" "texgenscale");
                    normal = vnormal;
                    tangentx = normalize(vec3(1.001, 0.0, 0.0) - vnormal*vnormal.x);
                    tangenty = normalize(vec3(0.0, 1.001, 0.0) - vnormal*vnormal.y);
                    tangentz = normalize(vec3(0.0, 0.0, -1.001) + vnormal*vnormal.z);
                ]] [result [
                    texcoord0 = vtexcoord0.xy + texgenscroll;
                    vec3 bitangent = cross(vnormal, vtangent.xyz)*vtangent.w;
                    world = mat3(vtangent.xyz, bitangent, vnormal);
                ]])
            }
        ]
        shadowtcs = (tesselationbumpcontrolshader @arg2)
        shadowtes = (tesselationshadowevaluationshader @arg2)
        tesselationshader @arg1 (concatword "tess_shadow_" @arg3) $shadowvs $shadowtcs $shadowtes [
            void main(void) {}
        ]
        tesselationshader @arg1 (concatword "tess_shadowalpha_" @arg3) $shadowvs $shadowtcs $shadowtes [
            uniform sampler2D diffusemap, normalmap;
            uniform vec4 colorparams, tessshadowalpha;
            @(if (btopt "T") [result [
                uniform vec4 triplanarbias;
                @(? (btopt "d") [uniform sampler2D detaildiffusemap, detailnormalmap;])
                in vec2 shadow_fragmenttexcoordx, shadow_fragmenttexcoordy, shadow_fragmenttexcoordz;
                in vec3 shadow_fragmentnormal;
            ]] [result [
                in vec2 shadow_fragmenttexcoord;
            ]])
            fragdata(0) vec4 gcolor;
            void main(void)
            {
                @(if (btopt "T") [result [
                    vec3 blend = max(abs(shadow_fragmentnormal) - triplanarbias.xyz, 0.001);
                    blend *= blend;
                    blend /= blend.x + blend.y + blend.z;
                    vec4 diffuse = texture2D(diffusemap, shadow_fragmenttexcoordx)*blend.x +
                                   texture2D(diffusemap, shadow_fragmenttexcoordy)*blend.y +
                                   texture2D(@(? (btopt "d") "detaildiffusemap" "diffusemap"), shadow_fragmenttexcoordz)*blend.z;
                    float mask = texture2D(normalmap, shadow_fragmenttexcoordx).a*blend.x +
                                 texture2D(normalmap, shadow_fragmenttexcoordy).a*blend.y +
                                 texture2D(@(? (btopt "d") "detailnormalmap" "normalmap"), shadow_fragmenttexcoordz).a*blend.z;
                ]] [result [
                    vec4 diffuse = texture2D(diffusemap, shadow_fragmenttexcoord);
                    float mask = texture2D(normalmap, shadow_fragmenttexcoord).a;
                ]])
                float alpha = colorparams.a;
                if(tessshadowalpha.x > 0.5) alpha *= mask;
                gcolor.rgb = mix(vec3(1.0), diffuse.rgb*colorparams.rgb, alpha)*(1.0 - (tessshadowalpha.x > 0.5 ? alpha : 0.0));
                gcolor.a = alpha;
            }
        ]
    ]
]

tesselationworldshader = [
    if $tesselationsupported [
        defershader $arg1 (concatword "tess_" $arg2) [
            local tcs tes
            tcs = (tesselationworldcontrolshader @arg3)
            tes = (tesselationworldevaluationshader @arg3)
            tesselationcopyshader (concatword "tess_" @arg2) @arg2 $tcs $tes
        ]
    ]
]

tesselationbumpshader = [
    if $tesselationsupported [
        defershader $arg1 (concatword "tess_" $arg2) [
            local tcs tes
            tcs = (tesselationbumpcontrolshader @arg3)
            tes = (tesselationbumpevaluationshader @arg3)
            tesselationcopyshader (concatword "tess_" @arg2) @arg2 $tcs $tes
        ]
        defershader $arg1 (concatword "tess_shadow_" $arg2) [tesselationshadowshader @arg1 @arg3 @arg2]
        defershader $arg1 (concatword "tess_shadowalpha_" $arg2) [tesselationshadowshader @arg1 @arg3 @arg2]
    ]
]
